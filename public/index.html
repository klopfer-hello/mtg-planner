function DeckDetail({ id, dataVersion, initialNotice, onBack, onOpenCard, onOpenDeck, onAsk, onChanged, onCollectionChanged = onChanged }) {
  const [deck, setDeck] = useState(null);
  const [error, setError] = useState(null);
  const [actionError, setActionError] = useState(null);
  const [notice, setNotice] = useState(initialNotice);
  const [editing, setEditing] = useState(false);
  const [form, setForm] = useState({ name: "", format: "", description: "" });
  const [saving, setSaving] = useState(false);
  const [onlyMissing, setOnlyMissing] = useState(false);
  const [actionCard, setActionCard] = useState(null); // {board, name}
  const [cardBusy, setCardBusy] = useState(false);
  const [cardError, setCardError] = useState(null);
  const [statusBusy, setStatusBusy] = useState(false);
  const [deckBox, setDeckBox] = useState(false);

  const load = useCallback(() => {
    setError(null);
    api(`/api/decks/${id}`).then(setDeck).catch((e) => setError(e.status === 404 ? "This deck no longer exists." : e.message));
  }, [id]);
  useEffect(load, [load, dataVersion]); // also after the planner saved this deck

  const startEdit = () => {
    setForm({ name: deck.name, format: deck.format || "", description: deck.description || "" });
    setEditing(true);
  };
  const saveEdit = async (e) => {
    e.preventDefault();
    if (!form.name.trim()) return;
    setSaving(true);
    setActionError(null);
    try {
      const updated = await api(`/api/decks/${id}`, { method: "PATCH", json: { name: form.name.trim(), format: form.format || "", description: form.description } });
      setDeck((d) => ({ ...d, ...updated }));
      setEditing(false);
      onChanged();
    } catch (err) {
      setActionError(err.message);
    } finally {
      setSaving(false);
    }
  };
  const setStatus = async (status) => {
    if (!deck || deck.status === status || statusBusy) return;
    if (status === "built") {
      // Cards this idea deck shares with built decks turn into conflicts: owned copies in use,
      // and shared cards nobody has enough of (same rule as the server's conflict flag).
      const n = deckCounts(deck).inUse;
      const conflicting = new Map();
      for (const c of asList(deck.cards)) {
        if (!c || c.basic || c.board === "maybe") continue;
        const elsewhere = builtElsewhereOf(c);
        if (elsewhere.length && (cardInUse(c) > 0 || cardToBuy(c) > 0)) conflicting.set(c.name, elsewhere);
      }
      if (n > 0 || conflicting.size > 0) {
        const names = [...conflicting.keys()];
        const list = names.slice(0, 5).join(", ") + (names.length > 5 ? ", …" : "");
        const where = deckNames([...conflicting.values()].flat());
        const k = conflicting.size;
        const head = n > 0
          ? `${n === 1 ? "1 card is" : `${n} cards are`} in use in other built decks${where ? ` (${where})` : ""}.`
          : `This deck shares cards with other built decks${where ? ` (${where})` : ""}.`;
        if (!window.confirm(`${head}\n\nAs a built deck, ${k === 1 ? "1 card" : `${k} cards`} will show as conflicts${list ? ` (${list})` : ""} until you move or buy copies. Set to Built?`)) return;
      }
    }
    setStatusBusy(true);
    setActionError(null);
    try {
      await api(`/api/decks/${id}`, { method: "PATCH", json: { status } });
      setDeck((d) => ({ ...d, status }));
      load(); // conflicts and free copies change with the status
      onCollectionChanged(); // avail:/used: and card usage in the other tabs too
    } catch (err) {
      setActionError(err.message);
    } finally {
      setStatusBusy(false);
    }
  };
  const remove = async () => {
    if (!window.confirm(`Delete the deck "${deck.name}"? This cannot be undone. Your collection is not affected.`)) return;
    setActionError(null);
    try {
      await api(`/api/decks/${id}`, { method: "DELETE" });
      onChanged();
      onBack();
    } catch (err) {
      setActionError(err.message);
    }
  };

  // Card edits (board moves, quantity, commander). The answer is the updated
  // deck when the server sends one; otherwise the deck is reloaded.
  const runCardAction = async (path, method, json, kind) => {
    setCardBusy(true);
    setCardError(null);
    try {
      const res = await api(path, { method, json });
      const next = res && Array.isArray(res.cards) ? res : res && Array.isArray(res.deck?.cards) ? res.deck : null;
      if (next) setDeck(next);
      else load();
      if (kind !== "qty") setActionCard(null);
      else if (next) {
        const c = next.cards.find((x) => x.board === json.board && x.name === json.name);
        setActionCard(c ? { board: c.board, name: c.name } : null);
      }
      onChanged();
    } catch (err) {
      if (kind === "suggest") setActionError(err.message);
      else setCardError(err.message);
    } finally {
      setCardBusy(false);
    }
  };
  const openActions = (c) => { setCardError(null); setActionCard({ board: c.board, name: c.name }); };
  const actionTarget = actionCard && deck?.cards.find((c) => c.board === actionCard.board && c.name === actionCard.name);
  const suggestions = commanderSuggestions(deck);
  const needsCommander = deck && (isCommanderFormat(deck) || Array.isArray(deck.commander_suggestions)) && !hasCommander(deck);

  const grouped = useMemo(() => {
    if (!deck) return [];
    return ["commander", "main", "side", "maybe"].map((board) => {
      const cards = deck.cards.filter((c) => c.board === board && (!onlyMissing || cardToBuy(c) > 0 || cardInUse(c) > 0));
      const byType = DISPLAY_TYPES.map((t) => ({ type: t, cards: cards.filter((c) => mainType(c.type_line) === t) }))
        .filter((g) => g.cards.length);
      return { board, count: deck.counts?.[board] ?? 0, cards, byType };
    }).filter((b) => b.cards.length);
  }, [deck, onlyMissing]);

  const exportHref = `/api/decks/${id}/export`;
  const counts = deckCounts(deck);

  return (
    <div className="stack-lg">
      <div>
        <button type="button" className="btn ghost" onClick={onBack} style={{ marginLeft: -8 }}><Icon.back /> All decks</button>
      </div>
      {error && <ErrorNotice error={error} onRetry={load} />}
      {!deck && !error && <Spinner label="Loading deck…" />}
      {deck && (
        <>
          <header className="deck-head">
            {!editing ? (
              <>
                <h2>{deck.name}</h2>
                <div className="row small">
                  {deck.format && <span className="badge">{deck.format}</span>}
                  <SourceBadge source={deck.source} />
                  <span className="muted">updated {fmtAgo(deck.updated_at)}</span>
                </div>
                {(deck.status === "idea" || deck.status === "built") && (
                  <div className="row">
                    <div className="segmented status-toggle" role="group" aria-label="Deck status">
                      <button type="button" aria-pressed={deck.status === "idea"} disabled={statusBusy} onClick={() => setStatus("idea")}>Idea</button>
                      <button type="button" aria-pressed={deck.status === "built"} disabled={statusBusy} onClick={() => setStatus("built")}>Built</button>
                    </div>
                    <span className="small muted grow" style={{ flexBasis: 160 }}>
                      {deck.status === "built" ? "Built: this deck claims its cards. Other decks see them as used." : "Idea: doesn't claim cards. Shows what you own and what's free."}
                    </span>
                  </div>
                )}
                {deck.description && <p style={{ margin: 0, whiteSpace: "pre-wrap" }}>{deck.description}</p>}
              </>
            ) : (
              <form className="card stack" onSubmit={saveEdit} aria-label="Edit deck">
                <div className="field">
                  <label htmlFor="edit-name">Name</label>
                  <input id="edit-name" className="input" required maxLength={200} value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} autoFocus />
                </div>
                <div className="field">
                  <label htmlFor="edit-format">Format</label>
                  <select id="edit-format" className="select" value={form.format} onChange={(e) => setForm({ ...form, format: e.target.value })}>
                    <option value="">—</option>
                    {[...new Set([...FORMATS, form.format].filter(Boolean))].map((f) => <option key={f} value={f}>{cap(f)}</option>)}
                  </select>
                </div>
                <div className="field">
                  <label htmlFor="edit-desc">Description</label>
                  <textarea id="edit-desc" className="input" rows={3} maxLength={5000} value={form.description} onChange={(e) => setForm({ ...form, description: e.target.value })} />
                </div>
                <div className="row">
                  <button type="submit" className="btn primary" disabled={saving || !form.name.trim()}>{saving ? "Saving…" : "Save"}</button>
                  <button type="button" className="btn ghost" onClick={() => setEditing(false)}>Cancel</button>
                </div>
              </form>
            )}
            <div className="stats">
              {["commander", "main", "side", "maybe"].filter((b) => b === "main" || deck.counts?.[b]).map((b) => (
                <div className="stat" key={b}><div className="v">{deck.counts?.[b] ?? 0}</div><div className="k">{BOARD_LABEL[b]}</div></div>
              ))}
            </div>
            <DeckValue value={deck.value} />
            <ConflictBanner deck={deck} onOpenDeck={onOpenDeck} />
            {needsCommander && (
              <div className="notice warn" role="status">
                <span aria-hidden="true">♛</span>
                <div className="grow stack" style={{ gap: 8 }}>
                  <b>No commander set</b>
                  {suggestions.length > 0 ? (
                    <>
                      <span className="small">Tap a card from this deck to make it the commander:</span>
                      <div className="chips cmd-suggest">
                        {suggestions.map((sg) => (
                          <button key={sg.name} type="button" className="chip" disabled={cardBusy}
                            onClick={() => runCardAction(`/api/decks/${id}/commander`, "POST", { name: sg.name }, "suggest")}>
                            <Icon.crown /> {sg.name}
                          </button>
                        ))}
                      </div>
                    </>
                  ) : <span className="small">Use the <b>⋯</b> button next to a card to set it as the commander.</span>}
                </div>
              </div>
            )}
            <DeckNeedNotice deck={deck} />
            <div className="row">
              <button type="button" className="btn primary" onClick={() => onAsk(deck)}><Icon.sparkle /> Ask the planner</button>
              {deck.status === "built" && <button type="button" className="btn" onClick={() => setDeckBox(true)}><Icon.box /> Put into deck box</button>}
              <a className="btn" href={exportHref} download><Icon.download /> Export</a>
              {!editing && <button type="button" className="btn" onClick={startEdit}><Icon.edit /> Rename</button>}
              <button type="button" className="btn danger" onClick={remove}><Icon.trash /> Delete</button>
            </div>
            <ErrorNotice error={actionError} onDismiss={() => setActionError(null)} />
            {notice && <div className="notice warn" role="status"><div className="grow">{notice}</div><button type="button" className="btn ghost icon sm" aria-label="Dismiss" onClick={() => setNotice(null)}><Icon.close /></button></div>}
          </header>

          <DeckShopping deck={deck} onOpenDeck={onOpenDeck} />

          {deck.cards.length > 0 && (counts.toBuy > 0 || counts.inUse > 0) && (
            <label className="row" style={{ minHeight: 44, cursor: "pointer" }}>
              <input type="checkbox" checked={onlyMissing} onChange={(e) => setOnlyMissing(e.target.checked)} style={{ width: 20, height: 20, accentColor: "var(--accent)" }} />
              {counts.inUse > 0 ? "Only cards to buy or in other decks" : "Only show cards to buy"}
            </label>
          )}

          {deck.cards.length === 0 && <div className="empty"><h3>This deck is empty</h3></div>}

          {grouped.map((b) => (
            <section key={b.board} className="board" aria-label={BOARD_LABEL[b.board]}>
              <h3>{BOARD_LABEL[b.board]} <span className="muted small">{b.count}</span></h3>
              <div className="deck-section">
                {b.byType.map((g) => (
                  <div key={g.type} className="type-group">
                    <h4>{g.type} ({g.cards.reduce((a, c) => a + c.quantity, 0)})</h4>
                    {g.cards.map((c) => <DeckCardRow key={`${c.board}|${c.name}`} card={c} onOpenCard={onOpenCard} onActions={openActions} />)}
                  </div>
                ))}
              </div>
            </section>
          ))}
          {actionTarget && (
            <CardActionsSheet deck={deck} card={actionTarget} busy={cardBusy} error={cardError}
              onRun={runCardAction} onOpenCard={(cid) => { setActionCard(null); onOpenCard(cid); }}
              onClose={() => setActionCard(null)} />
          )}
          {deckBox && <DeckBoxSheet deck={deck} onClose={() => setDeckBox(false)} onDone={() => { load(); onCollectionChanged(); }} />}
        </>
      )}
    </div>
  );
}

function DecksTab({ dataVersion, homeKey, deckId, deckNotice, onOpenDeck, onOpenCard, onAsk, onChanged, onCollectionChanged }) {
  const [listKey, bumpList] = useReducer((x) => x + 1, 0);
  // "Back" from a deck returns to where it was opened: the list or the shopping list.
  const [shopping, setShopping] = useState(false);
  useEffect(() => { setShopping(false); }, [homeKey]);
  if (deckId) {
    return (
      <DeckDetail key={deckId} id={deckId} dataVersion={dataVersion} initialNotice={deckNotice} onBack={() => { onOpenDeck(null); bumpList(); }}
        onOpenCard={onOpenCard} onOpenDeck={onOpenDeck} onAsk={onAsk} onChanged={onChanged} onCollectionChanged={onCollectionChanged} />
    );
  }
  if (shopping) {
    return <ShoppingListView dataVersion={dataVersion + listKey} onBack={() => { setShopping(false); window.scrollTo(0, 0); }} onOpenDeck={onOpenDeck} />;
  }
  return <DeckList dataVersion={dataVersion} refreshKey={listKey} onOpen={onOpenDeck} onShopping={() => { setShopping(true); window.scrollTo(0, 0); }} />;
}

const SUGGESTIONS = [
  "Build a Commander deck from cards I own around my best legendary creature",
  "Which of my cards are worth more than €10?",
  "Suggest 10 upgrades under €2 for my deck …",
  "Find me all blue counterspells I own",
  "Build a deck only from free cards, without breaking my built decks",
];

function toolIcon(name = "") {
  if (/search|find|check_owned|alternatives|staples|synerg/.test(name)) return "🔍";
  if (/deck|mana_base|brawl/.test(name)) return "🃏";
  if (/price/.test(name)) return "💶";
  if (/rules/.test(name)) return "📖";
  if (/overview|get_card|batch|random|sets/.test(name)) return "📋";
  return "🔧";
}
function ToolChip({ tool }) {
  const label = `${tool.name}${tool.input ? `: ${tool.input}` : ""}`;
  return (
    <span className="tool-chip" title={label}>
      <span aria-hidden="true">{toolIcon(tool.name)}</span>
      <span><b>{tool.name}</b>{tool.input ? `: ${tool.input}` : ""}</span>
    </span>
  );
}

function Message({ msg }) {
  if (msg.role === "user") {
    return <div className="msg user"><div className="bubble">{msg.content}</div></div>;
  }
  const tools = msg.tools || [];
  return (
    <div className="msg assistant">
      {tools.length > 0 && (
        <details className="disclosure">
          <summary>Used {plural(tools.length, "tool")}</summary>
          <div className="tools" style={{ marginTop: 6 }}>{tools.map((t, i) => <ToolChip key={i} tool={t} />)}</div>
        </details>
      )}
      <div className="bubble"><Markdown text={msg.content || "_(no answer)_"} /></div>
      <div className="meta">
        {msg.created_at && <span>{fmtDate(msg.created_at)}</span>}
        {msg.cost_usd != null && <span title="Equivalent API cost reported by Claude Code">≈ ${Number(msg.cost_usd).toFixed(3)}</span>}
      </div>
    </div>
  );
}

function SetupHint() {
  return (
    <div className="notice warn" role="alert">
      <span aria-hidden="true">🔑</span>
      <div className="grow">
        <b>Claude is not configured on the server.</b> On a machine with Claude Code, run <code>claude setup-token</code>,
        put the token into the app's <code>.env</code> as <code>CLAUDE_CODE_OAUTH_TOKEN=…</code>, then recreate the container.
      </div>
    </div>
  );
}

/** Height of what the user actually sees (excludes an on-screen keyboard). */
/**
 * Pixels of the chat below what the user can read: the end of the conversation
 * minus the top of the fixed composer (phones, also while the keyboard lifts it),
 * else the plain document gap (desktop). <= 0 means the newest line is visible.
 */
function chatGap(endEl, composerEl) {
  if (endEl && composerEl && getComputedStyle(composerEl).position === "fixed") {
    return endEl.getBoundingClientRect().bottom - composerEl.getBoundingClientRect().top;
  }
  const el = document.documentElement;
  return el.scrollHeight - (window.scrollY + window.innerHeight);
}

/**
 * Pixels the on-screen keyboard covers at the bottom of the layout viewport
 * (iOS Safari and Chrome on Android resize only the visual viewport), 0 when
 * it is closed. Used to keep the composer right above the keyboard.
 */
function useKeyboardInset(active) {
  const [kb, setKb] = useState(0);
  useEffect(() => {
    const vv = window.visualViewport;
    if (!active || !vv) { setKb(0); return; }
    const update = () => {
      const covered = Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
      setKb(covered > 80 ? covered : 0);
    };
    update();
    vv.addEventListener("resize", update);
    vv.addEventListener("scroll", update);
    return () => { vv.removeEventListener("resize", update); vv.removeEventListener("scroll", update); };
  }, [active]);
  return kb;
}

function PlannerTab({ active, health, request, onRequestHandled, onChanged }) {
  const [chats, setChats] = useState(null);
  const [chatsError, setChatsError] = useState(null);
  const [chatId, setChatId] = useState(() => store.get("mtg.chat", null));
  const chatIdRef = useRef(chatId);
  const [messages, setMessages] = useState([]);
  const [chatLoading, setChatLoading] = useState(false);
  const [serverBusy, setServerBusy] = useState(false);
  const [stream, setStream] = useState(null); // {text, tools} while this tab streams an answer
  const streamCtl = useRef(null);
  const sending = useRef(false); // set synchronously: blocks a double submit while the chat is created
  const [error, setError] = useState(null); // {message, status}
  const [input, setInput] = useState("");
  const [drawer, setDrawer] = useState(false);
  const drawerRef = useRef(null);
  const inputRef = useRef(null);
  const atBottom = useRef(true);

  const loadChats = useCallback(async () => {
    try {
      setChats(await api("/api/chats"));
      setChatsError(null);
    } catch (e) {
      setChatsError(`Could not load chats: ${e.message}`);
    }
  }, []);

  // Plain functions on purpose: they only touch refs and state setters.
  async function loadChat(id, { quiet = false } = {}) {
    if (!quiet) setChatLoading(true);
    try {
      const d = await api(`/api/chats/${id}`);
      if (chatIdRef.current !== id) return;
      setMessages(d.messages);
      setServerBusy(d.busy);
    } catch (e) {
      if (chatIdRef.current !== id) return;
      if (e.status === 404) selectChat(null);
      else setError({ message: `Could not load the chat: ${e.message}` });
    } finally {
      if (!quiet && chatIdRef.current === id) setChatLoading(false);
    }
  }

  function selectChat(id, { load = true } = {}) {
    // Leaving a streaming chat only detaches this browser: the server keeps
    // running the turn and stores the answer.
    if (streamCtl.current) { streamCtl.current.abort(); streamCtl.current = null; }
    chatIdRef.current = id;
    setChatId(id);
    store.set("mtg.chat", id);
    setMessages([]);
    setStream(null);
    setServerBusy(false);
    setError(null);
    setChatLoading(false);
    setDrawer(false);
    atBottom.current = true;
    if (id && load) loadChat(id);
  }

  useEffect(() => {
    loadChats();
    if (chatIdRef.current) loadChat(chatIdRef.current);
    return () => streamCtl.current?.abort();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  // Another tab/device (or a detached stream) is still answering: poll.
  useEffect(() => {
    if (!serverBusy || stream || !chatId) return;
    const t = setInterval(() => loadChat(chatId, { quiet: true }), 3000);
    return () => clearInterval(t);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [serverBusy, stream, chatId]);
  // ...and refresh the list once it finishes (title/updated_at). The turn may
  // have saved a deck (save_deck), so the Decks tab refetches too.
  const wasBusy = useRef(false);
  useEffect(() => {
    if (wasBusy.current && !serverBusy) { loadChats(); onChanged?.(); }
    wasBusy.current = serverBusy;
  }, [serverBusy, loadChats, onChanged]);

  async function send(textArg, targetId) {
    const fromInput = textArg == null;
    const text = (fromInput ? input : textArg).trim();
    // An explicit target chat (deck prompt) was just created, so a stale busy flag doesn't apply.
    if (!text || sending.current || streamCtl.current || (serverBusy && targetId == null)) return;
    sending.current = true;
    try {
      await sendTurn(text, fromInput, targetId);
    } finally {
      sending.current = false;
    }
  }

  async function sendTurn(text, fromInput, targetId) {
    setError(null);
    let id = targetId ?? chatIdRef.current;
    if (!id) {
      try {
        const chat = await api("/api/chats", { method: "POST", json: {} });
        setChats((cs) => [chat, ...(cs || [])]);
        id = chat.id;
        selectChat(id, { load: false });
      } catch (e) {
        setError({ message: `Could not create a chat: ${e.message}` });
        return;
      }
    }
    const ctl = new AbortController();
    streamCtl.current = ctl;
    const tmpId = `tmp-${Date.now()}`;
    setMessages((m) => [...m, { id: tmpId, role: "user", content: text, tools: [], created_at: null }]);
    setStream({ text: "", tools: [] });
    if (fromInput) setInput("");
    atBottom.current = true;

    const undo = (message, status) => {
      if (streamCtl.current === ctl) streamCtl.current = null;
      if (chatIdRef.current !== id) return;
      setStream(null);
      setMessages((m) => m.filter((x) => x.id !== tmpId));
      setInput((cur) => cur || text); // keep the prompt so it can be re-sent
      setError({ message, status });
    };

    let res;
    try {
      res = await fetch(`/api/chats/${id}/messages`, {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }), signal: ctl.signal,
      });
    } catch (e) {
      if (!ctl.signal.aborted) undo(`Network error: ${e.message}`);
      return;
    }
    if (!res.ok) {
      let message = `Request failed: HTTP ${res.status}`;
      try { const d = await res.json(); if (d?.error) message = d.error; } catch { /* not JSON */ }
      undo(message, res.status);
      if (res.status === 409) loadChat(id, { quiet: true }); // shows the running answer as busy
      return;
    }

    try {
      for await (const ev of readSse(res.body)) {
        if (chatIdRef.current !== id || ctl.signal.aborted) break;
        if (ev.type === "text") setStream((s) => s && { ...s, text: s.text + ev.text });
        else if (ev.type === "tool") setStream((s) => s && { ...s, tools: [...s.tools, { name: ev.name, input: ev.input }] });
        else if (ev.type === "done") { setMessages((m) => [...m, ev.message]); setStream(null); onChanged?.(); }
        else if (ev.type === "error") setError({ message: ev.error });
      }
    } catch (e) {
      if (!ctl.signal.aborted && chatIdRef.current === id) setError({ message: `Connection lost: ${e.message}. The answer may still arrive — reopen the chat in a moment.` });
    }
    if (streamCtl.current === ctl) streamCtl.current = null;
    if (chatIdRef.current === id) {
      setStream(null);
      loadChat(id, { quiet: true }); // sync stored ids, stored error text, busy flag
    }
    loadChats();
  }

  // "Ask the planner about this deck": start a fresh chat and send the prompt.
  useEffect(() => {
    if (!request) return;
    onRequestHandled();
    (async () => {
      if (streamCtl.current) { setError({ message: "Wait for the current answer to finish first." }); setInput(request.prompt); return; }
      try {
        const chat = await api("/api/chats", { method: "POST", json: { title: request.title } });
        setChats((cs) => [chat, ...(cs || [])]);
        selectChat(chat.id, { load: false });
        send(request.prompt, chat.id);
      } catch (e) {
        setError({ message: `Could not create a chat: ${e.message}` });
      }
    })();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [request]);

  async function deleteChat(id) {
    const chat = chats?.find((c) => c.id === id);
    if (!window.confirm(`Delete the chat "${chat?.title || "this chat"}"?`)) return;
    try {
      await api(`/api/chats/${id}`, { method: "DELETE" });
      setChats((cs) => (cs || []).filter((c) => c.id !== id));
      if (chatIdRef.current === id) selectChat(null);
    } catch (e) {
      setChatsError(`Could not delete the chat: ${e.message}`);
    }
  }

  // Stick to the bottom while an answer streams, unless the user scrolled up
  // (any upward scroll, a finger on the screen, or the wheel turned up stops
  // following); a "Latest" button jumps back down. Following re-arms once the
  // newest line is visible again.
  const [showLatest, setShowLatest] = useState(false);
  const chatEndRef = useRef(null);
  const lastY = useRef(0);
  const touching = useRef(false);
  const measureBottom = useCallback(() => {
    const gap = chatGap(chatEndRef.current, composerRef.current);
    const y = window.scrollY;
    if (y < lastY.current - 1) atBottom.current = gap <= 0;
    else if (gap <= 24 && !touching.current) atBottom.current = true;
    lastY.current = y;
    setShowLatest(gap > 120);
  }, []);
  useEffect(() => {
    if (!active) return;
    measureBottom();
    const vv = window.visualViewport;
    const onTouchStart = () => { touching.current = true; };
    const onTouchEnd = () => { touching.current = false; measureBottom(); };
    const onWheel = (e) => { if (e.deltaY < 0) atBottom.current = false; };
    window.addEventListener("scroll", measureBottom, { passive: true });
    window.addEventListener("touchstart", onTouchStart, { passive: true });
    window.addEventListener("touchend", onTouchEnd, { passive: true });
    window.addEventListener("touchcancel", onTouchEnd, { passive: true });
    window.addEventListener("wheel", onWheel, { passive: true });
    vv?.addEventListener("resize", measureBottom);
    return () => {
      window.removeEventListener("scroll", measureBottom);
      window.removeEventListener("touchstart", onTouchStart);
      window.removeEventListener("touchend", onTouchEnd);
      window.removeEventListener("touchcancel", onTouchEnd);
      window.removeEventListener("wheel", onWheel);
      vv?.removeEventListener("resize", measureBottom);
    };
  }, [active, measureBottom]);
  const scrollToEnd = (behavior = "auto") => {
    // The planner's bottom padding includes the keyboard inset, so the document end
    // sits right above the (lifted) composer.
    window.scrollTo({ top: document.documentElement.scrollHeight, behavior });
  };
  useLayoutEffect(() => {
    if (!active) return;
    if (atBottom.current && !touching.current) scrollToEnd();
    measureBottom();
  }, [messages, stream, serverBusy, active, measureBottom]);
  const jumpToLatest = () => {
    atBottom.current = true;
    setShowLatest(false);
    const smooth = !window.matchMedia?.("(prefers-reduced-motion: reduce)").matches;
    scrollToEnd(smooth ? "smooth" : "auto");
  };

  // Phones: the composer is fixed above the tab bar, or right above the
  // on-screen keyboard (visual viewport) while it is open.
  const kb = useKeyboardInset(active);
  // Keyboard opened/closed while following: keep the newest line above the composer.
  useLayoutEffect(() => {
    if (active && atBottom.current && !touching.current) scrollToEnd();
  }, [kb]); // eslint-disable-line react-hooks/exhaustive-deps
  const composerRef = useRef(null);
  const [composerH, setComposerH] = useState(64);
  useLayoutEffect(() => {
    const el = composerRef.current;
    if (!el || typeof ResizeObserver === "undefined") return;
    const ro = new ResizeObserver(() => setComposerH(Math.round(el.offsetHeight)));
    ro.observe(el);
    return () => ro.disconnect();
  }, []);

  // Auto-grow composer.
  useLayoutEffect(() => {
    const el = inputRef.current;
    if (!el) return;
    el.style.height = "auto";
    el.style.height = `${Math.min(el.scrollHeight, window.innerHeight * 0.4)}px`;
  }, [input]);

  const coarse = useMemo(() => window.matchMedia?.("(pointer: coarse)").matches, []);
  // Mobile chat drawer behaves like a modal: focus moves in, Tab is trapped,
  // Escape closes it and focus returns to the toggle (as in Sheet).
  useEffect(() => {
    if (!drawer) return;
    const prevFocus = document.activeElement;
    const focusables = () => drawerRef.current
      ? [...drawerRef.current.querySelectorAll('a[href], button:not([disabled]), input, select, textarea, [tabindex]:not([tabindex="-1"])')]
      : [];
    focusables()[0]?.focus();
    const onKey = (e) => {
      if (e.key === "Escape") { e.stopPropagation(); setDrawer(false); }
      if (e.key === "Tab") {
        const f = focusables();
        if (!f.length) return;
        const first = f[0], last = f[f.length - 1];
        const inside = drawerRef.current.contains(document.activeElement);
        if (e.shiftKey && (!inside || document.activeElement === first)) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && (!inside || document.activeElement === last)) { e.preventDefault(); first.focus(); }
      }
    };
    document.addEventListener("keydown", onKey);
    return () => {
      document.removeEventListener("keydown", onKey);
      if (prevFocus && prevFocus.focus && document.contains(prevFocus)) prevFocus.focus({ preventScroll: true });
    };
  }, [drawer]);

  const busy = Boolean(stream) || serverBusy;
  const chat = chats?.find((c) => c.id === chatId);
  const notConfigured = health && !health.claude_configured;

  const newChat = () => { selectChat(null); window.scrollTo(0, 0); setTimeout(() => inputRef.current?.focus({ preventScroll: true }), 0); };
  const sidebar = (
    <>
      {drawer && <div className="drawer-backdrop" onClick={() => setDrawer(false)} aria-hidden="true" />}
      <aside ref={drawerRef} className={`chat-side${drawer ? " open" : ""}`} aria-label="Chats"
        role={drawer ? "dialog" : undefined} aria-modal={drawer ? "true" : undefined}>
        <div className="row between">
          <h2 style={{ fontSize: "1.05rem" }}>Chats</h2>
          <button type="button" className="btn ghost icon drawer-toggle" aria-label="Close chat list" onClick={() => setDrawer(false)}><Icon.close /></button>
        </div>
        <button type="button" className="btn primary" onClick={() => newChat()}><Icon.plus /> New chat</button>
        <ErrorNotice error={chatsError} onRetry={loadChats} />
        {!chats && !chatsError && <Spinner />}
        {chats && chats.length === 0 && <p className="muted small">No chats yet.</p>}
        {chats?.map((c) => (
          <div key={c.id} className="chat-link" aria-current={c.id === chatId ? "true" : undefined}>
            <button type="button" onClick={() => selectChat(c.id)}>
              <span>{c.title}</span>
              <span className="muted small">{fmtAgo(c.updated_at)}</span>
            </button>
            <button type="button" className="btn ghost icon" aria-label={`Delete chat ${c.title}`} onClick={() => deleteChat(c.id)}><Icon.trash /></button>
          </div>
        ))}
      </aside>
    </>
  );

  const plannerStyle = { "--composer-h": `${composerH}px`, "--kb": `${kb}px` };

  return (
    <div className={`planner${kb ? " kb-open" : ""}`} style={plannerStyle}>
      {sidebar}
      <section className="chat-main" aria-label="Conversation" ref={chatEndRef}>
        <div className="planner-bar">
          <button type="button" className="btn ghost drawer-toggle" aria-label="Show chats" aria-expanded={drawer} onClick={() => setDrawer(true)}><Icon.menu /> Chats</button>
          <h2 title={chatId ? chat?.title || "Chat" : "New chat"}>{chatId ? chat?.title || "Chat" : "New chat"}</h2>
          <button type="button" className="btn ghost" onClick={newChat} disabled={!chatId && !messages.length} aria-label="New chat"><Icon.plus /> New chat</button>
        </div>

        {notConfigured && <SetupHint />}

        {chatLoading && <Spinner label="Loading chat…" />}

        {!chatId && messages.length === 0 && !stream && (
          <div className="stack">
            <div className="empty" style={{ paddingBottom: 8 }}>
              <h3>Ask the planner</h3>
              <p style={{ margin: 0, maxWidth: 520 }}>Claude can search your collection, look cards up on Scryfall, check rules and prices, and save decks you'll find in the Decks tab.</p>
            </div>
            <div className="suggestions">
              {SUGGESTIONS.map((s) => (
                <button key={s} type="button" className="suggestion" onClick={() => { setInput(s); setTimeout(() => { const el = inputRef.current; if (el) { el.focus(); el.setSelectionRange(s.length, s.length); } }, 0); }}>{s}</button>
              ))}
            </div>
          </div>
        )}

        {chatId && !chatLoading && messages.length === 0 && !stream && !serverBusy && (
          <p className="muted">No messages yet — say hello.</p>
        )}

        <div className="messages" aria-live="off">
          {messages.map((m) => <Message key={m.id} msg={m} />)}
          {stream && (
            <div className="msg assistant" aria-busy="true">
              {stream.tools.length > 0 && <div className="tools">{stream.tools.map((t, i) => <ToolChip key={i} tool={t} />)}</div>}
              <div className="bubble">
                {stream.text ? <Markdown text={stream.text} /> : null}
                <span className="typing" role="status" aria-label="Claude is working"><span /><span /><span /></span>
              </div>
            </div>
          )}
          {!stream && serverBusy && (
            <div className="notice" role="status"><span className="spinner" aria-hidden="true" /><div className="grow">Claude is still working on an answer in this chat. It will appear here when it's done.</div></div>
          )}
        </div>

        {error && (error.status === 503
          ? (!notConfigured && <SetupHint />)
          : <ErrorNotice error={error.message} onDismiss={() => setError(null)} />)}

        {showLatest && (messages.length > 0 || stream) && (
          <button type="button" className="btn primary to-latest" onClick={jumpToLatest}><Icon.down /> Latest</button>
        )}

        <div className="composer" ref={composerRef}>
          <form onSubmit={(e) => { e.preventDefault(); atBottom.current = true; send(); }}>
            <label htmlFor="chat-input" className="sr-only">Message</label>
            <textarea id="chat-input" ref={inputRef} rows={1} value={input} maxLength={20000}
              placeholder={busy ? "Claude is answering…" : "Ask the planner…"}
              onChange={(e) => setInput(e.target.value)}
              onKeyDown={(e) => {
                if (e.key === "Enter" && !e.shiftKey && !coarse && !e.nativeEvent.isComposing) { e.preventDefault(); send(); }
              }} />
            <button type="submit" className="btn primary" aria-label="Send" disabled={busy || !input.trim()}>
              {busy ? <span className="spinner" aria-hidden="true" style={{ borderTopColor: "var(--accent-ink)" }} /> : <Icon.send />}
            </button>
          </form>
        </div>
      </section>
    </div>
  );
}

function Collapsible({ label, children }) {
  return (
    <details className="disclosure">
      <summary>{label}</summary>
      <div style={{ marginTop: 6 }}>{children}</div>
    </details>
  );
}

const IMPORT_MODE_LABEL = { delta: "Only new copies (delta)", add: "Add everything", replace: "Replace (sync)" };

/**
 * Delta import lists: entries may be strings or objects
 * ({name, quantity|added|delta, binder, set_code, collector_number}).
 */
function deltaEntries(list, kind) {
  return asList(list, "items", "cards").map((x, i) => {
    if (typeof x === "string") return { key: i, text: x };
    if (!x || typeof x !== "object") return null;
    const raw = kind === "added"
      ? (x.added ?? x.quantity ?? x.delta ?? x.diff ?? x.count)
      : (x.decrease ?? x.decreased ?? x.fewer ?? x.missing ?? x.delta ?? x.diff ?? x.quantity ?? x.count);
    const n = raw == null ? null : Math.abs(Number(raw));
    const where = [x.set_code ? `${String(x.set_code).toUpperCase()}${x.collector_number ? ` #${x.collector_number}` : ""}` : null,
      x.finish && x.finish !== "normal" ? x.finish : null, x.binder ? `in ${x.binder}` : null].filter(Boolean).join(" · ");
    return { key: i, name: x.name || x.card || "?", n, where };
  }).filter(Boolean);
}

function DeltaLists({ s }) {
  const added = deltaEntries(s.added ?? s.delta?.added, "added");
  const fewer = deltaEntries(s.decreased ?? s.decreases ?? s.delta?.decreased, "decreased");
  if (!added.length && !fewer.length) {
    return s.mode === "delta" ? <p className="small muted" style={{ margin: 0 }}>Nothing new since the last ManaBox export.</p> : null;
  }
  return (
    <>
      {added.length > 0 && (
        <Collapsible label={`Added: ${plural(added.length, "row")}`}>
          <ul className="delta-list">
            {added.map((a) => <li key={a.key}>{a.text ?? <><b>+{a.n ?? "?"}</b> {a.name}{a.where && <span className="muted"> · {a.where}</span>}</>}</li>)}
          {s.added_truncated > 0 && <li className="muted">… and {fmtInt(s.added_truncated)} more</li>}
          </ul>
        </Collapsible>
      )}
      {fewer.length > 0 && (
        <div className="notice warn" role="status">
          <span aria-hidden="true">⚠️</span>
          <div className="grow stack" style={{ gap: 6 }}>
            <span><b>ManaBox has fewer copies of {plural(fewer.length, "card")}.</b> Nothing was removed here; delete them yourself if they are really gone.</span>
            <ul className="delta-list">
              {fewer.map((f) => <li key={f.key}>{f.text ?? <>ManaBox has fewer copies of <b>{f.name}</b> (−{f.n ?? "?"}){f.where && <span> · {f.where}</span>}</>}</li>)}
            {s.decreased_truncated > 0 && <li>… and {fmtInt(s.decreased_truncated)} more</li>}
            </ul>
          </div>
        </div>
      )}
    </>
  );
}

function ImportSummary({ s }) {
  if (!s) return null;
  const delta = (s.total_cards_after ?? 0) - (s.total_cards_before ?? 0);
  const stats = [
    s.total_cards_before != null || s.total_cards_after != null
      ? [`${fmtInt(s.total_cards_before)} → ${fmtInt(s.total_cards_after)}`, `Copies (${delta >= 0 ? "+" : ""}${fmtInt(delta)})`] : null,
    (s.added_copies ?? s.copies_added) != null && s.mode === "delta" ? [`+${fmtInt(s.added_copies ?? s.copies_added)}`, "Copies added"] : null,
    s.printings_added != null && s.mode !== "delta" ? [`+${fmtInt(s.printings_added)}`, "Printings added"] : null,
    s.kept_app_copies ? [fmtInt(s.kept_app_copies), "Already sorted here"] : null,
    s.printings_removed != null && s.mode !== "delta" ? [`−${fmtInt(s.printings_removed)}`, "Printings removed"] : null,
    s.printings_changed != null && s.mode !== "delta" ? [fmtInt(s.printings_changed), "Qty changed"] : null,
    (s.decreased_copies ?? s.copies_decreased) ? [`−${fmtInt(s.decreased_copies ?? s.copies_decreased)}`, "Fewer in ManaBox"] : null,
  ].filter(Boolean);
  return (
    <div className="stack">
      {stats.length > 0 && (
        <div className="summary-grid">
          {stats.map(([v, k]) => <div key={k} className="stat"><div className="v">{v}</div><div className="k">{k}</div></div>)}
        </div>
      )}
      <DeltaLists s={s} />
      <dl className="kv">
        <dt>Mode</dt><dd>{IMPORT_MODE_LABEL[s.mode] || s.mode || "—"}</dd>
        {s.rows != null && (<><dt>Rows</dt><dd>{fmtInt(s.imported_rows)} imported of {fmtInt(s.rows)}</dd></>)}
        {s.printings != null && (<><dt>Printings</dt><dd>{fmtInt(s.printings)} owned</dd></>)}
        {s.decks_from_binders?.length > 0 && (<><dt>Decks</dt><dd>{s.decks_from_binders.join(", ")}</dd></>)}
        {s.skipped_wishlist_rows > 0 && (<><dt>Skipped</dt><dd>{plural(s.skipped_wishlist_rows, "wish-list row")}</dd></>)}
      </dl>
      {s.unresolved?.length > 0 && (
        <Collapsible label={`${plural(s.unresolved.length, "row")} could not be matched on Scryfall`}>
          <ul className="small" style={{ margin: 0, paddingLeft: 18 }}>
            {s.unresolved.map((u, i) => <li key={i}>{u}</li>)}
          </ul>
        </Collapsible>
      )}
    </div>
  );
}

/** Who owns the collection: ManaBox (imports replace) or mtg-planner (imports add). */
function MasterPanel({ master, busy, error, onSwitch }) {
  return (
    <section className="card stack" aria-labelledby="master-title">
      <div className="row between">
        <h2 id="master-title">Collection master</h2>
        {master && <span className={`badge ${master === "app" ? "accent" : "warn"}`}>{master === "app" ? "mtg-planner" : "ManaBox"}</span>}
      </div>
      {!master && !error && <Spinner />}
      {master === "manabox" && (
        <p className="small" style={{ margin: 0 }}>
          <b>ManaBox is the master.</b> A ManaBox import replaces every card that came from ManaBox (cards you scanned stay).

const fmtBytes = (n) => (n == null ? "—" : n >= 1024 * 1024 ? `${(n / 1024 / 1024).toFixed(1)} MB` : `${Math.max(1, Math.round(n / 1024))} KB`);
const backupCounts = (c) => (c ? `${plural(c.copies, "copy", "copies")} · ${plural(c.decks, "deck")} · ${plural(c.binders, "binder")} · ${plural(c.chats, "chat")}` : "contents unknown");

/** Asks before a restore and says exactly what gets replaced. `target` = {kind:'stored', backup} | {kind:'upload', file}. */
function RestoreConfirmSheet({ target, current, busy, onConfirm, onCancel }) {
  const b = target.kind === "stored" ? target.backup : null;
  return (
    <Sheet title="Restore this backup?" onClose={() => { if (!busy) onCancel(); }}>
      <div className="stack">
        <p style={{ margin: 0 }}>
          {b ? <>Backup from <b>{fmtDate(b.created_at)}</b>{b.app_version ? <> (app {b.app_version})</> : null}</> : <>File <b style={{ overflowWrap: "anywhere" }}>{target.file.name}</b> ({fmtBytes(target.file.size)})</>}
        </p>
        <div className="notice warn" role="alert">
          <span aria-hidden="true">⚠️</span>
          <div className="grow">
            <b>All app data is replaced</b> by the backup: your whole collection and binders, decks, the scan list (incl. calibration
            data), planner chats and settings (collection master). Changes made since the backup are lost.
          </div>
        </div>
        <ul className="small" style={{ margin: 0, paddingLeft: 20, display: "grid", gap: 4 }}>
          <li>Now: {current ? `${plural(current.total_cards, "copy", "copies")} · ${plural(current.decks, "deck")}` : "…"}</li>
          <li>Backup: {b ? backupCounts(b.counts) : "checked on upload"}</li>
          <li>A <b>safety backup</b> of the current data is taken first; you can restore it from the list if needed.</li>
          <li>Not affected: the scanner's card index, fingerprints and scan photos.</li>
        </ul>
        <div className="row">
          <button type="button" className="btn primary grow" disabled={busy} onClick={onConfirm}>
            {busy ? <><span className="spinner" aria-hidden="true" style={{ borderTopColor: "var(--accent-ink)" }} /> Restoring…</> : <><Icon.undo /> Replace everything</>}
          </button>
          <button type="button" className="btn ghost" disabled={busy} onClick={onCancel}>Cancel</button>
        </div>
      </div>
    </Sheet>
  );
}

/** Import tab: manual backups of the app data (create, download, delete) and restore from a stored or uploaded one. */
function BackupPanel({ dataVersion, onRestored }) {
  const [list, setList] = useState(null);
  const [listError, setListError] = useState(null);
  const [creating, setCreating] = useState(false);
  const [error, setError] = useState(null);
  const [fresh, setFresh] = useState(null); // name of the backup just made
  const [confirm, setConfirm] = useState(null); // RestoreConfirmSheet target
  const [current, setCurrent] = useState(null);
  const [restoring, setRestoring] = useState(false);
  const fileInput = useRef(null);
  const load = useCallback(() => {
    setListError(null);
    api("/api/backups").then((d) => setList(d.backups)).catch((e) => setListError(`Could not load backups: ${e.message}`));
  }, []);
  useEffect(load, [load, dataVersion]);

  const create = async () => {
    setCreating(true); setError(null);
    try {
      const b = await api("/api/backups", { method: "POST" });
      setFresh(b.name);
      load();
    } catch (e) { setError(e.message); } finally { setCreating(false); }
  };
  const remove = async (b) => {
    if (!window.confirm(`Delete the backup from ${fmtDate(b.created_at)}? This cannot be undone.`)) return;
    setError(null);
    try { await api(`/api/backups/${encodeURIComponent(b.name)}`, { method: "DELETE" }); load(); } catch (e) { setError(e.message); }
  };
  const askRestore = (t) => {
    setError(null);
    setConfirm(t);
    setCurrent(null);
    api("/api/stats").then(setCurrent).catch(() => setCurrent(null));
  };
  const restore = async () => {
    setRestoring(true); setError(null);
    try {
      const r = confirm.kind === "stored"
        ? await api(`/api/backups/${encodeURIComponent(confirm.backup.name)}/restore`, { method: "POST", json: { confirm: true } })
        : await api("/api/backups/restore-upload?confirm=1", { method: "POST", body: confirm.file, headers: { "Content-Type": "application/gzip" } });
      setConfirm(null);
      onRestored(r);
    } catch (e) {
      setError(`Restore failed: ${e.message}`);
      setConfirm(null);
      load();
    } finally {
      setRestoring(false);
      if (fileInput.current) fileInput.current.value = "";
    }
  };
  const busy = creating || restoring;

  return (
    <section className="card stack" aria-labelledby="backup-title" aria-busy={busy}>
      <h2 id="backup-title">Backup &amp; restore</h2>
      <p className="small muted" style={{ margin: 0 }}>
        A backup holds all app data: collection, binders, decks, scan list, planner chats and settings. The scanner's card index and photos
        are not included (they are rebuilt). Download one to keep a copy off this server.
      </p>
      <div className="row">
        <button type="button" className="btn primary" onClick={create} disabled={busy}>
          {creating ? <><span className="spinner" aria-hidden="true" style={{ borderTopColor: "var(--accent-ink)" }} /> Creating…</> : <><Icon.box /> Create backup</>}
        </button>
        <label className={`btn${busy ? " disabled" : ""}`} aria-disabled={busy}>
          <Icon.file /> Restore from file
          <input ref={fileInput} type="file" accept=".gz,application/gzip" disabled={busy} className="sr-only"
            onChange={(e) => { const f = e.target.files?.[0]; if (f) askRestore({ kind: "upload", file: f }); }} />
        </label>
      </div>
      <ErrorNotice error={error} onDismiss={() => setError(null)} />
      <ErrorNotice error={listError} onRetry={load} />
      {!list && !listError && <Spinner />}
      {list && list.length === 0 && <p className="muted small" style={{ margin: 0 }}>No backups yet.</p>}
      {list && list.length > 0 && (
        <div>
          {list.map((b) => (
            <div key={b.name} className="history-item backup-item">
              <div className="row between">
                <b>{fmtDate(b.created_at)}</b>
                <span className="row small" style={{ gap: 6 }}>
                  {b.name === fresh && <span className="badge accent">new</span>}
                  {b.kind === "pre-restore" && <span className="badge warn" title="Taken automatically right before a restore">before restore</span>}
                  <span className="muted nowrap">{fmtBytes(b.size)}</span>
                </span>
              </div>
              <span className="small muted">{backupCounts(b.counts)}{b.app_version ? ` · app ${b.app_version}` : ""}</span>
              <div className="row" style={{ gap: 6 }}>
                <a className="btn sm" href={`/api/backups/${encodeURIComponent(b.name)}/download`} download={b.name}><Icon.download /> Download</a>
                <button type="button" className="btn sm" disabled={busy} onClick={() => askRestore({ kind: "stored", backup: b })}><Icon.undo /> Restore</button>
                <button type="button" className="btn sm ghost danger" style={{ marginLeft: "auto", paddingInline: 8 }} disabled={busy} onClick={() => remove(b)}
                  aria-label={`Delete backup from ${fmtDate(b.created_at)}`} title="Delete"><Icon.trash /></button>
              </div>
            </div>
          ))}
        </div>
      )}
      {confirm && <RestoreConfirmSheet target={confirm} current={current} busy={restoring} onConfirm={restore}
        onCancel={() => { setConfirm(null); if (fileInput.current) fileInput.current.value = ""; }} />}
    </section>
  );
}

const IMPORT_MODE_HELP = {
  delta: "Compares the file with your last ManaBox export and adds only the copies that are new (into their ManaBox binder). Fewer copies in ManaBox are listed, never deleted. Importing the same file twice changes nothing.",
  add: "Adds every copy in the file on top of what's already here.",
  replace: "Cards imported from ManaBox become exactly what's in the file. Scanned cards and cards organised here are kept.",
};

function ImportTab({ dataVersion, health, onImported, onRestored, restored, onDismissRestored }) {
  const [file, setFile] = useState(null);
  const [mode, setMode] = useState("replace");
  const modeTouched = useRef(false);
  const [master, setMaster] = useState(null);
  const [masterState, setMasterState] = useState({ busy: false, error: null });
  const loadMaster = useCallback(() => {
    api("/api/settings").then((d) => {
      const m = d?.collection_master === "app" ? "app" : "manabox";
      setMaster(m);
      // The default import mode follows the master until the user picks one.
      if (!modeTouched.current) setMode(m === "app" ? "delta" : "replace");
    }).catch((e) => setMasterState((st) => ({ ...st, error: `Could not load settings: ${e.message}` })));
  }, []);
  useEffect(loadMaster, [loadMaster, dataVersion]);
  const switchMaster = async (to) => {
    if (to === "manabox" && !window.confirm("Make ManaBox the master again? The import mode defaults to Replace again, which replaces every card that came from ManaBox. Cards you organised here stay where they are; a replace counts them against the file instead of adding them again.")) return;
    setMasterState({ busy: true, error: null });
    try {
      const d = await api("/api/settings", { method: "PATCH", json: { collection_master: to } });
      setMaster(d.collection_master);
      modeTouched.current = false;
      setMode(d.collection_master === "app" ? "delta" : "replace");
      setMasterState({ busy: false, error: null });
    } catch (e) { setMasterState({ busy: false, error: e.message }); }
  };
  const pickMode = (m) => { modeTouched.current = true; setMode(m); };
  const [busy, setBusy] = useState(false);
  const [started, setStarted] = useState(null);
  const [elapsed, setElapsed] = useState(0);
  const [result, setResult] = useState(null);
  const [error, setError] = useState(null);
  const [refresh, setRefresh] = useState({ busy: false, result: null, error: null });
  const [history, setHistory] = useState(null);
  const [historyError, setHistoryError] = useState(null);
  const fileInput = useRef(null);

  const loadHistory = useCallback(() => {
    setHistoryError(null);
    api("/api/imports").then(setHistory).catch((e) => setHistoryError(`Could not load import history: ${e.message}`));
  }, []);
  useEffect(loadHistory, [loadHistory, dataVersion]);

  // Elapsed-time counter while a request runs.
  useEffect(() => {
    if (!started) return;
    const t = setInterval(() => setElapsed(Math.round((Date.now() - started) / 1000)), 1000);
    return () => clearInterval(t);
  }, [started]);
  // Warn before closing the page mid-import.
  useEffect(() => {
    if (!busy) return;
    const h = (e) => { e.preventDefault(); e.returnValue = ""; };
    window.addEventListener("beforeunload", h);
    return () => window.removeEventListener("beforeunload", h);
  }, [busy]);

  const submit = async (e) => {
    e.preventDefault();
    if (!file || busy) return;
    const confirmReplace = mode === "replace" && master === "app";
    if (confirmReplace && !window.confirm(
      "Replace your ManaBox cards?\n\nmtg-planner is the master of your collection. A replace import DELETES every card that came from ManaBox " +
      "and loads this file instead. Cards you scanned or moved into binders here stay.\n\nUse Add to keep everything.")) return;
    setBusy(true);
    setError(null);
    setResult(null);
    setElapsed(0);
    setStarted(Date.now());
    try {
      const text = await file.text();
      const params = new URLSearchParams({ mode, filename: file.name });
      if (confirmReplace) params.set("confirm_replace", "1");
      const summary = await api(`/api/import/manabox?${params}`, { method: "POST", body: text, headers: { "Content-Type": "text/csv" } });
      setResult(summary);
      setFile(null);
      if (fileInput.current) fileInput.current.value = "";
      onImported();
    } catch (err) {
      setError(err.message);
    } finally {
      setBusy(false);
      setStarted(null);
    }
  };

  const refreshPrices = async () => {
    setRefresh({ busy: true, result: null, error: null });
    try {
      const r = await api("/api/refresh-prices", { method: "POST" });
      setRefresh({ busy: false, result: r, error: null });
      onImported();
    } catch (err) {
      setRefresh({ busy: false, result: null, error: err.message });
    }
  };

  return (
    <div className="stack-lg" style={{ maxWidth: 760 }}>
      <div className="page-title"><h1>Import</h1></div>
      {restored && (
        <div className="notice ok" role="status">
          <span aria-hidden="true">✓</span>
          <div className="grow">
            <b>Backup restored.</b> {backupCounts(restored.restored?.counts)}. Your previous data is kept as the safety backup
            {restored.safety_backup ? ` from ${fmtDate(restored.safety_backup.created_at)}` : ""}.
          </div>
          <button type="button" className="btn ghost sm" onClick={onDismissRestored} aria-label="Dismiss"><Icon.close /></button>
        </div>
      )}

      <form className="card stack" onSubmit={submit} aria-labelledby="import-title" aria-busy={busy}>
        <h2 id="import-title">ManaBox collection CSV</h2>
        <Collapsible label="How to export from ManaBox">
          <ol className="steps small">
            <li>In ManaBox open <b>Collection</b>, tap <b>⋯</b> → <b>Export</b> → <b>CSV</b>.</li>
            <li>Share or save the file (e.g. to Files / Downloads).</li>
            <li>Pick it below and tap <b>Import</b>.</li>
          </ol>
          <p className="small muted" style={{ marginBottom: 0 }}>Deck binders become decks; wish-list binders are skipped.</p>
        </Collapsible>

        <label className={`file-drop${file ? " has-file" : ""}`}>
          <Icon.file />
          <b>{file ? file.name : "Choose CSV file"}</b>
          <span className="muted small">{file ? `${(file.size / 1024).toFixed(0)} KB · tap to change` : "ManaBox export (.csv)"}</span>
          <input ref={fileInput} type="file" accept=".csv,text/csv" disabled={busy}
            onChange={(e) => { setFile(e.target.files?.[0] || null); setError(null); }} />
        </label>

        <fieldset style={{ border: 0, padding: 0, margin: 0 }} className="stack" disabled={busy}>
          <legend className="label" style={{ marginBottom: 8 }}>Mode</legend>
          {(master === "app" ? ["delta", "add", "replace"] : ["replace", "delta", "add"]).map((m) => (
            <label key={m} className="radio-card">
              <input type="radio" name="mode" value={m} checked={mode === m} onChange={() => pickMode(m)} />
              <span>
                <b>{IMPORT_MODE_LABEL[m]}</b>{(master === "app" ? m === "delta" : m === "replace") && <> <span className={`badge${master === "app" ? " accent" : ""}`}>default</span></>}<br />
                <span className="small muted">{IMPORT_MODE_HELP[m]}</span>
              </span>
            </label>
          ))}
          {mode === "add" && (
            <div className="notice warn" role="alert">
              <span aria-hidden="true">⚠️</span>
              <div className="grow"><b>Add duplicates cards you already imported.</b> Every copy in the file is added again, even if it came in with an earlier import. Use <b>Only new copies</b> to add just what changed.</div>
            </div>
          )}
          {master === "app" && mode === "replace" && (
            <div className="notice warn" role="alert">
              <span aria-hidden="true">⚠️</span>
              <div className="grow"><b>This deletes every card that came from ManaBox</b> and loads the file instead. mtg-planner is the master of your collection, so this is rarely what you want: cards you moved or scanned here stay, but ManaBox cards you haven't organised yet are replaced by the file. You'll be asked to confirm.</div>
            </div>
          )}
        </fieldset>

        <button type="submit" className="btn primary" disabled={!file || busy}>
          {busy ? <><span className="spinner" aria-hidden="true" style={{ borderTopColor: "var(--accent-ink)" }} /> Importing…</> : <><Icon.import /> Import</>}
        </button>

        {busy && (
          <div className="stack" role="status" aria-live="polite">
            <div className="progress" aria-hidden="true" />
            <span className="small muted">Matching cards on Scryfall and fetching prices… {elapsed}s. Large collections can take a minute — keep this page open.</span>
          </div>
        )}
        <ErrorNotice error={error} />
        {result && (
          <div className="stack" role="status">
            <div className="notice ok"><span aria-hidden="true">✓</span><div className="grow"><b>Import complete.</b></div></div>
            <ImportSummary s={result} />
          </div>
        )}
      </form>

      <MasterPanel master={master} busy={masterState.busy} error={masterState.error} onSwitch={switchMaster} />

      <section className="card stack" aria-labelledby="prices-title">
        <h2 id="prices-title">Prices</h2>
        <p className="small muted" style={{ margin: 0 }}>Imports already fetch current prices. Refresh in between to update prices and card data for everything you own and every deck card.</p>
        <div className="row">
          <button type="button" className="btn" onClick={refreshPrices} disabled={refresh.busy || busy}>
            {refresh.busy ? <><span className="spinner" aria-hidden="true" /> Refreshing…</> : <><Icon.refresh /> Refresh prices</>}
          </button>
          {refresh.result && <span className="small" role="status">Refreshed {fmtInt(refresh.result.refreshed)} cards{refresh.result.not_found ? `, ${fmtInt(refresh.result.not_found)} not found` : ""}.</span>}
        </div>
        <ErrorNotice error={refresh.error} />
      </section>

      <ScannerIndexPanel health={health} />

      <BackupPanel dataVersion={dataVersion} onRestored={onRestored} />

      <section className="card stack" aria-labelledby="history-title">
        <h2 id="history-title">Import history</h2>
        <ErrorNotice error={historyError} onRetry={loadHistory} />
        {!history && !historyError && <Spinner />}
        {history && history.length === 0 && <p className="muted" style={{ margin: 0 }}>No imports yet.</p>}
        {history && history.length > 0 && (
          <div>
            {history.map((h) => {
              const s = h.summary || {};
              return (
                <div key={h.id} className="history-item">
                  <div className="row between">
                    <b style={{ overflowWrap: "anywhere" }}>{h.filename || "ManaBox CSV"}</b>
                    <span className="muted small nowrap">{fmtDate(h.created_at)}</span>
                  </div>
                  <div className="row small">
                    <span className={`badge ${h.mode === "add" ? "warn" : h.mode === "delta" ? "accent" : ""}`}>{h.mode === "delta" ? "new copies" : h.mode || h.kind}</span>
                    <span className="muted">{fmtInt(s.total_cards_before)} → {fmtInt(s.total_cards_after)} copies{h.mode === "delta" || s.mode === "delta"
                      ? `${(s.added_copies ?? s.copies_added) != null ? ` · +${fmtInt(s.added_copies ?? s.copies_added)} new` : ""}`
                      : ` · +${fmtInt(s.printings_added)} / −${fmtInt(s.printings_removed)} / ~${fmtInt(s.printings_changed)} printings`}</span>
                    {s.unresolved?.length > 0 && <span className="badge warn">{s.unresolved.length} unresolved</span>}
                  </div>

                </div>
              );
            })}
          </div>
        )}
      </section>

      <p className="footer-note">mtg-planner {health ? health.version : ""} · card data and images © Scryfall / Wizards of the Coast · unofficial fan tool</p>
    </div>
  );
}

// ===========================================================================
// Scan tab: camera scanner, staging list, commit to binder / deck
// ===========================================================================

const SCAN_LANGS = [
  ["en", "English"], ["de", "Deutsch"], ["fr", "Français"], ["it", "Italiano"], ["es", "Español"], ["pt", "Português"],
  ["ja", "日本語"], ["ko", "한국어"], ["ru", "Русский"], ["zhs", "简体中文"], ["zht", "繁體中文"],
];
const CONDITIONS = [
  ["mint", "Mint", "M"], ["near_mint", "Near Mint", "NM"], ["excellent", "Excellent", "EX"], ["good", "Good", "GD"],
  ["light_played", "Light Played", "LP"], ["played", "Played", "PL"], ["poor", "Poor", "PR"],
];
const BOARDS = [["main", "Main deck"], ["side", "Sideboard"], ["commander", "Commander"], ["maybe", "Maybeboard"]];
const FINISH_LABEL = { nonfoil: "Non-foil", foil: "Foil", etched: "Etched" };
const STATUS_LABEL = { auto: "✓ matched", suggest: "? confirm", review: "✗ pick", failed: "✗ unknown", duplicate: "= same as last" };
const STATUS_COLOR = { auto: "#62d18d", suggest: "#f0c062", duplicate: "#f0c062", review: "#ff8274", failed: "#ff8274", error: "#ff8274" };
// (Sound settings moved to mtg.scan.sound, see loadSoundSettings.)
const SCAN_DEFAULTS = { storageLang: "en", foil: "auto", condition: "near_mint", setHint: "", auto: true, photo: true, calibration: false };

/** Array from an API answer that may be a bare array or wrap it in a key. */
const asList = (d, ...keys) => (Array.isArray(d) ? d : keys.map((k) => d?.[k]).find(Array.isArray) || []);
const jsonArr = (v) => {
  if (Array.isArray(v)) return v;
  if (typeof v === "string" && v.trim().startsWith("[")) { try { const a = JSON.parse(v); return Array.isArray(a) ? a : []; } catch { return []; } }
  return [];
};
const normFinish = (f) => (f === "normal" || !f ? "nonfoil" : f);

/** One printing shape for index rows, candidates and scan rows. */
function normPrinting(p) {
  if (!p) return null;
  const face = jsonArr(p.faces)[0] || {};
  return {
    id: p.id ?? p.printing_id ?? p.scryfall_id ?? null,
    oracle_id: p.oracle_id ?? null,
    name: p.printed_name && p.lang && p.lang !== "en" ? p.printed_name : (p.name ?? face.name ?? "?"),
    en_name: p.name ?? face.name ?? "",
    set: String(p.set_code ?? p.set ?? "").toLowerCase(),
    set_name: p.set_name ?? "",
    cn: p.collector_number ?? p.number ?? "",
    lang: p.lang ?? p.language ?? "",
    frame: p.frame != null ? String(p.frame) : null,
    img: p.image_normal ?? face.image_normal ?? p.image_small ?? face.image_small ?? null,
    imgSmall: p.image_small ?? face.image_small ?? p.image_normal ?? face.image_normal ?? null,
    finishes: jsonArr(p.finishes).map(normFinish),
    score: typeof p.score === "number" ? p.score : null,
    // What tells near-identical printings apart (promo stamps, frames, borders).
    tags: [...new Set([
      ...jsonArr(p.promo_types), ...jsonArr(p.frame_effects).filter((f) => f !== "legendary"),
      p.full_art ? "full art" : null, p.textless ? "textless" : null,
      p.border_color && p.border_color !== "black" ? `${p.border_color} border` : null,
      p.frame && !["2015", "2003"].includes(String(p.frame)) ? `${p.frame} frame` : null,
    ].filter(Boolean).map(String))],
  };
}
const printingLabel = (p) => (p ? `${p.set.toUpperCase()} #${p.cn}${p.lang ? ` · ${p.lang.toUpperCase()}` : ""}` : "");

// Scan ids can be reused (Rescan/Undo delete the newest row, SQLite hands its id
// out again), so the URL carries the scan's created_at: a new capture never hits
// the browser's cached JPEG of the old one.
const scanFileUrl = (s, kind) => `/api/scans/${s.id}/${kind}${s.created_at ? `?v=${encodeURIComponent(s.created_at)}` : ""}`;
function scanThumb(s) {
  const st = s.store || s.store_printing || s.printing || {};
  return s.image_small || s.image_normal || st.image_small || st.image_normal || jsonArr(st.faces)[0]?.image_small || (s.image_path || s.has_image ? scanFileUrl(s, "image") : null);
}
function scanFinishes(s) {
  const st = s.store || s.store_printing || s.printing || {};
  const f = jsonArr(s.finishes).length ? jsonArr(s.finishes) : jsonArr(st.finishes);
  const list = [...new Set(f.map(normFinish))].filter((x) => FINISH_LABEL[x]);
  return list.length ? list : ["nonfoil", "foil"];
}
const candidatesOf = (result, scan) => {
  const r = jsonArr(result?.candidates);
  return (r.length ? r : jsonArr(scan?.candidates)).map(normPrinting).filter((p) => p && p.id);
};

// ---------------------------------------------------------------------------
// Feedback: scan sounds (scanlib createScanSounds, Web Audio unlocked on the
// "Start camera" tap) + vibration. Sound settings are per device in
// localStorage mtg.scan.sound {enabled, threshold}: a staged scan plays the
// success blip, or the cash sound when its EUR price is >= threshold.

const SOUND_DEFAULTS = { enabled: true, threshold: 5 };
function loadSoundSettings() {
  const s = store.get("mtg.scan.sound", null);
  // Before v0.5.0 the on/off switch lived in mtg.scan.settings.sound ("Beep on scan").
  const legacy = store.get("mtg.scan.settings", {})?.sound;
  const enabled = typeof s?.enabled === "boolean" ? s.enabled : legacy !== false;
  const t = Number(s?.threshold);
  return { enabled, threshold: Number.isFinite(t) && t >= 0 ? t : SOUND_DEFAULTS.threshold };
}
function vibrate(kind) {
  try { navigator.vibrate?.(kind === "auto" || kind === "increment" ? 40 : kind === "suggest" || kind === "duplicate" ? [30, 60, 30] : [120, 60, 120]); } catch { /* ignore */ }
}

// Scanner version: scanlib's scanDetVersion() reads ?det=v1|v2, else localStorage
// mtg.scan.det (a plain string), default v2. The settings choice writes that key.
const SCAN_DET_KEY = "mtg.scan.det";
function detUrlOverride() {
  try { const v = new URLSearchParams(window.location.search).get("det"); return v === "v1" || v === "v2" ? v : null; } catch { return null; }
}
function readDetChoice() {
  try { return localStorage.getItem(SCAN_DET_KEY) === "v1" ? "v1" : "v2"; } catch { return "v2"; }
}
function writeDetChoice(v) {
  try { localStorage.setItem(SCAN_DET_KEY, v); } catch { /* private mode: this session only */ }
}

// Record session (scanner tuning data): small frames + capture decision
// records go to POST /api/debug/frames. Off by default, auto-off after 15 min.
const RECORD_MAX_MS = 15 * 60 * 1000;
const RECORD_EVERY_MS = 500;
const RECORD_MAX_B64 = 300 * 1024;
function newRecordSession() {
  const d = new Date(), p = (n) => String(n).padStart(2, "0");
  const rnd = Math.random().toString(36).slice(2, 6).padEnd(4, "0");
  return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}-${rnd}`;
}
/**
 * Capture tuning overrides for field tests (CaptureController cfg): localStorage
 * mtg.scan.capture (JSON object), then ?scancfg=<JSON> in the URL on top.
 * capture.js validates them and ignores unknown keys / wrong types.
 */
function readCaptureOverrides() {
  let over = {};
  const saved = store.get("mtg.scan.capture", null);
  if (saved && typeof saved === "object" && !Array.isArray(saved)) over = { ...saved };
  try {
    const q = new URLSearchParams(window.location.search).get("scancfg");
    const u = q ? JSON.parse(q) : null;
    if (u && typeof u === "object" && !Array.isArray(u)) over = { ...over, ...u };
  } catch { /* malformed ?scancfg */ }
  return over;
}
const fmtElapsed = (ms) => { const s = Math.max(0, Math.floor(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };

/**
 * Recorded sessions on the server (GET/DELETE /api/debug/sessions), shown in
 * the scan settings so old recordings can be cleaned up from the phone.
 * `recording` = the session being recorded now (not deletable, list reloads when it stops).
 */
function RecordedSessions({ recording }) {
  const [list, setList] = useState(null);
  const [error, setError] = useState(null);
  const [ask, setAsk] = useState(null); // id awaiting the inline "Delete?" confirm
  const [busy, setBusy] = useState(null);
  const load = useCallback(() => {
    api("/api/debug/sessions").then((d) => { setList(d.sessions || []); setError(null); })
      .catch((e) => setError(`Could not load recorded sessions: ${e.message}`));
  }, []);
  useEffect(load, [load, recording]);
  const remove = async (id) => {
    setBusy(id); setError(null);
    try { await api(`/api/debug/sessions/${encodeURIComponent(id)}`, { method: "DELETE" }); setAsk(null); load(); }
    catch (e) { setError(`Delete failed: ${e.message}`); setAsk(null); load(); }
    finally { setBusy(null); }
  };
  return (
    <div className="field rec-sessions" style={{ gridColumn: "1 / -1" }}>
      <span className="small" style={{ fontWeight: 600 }}>Recorded sessions</span>
      {error && <span className="small" style={{ color: "var(--bad)" }} role="alert">{error}</span>}
      {!list && !error && <span className="small muted">Loading…</span>}
      {list && list.length === 0 && <span className="small muted">No recorded sessions.</span>}
      {list && list.length > 0 && (
        <ul className="rec-list">
          {list.map((s) => (
            <li key={s.id}>
              <span className="grow small">
                <b>{fmtDate(s.started_at)}</b>
                <span className="muted"> · {plural(s.frames, "frame")} · {(s.bytes / 1048576).toFixed(1)} MB</span>
                {s.id === recording && <span className="badge accent" style={{ marginLeft: 6 }}>recording</span>}
              </span>
              {ask === s.id ? (
                <span className="row small" style={{ gap: 4 }} role="group" aria-label="Confirm delete">
                  <span>Delete?</span>
                  <button type="button" className="btn sm danger" disabled={busy === s.id} onClick={() => remove(s.id)}>Yes</button>
                  <button type="button" className="btn sm" disabled={busy === s.id} onClick={() => setAsk(null)}>No</button>
                </span>
              ) : (
                <button type="button" className="btn sm ghost danger" style={{ paddingInline: 8 }} disabled={s.id === recording || Boolean(busy)}
                  onClick={() => setAsk(s.id)} aria-label={`Delete recorded session from ${fmtDate(s.started_at)}`} title="Delete"><Icon.trash /></button>
              )}
            </li>
          ))}
        </ul>
      )}
    </div>
  );
}

function cameraErrorMessage(e) {
  const n = e?.name;
  if (n === "NotAllowedError" || n === "SecurityError") return "Camera access was denied. Allow the camera for this site in your browser settings, then tap Start camera again.";
  if (n === "NotFoundError" || n === "OverconstrainedError") return "No usable camera was found on this device.";
  if (n === "NotReadableError" || n === "AbortError") return "The camera is busy (another app or tab may be using it). Close it and try again.";
  return e?.message || "Could not start the camera.";
}

// ---------------------------------------------------------------------------
// Camera view: stream, analysis loop, overlay, auto/manual capture.
// v2 (default): detector A2 + CaptureController (public/capture.js) + upload
// queue. v1 (?det=v1 or the "classic" setting): the old findCard/AutoCapture
// path, kept unchanged as the fallback for v0.5.x.

function CameraView(props) {
  return props.v2 ? <CameraViewV2 {...props} /> : <CameraViewV1 {...props} />;
}

function CameraViewV1({ lib, active, settings, busy, paused, flash, rearmKey, onCapture, onError, onUnlock }) {
  const videoRef = useRef(null);
  const overlayRef = useRef(null);
  const streamRef = useRef(null);
  const trackRef = useRef(null);
  const acRef = useRef(null);
  const obsRef = useRef(null);
  const capturingRef = useRef(false);
  const live = useRef({});
  live.current = { busy, paused, auto: settings.auto, photo: settings.photo, onCapture, onError, flash };
  const [cam, setCam] = useState({ state: "off", error: null, vw: 0, vh: 0 });
  const [status, setStatus] = useState({ phase: "searching", hint: "" });
  const [torch, setTorchState] = useState({ supported: null, on: false });
  // Every stop() bumps the generation; a start() that resumes after it (the
  // permission prompt or camera warm-up was still pending) drops its stream.
  const genRef = useRef(0);
  const activeRef = useRef(active);
  activeRef.current = active;

  const stop = useCallback(() => {
    genRef.current++;
    if (lib) lib.stopStream(streamRef.current);
    else streamRef.current?.getTracks().forEach((t) => t.stop());
    streamRef.current = null;
    trackRef.current = null;
    if (videoRef.current) videoRef.current.srcObject = null;
    setCam((c) => (c.state === "off" || c.state === "error" ? c : { ...c, state: "off" }));
    setTorchState((t) => ({ ...t, on: false }));
  }, [lib]);

  const start = async () => {
    if (!lib || cam.state === "starting") return;
    onUnlock?.();
    const gen = ++genRef.current;
    const stale = () => gen !== genRef.current || !activeRef.current || document.hidden;
    setCam({ state: "starting", error: null, vw: 0, vh: 0 });
    try {
      const stream = await lib.openCamera();
      if (stale()) {
        lib.stopStream(stream);
        if (gen === genRef.current) stop();
        return;
      }
      streamRef.current = stream;
      const track = stream.getVideoTracks()[0];
      trackRef.current = track;
      track?.addEventListener?.("ended", () => { stop(); setCam({ state: "error", error: "The camera stopped (another app may have taken it).", vw: 0, vh: 0 }); });
      const v = videoRef.current;
      v.muted = true;
      v.setAttribute("playsinline", "");
      v.setAttribute("muted", "");
      v.srcObject = stream;
      await v.play().catch(() => {});
      if (!v.videoWidth) {
        await new Promise((res) => { v.addEventListener("loadedmetadata", res, { once: true }); setTimeout(res, 4000); });
      }
      if (stale()) { if (gen === genRef.current) stop(); return; }
      lib.preferContinuousFocus(track);
      setTorchState({ supported: lib.torchCapability(track), on: false });
      acRef.current = new lib.AutoCapture();
      setCam({ state: "on", error: null, vw: v.videoWidth, vh: v.videoHeight });
    } catch (e) {
      stop();
      setCam({ state: "error", error: cameraErrorMessage(e), vw: 0, vh: 0 });
    }
  };

  // Stop the camera when the tab is left or the page is hidden.
  useEffect(() => { if (!active) stop(); }, [active, stop]);
  useEffect(() => {
    const h = () => { if (document.hidden) stop(); };
    document.addEventListener("visibilitychange", h);
    return () => { document.removeEventListener("visibilitychange", h); stop(); };
  }, [stop]);
  useEffect(() => { acRef.current?.rearm(); }, [rearmKey]);

  const shoot = useCallback(async (o, mode) => {
    const v = videoRef.current;
    if (!lib || !v || !v.videoWidth || capturingRef.current || live.current.busy) return;
    capturingRef.current = true;
    const found = Boolean(o && o.found);
    const corners = found ? o.corners : lib.rectQuad(lib.guideRect(v.videoWidth, v.videoHeight));
    if (mode === "manual") acRef.current?.captured(o || {});
    try {
      const cap = await lib.captureCard(v, trackRef.current, corners, { preferPhoto: live.current.photo !== false });
      live.current.onCapture({ ...cap, mode, detected: found });
    } catch (e) {
      acRef.current?.rearm();
      live.current.onError?.(`Capture failed: ${e.message}`);
    } finally {
      capturingRef.current = false;
    }
  }, [lib]);

  // Analysis loop (~8 fps) + overlay drawing.
  useEffect(() => {
    if (cam.state !== "on" || !lib) return;
    const v = videoRef.current;
    const analyze = lib.createAnalyzer();
    const gap = 1000 / lib.CAPTURE_DEFAULTS.fps;
    let alive = true, timer = null, last = 0, shown = { phase: "", hint: "" };

    const draw = (o, r) => {
      const c = overlayRef.current;
      if (!c) return;
      const cw = c.clientWidth, ch = c.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
      if (!cw || !ch) return;
      if (c.width !== Math.round(cw * dpr) || c.height !== Math.round(ch * dpr)) { c.width = Math.round(cw * dpr); c.height = Math.round(ch * dpr); }
      const ctx = c.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, cw, ch);
      const sc = Math.max(cw / o.vw, ch / o.vh), dx = (cw - o.vw * sc) / 2, dy = (ch - o.vh * sc) / 2;
      const map = ([x, y]) => [x * sc + dx, y * sc + dy];
      const g = lib.rectQuad(o.guide).map(map);
      ctx.fillStyle = "rgba(0,0,0,.38)";
      ctx.beginPath();
      ctx.rect(0, 0, cw, ch);
      ctx.moveTo(g[0][0], g[0][1]); ctx.lineTo(g[3][0], g[3][1]); ctx.lineTo(g[2][0], g[2][1]); ctx.lineTo(g[1][0], g[1][1]); ctx.closePath();
      ctx.fill();
      const fl = live.current.flash;
      const flashOn = fl && Date.now() < fl.until;
      ctx.lineWidth = flashOn ? 6 : 2.5;
      ctx.setLineDash(flashOn || o.found ? [] : [10, 8]);
      ctx.strokeStyle = flashOn ? fl.color : "rgba(255,255,255,.85)";
      ctx.strokeRect(g[0][0], g[0][1], g[2][0] - g[0][0], g[2][1] - g[0][1]);
      if (o.found && o.corners) {
        const q = o.corners.map(map);
        ctx.setLineDash([]);
        ctx.lineWidth = 3;
