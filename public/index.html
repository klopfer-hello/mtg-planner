function PlannerTab({ active, health, request, onRequestHandled, onChanged }) {
  const [chats, setChats] = useState(null);
  const [chatsError, setChatsError] = useState(null);
  const [chatId, setChatId] = useState(() => store.get("mtg.chat", null));
  const chatIdRef = useRef(chatId);
  const [messages, setMessages] = useState([]);
  const [chatLoading, setChatLoading] = useState(false);
  const [serverBusy, setServerBusy] = useState(false);
  const [stream, setStream] = useState(null); // {text, tools} while this tab streams an answer
  const streamCtl = useRef(null);
  const sending = useRef(false); // set synchronously: blocks a double submit while the chat is created
  const [error, setError] = useState(null); // {message, status}
  const [input, setInput] = useState("");
  const [drawer, setDrawer] = useState(false);
  const drawerRef = useRef(null);
  const inputRef = useRef(null);
  const atBottom = useRef(true);

  const loadChats = useCallback(async () => {
    try {
      setChats(await api("/api/chats"));
      setChatsError(null);
    } catch (e) {
      setChatsError(`Could not load chats: ${e.message}`);
    }
  }, []);

  // Plain functions on purpose: they only touch refs and state setters.
  async function loadChat(id, { quiet = false } = {}) {
    if (!quiet) setChatLoading(true);
    try {
      const d = await api(`/api/chats/${id}`);
      if (chatIdRef.current !== id) return;
      setMessages(d.messages);
      setServerBusy(d.busy);
    } catch (e) {
      if (chatIdRef.current !== id) return;
      if (e.status === 404) selectChat(null);
      else setError({ message: `Could not load the chat: ${e.message}` });
    } finally {
      if (!quiet && chatIdRef.current === id) setChatLoading(false);
    }
  }

  function selectChat(id, { load = true } = {}) {
    // Leaving a streaming chat only detaches this browser: the server keeps
    // running the turn and stores the answer.
    if (streamCtl.current) { streamCtl.current.abort(); streamCtl.current = null; }
    chatIdRef.current = id;
    setChatId(id);
    store.set("mtg.chat", id);
    setMessages([]);
    setStream(null);
    setServerBusy(false);
    setError(null);
    setChatLoading(false);
    setDrawer(false);
    atBottom.current = true;
    if (id && load) loadChat(id);
  }

  useEffect(() => {
    loadChats();
    if (chatIdRef.current) loadChat(chatIdRef.current);
    return () => streamCtl.current?.abort();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  // Another tab/device (or a detached stream) is still answering: poll.
  useEffect(() => {
    if (!serverBusy || stream || !chatId) return;
    const t = setInterval(() => loadChat(chatId, { quiet: true }), 3000);
    return () => clearInterval(t);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [serverBusy, stream, chatId]);
  // ...and refresh the list once it finishes (title/updated_at). The turn may
  // have saved a deck (save_deck), so the Decks tab refetches too.
  const wasBusy = useRef(false);
  useEffect(() => {
    if (wasBusy.current && !serverBusy) { loadChats(); onChanged?.(); }
    wasBusy.current = serverBusy;
  }, [serverBusy, loadChats, onChanged]);

  async function send(textArg, targetId) {
    const fromInput = textArg == null;
    const text = (fromInput ? input : textArg).trim();
    // An explicit target chat (deck prompt) was just created, so a stale busy flag doesn't apply.
    if (!text || sending.current || streamCtl.current || (serverBusy && targetId == null)) return;
    sending.current = true;
    try {
      await sendTurn(text, fromInput, targetId);
    } finally {
      sending.current = false;
    }
  }

  async function sendTurn(text, fromInput, targetId) {
    setError(null);
    let id = targetId ?? chatIdRef.current;
    if (!id) {
      try {
        const chat = await api("/api/chats", { method: "POST", json: {} });
        setChats((cs) => [chat, ...(cs || [])]);
        id = chat.id;
        selectChat(id, { load: false });
      } catch (e) {
        setError({ message: `Could not create a chat: ${e.message}` });
        return;
      }
    }
    const ctl = new AbortController();
    streamCtl.current = ctl;
    const tmpId = `tmp-${Date.now()}`;
    setMessages((m) => [...m, { id: tmpId, role: "user", content: text, tools: [], created_at: null }]);
    setStream({ text: "", tools: [] });
    if (fromInput) setInput("");
    atBottom.current = true;

    const undo = (message, status) => {
      if (streamCtl.current === ctl) streamCtl.current = null;
      if (chatIdRef.current !== id) return;
      setStream(null);
      setMessages((m) => m.filter((x) => x.id !== tmpId));
      setInput((cur) => cur || text); // keep the prompt so it can be re-sent
      setError({ message, status });
    };

    let res;
    try {
      res = await fetch(`/api/chats/${id}/messages`, {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }), signal: ctl.signal,
      });
    } catch (e) {
      if (!ctl.signal.aborted) undo(`Network error: ${e.message}`);
      return;
    }
    if (!res.ok) {
      let message = `Request failed: HTTP ${res.status}`;
      try { const d = await res.json(); if (d?.error) message = d.error; } catch { /* not JSON */ }
      undo(message, res.status);
      if (res.status === 409) loadChat(id, { quiet: true }); // shows the running answer as busy
      return;
    }

    try {
      for await (const ev of readSse(res.body)) {
        if (chatIdRef.current !== id || ctl.signal.aborted) break;
        if (ev.type === "text") setStream((s) => s && { ...s, text: s.text + ev.text });
        else if (ev.type === "tool") setStream((s) => s && { ...s, tools: [...s.tools, { name: ev.name, input: ev.input }] });
        else if (ev.type === "done") { setMessages((m) => [...m, ev.message]); setStream(null); onChanged?.(); }
        else if (ev.type === "error") setError({ message: ev.error });
      }
    } catch (e) {
      if (!ctl.signal.aborted && chatIdRef.current === id) setError({ message: `Connection lost: ${e.message}. The answer may still arrive — reopen the chat in a moment.` });
    }
    if (streamCtl.current === ctl) streamCtl.current = null;
    if (chatIdRef.current === id) {
      setStream(null);
      loadChat(id, { quiet: true }); // sync stored ids, stored error text, busy flag
    }
    loadChats();
  }

  // "Ask the planner about this deck": start a fresh chat and send the prompt.
  useEffect(() => {
    if (!request) return;
    onRequestHandled();
    (async () => {
      if (streamCtl.current) { setError({ message: "Wait for the current answer to finish first." }); setInput(request.prompt); return; }
      try {
        const chat = await api("/api/chats", { method: "POST", json: { title: request.title } });
        setChats((cs) => [chat, ...(cs || [])]);
        selectChat(chat.id, { load: false });
        send(request.prompt, chat.id);
      } catch (e) {
        setError({ message: `Could not create a chat: ${e.message}` });
      }
    })();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [request]);

  async function deleteChat(id) {
    const chat = chats?.find((c) => c.id === id);
    if (!window.confirm(`Delete the chat "${chat?.title || "this chat"}"?`)) return;
    try {
      await api(`/api/chats/${id}`, { method: "DELETE" });
      setChats((cs) => (cs || []).filter((c) => c.id !== id));
      if (chatIdRef.current === id) selectChat(null);
    } catch (e) {
      setChatsError(`Could not delete the chat: ${e.message}`);
    }
  }

  // Stick to the bottom while an answer streams, unless the user scrolled up.
  useEffect(() => {
    if (!active) return;
    const onScroll = () => {
      const el = document.documentElement;
      atBottom.current = window.innerHeight + window.scrollY >= el.scrollHeight - 160;
    };
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, [active]);
  useLayoutEffect(() => {
    if (active && atBottom.current) window.scrollTo(0, document.documentElement.scrollHeight);
  }, [messages, stream, serverBusy, active]);

  // Auto-grow composer.
  useLayoutEffect(() => {
    const el = inputRef.current;
    if (!el) return;
    el.style.height = "auto";
    el.style.height = `${Math.min(el.scrollHeight, window.innerHeight * 0.4)}px`;
  }, [input]);

  const coarse = useMemo(() => window.matchMedia?.("(pointer: coarse)").matches, []);
  // Mobile chat drawer behaves like a modal: focus moves in, Tab is trapped,
  // Escape closes it and focus returns to the toggle (as in Sheet).
  useEffect(() => {
    if (!drawer) return;
    const prevFocus = document.activeElement;
    const focusables = () => drawerRef.current
      ? [...drawerRef.current.querySelectorAll('a[href], button:not([disabled]), input, select, textarea, [tabindex]:not([tabindex="-1"])')]
      : [];
    focusables()[0]?.focus();
    const onKey = (e) => {
      if (e.key === "Escape") { e.stopPropagation(); setDrawer(false); }
      if (e.key === "Tab") {
        const f = focusables();
        if (!f.length) return;
        const first = f[0], last = f[f.length - 1];
        const inside = drawerRef.current.contains(document.activeElement);
        if (e.shiftKey && (!inside || document.activeElement === first)) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && (!inside || document.activeElement === last)) { e.preventDefault(); first.focus(); }
      }
    };
    document.addEventListener("keydown", onKey);
    return () => {
      document.removeEventListener("keydown", onKey);
      if (prevFocus && prevFocus.focus && document.contains(prevFocus)) prevFocus.focus({ preventScroll: true });
    };
  }, [drawer]);

  const busy = Boolean(stream) || serverBusy;
  const chat = chats?.find((c) => c.id === chatId);
  const notConfigured = health && !health.claude_configured;

  const sidebar = (
    <>
      {drawer && <div className="drawer-backdrop" onClick={() => setDrawer(false)} aria-hidden="true" />}
      <aside ref={drawerRef} className={`chat-side${drawer ? " open" : ""}`} aria-label="Chats"
        role={drawer ? "dialog" : undefined} aria-modal={drawer ? "true" : undefined}>
        <div className="row between">
          <h2 style={{ fontSize: "1.05rem" }}>Chats</h2>
          <button type="button" className="btn ghost icon drawer-toggle" aria-label="Close chat list" onClick={() => setDrawer(false)}><Icon.close /></button>
        </div>
        <button type="button" className="btn primary" onClick={() => { selectChat(null); setTimeout(() => inputRef.current?.focus(), 0); }}><Icon.plus /> New chat</button>
        <ErrorNotice error={chatsError} onRetry={loadChats} />
        {!chats && !chatsError && <Spinner />}
        {chats && chats.length === 0 && <p className="muted small">No chats yet.</p>}
        {chats?.map((c) => (
          <div key={c.id} className="chat-link" aria-current={c.id === chatId ? "true" : undefined}>
            <button type="button" onClick={() => selectChat(c.id)}>
              <span>{c.title}</span>
              <span className="muted small">{fmtAgo(c.updated_at)}</span>
            </button>
            <button type="button" className="btn ghost icon" aria-label={`Delete chat ${c.title}`} onClick={() => deleteChat(c.id)}><Icon.trash /></button>
          </div>
        ))}
      </aside>
    </>
  );

  return (
    <div className="planner">
      {sidebar}
      <section className="chat-main" aria-label="Conversation">
        <div className="chat-title">
          <button type="button" className="btn icon drawer-toggle" aria-label="Show chats" aria-expanded={drawer} onClick={() => setDrawer(true)}><Icon.menu /></button>
          <h2>{chatId ? chat?.title || "Chat" : "New chat"}</h2>
          {chatId && <button type="button" className="btn sm" onClick={() => selectChat(null)}><Icon.plus /> New</button>}
        </div>

        {notConfigured && <SetupHint />}

        {chatLoading && <Spinner label="Loading chat…" />}

        {!chatId && messages.length === 0 && !stream && (
          <div className="stack">
            <div className="empty" style={{ paddingBottom: 8 }}>
              <h3>Ask the planner</h3>
              <p style={{ margin: 0, maxWidth: 520 }}>Claude can search your collection, look cards up on Scryfall, check rules and prices, and save decks you'll find in the Decks tab.</p>
            </div>
            <div className="suggestions">
              {SUGGESTIONS.map((s) => (
                <button key={s} type="button" className="suggestion" onClick={() => { setInput(s); setTimeout(() => { const el = inputRef.current; if (el) { el.focus(); el.setSelectionRange(s.length, s.length); } }, 0); }}>{s}</button>
              ))}
            </div>
          </div>
        )}

        {chatId && !chatLoading && messages.length === 0 && !stream && !serverBusy && (
          <p className="muted">No messages yet — say hello.</p>
        )}

        <div className="messages" aria-live="off">
          {messages.map((m) => <Message key={m.id} msg={m} />)}
          {stream && (
            <div className="msg assistant" aria-busy="true">
              {stream.tools.length > 0 && <div className="tools">{stream.tools.map((t, i) => <ToolChip key={i} tool={t} />)}</div>}
              <div className="bubble">
                {stream.text ? <Markdown text={stream.text} /> : null}
                <span className="typing" role="status" aria-label="Claude is working"><span /><span /><span /></span>
              </div>
            </div>
          )}
          {!stream && serverBusy && (
            <div className="notice" role="status"><span className="spinner" aria-hidden="true" /><div className="grow">Claude is still working on an answer in this chat. It will appear here when it's done.</div></div>
          )}
        </div>

        {error && (error.status === 503
          ? (!notConfigured && <SetupHint />)
          : <ErrorNotice error={error.message} onDismiss={() => setError(null)} />)}

        <div className="composer">
          <form onSubmit={(e) => { e.preventDefault(); send(); }}>
            <label htmlFor="chat-input" className="sr-only">Message</label>
            <textarea id="chat-input" ref={inputRef} rows={1} value={input} maxLength={20000}
              placeholder={busy ? "Claude is answering…" : "Ask the planner…"}
              onChange={(e) => setInput(e.target.value)}
              onKeyDown={(e) => {
                if (e.key === "Enter" && !e.shiftKey && !coarse && !e.nativeEvent.isComposing) { e.preventDefault(); send(); }
              }} />
            <button type="submit" className="btn primary" aria-label="Send" disabled={busy || !input.trim()}>
              {busy ? <span className="spinner" aria-hidden="true" style={{ borderTopColor: "var(--accent-ink)" }} /> : <Icon.send />}
            </button>
          </form>
        </div>
      </section>
    </div>
  );
}

// ===========================================================================
// Import tab
// ===========================================================================

function Collapsible({ label, children }) {
  return (
    <details className="disclosure">
      <summary>{label}</summary>
      <div style={{ marginTop: 6 }}>{children}</div>
    </details>
  );
}

function ImportSummary({ s }) {
  if (!s) return null;
  const delta = (s.total_cards_after ?? 0) - (s.total_cards_before ?? 0);
  return (
    <div className="stack">
      <div className="summary-grid">
        <div className="stat"><div className="v">{fmtInt(s.total_cards_before)} → {fmtInt(s.total_cards_after)}</div><div className="k">Copies ({delta >= 0 ? "+" : ""}{fmtInt(delta)})</div></div>
        <div className="stat"><div className="v">+{fmtInt(s.printings_added)}</div><div className="k">Printings added</div></div>
        <div className="stat"><div className="v">−{fmtInt(s.printings_removed)}</div><div className="k">Printings removed</div></div>
        <div className="stat"><div className="v">{fmtInt(s.printings_changed)}</div><div className="k">Qty changed</div></div>
      </div>
      <dl className="kv">
        <dt>Mode</dt><dd>{s.mode === "add" ? "Add (merge)" : "Replace (sync)"}</dd>
        <dt>Rows</dt><dd>{fmtInt(s.imported_rows)} imported of {fmtInt(s.rows)}</dd>
        <dt>Printings</dt><dd>{fmtInt(s.printings)} owned</dd>
        {s.decks_from_binders?.length > 0 && (<><dt>Decks</dt><dd>{s.decks_from_binders.join(", ")}</dd></>)}
        {s.skipped_wishlist_rows > 0 && (<><dt>Skipped</dt><dd>{plural(s.skipped_wishlist_rows, "wish-list row")}</dd></>)}
      </dl>
      {s.unresolved?.length > 0 && (
        <Collapsible label={`${plural(s.unresolved.length, "row")} could not be matched on Scryfall`}>
          <ul className="small" style={{ margin: 0, paddingLeft: 18 }}>
            {s.unresolved.map((u, i) => <li key={i}>{u}</li>)}
          </ul>
        </Collapsible>
      )}
    </div>
  );
}

function ImportTab({ dataVersion, health, onImported }) {
  const [file, setFile] = useState(null);
  const [mode, setMode] = useState("replace");
  const [busy, setBusy] = useState(false);
  const [started, setStarted] = useState(null);
  const [elapsed, setElapsed] = useState(0);
  const [result, setResult] = useState(null);
  const [error, setError] = useState(null);
  const [refresh, setRefresh] = useState({ busy: false, result: null, error: null });
  const [history, setHistory] = useState(null);
  const [historyError, setHistoryError] = useState(null);
  const fileInput = useRef(null);

  const loadHistory = useCallback(() => {
    setHistoryError(null);
    api("/api/imports").then(setHistory).catch((e) => setHistoryError(`Could not load import history: ${e.message}`));
  }, []);
  useEffect(loadHistory, [loadHistory, dataVersion]);

  // Elapsed-time counter while a request runs.
  useEffect(() => {
    if (!started) return;
    const t = setInterval(() => setElapsed(Math.round((Date.now() - started) / 1000)), 1000);
    return () => clearInterval(t);
  }, [started]);
  // Warn before closing the page mid-import.
  useEffect(() => {
    if (!busy) return;
    const h = (e) => { e.preventDefault(); e.returnValue = ""; };
    window.addEventListener("beforeunload", h);
    return () => window.removeEventListener("beforeunload", h);
  }, [busy]);

  const submit = async (e) => {
    e.preventDefault();
    if (!file || busy) return;
    setBusy(true);
    setError(null);
    setResult(null);
    setElapsed(0);
    setStarted(Date.now());
    try {
      const text = await file.text();
      const params = new URLSearchParams({ mode, filename: file.name });
      const summary = await api(`/api/import/manabox?${params}`, { method: "POST", body: text, headers: { "Content-Type": "text/csv" } });
      setResult(summary);
      setFile(null);
      if (fileInput.current) fileInput.current.value = "";
      onImported();
    } catch (err) {
      setError(err.message);
    } finally {
      setBusy(false);
      setStarted(null);
    }
  };

  const refreshPrices = async () => {
    setRefresh({ busy: true, result: null, error: null });
    try {
      const r = await api("/api/refresh-prices", { method: "POST" });
      setRefresh({ busy: false, result: r, error: null });
      onImported();
    } catch (err) {
      setRefresh({ busy: false, result: null, error: err.message });
    }
  };

  return (
    <div className="stack-lg" style={{ maxWidth: 760 }}>
      <div className="page-title"><h1>Import</h1></div>

      <form className="card stack" onSubmit={submit} aria-labelledby="import-title" aria-busy={busy}>
        <h2 id="import-title">ManaBox collection CSV</h2>
        <Collapsible label="How to export from ManaBox">
          <ol className="steps small">
            <li>In ManaBox open <b>Collection</b>, tap <b>⋯</b> → <b>Export</b> → <b>CSV</b>.</li>
            <li>Share or save the file (e.g. to Files / Downloads).</li>
            <li>Pick it below and tap <b>Import</b>.</li>
          </ol>
          <p className="small muted" style={{ marginBottom: 0 }}>Deck binders become decks; wish-list binders are skipped.</p>
        </Collapsible>

        <label className={`file-drop${file ? " has-file" : ""}`}>
          <Icon.file />
          <b>{file ? file.name : "Choose CSV file"}</b>
          <span className="muted small">{file ? `${(file.size / 1024).toFixed(0)} KB · tap to change` : "ManaBox export (.csv)"}</span>
          <input ref={fileInput} type="file" accept=".csv,text/csv" disabled={busy}
            onChange={(e) => { setFile(e.target.files?.[0] || null); setError(null); }} />
        </label>

        <fieldset style={{ border: 0, padding: 0, margin: 0 }} className="stack" disabled={busy}>
          <legend className="label" style={{ marginBottom: 8 }}>Mode</legend>
          <label className="radio-card">
            <input type="radio" name="mode" value="replace" checked={mode === "replace"} onChange={() => setMode("replace")} />
            <span><b>Replace (sync)</b><br /><span className="small muted">Your collection becomes exactly what's in the file. ManaBox is the source of truth.</span></span>
          </label>
          <label className="radio-card">
            <input type="radio" name="mode" value="add" checked={mode === "add"} onChange={() => setMode("add")} />
            <span><b>Add</b><br /><span className="small muted">Add the file's quantities on top of what's already here.</span></span>
          </label>
        </fieldset>

        <button type="submit" className="btn primary" disabled={!file || busy}>
          {busy ? <><span className="spinner" aria-hidden="true" style={{ borderTopColor: "var(--accent-ink)" }} /> Importing…</> : <><Icon.import /> Import</>}
        </button>

        {busy && (
          <div className="stack" role="status" aria-live="polite">
            <div className="progress" aria-hidden="true" />
            <span className="small muted">Matching cards on Scryfall and fetching prices… {elapsed}s. Large collections can take a minute — keep this page open.</span>
          </div>
        )}
        <ErrorNotice error={error} />
        {result && (
          <div className="stack" role="status">
            <div className="notice ok"><span aria-hidden="true">✓</span><div className="grow"><b>Import complete.</b></div></div>
            <ImportSummary s={result} />
          </div>
        )}
      </form>

      <section className="card stack" aria-labelledby="prices-title">
        <h2 id="prices-title">Prices</h2>
        <p className="small muted" style={{ margin: 0 }}>Imports already fetch current prices. Refresh in between to update prices and card data for everything you own and every deck card.</p>
        <div className="row">
          <button type="button" className="btn" onClick={refreshPrices} disabled={refresh.busy || busy}>
            {refresh.busy ? <><span className="spinner" aria-hidden="true" /> Refreshing…</> : <><Icon.refresh /> Refresh prices</>}
          </button>
          {refresh.result && <span className="small" role="status">Refreshed {fmtInt(refresh.result.refreshed)} cards{refresh.result.not_found ? `, ${fmtInt(refresh.result.not_found)} not found` : ""}.</span>}
        </div>
        <ErrorNotice error={refresh.error} />
      </section>

      <section className="card stack" aria-labelledby="history-title">
        <h2 id="history-title">Import history</h2>
        <ErrorNotice error={historyError} onRetry={loadHistory} />
        {!history && !historyError && <Spinner />}
        {history && history.length === 0 && <p className="muted" style={{ margin: 0 }}>No imports yet.</p>}
        {history && history.length > 0 && (
          <div>
            {history.map((h) => {
              const s = h.summary || {};
              return (
                <div key={h.id} className="history-item">
                  <div className="row between">
                    <b style={{ overflowWrap: "anywhere" }}>{h.filename || "ManaBox CSV"}</b>
                    <span className="muted small nowrap">{fmtDate(h.created_at)}</span>
                  </div>
                  <div className="row small">
                    <span className={`badge ${h.mode === "add" ? "accent" : ""}`}>{h.mode || h.kind}</span>
                    <span className="muted">{fmtInt(s.total_cards_before)} → {fmtInt(s.total_cards_after)} copies · +{fmtInt(s.printings_added)} / −{fmtInt(s.printings_removed)} / ~{fmtInt(s.printings_changed)} printings</span>
                    {s.unresolved?.length > 0 && <span className="badge warn">{s.unresolved.length} unresolved</span>}
                  </div>
                  <Collapsible label="Details"><ImportSummary s={s} /></Collapsible>
                </div>
              );
            })}
          </div>
        )}
      </section>

      <p className="footer-note">mtg-planner {health ? health.version : ""} · card data and images © Scryfall / Wizards of the Coast · unofficial fan tool</p>
    </div>
  );
}

// ===========================================================================
// App shell
// ===========================================================================

const TABS = [
  { id: "collection", label: "Collection", icon: Icon.collection },
  { id: "decks", label: "Decks", icon: Icon.decks },
  { id: "planner", label: "Planner", icon: Icon.planner },
  { id: "import", label: "Import", icon: Icon.import },
];
const isTab = (t) => TABS.some((x) => x.id === t);

function App() {
  const [tab, setTab] = useState(() => {
    const h = location.hash.slice(1);
    return isTab(h) ? h : store.get("mtg.tab", "collection");
  });
  const [visited, setVisited] = useState(() => new Set([isTab(tab) ? tab : "collection"]));
  // Collection data (imports, prices) and deck data (deck edits, planner
  // save_deck) are versioned separately so a deck rename doesn't reset the
  // collection list. An import changes both.
  const [dataVersion, bumpData] = useReducer((x) => x + 1, 0);
  const [deckVersion, bumpDecks] = useReducer((x) => x + 1, 0);
  const onImported = useCallback(() => { bumpData(); bumpDecks(); }, []);
  const [cardId, setCardId] = useState(null);
  const [deck, setDeck] = useState({ id: null, notice: null });
  const [plannerRequest, setPlannerRequest] = useState(null);
  const [health, setHealth] = useState(null);
  const scrollPos = useRef({});
  const tabRefs = useRef({});

  useEffect(() => {
    api("/healthz").then(setHealth).catch(() => setHealth(null));
  }, []);

  const switchTab = useCallback((next) => {
    if (!isTab(next)) return;
    setTab((cur) => {
      if (cur !== next) scrollPos.current[cur] = window.scrollY;
      return next;
    });
  }, []);

  useLayoutEffect(() => {
    store.set("mtg.tab", tab);
    if (location.hash.slice(1) !== tab) history.replaceState(null, "", `#${tab}`);
    setVisited((v) => (v.has(tab) ? v : new Set([...v, tab])));
    window.scrollTo(0, scrollPos.current[tab] || 0);
  }, [tab]);

  useEffect(() => {
    const onHash = () => { const h = location.hash.slice(1); if (isTab(h)) switchTab(h); };
    window.addEventListener("hashchange", onHash);
    return () => window.removeEventListener("hashchange", onHash);
  }, [switchTab]);

  const openDeck = useCallback((id, notice = null) => {
    setDeck({ id, notice });
    setCardId(null);
    scrollPos.current.decks = 0;
    if (id) switchTab("decks");
    window.scrollTo(0, 0);
  }, [switchTab]);

  const askAboutDeck = useCallback((d) => {
    const prompt = `Let's work on my deck #${d.id} "${d.name}"${d.format ? ` (${d.format})` : ""}. `
      + `Load it with get_deck and give me a short analysis: mana curve, card-type balance, key synergies, weak spots, `
      + `and which of the missing cards matter most. Suggest improvements, preferring cards I already own.`;
    setPlannerRequest({ prompt, title: `Deck: ${d.name}`.slice(0, 60), nonce: Date.now() });
    switchTab("planner");
  }, [switchTab]);

  const onTabKey = (e) => {
    const i = TABS.findIndex((t) => t.id === tab);
    let j = null;
    if (e.key === "ArrowRight") j = (i + 1) % TABS.length;
    else if (e.key === "ArrowLeft") j = (i - 1 + TABS.length) % TABS.length;
    else if (e.key === "Home") j = 0;
    else if (e.key === "End") j = TABS.length - 1;
    if (j == null) return;
    e.preventDefault();
    switchTab(TABS[j].id);
    tabRefs.current[TABS[j].id]?.focus();
  };

  const panel = (id, content) => (
    <section key={id} id={`panel-${id}`} role="tabpanel" aria-labelledby={`tab-${id}`} hidden={tab !== id}>
      {visited.has(id) && content}
    </section>
  );

  return (
    <>
      <header className="app-header">
        <div className="brand"><img src="icon.svg" alt="" width="28" height="28" /> MTG Planner</div>
        <nav className="tabbar" role="tablist" aria-label="Sections" onKeyDown={onTabKey}>
          {TABS.map((t) => (
            <button key={t.id} id={`tab-${t.id}`} ref={(el) => { tabRefs.current[t.id] = el; }} type="button" role="tab" className="tab"
              aria-selected={tab === t.id} aria-controls={`panel-${t.id}`} tabIndex={tab === t.id ? 0 : -1}
              onClick={() => {
                if (t.id === "decks" && tab === "decks" && deck.id) openDeck(null);
                switchTab(t.id);
              }}>
              <t.icon />
              <span>{t.label}</span>
            </button>
          ))}
        </nav>
      </header>
      <main>
        {panel("collection", <CollectionTab dataVersion={dataVersion} onOpenCard={setCardId} onGoImport={() => switchTab("import")} />)}
        {panel("decks", <DecksTab dataVersion={deckVersion} deckId={deck.id} deckNotice={deck.notice} onOpenDeck={openDeck}
          onOpenCard={setCardId} onAsk={askAboutDeck} onChanged={bumpDecks} />)}
        {panel("planner", <PlannerTab active={tab === "planner"} health={health} request={plannerRequest}
          onRequestHandled={() => setPlannerRequest(null)} onChanged={bumpDecks} />)}
        {panel("import", <ImportTab dataVersion={dataVersion} health={health} onImported={onImported} />)}
      </main>
      {cardId && <CardSheet id={cardId} onClose={() => setCardId(null)} onOpenCard={setCardId} onOpenDeck={(id) => openDeck(id)} />}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
