// Allocation per deck row (v0.3.1): to_buy = copies you don't own at all
// (the only "missing" ones); in_use = owned copies claimed by other built
// decks (can be moved). Older servers only send `missing`: then it is to_buy.
const cardToBuy = (c) => (c && !c.basic ? Math.max(0, Number(c.to_buy ?? c.missing) || 0) : 0);
const cardInUse = (c) => (c && !c.basic ? Math.max(0, Number(c.in_use) || 0) : 0);
/** Other BUILT decks that use this card (names for the visible in-use line). */
const builtElsewhereOf = (c) => {
  const own = asList(c?.in_use_decks).filter((u) => u && (u.name || typeof u === "string"));
  if (own.length) return own;
  return asList(c?.used_elsewhere).filter((u) => u && (typeof u === "string" || (u.name && (!u.status || u.status === "built"))));
};
const deckNames = (list) => list.map(refName).filter((n, i, a) => a.indexOf(n) === i).join(", ");
/** Locked binders holding this card (kept for another deck or for all): "X, Y". */
const lockedOf = (c) => asList(c?.in_locked ?? c?.in_boxes).filter((b) => b && b.binder);
const boxNames = (c) => lockedOf(c).map((b) => b.binder).filter((n, i, a) => a.indexOf(n) === i).join(", ");
/** Copies of a deck row that lie in locked binders (part of in_use). */
const cardInLocked = (c) => (c && !c.basic ? Math.max(0, Number(c.in_use_locked ?? c.in_use_box) || 0) : 0);
/** Deck-level counts with fallbacks to the pre-0.3.1 fields. */
function deckCounts(deck) {
  const cards = asList(deck?.cards).filter((c) => c && c.board !== "maybe");
  const toBuy = deck?.to_buy_count ?? deck?.missing_count ?? cards.reduce((a, c) => a + cardToBuy(c), 0);
  const inUse = deck?.in_use_count ?? cards.reduce((a, c) => a + cardInUse(c), 0);
  return {
    toBuy: Number(toBuy) || 0,
    inUse: Number(inUse) || 0,
    toBuyEur: deck?.to_buy_eur ?? deck?.missing_cost_eur ?? deck?.missing_eur ?? deck?.value?.to_buy_eur ?? null,
    inUseEur: deck?.in_use_eur ?? deck?.value?.in_use_eur ?? null,
  };
}

function DeckCardRow({ card, onOpenCard, onActions, selecting = false, selected = false, onToggle }) {
  const [peek, setPeek] = useState(false);
  const elsewhere = asList(card.used_elsewhere).filter((u) => u && (u.name || typeof u === "string"));
  const free = card.available_for_this;
  const hasFree = !card.basic && typeof free === "number";
  const freeText = hasFree ? `own ${card.owned ?? 0} · ${Math.max(0, free)} free` : null;
  const toBuy = cardToBuy(card);
  const inUse = cardInUse(card);
  const builtElsewhere = card.basic ? [] : builtElsewhereOf(card);
  const decksWhere = deckNames(builtElsewhere) || "another built deck";
  // In use = claimed by other built decks and/or lying in locked binders (kept for another deck).
  const inBox = cardInLocked(card);
  const inDecks = inUse - inBox;
  const where = [inDecks > 0 ? deckNames(builtElsewhere) : "", inBox > 0 ? `locked binder ${boxNames(card)}` : ""].filter(Boolean).join(", ") || decksWhere;
  // Built deck + contested copies = conflict (red); idea deck = in use (amber).
  const conflict = Boolean(card.conflict) && !card.basic;
  const badges = [];
  if (card.basic) badges.push(<span key="b" className="badge" title="Basic land">basic</span>);
  else {
    if (inUse > 0) {
      const t = conflict
        ? `Conflict: ${inUse} of your copies ${inUse === 1 ? "is" : "are"} also in ${where} (own ${card.owned ?? 0})`
        : `In use: ${inUse} owned ${inUse === 1 ? "copy is" : "copies are"} in ${where}. You can move ${inUse === 1 ? "it" : "them"} to this deck.`;
      badges.push(<span key="u" className={`badge ${conflict ? "bad" : "warn"}`} role="img" aria-label={t} title={t}>{conflict ? "⚠" : inBox >= inUse ? "🔒" : "⇄"} {inUse}</span>);
    }
    if (conflict && !inUse) {
      // Shared with another built deck but no owned copy to contest: still a conflict.
      const t = `Conflict: also in ${decksWhere} (own ${card.owned ?? 0})`;
      badges.push(<span key="c" className="badge bad" role="img" aria-label={t} title={t}>⚠</span>);
    }
    if (toBuy > 0) {
      const t = `To buy: ${toBuy} (${freeText || `you own ${card.owned ?? 0}`})`;
      badges.push(<span key="m" className="badge bad" role="img" aria-label={t} title={t}>✗ {toBuy}</span>);
    }
    if (!inUse && !toBuy) {
      // Covered. Another built deck also using it (enough copies) stays a hint.
      const sharedTitle = builtElsewhere.length
        ? `${conflict ? `Not enough copies (own ${card.owned ?? 0}). ` : ""}Also used in: ${builtElsewhere.map((u) => (typeof u === "string" ? u : `${u.name}${u.quantity ? ` (${u.quantity}×)` : ""}`)).join(", ")}`
        : null;
      if (sharedTitle && !conflict) badges.push(<span key="s" className={`badge ${conflict ? "bad" : "warn"}`} role="img" aria-label={sharedTitle} title={sharedTitle}>⚠</span>);
      badges.push(<span key="ok" className="badge ok" aria-label={`Owned (${card.owned})`} title={`You own ${card.owned}`}>✓</span>);
    }
  }
  // Visible on phones (no hover): where the copies are and that they can move.
  const lockedLine = inBox > 0 ? <>🔒 in {boxNames(card)} · locked</> : null;
  const useLine = conflict
    ? <span className="use conf">conflict: also in {decksWhere}{lockedLine && <> · {lockedLine}</>}</span>
    : inUse > 0
      ? <span className="use inuse">{inDecks > 0 && <>in {deckNames(builtElsewhere) || decksWhere} · can be moved</>}{inDecks > 0 && lockedLine && " · "}{lockedLine}</span>
      : null;
  const unresolved = !card.scryfall_id;
  return (
    <>
      <div className="deck-line">
      <button type="button" className="deck-row" disabled={unresolved && !selecting}
        aria-expanded={unresolved || selecting ? undefined : peek} aria-pressed={selecting ? selected : undefined}
        aria-label={selecting ? `Select ${card.quantity}× ${card.name}` : undefined}
        onClick={() => (selecting ? onToggle?.() : setPeek((p) => !p))} title={unresolved && !selecting ? "Not found on Scryfall" : undefined}>
        {selecting
          ? <span className="sel-mark" aria-hidden="true">{selected && <Icon.check />}</span>
          : <span className="q">{card.quantity}</span>}
        <span className="nm">
          <b>{selecting ? `${card.quantity}× ` : ""}{card.name}</b>
          <ManaCost cost={card.mana_cost} />
          {unresolved && <span className="badge warn">unresolved</span>}
          {!useLine && hasFree && free < (card.owned ?? 0) && <span className="free">{freeText}</span>}
        </span>
        <span className="end">
          <span className="price">{fmtPrice(card.price)}</span>
          {badges}
        </span>
        {useLine}
      </button>
      {onActions && !selecting && (
        <button type="button" className="btn ghost icon row-more" aria-label={`Actions for ${card.name}`} title="Board, quantity, commander" onClick={(e) => onActions(card, e.currentTarget)}><Icon.more /></button>
      )}
      </div>
      {peek && !unresolved && !selecting && (
        <div className="peek">
          {card.image_small ? <img src={card.image_small} alt={card.name} loading="lazy" /> : <span />}
          <div className="stack small" style={{ gap: 6, alignContent: "start" }}>
            <span>{card.type_line}</span>
            <span className="muted">{(card.set_code || "").toUpperCase()} #{card.collector_number} · {freeText || `own ${card.owned}`}</span>
            {asList(card.binders).length > 0 && (
              <span>In {asList(card.binders).length === 1 ? "binder" : "binders"}: {asList(card.binders).map((b) => `${b.binder || "Unsorted"} (${b.quantity})`).join(", ")}</span>
            )}
            {elsewhere.length > 0 && (
              <span className="muted">Also in: {elsewhere.map((u) => (typeof u === "string" ? u : `${u.name}${u.status ? ` (${u.status})` : ""}${u.quantity ? ` ${u.quantity}×` : ""}`)).join(", ")}</span>
            )}
            <button type="button" className="btn sm" style={{ justifySelf: "start" }} onClick={() => onOpenCard(card.scryfall_id)}>Card details</button>
          </div>
        </div>
      )}
    </>
  );
}

const MOVE_BOARDS = ["main", "side", "maybe"];
/** commander_suggestions may be names or card objects. */
const commanderSuggestions = (deck) => asList(deck?.commander_suggestions, "cards", "suggestions")
  .map((x) => (typeof x === "string" ? { name: x } : x))
  .filter((x) => x && x.name)
  .filter((x, i, a) => a.findIndex((y) => y.name === x.name) === i);
// Same rule as the server (lib/decks.js isCommanderFormat): trimmed, case-insensitive.
const isCommanderFormat = (deck) => String(deck?.format || "").trim().toLowerCase() === "commander";
const hasCommander = (deck) => (deck?.counts?.commander ?? 0) > 0 || (deck?.cards || []).some((c) => c.board === "commander");

/** Per-card actions: commander, board moves, quantity, remove. */
/**
 * A small dropdown menu at a button (`anchor`, a DOM element): fixed position below it, flipped above near
 * the bottom; follows scrolling and closes once the button leaves the screen; Escape and a tap outside
 * close it. `deps` re-place it when its content changes size.
 */
function PopMenu({ anchor, onClose, label, className = "", deps = [], children }) {
  const ref = useRef(null);
  const [pos, setPos] = useState(null);
  const place = useCallback(() => {
    const el = ref.current;
    if (!el || !anchor || !anchor.isConnected) return false;
    const r = anchor.getBoundingClientRect(), vw = window.innerWidth, vh = window.innerHeight;
    if (r.bottom < 0 || r.top > vh) return false;
    const w = Math.min(280, vw - 16), h = el.offsetHeight;
    const left = Math.min(Math.max(8, r.right - w), vw - w - 8);
    let top = r.bottom + 4;
    if (top + h > vh - 8) top = r.top - h - 4 >= 8 ? r.top - h - 4 : Math.max(8, vh - h - 8);
    setPos({ left, top, width: w });
    return true;
  }, [anchor]);
  // eslint-disable-next-line react-hooks/exhaustive-deps
  useLayoutEffect(() => { place(); }, [place, ...deps]);
  useEffect(() => {
    ref.current?.querySelector("[role=menuitem]:not(:disabled), [role=menuitemradio]:not(:disabled)")?.focus({ preventScroll: true });
    const away = (e) => { if (ref.current && !ref.current.contains(e.target) && !anchor?.contains(e.target)) onClose(); };
    const key = (e) => { if (e.key === "Escape") { e.stopPropagation(); onClose(); anchor?.focus?.(); } };
    // Scrolling moves the menu with its button; it closes once the button is off screen.
    const moved = (e) => { if (ref.current?.contains(e.target)) return; if (!place()) onClose(); };
    document.addEventListener("pointerdown", away, true);
    document.addEventListener("keydown", key, true);
    window.addEventListener("scroll", moved, true);
    window.addEventListener("resize", moved);
    return () => {
      document.removeEventListener("pointerdown", away, true);
      document.removeEventListener("keydown", key, true);
      window.removeEventListener("scroll", moved, true);
      window.removeEventListener("resize", moved);
    };
  }, [anchor, onClose, place]);
  return (
    <div ref={ref} className={`card-menu ${className}`} role="menu" aria-label={label}
      style={pos ? { left: pos.left, top: pos.top, width: pos.width } : { visibility: "hidden", left: 0, top: 0 }}>
      {children}
    </div>
  );
}

/** A square icon button: the label is its accessible name and tooltip. `dot` marks it (e.g. a guide exists). */
function IconBtn({ icon: I, label, onClick, primary = false, danger = false, pressed, dot = false, disabled = false, href, download }) {
  const cls = `icon-btn${primary ? " primary" : ""}${danger ? " danger" : ""}`;
  if (href) return <a className={cls} href={href} download={download} aria-label={label} title={label}><I />{dot && <span className="dot" aria-hidden="true" />}</a>;
  return (
    <button type="button" className={cls} aria-label={label} title={label} onClick={onClick} disabled={disabled}
      aria-pressed={pressed === undefined ? undefined : Boolean(pressed)}>
      <I />{dot && <span className="dot" aria-hidden="true" />}
    </button>
  );
}

/** Deck page: cards per board and the deck's value (the old tiles), as a pop-up. */
function DeckValueSheet({ deck, onClose }) {
  return (
    <Sheet title="Cards and value" onClose={onClose}>
      <div className="stack">
        <div className="stats">
          {["commander", "main", "side", "maybe"].filter((b) => b === "main" || deck.counts?.[b]).map((b) => (
            <div className="stat" key={b}><div className="v">{deck.counts?.[b] ?? 0}</div><div className="k">{BOARD_LABEL[b]}</div></div>
          ))}
        </div>
        <DeckValue value={deck.value} />
      </div>
    </Sheet>
  );
}

/**
 * The ⋯ next to a deck card: a PopMenu with card details, set as commander (replace one of several),
 * move to another board, copies −/+ (the menu stays open) and remove.
 */
function CardActionsMenu({ deck, card, anchor, busy, error, onRun, onOpenCard, onClose }) {
  const qty = card.quantity ?? 1;
  const isCmd = card.board === "commander";
  const commanders = (deck.cards || []).filter((c) => c.board === "commander");
  const patch = (body, label) => onRun(`/api/decks/${deck.id}/cards`, "PATCH", { name: card.name, board: card.board, ...body }, label);
  const remove = () => {
    if (!window.confirm(`Remove ${card.name} from the ${(BOARD_LABEL[card.board] || card.board).toLowerCase()}?`)) return;
    patch({ quantity: 0 }, "remove");
  };
  const item = (label, onClick, { icon = null, danger = false, disabled = false } = {}) => (
    <button type="button" role="menuitem" className={`menu-item${danger ? " danger" : ""}`} disabled={busy || disabled} onClick={onClick}>{icon}{label}</button>
  );
  return (
    <PopMenu anchor={anchor} onClose={onClose} label={`Actions for ${card.name}`} deps={[card, error, commanders.length]}>
      <div className="menu-head small"><b>{card.name}</b><span className="muted">{qty}× · {BOARD_LABEL[card.board] || card.board}</span></div>
      {card.scryfall_id && item("Card details", () => { onClose(); onOpenCard(card.scryfall_id); }, { icon: <Icon.search /> })}
      {!isCmd && commanders.length <= 1 && item(commanders.length ? "Make commander" : "Set as commander",
        () => onRun(`/api/decks/${deck.id}/commander`, "POST", { name: card.name }, "commander"), { icon: <Icon.crown /> })}
      {!isCmd && commanders.length > 1 && commanders.map((c) => (
        <React.Fragment key={c.name}>{item(`Commander instead of ${c.name}`,
          () => onRun(`/api/decks/${deck.id}/commander`, "POST", { name: card.name, replace: c.name }, "commander"), { icon: <Icon.crown /> })}</React.Fragment>
      ))}
      {MOVE_BOARDS.filter((b) => b !== card.board).map((b) => (
        <React.Fragment key={b}>{item(`Move to ${BOARD_LABEL[b]}`, () => patch({ to_board: b }, "move"), { icon: <Icon.up /> })}</React.Fragment>
      ))}
      <div className="menu-qty">
        <span>Copies</span>
        <div className="stepper" role="group" aria-label="Copies">
          <button type="button" aria-label="One less" disabled={busy || qty <= 1} onClick={() => patch({ quantity: qty - 1 }, "qty")}><Icon.minus /></button>
          <output aria-live="polite">{qty}</output>
          <button type="button" aria-label="One more" disabled={busy} onClick={() => patch({ quantity: qty + 1 }, "qty")}><Icon.plus /></button>
        </div>
      </div>
      {item("Remove from deck", remove, { icon: <Icon.trash />, danger: true })}
      {error && <div className="menu-error small" role="alert">{typeof error === "string" ? error : error.message}</div>}
    </PopMenu>
  );
}

function DeckValue({ value }) {
  if (!value || typeof value !== "object") return null;
  const items = [
    ["total", "Deck value", value.total_eur],
    ["", "Owned", value.owned_eur],
    ["", "To buy", value.to_buy_eur],
    ["", "Maybeboard", value.maybe_eur],
  ].filter(([, , v]) => v != null);
  if (!items.length && !value.no_eur_price) return null;
  return (
    <div className="stack" style={{ gap: 6 }} aria-label="Deck value">
      <div className="value-grid">
        {items.map(([cls, k, v]) => <div key={k} className={`stat ${cls}`}><div className="v">{fmtEur(v)}</div><div className="k">{k}</div></div>)}
      </div>
      {value.no_eur_price > 0 && (
        <span className="small muted">{plural(value.no_eur_price, "card")} without € price (not counted)</span>
      )}
    </div>
  );
}

// ---------------------------------------------------------------------------
// Deck allocation: idea / built status, conflicts, shopping lists, deck boxes

const refName = (d) => (typeof d === "string" ? d : d?.name || "?");
function StatusBadge({ status }) {
  if (status !== "built" && status !== "idea") return null;
  return status === "built"
    ? <span className="badge ok" title="Built: this deck claims its cards">built</span>
    : <span className="badge" title="Idea: doesn't claim cards">idea</span>;
}

/** Line EUR of a shopping-list item: cost_eur (need × unit price_eur), or null when unpriced. */
function lineEurOf(qtyKey) {
  const qty = (it) => Math.max(1, Number(it[qtyKey]) || 1);
  return (it) => (it.cost_eur != null ? Number(it.cost_eur) : it.price_eur == null ? null : Number(it.price_eur) * qty(it));
}

function BuyList({ items, qtyKey, total, sub, label = "Total", onWish = null, isWished = null }) {
  const lineEur = lineEurOf(qtyKey);
  return (
    <div className="deck-section" style={{ padding: 0, gap: 0 }}>
      <div className="buy-list">
        {items.map((it, i) => {
          const eur = lineEur(it);
          const wished = isWished?.(it);
          return (
            <div key={`${it.name}-${i}`} className={`buy-row${onWish ? " has-act" : ""}`}>
              <span className="q">{it[qtyKey] ?? 1}×</span>
              <span className="nm"><b>{it.name}</b>{sub && sub(it)}</span>
              <span className="p">{eur == null ? <span className="muted">no €</span> : fmtEur(eur)}</span>
              {onWish && (
                <button type="button" className="btn ghost icon sm wish-btn" aria-pressed={Boolean(wished)} disabled={wished}
                  aria-label={wished ? `${it.name} is on your wishlist` : `Add ${it.name} to your wishlist`} onClick={() => onWish(it)}>
                  {wished ? <Icon.heartFull /> : <Icon.heart />}
                </button>
              )}
            </div>
          );
        })}
      </div>
      {total != null && <div className="buy-total"><span>{label}</span><span>{fmtEur(total)}</span></div>}
    </div>
  );
}

/** "⚠ 2 cards are also in another built deck" + which decks. */
function ConflictBanner({ deck, onOpenDeck }) {
  const list = asList(deck.conflicts);
  const n = deck.conflict_count ?? list.length;
  if (!n) return null;
  return (
    <div className="notice error" role="status">
      <span aria-hidden="true">⚠</span>
      <div className="grow">
        <b>{n === 1 ? "1 card is" : `${fmtInt(n)} cards are`} also in another built deck</b> and you don't own enough copies for all of them.
        {list.length > 0 && (
          <ul className="conflict-list">
            {list.map((c, i) => {
              const others = asList(c.decks).filter((d) => !(d && typeof d === "object" && (d.deck_id ?? d.id) === deck.id));
              return (
                <li key={`${c.name}-${i}`}>
                  <b>{c.name}</b>: own {c.owned ?? "?"}, built decks need {c.demand ?? "?"}
                  {others.length > 0 && <>{" · "}{others.map((d, j) => (
                    <React.Fragment key={j}>{j > 0 && ", "}
                      {typeof d === "object" && (d.deck_id ?? d.id) != null && onOpenDeck
                        ? <button type="button" className="linkbtn" onClick={() => onOpenDeck(d.deck_id ?? d.id)}>{d.name}</button>
                        : refName(d)}
                      {typeof d === "object" && d.quantity ? ` ${d.quantity}×` : ""}
                    </React.Fragment>))}</>}
                </li>
              );
            })}
          </ul>
        )}
      </div>
    </div>

}

/** "80 to buy (~€X) · 8 in other decks (€Y to buy instead)" or "you own every card". */
function DeckNeedNotice({ deck }) {
  const { toBuy, inUse, toBuyEur, inUseEur } = deckCounts(deck);
  const built = deck?.status === "built";
  // Copies only free in locked binders (deck boxes, binders the user locked).
  const locked = Math.max(0, Number(deck?.in_use_locked_count ?? deck?.in_use_box_count) || 0);
  const inDecks = Math.max(0, inUse - locked);
  if (!toBuy && !inUse) {
    return <div className="notice ok"><span aria-hidden="true">✓</span><div className="grow"><b>You own every card in this deck.</b></div></div>;
  }
  return (
    <div className={`notice ${toBuy || built ? "warn" : "ok"} need-notice`} role="status">
      <span aria-hidden="true">{toBuy ? "✗" : built ? "⚠" : "✓"}</span>
      <div className="grow stack" style={{ gap: 2 }}>
        <span>
          {toBuy > 0
            ? <b>{fmtInt(toBuy)} to buy{toBuyEur != null ? ` (~${fmtEur(toBuyEur)})` : ""}</b>
            : <b>You own every card</b>}
          {inDecks > 0 && <>
            {" · "}
            <span className="inuse-count"><span aria-hidden="true">{built ? "⚠" : "⇄"}</span> {fmtInt(inDecks)} in other {built ? "built " : ""}decks{inUseEur != null && inUseEur > 0 && !locked ? ` (${fmtEur(inUseEur)} to buy instead)` : ""}</span>
          </>}
          {locked > 0 && <>
            {" · "}
            <span className="locked-count"><span aria-hidden="true">🔒</span> {plural(locked, "card")} only in locked binders</span>
          </>}
        </span>
        <span className="small">
          {inDecks > 0 && (built ? "Shared copies: move them or buy extra to play both decks. " : "You own those; move them over when you build this deck. ")}
          {locked > 0 && "Locked binders keep their cards for their own deck; unlock the binder or move the cards to use them here. "}
          Maybeboard not counted.
        </span>
      </div>
    </div>
  );
}

/** In-use list: shopping.in_use from the server, else derived from the rows. */
function inUseItemsOf(deck) {
  const listed = asList(deck?.shopping?.in_use).filter((x) => x && x.name);
  if (listed.length || Array.isArray(deck?.shopping?.in_use)) return listed;
  const byName = new Map();
  for (const c of asList(deck?.cards)) {
    const n = cardInUse(c);
    if (!n || c.board === "maybe") continue;
    const prev = byName.get(c.name);
    const unit = c.eur ?? c.price_eur ?? null;
    if (prev) { prev.quantity += n; if (prev.price_eur != null) prev.cost_eur = prev.price_eur * prev.quantity; continue; }
    byName.set(c.name, {
      name: c.name, oracle_id: c.oracle_id, quantity: n,
      decks: builtElsewhereOf(c).map((u) => (typeof u === "string" ? { name: u } : { id: u.deck_id ?? u.id, name: u.name })),
      price_eur: unit == null ? null : Number(unit), cost_eur: unit == null ? null : Number(unit) * n,
    });
  }
  return [...byName.values()];
}

/** Deck names as links (tap opens that deck). */
function DeckLinks({ decks, boxes, onOpenDeck, shared = false }) {
  const list = asList(decks).filter(Boolean);
  const boxList = asList(boxes).filter((b) => b && b.binder);
  if (!list.length && !boxList.length) return null;
  return (
    <span className="sub">in {boxList.map((b, j) => (
      <React.Fragment key={`b${j}`}>{j > 0 && ", "}🔒 {b.binder}</React.Fragment>
    ))}{boxList.length > 0 && list.length > 0 && ", "}{list.map((d, j) => {
      const did = typeof d === "object" ? (d.id ?? d.deck_id) : null;
      return (
        <React.Fragment key={j}>{j > 0 && ", "}
          {did != null && onOpenDeck
            ? <button type="button" className="linkbtn" onClick={() => onOpenDeck(did)}>{refName(d)}</button>
            : refName(d)}
        </React.Fragment>
      );
    })}{shared ? " · conflict" : list.length ? " · can be moved" : " · locked"}</span>
  );
}

/**
 * Add shopping rows ({oracle_id?, name, qty}) to the wishlist: POST /api/wishlist by oracle id + name
 * (the server knows the deck printing's card row). Remembers which rows were added this time.
 */
function useWishAdd(onWishChanged) {
  const [added, setAdded] = useState(() => new Set());
  const [msg, setMsg] = useState(null);
  const keyOf = (it) => it.oracle_id || `name:${it.name}`;
  const add = async (list) => {
    let n = 0;
    const fails = [];
    const done = new Set(added);
    for (const it of list) {
      if (done.has(keyOf(it))) continue;
      try {
        await api("/api/wishlist", { method: "POST", json: { oracle_id: it.oracle_id || undefined, name: it.name, quantity: Math.max(1, Math.min(99, Number(it.qty) || 1)) } });
        done.add(keyOf(it));
        n++;
      } catch (e) { fails.push(`${it.name}: ${e.message}`); }
    }
    setAdded(done);
    setMsg(fails.length ? { error: `Could not add ${fails.join("; ")}` } : { text: n === 1 ? `Added ${list[0].name} to your wishlist.` : `Added ${plural(n, "card")} to your wishlist.` });
    if (n) onWishChanged?.();
  };
  const el = msg ? (msg.error ? <ErrorNotice error={msg.error} onDismiss={() => setMsg(null)} />
    : <div className="notice ok" role="status"><span aria-hidden="true">♥</span><div className="grow">{msg.text}</div>
      <button type="button" className="btn ghost icon sm" aria-label="Dismiss" onClick={() => setMsg(null)}><Icon.close /></button></div>) : null;
  return { add, isAdded: (it) => added.has(keyOf(it)), el };
}

/** What to buy for this deck (copies you don't own), plus the owned copies
 *  that sit in other built decks (move them, or buy extra). */
function DeckShopping({ deck, onOpenDeck, onWishChanged }) {
  const wish = useWishAdd(onWishChanged);
  const shopping = deck?.shopping;
  const items = asList(shopping?.items).filter((x) => x && x.name)
    .map((x) => ({ ...x, qty: x.to_buy ?? x.need ?? x.quantity ?? 1 }));
  const inUse = inUseItemsOf(deck).map((x) => ({ ...x, qty: x.quantity ?? x.in_use ?? x.need ?? 1 }));
  if (!items.length && !inUse.length) return null;
  const inUseCards = inUse.reduce((a, x) => a + (Number(x.qty) || 1), 0);
  const lineEur = lineEurOf("qty");
  const inUseTotal = shopping?.in_use_eur ?? deck?.in_use_eur ?? deck?.value?.in_use_eur
    ?? (inUse.some((x) => lineEur(x) != null) ? inUse.reduce((a, x) => a + (lineEur(x) || 0), 0) : null);
  const built = deck?.status === "built";
  const anyBoxed = inUse.some((x) => (x.in_box ?? 0) > 0);
  const boxedOnly = anyBoxed && inUse.every((x) => (x.in_box ?? 0) >= (x.quantity ?? 0));
  return (
    <section className="stack" style={{ gap: 8 }} aria-labelledby="deck-shop-title">
      <h3 id="deck-shop-title" className="row" style={{ gap: 8 }}>To buy <span className="muted small">{items.length ? plural(items.reduce((a, x) => a + (Number(x.qty) || 1), 0), "card") : "nothing"}</span></h3>
      {items.length > 0
        ? <>
          <BuyList items={items} qtyKey="qty" total={shopping?.total_eur} onWish={(it) => wish.add([it])} isWished={wish.isAdded} />
          <div className="list-actions">
            {items.length > 1 && !items.every(wish.isAdded) && (
              <button type="button" className="btn sm" onClick={() => wish.add(items)}><Icon.heart /> Add all to wishlist</button>
            )}
            <a className="btn sm" href={`/api/decks/${deck.id}/to-buy`} download={`${deck.name} - to buy.txt`}><Icon.download /> Export list</a>
          </div>
          {wish.el}
        </>
        : <span className="small muted">You own every card. {built ? "Some copies are also claimed by other built decks." : "Some copies are in other decks."}</span>}
      {inUse.length > 0 && (
        <details className="disclosure inuse-list">
          <summary>
            <span>{built && !boxedOnly ? "Shared with other built decks" : boxedOnly ? "In locked binders" : anyBoxed ? "In other decks or locked binders" : "In other decks"}: {plural(inUseCards, "card")}{inUseTotal != null ? ` (buy instead: ${fmtEur(inUseTotal)})` : ""}</span>
          </summary>
          <span className="small muted">{built && !boxedOnly
            ? "You own these, but other built decks claim the copies. Move them between decks or buy extra copies to play all at once."
            : anyBoxed
              ? "You own these; they are in your built decks or in locked binders (kept for their own deck). Move them over, unlock the binder, or buy extra copies."
              : "You own these; they are in your built decks now. Move them over when you build this deck, or buy extra copies."}</span>
          <BuyList items={inUse} qtyKey="qty" total={inUseTotal} label="Buy instead"
            sub={(it) => <DeckLinks decks={(it.quantity ?? 0) - (it.in_box ?? 0) > 0 ? it.decks : []} boxes={it.in_box ? it.boxes : []}
              onOpenDeck={onOpenDeck} shared={it.conflict || (built && (it.quantity ?? 0) - (it.in_box ?? 0) > 0)} />} />
        </details>
      )}
    </section>
  );
}

/** POST /api/decks/:id/to-binder: gather the deck's owned copies into one binder. */
function DeckBoxSheet({ deck, pickedOnly = false, onClose, onDone }) {
  const [name, setName] = useState(deck.box_binder || `Deck box: ${deck.name}`.slice(0, 100));
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);
  const [result, setResult] = useState(null);
  const [guarded, masterDialog] = useMasterConfirm();
  const submit = async (e) => {
    e.preventDefault();
    if (!name.trim() || busy) return;
    setBusy(true); setError(null);
    try {
      const res = await guarded((confirm) => api(`/api/decks/${deck.id}/to-binder`, { method: "POST", json: { binder: name.trim(), confirm_master: confirm, ...(pickedOnly ? { picked_only: true } : {}) } }));
      if (res) { setResult(res); onDone?.(res); }
    } catch (err) { setError(err.message); } finally { setBusy(false); }
  };
  const moved = asList(result?.moved, "items", "cards");
  const missing = asList(result?.missing, "items", "cards");
  const movedCopies = result?.moved_copies ?? moved.reduce((a, m) => a + (Number(m.quantity ?? m.moved) || 0), 0);
  return (
    <Sheet title={pickedOnly ? "Put picked cards into deck box" : "Put into deck box"} onClose={onClose}>
      {!result ? (
        <form className="stack" onSubmit={submit}>
          <p className="small" style={{ margin: 0 }}>
            {pickedOnly && <><b>Only the cards you ticked</b> move. </>}Moves the copies <b>{deck.name}</b> needs into one binder: first from {UNSORTED}, then from your other binders.
            Copies already in this binder{deck.source === "manabox" ? " or in the deck's own ManaBox binder" : ""} count as boxed;
            copies in another built deck's box stay where they are.
          </p>
          <div className="field">
            <label htmlFor="deckbox-name">Binder</label>
            <input id="deckbox-name" className="input" style={{ fontSize: 16 }} maxLength={100} required value={name} onChange={(e) => setName(e.target.value)} />
          </div>
          <ErrorNotice error={error} />
          <button type="submit" className="btn primary wrap" disabled={busy || !name.trim()}>{busy ? "Moving…" : <><Icon.box /> Move cards into “{name.trim() || "…"}”</>}</button>
        </form>
      ) : (
        <div className="stack">
          <div className="notice ok" role="status"><span aria-hidden="true">✓</span><div className="grow">
            Moved <b>{plural(movedCopies || 0, "copy", "copies")}</b> to {result.to_binder || result.binder || name.trim()}.
          </div></div>
          {moved.length > 0 && (
            <Collapsible label={`Moved: ${plural(moved.length, "card")}`}>
              <ul className="delta-list">
                {moved.map((m, i) => <li key={i}>{typeof m === "string" ? m : <><b>{m.quantity ?? m.moved ?? ""}{m.quantity ?? m.moved ? "× " : ""}</b>{m.name}{m.from_binder != null ? <span className="muted"> · from {m.from_binder || UNSORTED}</span>
                  : asList(m.from).length > 0 && <span className="muted"> · from {asList(m.from).map((f) => `${f.binder || UNSORTED}${asList(m.from).length > 1 ? ` ${f.quantity}×` : ""}`).join(", ")}</span>}</>}</li>)}
              </ul>
            </Collapsible>
          )}
          {asList(result?.removed).length > 0 && (
            <div className="notice warn" role="status"><span aria-hidden="true">↩</span><div className="grow">
              <b>Take out of the box: {plural(result.removed_copies ?? asList(result.removed).reduce((a, m) => a + m.quantity, 0), "copy", "copies")}</b>
              <span className="small"> (no longer in the deck, now in {UNSORTED})</span>
              <ul className="delta-list" style={{ marginTop: 4 }}>
                {asList(result.removed).map((m, i) => <li key={i}>{m.quantity}× {m.name}</li>)}
              </ul>
            </div></div>
          )}
          {missing.length > 0 ? (
            <div className="notice warn"><span aria-hidden="true">✗</span><div className="grow">
              <b>Still missing {plural(missing.length, "card")}:</b>
              <ul className="delta-list" style={{ marginTop: 4 }}>
                {missing.map((m, i) => <li key={i}>{typeof m === "string" ? m : <>{m.quantity ?? m.missing ?? m.need ?? 1}× {m.name}</>}</li>)}
              </ul>
            </div></div>
          ) : <span className="small muted">Every owned card the deck needs is in the deck box now.</span>}
          <button type="button" className="btn primary" onClick={onClose}>Done</button>
        </div>
      )}
      {masterDialog}
    </Sheet>
  );
}

const BUILD_GROUP_HINT = {
  other: "Owned, but another built deck or a locked binder holds them.",
  basics: "Not enough in the collection: take them from your basic lands.",
  buy: "You don't own these.",
  box: "Already where the deck lives.",
  tokens: "Tokens and markers to bring. Not counted in the progress.",
};

/**
 * Build checklist: the deck's cards grouped by the binder to pick them from, a tick per line
 * (stored on the server, so it works across devices), then "Put into deck box" / "Mark as built".
 */
function BuildSheet({ deck, onClose, onSetBuilt, onCollectionChanged, onOpenCard }) {
  const [list, setList] = useState(null);
  const [error, setError] = useState(null);
  const [busy, setBusy] = useState(null); // line id being saved
  const [hidePicked, setHidePicked] = useState(false);
  const [boxing, setBoxing] = useState(false);
  const [statusBusy, setStatusBusy] = useState(false);
  const load = useCallback(() => {
    setError(null);
    api(`/api/decks/${deck.id}/build`).then(setList).catch((e) => setError(e.message));
  }, [deck.id]);
  useEffect(load, [load]);

  const lineId = (l) => `${l.key}\u0000${l.source}`;
  const toggle = async (l) => {
    if (l.source === "box" || busy) return;
    const quantity = l.picked >= l.quantity ? 0 : l.quantity;
    const id = lineId(l);
    setBusy(id);
    setError(null);
    // Optimistic: tick at once, the server's list replaces it.
    setList((cur) => cur && patchPick(cur, id, quantity));
    try {
      setList(await api(`/api/decks/${deck.id}/build/picks`, { method: "PUT", json: { key: l.key, source: l.source, quantity } }));
    } catch (err) {
      setError(err.message);
      load();
    } finally {
      setBusy(null);
    }
  };
  const clearAll = async () => {
    if (!window.confirm("Untick every card on this list?")) return;
    try { setList(await api(`/api/decks/${deck.id}/build/picks`, { method: "DELETE" })); } catch (err) { setError(err.message); }
  };
  const markBuilt = async () => {
    setStatusBusy(true);
    try { await onSetBuilt(); load(); } finally { setStatusBusy(false); }
  };

  if (boxing && list) {
    return (
      <DeckBoxSheet deck={{ ...deck, box_binder: list.box_binder }} pickedOnly
        onClose={() => { setBoxing(false); load(); }} onDone={() => onCollectionChanged?.()} />
    );
  }
  const total = list?.total ?? 0;
  const picked = list?.picked ?? 0;
  const pct = total ? Math.round((picked / total) * 100) : 0;
  const progress = list && (
    <div className="build-progress" aria-live="polite">
      <div className="row between small"><b>{fmtInt(picked)} / {fmtInt(total)} picked</b>
        {list.complete ? <span className="badge ok">✓ all picked</span> : <span className="muted">{pct}%</span>}</div>
      <div className="bar" role="progressbar" aria-valuemin={0} aria-valuemax={total} aria-valuenow={picked} aria-label="Picked cards">
        <span style={{ width: `${pct}%` }} />
      </div>
    </div>
  );
  return (
    <Sheet title={`Build: ${deck.name}`} onClose={onClose} pinned={progress}>
      {!list && !error && <Spinner label="Loading the list…" />}
      <ErrorNotice error={error} onRetry={list ? null : load} onDismiss={list ? () => setError(null) : null} />
      {list && (
        <div className="stack">
          {total === 0 && <div className="empty"><h3>Nothing to pick</h3><span>This deck has no cards yet.</span></div>}
          {total > 0 && (
            <div className="row between">
              <label className="row small" style={{ minHeight: 44, cursor: "pointer" }}>
                <input type="checkbox" checked={hidePicked} onChange={(e) => setHidePicked(e.target.checked)} style={{ width: 20, height: 20, accentColor: "var(--accent)" }} />
                Hide picked
              </label>
              {picked > 0 && <button type="button" className="btn ghost sm" onClick={clearAll}>Untick all</button>}
            </div>
          )}
          {list.groups.map((g) => {
            const lines = hidePicked ? g.lines.filter((l) => l.picked < l.quantity) : g.lines;
            const done = g.picked >= g.quantity;
            return (
              <details key={g.key} className="build-group" open={g.kind !== "box" && !done}>
                <summary>
                  <span className="grow gname">{g.kind === "binder" ? <Icon.collection /> : g.kind === "buy" ? <Icon.cart /> : g.kind === "box" ? <Icon.box /> : null}
                    <span>{g.title}</span></span>
                  <span className={`badge ${done ? "ok" : ""}`}>{fmtInt(g.picked)}/{fmtInt(g.quantity)}</span>
                </summary>
                {BUILD_GROUP_HINT[g.kind] && <p className="small muted" style={{ margin: "0 0 4px" }}>{BUILD_GROUP_HINT[g.kind]}</p>}
                {lines.length === 0 && <p className="small muted" style={{ margin: 0 }}>All picked.</p>}
                <div className="build-lines">
                  {lines.map((l) => {
                    const on = l.picked >= l.quantity;
                    const id = lineId(l);
                    return (
                      <div key={id} className={`build-line${on ? " on" : ""}`}>
                      <button type="button" role="checkbox" aria-checked={on ? "true" : l.picked > 0 ? "mixed" : "false"}
                        className="pick" disabled={l.source === "box" || busy === id} onClick={() => toggle(l)}>
                        <span className="tick" aria-hidden="true">{on ? <Icon.check /> : null}</span>
                        <span className="q">{l.quantity}×</span>
                        <span className="nm"><b>{l.name}</b>
                          {l.local_name && l.local_name !== l.name && <span className="de">({l.local_name})</span>}
                          {l.mana_cost ? <ManaCost cost={l.mana_cost} /> : null}
                          {l.commander && <span className="badge accent">commander</span>}
                          {g.kind === "other" && <span className="small muted">{(l.locked ?? l.box) ? "🔒 " : ""}in {l.binder || UNSORTED}{(l.locked ?? l.box) && !asList(l.decks).length ? " · locked" : ""}{asList(l.decks).length ? ` · ${asList(l.decks).join(", ")}` : ""}</span>}
                          {l.token && l.pt && <span className="badge">{l.pt}</span>}
                          {l.token && <span className="small muted">{l.need ? `need · you own none${l.estimate_note ? ` · ${l.estimate_note}` : ""}` : `in ${l.binder || UNSORTED}`}</span>}
                          {l.marker && asList(l.from).length > 0 && <span className="small muted">{asList(l.from).join(", ")}</span>}
                        </span>
                        {g.kind === "buy" && <span className="p small muted">{l.price_eur == null ? "" : fmtEur(l.price_eur * l.quantity)}</span>}
                      </button>
                      {l.scryfall_id && onOpenCard && (
                        <button type="button" className="peek" aria-label={`Show ${l.name}`} title="Show card" onClick={() => onOpenCard(l.scryfall_id)}>
                          {l.image_small ? <img src={l.image_small} alt="" loading="lazy" decoding="async" /> : <Icon.search />}
                        </button>
                      )}
                      </div>
                    );
                  })}
                </div>
              </details>
            );
          })}
          {total > 0 && (
            <div className="stack build-end">
              {list.movable_picked > 0 && (
                <button type="button" className="btn primary" onClick={() => setBoxing(true)}><Icon.box /> Put picked cards into deck box</button>
              )}
              {deck.status !== "built" && (
                <button type="button" className={`btn${list.complete ? " primary" : ""}`} disabled={statusBusy} onClick={markBuilt}>
                  <Icon.check /> {statusBusy ? "Saving…" : "Mark deck as built"}
                </button>
              )}
              {deck.status === "built" && <span className="small muted">This deck is built. Ticks only help you collect; they don't move cards.</span>}
            </div>
          )}
        </div>
      )}
    </Sheet>
  );
}

/** Checklist with one line's ticks set (optimistic update before the server answers). */
function patchPick(list, id, quantity) {
  let delta = 0, movable = 0;
  const groups = list.groups.map((g) => {
    let gd = 0;
    const lines = g.lines.map((l) => {
      if (`${l.key}\u0000${l.source}` !== id) return l;
      const n = Math.min(quantity, l.quantity);
      gd += n - l.picked;
      return { ...l, picked: n };
    });
    if (g.kind !== "tokens") delta += gd;
    if (g.kind === "binder") movable += gd;
    return gd ? { ...g, lines, picked: g.picked + gd } : g;
  });
  const picked = list.picked + delta;
  return { ...list, groups, picked, movable_picked: list.movable_picked + movable, complete: list.total > 0 && picked >= list.total };
}

const ACTOR_LABEL = { app: "You", claude: "✦ Claude", import: "ManaBox import", scan: "Scanner", system: "Before history" };

/** Added / removed / changed cards per board (and renamed, format, bracket). */
function DeckDiff({ diff, empty = "No card changes." }) {
  if (!diff) return null;
  const boards = asList(diff.boards);
  const meta = asList(diff.meta);
  const metaLabel = { name: "Name", format: "Format", description: "Description", status: "Status", bracket_declared: "Bracket" };
  const val = (f, v) => (v == null || v === "" ? "—" : f === "bracket_declared" ? `B${v}` : f === "description" ? "…" : String(v));
  return (
    <div className="stack" style={{ gap: 8 }}>
      {meta.map((m) => <div key={m.field} className="small">{metaLabel[m.field] ?? m.field}: <s className="muted">{val(m.field, m.from)}</s> → <b>{val(m.field, m.to)}</b></div>)}
      {boards.length === 0 && meta.length === 0 && <span className="small muted">{empty}</span>}
      {boards.map((b) => (
        <div key={b.board} className="diff-board">
          <h4>{BOARD_LABEL[b.board] ?? b.board}</h4>
          <ul className="diff-list">
            {asList(b.added).map((c) => <li key={`a${c.name}`} className="add"><span className="sym" aria-label="added">+</span>{c.quantity}× {c.name}</li>)}
            {asList(b.removed).map((c) => <li key={`r${c.name}`} className="rem"><span className="sym" aria-label="removed">−</span>{c.quantity}× {c.name}</li>)}
            {asList(b.changed).map((c) => <li key={`c${c.name}`} className="chg"><span className="sym" aria-label="changed">~</span>{c.name}: {c.from === c.to ? `${c.to}×` : `${c.from} → ${c.to}`}{c.printing ? " (other printing)" : ""}</li>)}
          </ul>
        </div>
      ))}
    </div>
  );
}

/** Deck history: versions newest first; tap one for its changes and "Restore this version". */
function HistorySheet({ deck, onClose, onRestored }) {
  const [data, setData] = useState(null);
  const [error, setError] = useState(null);
  const [open, setOpen] = useState(null); // version detail
  const [busy, setBusy] = useState(false);
  const load = useCallback(() => {
    setError(null);
    api(`/api/decks/${deck.id}/history`).then(setData).catch((e) => setError(e.message));
  }, [deck.id]);
  useEffect(load, [load]);
  const show = async (v) => {
    setError(null);
    setBusy(true);
    try { setOpen({ ...(await api(`/api/decks/${deck.id}/history/${v.id}`)), current: v.current }); } catch (err) { setError(err.message); } finally { setBusy(false); }
  };
  const restore = async () => {
    const v = open.version;
    const what = open.restore?.summary && open.restore.summary !== "No changes" ? `\n\nChanges: ${open.restore.summary}.` : "";
    if (!window.confirm(`Restore the version from ${fmtDate(v.at)}?${what}\n\nIt is saved as a new version, so nothing is lost. The status (idea/built) stays.`)) return;
    setBusy(true);
    setError(null);
    try {
      const res = await api(`/api/decks/${deck.id}/history/${v.id}/restore`, { method: "POST", json: { confirm: true } });
      onRestored?.(res);
      setOpen(null);
      load();
    } catch (err) { setError(err.message); } finally { setBusy(false); }
  };
  const versions = asList(data?.versions);
  return (
    <Sheet title={open ? "Version" : `History: ${deck.name}`} onClose={onClose}
      actions={open ? <button type="button" className="btn ghost sm" onClick={() => setOpen(null)}><Icon.back /> List</button> : null}>
      <ErrorNotice error={error} onDismiss={() => setError(null)} />
      {!open && !data && !error && <Spinner label="Loading history…" />}
      {!open && data && (
        <div className="stack" style={{ gap: 8 }}>
          <p className="small muted" style={{ margin: 0 }}>Every change is saved. Tap a version to see what changed. The newest {fmtInt(data.keep)} are kept.</p>
          {versions.length === 0 && <div className="empty"><h3>No history yet</h3></div>}
          {versions.map((v) => (
            <button key={v.id} type="button" className="version-row" disabled={busy} onClick={() => show(v)}>
              <span className="grow vbody">
                <span className="row small" style={{ gap: 6 }}>
                  <b>{fmtDate(v.at)}</b>
                  <span className={`badge ${v.actor === "claude" ? "accent" : ""}`}>{ACTOR_LABEL[v.actor] ?? v.actor}</span>
                  {v.current && <span className="badge ok">current</span>}
                </span>
                <span className="small">{v.summary}</span>
              </span>
              <span className="small muted">{plural(v.card_count, "card")}</span>
            </button>
          ))}
        </div>
      )}
      {open && (
        <div className="stack">
          <div className="row small" style={{ gap: 6 }}>
            <b>{fmtDate(open.version.at)}</b>
            <span className="badge">{ACTOR_LABEL[open.version.actor] ?? open.version.actor}</span>
            <span className="muted">{plural(open.version.card_count, "card")}</span>
          </div>
          <div className="small">{open.version.summary}</div>
          <h3 className="diff-h">What changed here</h3>
          {open.diff ? <DeckDiff diff={open.diff} /> : <span className="small muted">The oldest saved version: nothing earlier to compare with.</span>}
          {!open.current && (
            <>
              <h3 className="diff-h">If you restore it</h3>
              <DeckDiff diff={open.restore} empty="Same cards as now." />
              <button type="button" className="btn primary" disabled={busy} onClick={restore}><Icon.undo /> {busy ? "Restoring…" : "Restore this version"}</button>
            </>
          )}
          {open.current && <span className="badge ok" style={{ justifySelf: "start" }}>This is the deck as it is now</span>}
        </div>
      )}
    </Sheet>
  );
}

/** Market → To buy: everything short across all BUILT decks, plus what each deck still misses. */
function ShoppingListView({ dataVersion, onOpenDeck, onOpenWishlist, onWishChanged }) {
  const [data, setData] = useState(null);
  const [error, setError] = useState(null);
  const load = useCallback(() => {
    setError(null);
    api("/api/shopping-list").then(setData).catch((e) => setError(`Could not load the shopping list: ${e.message}`));
  }, []);
  useEffect(load, [load, dataVersion]);
  const items = asList(data?.built?.items).filter((x) => x && x.name);
  const perDeck = asList(data?.per_deck).filter((d) => d && d.id != null);
  const wishItems = asList(data?.wishlist?.items).filter((x) => x && x.name);
  const wish = useWishAdd(() => { onWishChanged?.(); load(); });
  return (
    <div className="stack-lg">
      <ErrorNotice error={error} onRetry={load} />
      {!data && !error && <Spinner label="Loading the to-buy list…" />}
      {data && (
        <>
          <section className="stack" aria-labelledby="shop-built-title">
            <h2 id="shop-built-title">For your built decks</h2>
            {items.length === 0
              ? <div className="notice ok"><span aria-hidden="true">✓</span><div className="grow">You own enough copies for every built deck.</div></div>
              : (
                <>
                  <span className="small muted">Cards your built decks need together, minus what you own.</span>
                  <BuyList items={items} qtyKey="short" total={data.built?.total_eur}
                    onWish={(it) => wish.add([{ ...it, qty: it.short }])} isWished={wish.isAdded}
                    sub={(it) => asList(it.decks).length > 0 && <span className="sub">{asList(it.decks).map(refName).join(", ")}</span>} />
                  <div className="list-actions">
                    <a className="btn sm" href="/api/shopping-list/export" download="To buy.txt"><Icon.download /> Export list</a>
                  </div>
                  {wish.el}
                </>
              )}
          </section>
          {wishItems.length > 0 && onOpenWishlist && (
            <div className="row between" style={{ gap: 8 }}>
              <span className="small muted">Plus {plural(wishItems.length, "card")} on your wishlist{data.wishlist?.total_eur ? ` (${fmtEur(data.wishlist.total_eur)})` : ""}.</span>
              <button type="button" className="btn sm" onClick={onOpenWishlist}><Icon.heart /> Wishlist</button>
            </div>
          )}
          {perDeck.length > 0 && (
            <section className="stack" aria-labelledby="shop-deck-title">
              <h2 id="shop-deck-title">Per deck</h2>
              <span className="small muted">Cards to buy per deck (copies you don't own). Owned cards sitting in other built decks are counted separately: you can move them.</span>
              <div className="list">
                {perDeck.map((d) => {
                  const { toBuy, inUse, toBuyEur } = deckCounts(d);
                  const sub = [toBuy ? `${fmtInt(toBuy)} to buy` : null, inUse ? `${fmtInt(inUse)} in other decks` : null].filter(Boolean).join(" · ");
                  return (
                    <button key={d.id} type="button" className="list-row" style={{ gridTemplateColumns: "minmax(0, 1fr) auto" }} onClick={() => onOpenDeck(d.id)}>
                      <span className="main">
                        <span className="nm"><b>{d.name}</b> <StatusBadge status={d.status} /></span>
                        <span className="sub">{sub || "complete"}</span>
                      </span>
                      <span className="end">{toBuy ? fmtEur(toBuyEur) : inUse ? <span className="badge warn" title="Owned, in other decks">⇄ {fmtInt(inUse)}</span> : <span className="badge ok">✓</span>}</span>
                    </button>
                  );
                })}
              </div>
            </section>
          )}
        </>
      )}
    </div>
  );
}

// ===========================================================================
// Deck power (v0.7.0): bracket + score badges, PowerSheet, stats charts.
// The server computes everything (lib/power.js, lib/deckstats.js); this only
// shows it. High brackets are not "bad": B4/B5 use the accent colour, warn/bad
// colours are kept for real problems (declared below the rules, not legal,
// combos not checked).
// ===========================================================================

const SOURCE_LABEL = { scryfall: "Scryfall", spellbook: "Spellbook", list: "list", regex: "text", name: "name", rules: "rules" };
const SPELLBOOK_SITE = "https://commanderspellbook.com";
const comboHref = (id) => `${SPELLBOOK_SITE}/combo/${encodeURIComponent(id)}/`;
const halfStep = (n) => Math.round(Number(n) * 2) / 2;
/** Score in UI half steps: 6.5, 7. */
const fmtScore = (n) => { const h = halfStep(n); return Number.isInteger(h) ? String(h) : h.toFixed(1); };
const fmtPct = (x) => (x == null ? "—" : `${Math.round(x * 100)}%`);
const fmtNum1 = (n) => (n == null ? "—" : String(Math.round(n * 10) / 10));
const fmtNum2 = (n) => (n == null ? "—" : String(Math.round(n * 100) / 100));
const BRACKET_LABEL = { 1: "Exhibition", 2: "Core", 3: "Upgraded", 4: "Optimized", 5: "cEDH" };

/** {bracket, score, legality, combos} of a deck detail; all null for a non-commander deck. */
function deckPowerOf(deck) {
  const p = deck?.power || {};
  const bracket = p.bracket ?? null;
  return { bracket, score: p.score ?? null, legality: p.legality ?? bracket?.legality ?? null, combos: deck?.combos ?? null };
}
const declaredBelow = (b) => Boolean(b?.reasons?.some((r) => r.rule === "declared_below"));
const comboItems = (c) => asList(c?.items).length ? c.items : asList(c?.result?.combos);
const comboUnresolved = (c) => asList(c?.unresolved).length ? c.unresolved : asList(c?.result?.unresolved);

/** Header badges: "B3 Upgraded", "6.5/10" and a "Not legal" badge; tapping any opens the PowerSheet. */
function PowerBadges({ deck, onOpen }) {
  const { bracket: b, score: s, legality } = deckPowerOf(deck);
  if (!b && !s) return null;
  // Plan §8: warn for a declared bracket below the rules and for an auto bracket that is
  // only a lower bound (combos / Game Changer flags / cards not checked yet).
  const tone = declaredBelow(b) ? "warn" : b && b.partial && b.declared == null ? "warn" : b && b.value >= 4 ? "accent" : "";
  return (
    <div className="row power-badges">
      {b && (
        <button type="button" className={`power-chip ${tone}`} onClick={onOpen}
          aria-label={`Bracket ${b.display} ${b.label}${b.declared != null ? ", set by you" : ""}${b.partial && b.declared == null ? ", combos not checked yet" : ""}. Show details`}>
          B{b.display} <span className="lbl">{b.label}</span>{b.declared != null && <span aria-hidden="true"> ✎</span>}
        </button>
      )}
      {s && (
        <button type="button" className="power-chip" onClick={onOpen} aria-label={`Power score ${s.partial ? "at least " : ""}${fmtScore(s.value)} of 10. Show details`}>
          {s.partial ? "≥ " : ""}{fmtScore(s.value)}/10
        </button>
      )}
      {legality && legality.ok === false && (
        <button type="button" className="power-chip bad" onClick={onOpen} aria-label="Not Commander-legal. Show details">✗ Not legal</button>
      )}
    </div>
  );
}

/** "B3 · 6.5" for the deck list (commander decks only). Accepts numbers or objects. */
function PowerListBadge({ d }) {
  const bObj = d.bracket && typeof d.bracket === "object" ? d.bracket : null;
  const b = bObj ? bObj.value : d.bracket;
  const sObj = d.score && typeof d.score === "object" ? d.score : null;
  const s = sObj ? sObj.value : d.score;
  if (b == null && s == null) return null;
  const declared = bObj ? bObj.declared != null : d.bracket_declared != null;
  const bp = !declared && Boolean(bObj ? bObj.partial : d.bracket_partial);
  const sp = Boolean(sObj ? sObj.partial : d.score_partial);
  const title = `${b != null ? `Bracket ${bp ? "≥" : ""}${b} ${BRACKET_LABEL[b] || ""}${declared ? " (set by you)" : ""}` : ""}${s != null ? ` · power score ${sp ? "≥ " : ""}${fmtScore(s)}/10` : ""}${bp || sp ? " · combos not checked yet" : ""}`;
  return (
    <span className={`badge ${b >= 4 ? "accent" : ""}`} title={title.replace(/^ · /, "")}>
      {b != null && <>B{bp ? "≥" : ""}{b}{declared ? "✎" : ""}</>}{b != null && s != null && " · "}{s != null && <>{sp ? "≥" : ""}{fmtScore(s)}</>}
    </span>
  );
}

const REASON_SHORT = {
  game_changers: (r) => plural(asList(r.cards).length || 1, "Game Changer"),
  mld: () => "mass land denial",
  extra_turns: (r) => plural(asList(r.cards).length || 3, "extra-turn card"),
  combo: (r) => (r.floor >= 4 ? "a fast two-card combo" : "a two-card combo"),
  extra_turn_combo: (r) => (r.floor >= 4 ? "a fast extra-turn combo" : "an extra-turn combo"),
};
const CAT_WORDS = {
  speed: ["a low curve", "a high curve"],
  fast_mana: ["lots of fast mana", "little fast mana"],
  tutors: ["many tutors", "few tutors"],
  combos: ["strong combos", "no fast combos"],
  interaction: ["good interaction", "little interaction"],
  draw: ["good card draw", "little card draw"],
  ramp: ["good ramp", "little ramp"],
  mana_base: ["a strong mana base", "a weak mana base"],
};

/** "Bracket 3 because of 2 Game Changers. Score 6.5: good ramp, few tutors." */
function powerSentence(b, s) {
  const out = [];
  if (b) {
    const floors = asList(b.reasons).filter((r) => r.floor > 2);
    const auto = `${b.partial ? "≥" : ""}${b.auto}`;
    let lead;
    if (b.declared != null) lead = `Bracket ${b.declared}, set by you${b.declared !== b.auto ? ` (the rules say ${auto})` : ""}`;
    else if (!floors.length) lead = `Bracket ${auto}: nothing pushes it higher`;
    else {
      const f = floors[0];
      const why = REASON_SHORT[f.rule]?.(f) ?? "the rules";
      lead = `Bracket ${auto} because of ${why}${floors.length > 1 ? ` and ${plural(floors.length - 1, "more reason")}` : ""}`;
    }
    out.push(`${lead}.`);
  }
  if (s) {
    const cats = asList(s.breakdown).filter((c) => c.max > 0 && !(s.partial && c.key === "combos"));
    const ratio = (c) => c.points / c.max;
    const strong = [...cats].sort((x, y) => ratio(y) - ratio(x)).filter((c) => ratio(c) >= 0.6)[0];
    const weak = [...cats].sort((x, y) => ratio(x) - ratio(y)).filter((c) => ratio(c) <= 0.3 && c !== strong)[0];
    const parts = [strong && CAT_WORDS[strong.key]?.[0], weak && CAT_WORDS[weak.key]?.[1]].filter(Boolean);
    out.push(`Score ${s.partial ? "≥ " : ""}${fmtScore(s.value)}${parts.length ? `: ${parts.join(", ")}` : ""}.`);
  }
  return out.join(" ");
}

function ReasonItem({ r }) {
  const level = r.level === "bad" ? "bad" : r.level === "warn" ? "warn" : "";
  return (
    <li className="pw-reason">
      <span className={`badge fl ${level}`}>{level === "bad" ? "✗" : level === "warn" ? "⚠" : r.floor != null ? `≥${r.floor}` : "i"}</span>
      <span className="tx">
        {r.text}{r.borderline && !/borderline/i.test(r.text || "") ? " (borderline)" : ""}
        {r.url && <> · <a href={r.url} target="_blank" rel="noopener noreferrer">combo</a></>}
      </span>
      {asList(r.cards).length > 0 && !r.url && (
        <span className="cards">
          {r.cards.map((c, i) => (
            <span key={`${c.name}|${i}`} className="pw-card" title={c.why ? `why: ${c.why}` : undefined}>
              {c.name}{c.source && <span className="src">{SOURCE_LABEL[c.source] || c.source}</span>}
            </span>
          ))}
        </span>
      )}
    </li>
  );
}

/** A 0-10 bar as inline SVG (scales with its column). */
function TenBar({ value, color = "var(--accent)" }) {
  const v = Math.max(0, Math.min(10, Number(value) || 0));
  return (
    <svg viewBox="0 0 100 10" preserveAspectRatio="none" aria-hidden="true" focusable="false">
      <rect x="0" y="0" width="100" height="10" rx="3" fill="var(--surface-3)" />
      {v > 0 && <rect x="0" y="0" width={v * 10} height="10" rx="3" fill={color} />}
    </svg>
  );
}

function ScoreBreakdown({ score }) {
  const [open, setOpen] = useState(null);
  return (
    <div className="pw-cats">
      {asList(score.breakdown).map((c) => {
        const expanded = open === c.key;
        const cards = asList(c.cards);
        return (
          <React.Fragment key={c.key}>
            <button type="button" className="pw-cat" aria-expanded={cards.length ? expanded : undefined}
              onClick={() => cards.length && setOpen(expanded ? null : c.key)} style={cards.length ? null : { cursor: "default" }}>
              <span className="nm">{c.label}{cards.length > 0 && <span className="muted" aria-hidden="true"> {expanded ? "▾" : "▸"}</span>}</span>
              <TenBar value={c.bar} />
              <span className="pt">{fmtNum2(c.points)}/{fmtNum2(c.max)}</span>
              <span className="wd">{c.words}{c.note ? ` · ${c.note}` : ""}</span>
            </button>
            {expanded && <ul className="pw-cat-cards">{cards.map((n) => <li key={n}>{n}</li>)}</ul>}
          </React.Fragment>
        );
      })}
    </div>
  );
}

function comboStatus(c) {
  if (!c) return { text: "Combos not checked", tone: "warn" };
  switch (c.status) {
    case "ok": return { text: `Combos checked ${fmtAgo(c.fetched_at)}`, tone: "" };
    case "stale": return { text: `Combos from ${fmtDate(c.fetched_at)} (an update is due)`, tone: "" };
    case "pending": return { text: "Checking combos…", tone: "", busy: true };
    case "offline": return { text: `Offline: combos not checked${c.fetched_at ? ` (last try ${fmtAgo(c.fetched_at)})` : ""}`, tone: "warn" };
    case "disabled": return { text: "Combos: off (Settings → Online services)", tone: "" };
    default: return { text: "Combos not checked", tone: "warn" };
  }
}

/** Details of the bracket and score: one sentence, ≤3 reasons, picker, breakdown, combos. */
function PowerSheet({ deck, onClose, onChanged }) {
  const { bracket: b, score: s, legality, combos } = deckPowerOf(deck);
  const [showAll, setShowAll] = useState(false);
  const [allCombos, setAllCombos] = useState(false);
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);
  const [msg, setMsg] = useState(null);
  const timer = useRef(null);
  useEffect(() => () => clearTimeout(timer.current), []);

  const reasons = asList(b?.reasons);
  const shown = showAll ? reasons : reasons.slice(0, 3);
  const info = asList(b?.info);
  const hidden = reasons.length - shown.length + (showAll ? 0 : info.length);
  const items = comboItems(combos);
  const unresolved = comboUnresolved(combos);
  const st = comboStatus(combos);
  const disabled = combos?.status === "disabled";

  const declare = async (v) => {
    if (!b || busy || (b.declared ?? null) === v) return;
    setBusy(true); setError(null);
    try {
      await api(`/api/decks/${deck.id}`, { method: "PATCH", json: { bracket_declared: v } });
      onChanged();
    } catch (e) { setError(e.message); } finally { setBusy(false); }
  };
  const refresh = async () => {
    setBusy(true); setError(null); setMsg(null);
    try {
      await api(`/api/decks/${deck.id}/combos`, { method: "POST" });
      setMsg("Checking combos…");
      clearTimeout(timer.current);
      timer.current = setTimeout(() => { setMsg(null); onChanged(); }, 4000);
    } catch (e) {
      if (e.status === 409) setMsg(`The combo check is paused (Commander Spellbook was unreachable or asked us to wait). Try again ${e.data?.retry_at ? fmtAgo(e.data.retry_at) : "in a few minutes"}.`);
      else if (e.status === 503) setMsg("The combo check is off. Turn it on in Settings → Online services.");
      else setError(e.message);
    } finally { setBusy(false); }
  };

  const sentence = powerSentence(b, s);
  return (
    <Sheet title="Power level" onClose={onClose}>
      <div className="pw">
        <div className="stack" style={{ gap: 6 }}>
          <p className="pw-lead">{sentence}</p>
          {b && <p className="pw-sub small muted">Bracket {b.value} {b.label}: {b.meaning}.</p>}
          {b?.cedh_hint && <p className="pw-sub small">Looks cEDH-like. Set 5 below if that is the intent.</p>}
        </div>

        {b && (
          <section className="stack" style={{ gap: 8 }} aria-labelledby="pw-why">
            <h3 id="pw-why">Why</h3>
            <ul className="pw-reasons">{shown.map((r, i) => <ReasonItem key={`${r.rule}|${i}`} r={r} />)}</ul>
            {showAll && info.length > 0 && <ul className="pw-info">{info.map((t) => <li key={t}>{t}</li>)}</ul>}
            {showAll && legality?.notes?.length > 0 && <ul className="pw-info">{legality.notes.map((t) => <li key={t}>{t}</li>)}</ul>}
            {(hidden > 0 || showAll) && (
              <div><button type="button" className="btn ghost sm" onClick={() => setShowAll(!showAll)} aria-expanded={showAll}>
                {showAll ? "Show less" : `Show all (${hidden} more)`}
              </button></div>
            )}
          </section>
        )}

        {b && (
          <section className="stack" style={{ gap: 8 }} aria-labelledby="pw-pick">
            <h3 id="pw-pick">Your bracket</h3>
            <div className="bracket-pick" role="group" aria-labelledby="pw-pick">
              <button type="button" aria-pressed={b.declared == null} disabled={busy} onClick={() => declare(null)}>Auto {b.partial ? "≥" : ""}{b.auto}</button>
              {[1, 2, 3, 4, 5].map((n) => (
                <button key={n} type="button" aria-pressed={b.declared === n} disabled={busy} onClick={() => declare(n)} title={`${n} ${BRACKET_LABEL[n]}`}>{n}</button>
              ))}
            </div>
            <p className="small muted" style={{ margin: 0 }}>Brackets 1 (Exhibition) and 5 (cEDH) are about intent, so only you set them. The app never picks them.</p>
          </section>
        )}

        {s && (
          <section className="stack" style={{ gap: 6 }} aria-labelledby="pw-score">
            <h3 id="pw-score">Score {s.partial ? "≥ " : ""}{fmtScore(s.value)}/10</h3>
            {s.note && <p className="small muted" style={{ margin: 0 }}>{s.note}.</p>}
            {s.unknown > 0 && <p className="small muted" style={{ margin: 0 }}>{plural(s.unknown, "card")} not known yet: they add nothing.</p>}
            <ScoreBreakdown score={s} />
            <p className="small muted" style={{ margin: 0 }}>Score bands follow the <a href="https://playgroup.gg/commander/bracket-calculator" target="_blank" rel="noopener noreferrer">playgroup.gg</a> calculator. Tap a row for its cards.</p>
          </section>
        )}

        <section className="stack" style={{ gap: 8 }} aria-labelledby="pw-combos">
          <h3 id="pw-combos">Combos</h3>
          {disabled ? <p className="small muted" style={{ margin: 0 }}>Combos: off. Turn on the combo check in Settings → Online services.</p> : (
            <>
              {items.length > 0 ? (
                <ul className="pw-combos">
                  {(allCombos ? items : items.slice(0, 5)).map((c) => (
                    <li key={c.id}>
                      <a href={comboHref(c.id)} target="_blank" rel="noopener noreferrer">{asList(c.cards).join(" + ")}</a>
                      <span className="small muted">
                        {c.assembly_mv != null && ` · ${c.assembly_mv} mana`}
                        {asList(c.produces).length > 0 && ` · ${c.produces.slice(0, 2).join(", ")}`}
                      </span>
                    </li>
                  ))}
                </ul>
              ) : combos?.status === "ok" || combos?.status === "stale" ? <p className="small muted" style={{ margin: 0 }}>No combos found.</p> : null}
              {items.length > 5 && <div><button type="button" className="btn ghost sm" onClick={() => setAllCombos(!allCombos)}>{allCombos ? "Show fewer" : `Show all ${items.length} combos`}</button></div>}
              {unresolved.length > 0 && <p className="small muted" style={{ margin: 0 }} title={unresolved.join(", ")}>{plural(unresolved.length, "card")} not checked (Commander Spellbook doesn't know {unresolved.length === 1 ? "it" : "them"}).</p>}
              <p className="small muted" style={{ margin: 0 }}>Combos by <a href={SPELLBOOK_SITE} target="_blank" rel="noopener noreferrer">Commander Spellbook</a>.</p>
            </>
          )}
          <div className={`pw-status ${st.tone === "warn" ? "notice warn" : ""}`} role="status">
            {st.busy && <span className="spinner" aria-hidden="true" />}
            <span className="grow">{msg || st.text}</span>
            {!disabled && (
              <button type="button" className="btn sm" onClick={refresh} disabled={busy || combos?.status === "pending"}><Icon.refresh /> Refresh</button>
            )}
          </div>
          <ErrorNotice error={error} onDismiss={() => setError(null)} />
        </section>
      </div>
    </Sheet>
  );
}

/** X spells per curve bucket from the deck cards (main board, nonland, not the commander). */
function xSpellsPerBucket(cards) {
  const out = Array(8).fill(0);
  for (const c of asList(cards)) {
    if (c.board !== "main" || c.companion || c.cmc == null) continue;
    const front = String(c.type_line || "").split(" // ")[0];
    if (/\bLand\b/.test(front)) continue;
    if (!/\{X\}/i.test(String(c.mana_cost || "").split(" // ")[0])) continue;
    out[Math.min(7, Math.max(0, Math.floor(Number(c.cmc))))] += Number(c.quantity) || 1;
  }
  return out;
}

/** Mana curve: 8 stacked columns (creatures / other spells), counts above, MV below. */
function CurveChart({ curve, cards }) {
  const cr = asList(curve?.creature), ot = asList(curve?.other);
  const buckets = asList(curve?.buckets).length === 8 ? curve.buckets : ["0", "1", "2", "3", "4", "5", "6", "7+"];
  const totals = buckets.map((_, i) => (cr[i] || 0) + (ot[i] || 0));
  const max = Math.max(0, ...totals);
  if (!max) return <p className="small muted" style={{ margin: 0 }}>No spells to chart yet.</p>;
  const xs = xSpellsPerBucket(cards);
  const W = 320, top = 22, base = 124, colW = W / 8, barW = 24;
  const scale = (base - top) / max;
  const summary = buckets.map((b, i) => `${b}: ${totals[i]}`).join(", ");
  return (
    <figure style={{ margin: 0 }} className="stack">
      <svg className="curve-chart" viewBox="0 0 320 150" role="img" aria-label={`Mana curve. Mana value: count. ${summary}`}>
        <line x1="0" x2={W} y1={base + 0.5} y2={base + 0.5} stroke="var(--border)" strokeWidth="1" />
        {buckets.map((b, i) => {
          const x = i * colW + (colW - barW) / 2;
          const hc = (cr[i] || 0) * scale, ho = (ot[i] || 0) * scale;
          const gap = hc > 0 && ho > 0 ? 2 : 0;
          const tip = `Mana value ${b}: ${cr[i] || 0} creatures, ${ot[i] || 0} other${xs[i] ? `, ${xs[i]} with X` : ""}`;
          return (
            <g key={b}>
              <title>{tip}</title>
              <rect x={i * colW} y={top - 20} width={colW} height={150 - top + 20} fill="transparent" />
              {hc > 0 && <rect x={x} y={base - hc} width={barW} height={hc} rx="3" fill="var(--chart-creature)" />}
              {ho > 0 && <rect x={x} y={base - hc - ho} width={barW} height={Math.max(1, ho - gap)} rx="3" fill="var(--chart-other)" />}
              {totals[i] > 0 && (
                <text x={x + barW / 2} y={base - hc - ho - 6} textAnchor="middle" fontSize="13" fontWeight="700" fill="var(--text)">
                  {totals[i]}{xs[i] > 0 && <tspan fill="var(--muted)" fontWeight="600"> X</tspan>}
                </text>
              )}
              <text x={x + barW / 2} y="143" textAnchor="middle" fontSize="13" fill="var(--muted)">{b}</text>
            </g>
          );
        })}
      </svg>
      <figcaption className="chart-legend">
        <span><span className="sw" style={{ background: "var(--chart-creature)" }} />Creatures</span>
        <span><span className="sw" style={{ background: "var(--chart-other)" }} />Other spells</span>
        <span>Mana value below, count above</span>
        {xs.some(Boolean) && <span>X = spells with X in the cost</span>}
      </figcaption>
    </figure>
  );
}

/** One identity colour: pips share vs land-source share, warn when sources lag by >10 points. */
function ColourSplit({ colours }) {
  const per = asList(colours?.per);
  if (!per.length) return <p className="small muted" style={{ margin: 0 }}>Colourless deck: no coloured pips to match.</p>;
  return (
    <div className="cs" role="list" aria-label="Colour split: pips against land sources">
      {per.map((c) => {
        const col = `var(--mana-${String(c.c).toLowerCase()})`;
        const lag = c.pip_share != null && c.source_share != null ? Math.round((c.pip_share - c.source_share) * 100) : null;
        return (
          <div key={c.c} className="cs-row" role="listitem">
            <SymbolText text={`{${c.c}}`} />
            <div className="stack" style={{ gap: 4, minWidth: 0 }}>
              <div className="cs-line">
                <span className="k">Pips</span>
                <svg viewBox="0 0 100 10" preserveAspectRatio="none" aria-hidden="true" focusable="false">
                  <rect width="100" height="10" rx="3" fill="var(--surface-3)" />
                  {c.pip_share > 0 && <rect width={c.pip_share * 100} height="10" rx="3" fill={col} />}
                </svg>
                <span className="v">{fmtPct(c.pip_share)} · {fmtNum1(c.pips)}</span>
              </div>
              <div className="cs-line">
                <span className="k">Sources</span>
                <svg viewBox="0 0 100 10" preserveAspectRatio="none" aria-hidden="true" focusable="false">
                  <rect width="100" height="10" rx="3" fill="var(--surface-3)" />
                  {c.source_share > 0 && <rect x="0.5" y="0.5" width={Math.max(0, c.source_share * 100 - 1)} height="9" rx="3" fill={col} fillOpacity="0.45" stroke={col} strokeWidth="1" vectorEffect="non-scaling-stroke" />}
                </svg>
                <span className="v">{fmtPct(c.source_share)} · {fmtNum1(c.sources)}</span>
              </div>
              {c.warn && <span className="cs-warn">⚠ Lands make {lag} points less {c.c} than the spells ask for</span>}
            </div>
          </div>
        );
      })}
    </div>
  );
}

const STAT_TYPES = ["Creature", "Instant", "Sorcery", "Artifact", "Enchantment", "Planeswalker", "Battle", "Land"];

/** Collapsed "Stats" disclosure: curve, colour split, facts, types (all formats). */
function DeckStats({ deck, onClose }) {
  const s = deck?.stats;
  if (!s) return null;
  const commanders = asList(s.curve?.commander);
  // deckStats keys are lowercase ("creature"); accept capitalised keys too.
  const t0 = s.types || {};
  const types = Object.fromEntries(STAT_TYPES.map((t) => [t, Number(t0[t.toLowerCase()] ?? t0[t]) || 0]));
  const spells = types.Instant + types.Sorcery;
  const excl = s.excluded || {};
  return (
    <Sheet title={`Stats · ${plural(s.total ?? 0, "card")}${s.avg_mv != null ? ` · avg MV ${s.avg_mv}` : ""}`} onClose={onClose}>
      <div className="stack deck-stats">
        {(commanders.length > 0 || s.companion) && (
          <div className="type-chips">
            {commanders.map((c) => <span key={c.name} className="badge"><Icon.crown /> {c.name}{c.mv != null ? ` · MV ${c.mv}` : ""}</span>)}
            {s.companion && <span className="badge">Companion: {s.companion.name}</span>}
          </div>
        )}
        <CurveChart curve={s.curve} cards={deck.cards} />
        <ColourSplit colours={s.colours} />
        <div className="stats">
          <div className="stat"><div className="v">{fmtInt(s.lands)}{s.mdfc_lands > 0 ? ` + ${fmtNum1(s.mdfc_lands)}` : ""}</div><div className="k">Lands{s.mdfc_lands > 0 ? " + MDFC" : ""}</div></div>
          <div className="stat"><div className="v">{s.avg_mv ?? "—"}</div><div className="k">Avg MV</div></div>
          <div className="stat"><div className="v">{fmtInt(types.Creature || 0)}</div><div className="k">Creatures</div></div>
          <div className="stat"><div className="v">{fmtInt(spells)}</div><div className="k">Instants + sorceries</div></div>
          {s.unknown?.count > 0 && <div className="stat"><div className="v">{fmtInt(s.unknown.count)}</div><div className="k">Unknown</div></div>}
        </div>
        <div className="type-chips">
          {STAT_TYPES.filter((t) => types[t] > 0).map((t) => <span key={t} className="badge">{t} {fmtInt(types[t])}</span>)}
        </div>
        {s.unknown?.count > 0 && <p className="small muted" style={{ margin: 0 }}>Not counted (card data missing): {s.unknown.names.slice(0, 8).join(", ")}{s.unknown.names.length > 8 ? ", …" : ""}</p>}
        {s.x_spells?.count > 0 && <p className="small muted" style={{ margin: 0 }}>{plural(s.x_spells.count, "X spell")} counted at their base cost: {s.x_spells.names.slice(0, 6).join(", ")}{s.x_spells.names.length > 6 ? ", …" : ""}</p>}
        {(excl.side > 0 || excl.maybe > 0) && <p className="small muted" style={{ margin: 0 }}>Not in the stats: {[excl.side > 0 && `${excl.side} sideboard`, excl.maybe > 0 && `${excl.maybe} maybe`].filter(Boolean).join(", ")}.</p>}
      </div>
    </Sheet>
  );
}

const COLOUR_NAMES = { W: "white", U: "blue", B: "black", R: "red", G: "green" };
const colourWords = (c) => (c ? c.split("").map((x) => COLOUR_NAMES[x] ?? x).join(" ") : "colorless");
const fromCards = (from) => asList(from).map((f) => `${f.name}${f.quantity > 1 ? ` ×${f.quantity}` : ""}${f.side ? " (side)" : ""}`).join(", ");

/**
 * Collapsed "Tokens & extras" disclosure (deck.accessories): token tiles (image, P/T, which cards
 * make them, how many to have ready, how many you own and where), then counters/dice/markers.
 */
/** Chip text for Tokens & extras ("2 tokens · 1 extra"), null when there is nothing. */
const extrasSummary = (deck) => {
  const a = deck?.accessories;
  if (!a) return null;
  const t = asList(a.tokens).length, m = asList(a.markers).length;
  if (!t && !m) return a.status === "pending" ? "Tokens…" : null;
  return [t && plural(t, "token"), m && plural(m, "extra", "extras")].filter(Boolean).join(" · ");
};

function DeckExtras({ deck, onClose }) {
  const a = deck?.accessories;
  if (!a) return null;
  const tokens = asList(a.tokens);
  const markers = asList(a.markers);
  if (!tokens.length && !markers.length && a.status !== "pending") return null;
  const sum = [tokens.length && plural(tokens.length, "token"), markers.length && plural(markers.length, "extra", "extras")].filter(Boolean).join(" · ");
  return (
    <Sheet title={`Tokens & extras${sum ? ` · ${sum}` : ""}`} onClose={onClose}>
      <div className="stack deck-extras">
        {a.status === "pending" && <p className="small muted" role="status" style={{ margin: 0 }}>Checking token details…</p>}
        {a.status === "unavailable" && <p className="small muted" style={{ margin: 0 }}>Token details aren't available right now: names come from the card text.</p>}
        {tokens.length > 0 && (
          <div className="token-grid">
            {tokens.map((t) => {
              const own = t.owned?.quantity ?? 0;
              const where = asList(t.owned?.binders).map((b) => `${b.binder || UNSORTED}${asList(t.owned?.binders).length > 1 ? ` ${b.quantity}` : ""}`).join(", ");
              return (
                <div key={t.key} className="token-tile">
                  <span className="cover" aria-hidden="true">
                    {t.image_small ? <img src={t.image_small} alt="" loading="lazy" decoding="async" width="146" height="204" /> : <span className="ph">{t.pt || "T"}</span>}
                  </span>
                  <div className="info">
