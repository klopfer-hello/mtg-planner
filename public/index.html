const IMPORT_MODE_HELP = {
  delta: "Compares the file with your last ManaBox export and adds only the copies that are new (into their ManaBox binder). Fewer copies in ManaBox are listed, never deleted. Importing the same file twice changes nothing.",
  add: "Adds every copy in the file on top of what's already here.",
  replace: "Cards imported from ManaBox become exactly what's in the file. Scanned cards and cards organised here are kept.",
};

/** Settings → Import → Card list: a text list (e.g. a bought deck or booster pulls) into one binder of the collection. */
function CardListImport({ onDone }) {
  const [text, setText] = useState("");
  const [binder, setBinder] = useState("");
  const [language, setLanguage] = useState("en");
  const [condition, setCondition] = useState("near_mint");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);
  const [result, setResult] = useState(null);
  const pickFile = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    try { setText(await file.text()); } catch (err) { setError(`Could not read the file: ${err.message}`); }
    e.target.value = "";
  };
  const submit = async (e) => {
    e.preventDefault();
    if (!text.trim() || busy) return;
    setBusy(true); setError(null); setResult(null);
    try {
      const res = await api("/api/collection/import-list", { method: "POST", json: { text, binder: binder.trim(), language, condition } });
      setResult(res);
      setText("");
      onDone?.();
    } catch (err) { setError(err.message); } finally { setBusy(false); }
  };
  return (
    <form className="card stack" onSubmit={submit} aria-labelledby="list-import-title">
      <div className="row between">
        <h2 id="list-import-title">Card list</h2>
        <label className="btn sm"><Icon.file /> Load .txt<input type="file" accept=".txt,.dec,.dek,text/plain" className="sr-only" onChange={pickFile} /></label>
      </div>
      <p className="small muted" style={{ margin: 0 }}>Adds a list of cards you got (a deck, booster pulls) to one binder. Same format as decklists:
        <code> 1 Sol Ring</code>, <code>1 Name (SET) 123</code>, <code>*F*</code> for foil. A deck you bought? Use <b>Decks → Import decklist → I own these cards</b>: it also creates the deck.</p>
      <textarea className="textarea" aria-label="Card list" value={text} onChange={(e) => setText(e.target.value)} placeholder={"4 Lightning Bolt\n1 Sol Ring (CMM) 1015 *F*"} />
      <div className="settings-grid">
        <div className="field" style={{ gridColumn: "1 / -1" }}>
          <label htmlFor="list-binder">Binder</label>
          <input id="list-binder" className="input" maxLength={100} value={binder} onChange={(e) => setBinder(e.target.value)} placeholder={`${UNSORTED} (leave empty) or a binder name`} />
        </div>
        <div className="field">
          <label htmlFor="list-lang">Language</label>
          <select id="list-lang" className="select" value={language} onChange={(e) => setLanguage(e.target.value)}>
            {SCAN_LANGS.map(([k, l]) => <option key={k} value={k}>{l}</option>)}
          </select>
        </div>
        <div className="field">
          <label htmlFor="list-cond">Condition</label>
          <select id="list-cond" className="select" value={condition} onChange={(e) => setCondition(e.target.value)}>
            {CONDITIONS.map(([k, l]) => <option key={k} value={k}>{l}</option>)}
          </select>
        </div>
      </div>
      <ErrorNotice error={error} onDismiss={() => setError(null)} />
      {result && (
        <div className="notice ok" role="status"><span aria-hidden="true">✓</span><div className="grow">
          <b>Added {plural(result.added_copies, "copy", "copies")}</b> ({plural(result.cards, "card")}) to {result.binder || UNSORTED}. Undo in Collection → Recent changes.
          {result.unresolved?.length > 0 && <div className="small">Not found: {result.unresolved.join(", ")}</div>}
          {result.parse_errors?.length > 0 && <div className="small">Skipped lines: {result.parse_errors.join(" | ")}</div>}
        </div></div>
      )}
      <div className="row">
        <button type="submit" className="btn primary" disabled={busy || !text.trim()}>{busy ? <><span className="spinner" aria-hidden="true" /> Adding…</> : <><Icon.plus /> Add to collection</>}</button>
      </div>
    </form>
  );
}

function ImportTab({ dataVersion, health, onImported, onRestored, restored, onDismissRestored }) {
  const [file, setFile] = useState(null);
  const [mode, setMode] = useState("replace");
  const modeTouched = useRef(false);
  const [master, setMaster] = useState(null);
  const [masterState, setMasterState] = useState({ busy: false, error: null });
  const loadMaster = useCallback(() => {
    api("/api/settings").then((d) => {
      const m = d?.collection_master === "app" ? "app" : "manabox";
      setMaster(m);
      // The default import mode follows the master until the user picks one.
      if (!modeTouched.current) setMode(m === "app" ? "delta" : "replace");
    }).catch((e) => setMasterState((st) => ({ ...st, error: `Could not load settings: ${e.message}` })));
  }, []);
  useEffect(loadMaster, [loadMaster, dataVersion]);
  const switchMaster = async (to) => {
    if (to === "manabox" && !window.confirm("Make ManaBox the master again? The import mode defaults to Replace again, which replaces every card that came from ManaBox. Cards you organised or edited here stay where they are; a replace counts them against the file instead of adding them again. Copies you deleted here stay deleted.")) return;
    setMasterState({ busy: true, error: null });
    try {
      const d = await api("/api/settings", { method: "PATCH", json: { collection_master: to } });
      setMaster(d.collection_master);
      modeTouched.current = false;
      setMode(d.collection_master === "app" ? "delta" : "replace");
      setMasterState({ busy: false, error: null });
    } catch (e) { setMasterState({ busy: false, error: e.message }); }
  };
  const pickMode = (m) => { modeTouched.current = true; setMode(m); };
  // Where the cards go: as in the file (default), Unsorted, one binder or a new one. Picked per import.
  const [target, setTarget] = useState(IMPORT_AS_FILE);
  const [newBinder, setNewBinder] = useState("");
  const [binderNames, setBinderNames] = useState([]);
  useEffect(() => {
    api("/api/binders").then((d) => setBinderNames((d?.binders || []).map((b) => b.name))).catch(() => setBinderNames([]));
  }, [dataVersion]);
  const [busy, setBusy] = useState(false);
  const [started, setStarted] = useState(null);
  const [elapsed, setElapsed] = useState(0);
  const [result, setResult] = useState(null);
  const [error, setError] = useState(null);
  const [refresh, setRefresh] = useState({ busy: false, result: null, error: null });
  const [history, setHistory] = useState(null);
  const [historyError, setHistoryError] = useState(null);
  const fileInput = useRef(null);

  const loadHistory = useCallback(() => {
    setHistoryError(null);
    api("/api/imports").then(setHistory).catch((e) => setHistoryError(`Could not load import history: ${e.message}`));
  }, []);
  useEffect(loadHistory, [loadHistory, dataVersion]);

  // Elapsed-time counter while a request runs.
  useEffect(() => {
    if (!started) return;
    const t = setInterval(() => setElapsed(Math.round((Date.now() - started) / 1000)), 1000);
    return () => clearInterval(t);
  }, [started]);
  // Warn before closing the page mid-import.
  useEffect(() => {
    if (!busy) return;
    const h = (e) => { e.preventDefault(); e.returnValue = ""; };
    window.addEventListener("beforeunload", h);
    return () => window.removeEventListener("beforeunload", h);
  }, [busy]);

  const submit = async (e) => {
    e.preventDefault();
    if (!file || busy) return;
    if (target === IMPORT_NEW_BINDER && !newBinder.trim()) { setError("Enter a name for the new binder."); return; }
    const confirmReplace = mode === "replace" && master === "app";
    if (confirmReplace && !window.confirm(
      "Replace your ManaBox cards?\n\nmtg-planner is the master of your collection. A replace import DELETES every card that came from ManaBox " +
      "and loads this file instead. Cards you scanned or moved into binders here stay.\n\nUse Add to keep everything.")) return;
    setBusy(true);
    setError(null);
    setResult(null);
    setElapsed(0);
    setStarted(Date.now());
    try {
      const text = await file.text();
      const params = new URLSearchParams({ mode, filename: file.name });
      if (confirmReplace) params.set("confirm_replace", "1");
      if (target === IMPORT_NEW_BINDER) { params.set("binder", newBinder.trim()); params.set("create_binder", "1"); }
      else if (target !== IMPORT_AS_FILE) params.set("binder", target);
      const summary = await api(`/api/import/manabox?${params}`, { method: "POST", body: text, headers: { "Content-Type": "text/csv" } });
      setResult(summary);
      setFile(null);
      setTarget(IMPORT_AS_FILE);
      setNewBinder("");
      if (fileInput.current) fileInput.current.value = "";
      onImported();
    } catch (err) {
      setError(err.message);
    } finally {
      setBusy(false);
      setStarted(null);
    }
  };

  const refreshPrices = async () => {
    setRefresh({ busy: true, result: null, error: null });
    try {
      const r = await api("/api/refresh-prices", { method: "POST" });
      setRefresh({ busy: false, result: r, error: null });
      onImported();
    } catch (err) {
      setRefresh({ busy: false, result: null, error: err.message });
    }
  };

  const [section, setSection] = useState(null);
  const openSection = (id) => setSection(id);
  const closeSection = useCallback(() => setSection(null), []);
  return (
    <div className="stack-lg" style={{ maxWidth: 760 }}>
      <div className="page-title"><h1>Settings</h1></div>
      {restored && (
        <div className="notice ok" role="status">
          <span aria-hidden="true">✓</span>
          <div className="grow">
            <b>Backup restored.</b> {backupCounts(restored.restored?.counts)}. Your previous data is kept as the safety backup
            {restored.safety_backup ? ` from ${fmtDate(restored.safety_backup.created_at)}` : ""}.
          </div>
          <button type="button" className="btn ghost sm" onClick={onDismissRestored} aria-label="Dismiss"><Icon.close /></button>
        </div>
      )}

      <nav className="settings-list" aria-label="Settings">
        {SETTINGS_SECTIONS.map((x) => (
          <button key={x.id} type="button" className="settings-row" onClick={() => openSection(x.id)}>
            <span className="settings-row-icon" aria-hidden="true"><x.icon /></span>
            <span className="stack" style={{ gap: 2, minWidth: 0 }}><b>{x.title}</b><span className="small muted">{x.sub}</span></span>
            <span className="settings-row-go" aria-hidden="true">›</span>
          </button>
        ))}
      </nav>
      <PhoneAppPanel dataVersion={dataVersion} />
      {section === "import" && (
        <Sheet title="Import" onClose={closeSection}>
          <div className="stack settings-sheet">
      <form className="card stack" onSubmit={submit} aria-labelledby="import-title" aria-busy={busy}>
        <h2 id="import-title">ManaBox collection CSV</h2>
        <Collapsible label="How to export from ManaBox">
          <ol className="steps small">
            <li>In ManaBox open <b>Collection</b>, tap <b>⋯</b> → <b>Export</b> → <b>CSV</b>.</li>
            <li>Share or save the file (e.g. to Files / Downloads).</li>
            <li>Pick it below and tap <b>Import</b>.</li>
          </ol>
          <p className="small muted" style={{ marginBottom: 0 }}>Deck binders become decks; wish-list binders are skipped.</p>
        </Collapsible>

        <label className={`file-drop${file ? " has-file" : ""}`}>
          <Icon.file />
          <b>{file ? file.name : "Choose CSV file"}</b>
          <span className="muted small">{file ? `${(file.size / 1024).toFixed(0)} KB · tap to change` : "ManaBox export (.csv)"}</span>
          <input ref={fileInput} type="file" accept=".csv,text/csv" disabled={busy}
            onChange={(e) => { setFile(e.target.files?.[0] || null); setError(null); }} />
        </label>

        <fieldset style={{ border: 0, padding: 0, margin: 0 }} className="stack" disabled={busy}>
          <legend className="label" style={{ marginBottom: 8 }}>Mode</legend>
          {(master === "app" ? ["delta", "add", "replace"] : ["replace", "delta", "add"]).map((m) => (
            <label key={m} className="radio-card">
              <input type="radio" name="mode" value={m} checked={mode === m} onChange={() => pickMode(m)} />
              <span>
                <b>{IMPORT_MODE_LABEL[m]}</b>{(master === "app" ? m === "delta" : m === "replace") && <> <span className={`badge${master === "app" ? " accent" : ""}`}>default</span></>}<br />
                <span className="small muted">{IMPORT_MODE_HELP[m]}</span>
              </span>
            </label>
          ))}
          {mode === "add" && (
            <div className="notice warn" role="alert">
              <span aria-hidden="true">⚠️</span>
              <div className="grow"><b>Add duplicates cards you already imported.</b> Every copy in the file is added again, even if it came in with an earlier import. Use <b>Only new copies</b> to add just what changed.</div>
            </div>
          )}
          {master === "app" && mode === "replace" && (
            <div className="notice warn" role="alert">
              <span aria-hidden="true">⚠️</span>
              <div className="grow"><b>This deletes every card that came from ManaBox</b> and loads the file instead. mtg-planner is the master of your collection, so this is rarely what you want: cards you moved or scanned here stay, but ManaBox cards you haven't organised yet are replaced by the file. You'll be asked to confirm.</div>
            </div>
          )}
        </fieldset>

        <div className="stack" style={{ gap: 6 }}>
          <label className="label" htmlFor="import-target">Put the cards into</label>
          <select id="import-target" className="select" value={target} disabled={busy}
            onChange={(e) => { setTarget(e.target.value); setError(null); }}>
            <option value={IMPORT_AS_FILE}>Binders as in ManaBox</option>
            <option value="">Unsorted</option>
            {binderNames.map((n) => <option key={n} value={n}>{n}</option>)}
            <option value={IMPORT_NEW_BINDER}>+ New binder…</option>
          </select>
          {target === IMPORT_NEW_BINDER && (
            <input className="input" type="text" maxLength={100} placeholder="Name of the new binder" value={newBinder}
              disabled={busy} onChange={(e) => setNewBinder(e.target.value)} aria-label="Name of the new binder" />

                <div key={h.id} className="history-item">

                    <span className={`badge ${h.mode === "add" ? "warn" : h.mode === "delta" ? "accent" : ""}`}>{h.mode === "delta" ? "new copies" : h.mode || h.kind}</span>
                    <span className="muted">{fmtInt(s.total_cards_before)} → {fmtInt(s.total_cards_after)} copies{h.mode === "delta" || s.mode === "delta"
                      ? `${(s.added_copies ?? s.copies_added) != null ? ` · +${fmtInt(s.added_copies ?? s.copies_added)} new` : ""}`
                      : ` · +${fmtInt(s.printings_added)} / −${fmtInt(s.printings_removed)} / ~${fmtInt(s.printings_changed)} printings`}</span>
                    {s.unresolved?.length > 0 && <span className="badge warn">{s.unresolved.length} unresolved</span>}
                  </div>

        )}
      </section>
          </div>
        </Sheet>
      )}
      {section === "collection" && (
        <Sheet title="Collection" onClose={closeSection}>
          <div className="stack settings-sheet">
      <MasterPanel master={master} busy={masterState.busy} error={masterState.error} onSwitch={switchMaster} />
      <ExportPanel />
      <RecentChanges dataVersion={dataVersion} onChanged={onImported} />
          </div>
        </Sheet>

      <BackupPanel dataVersion={dataVersion} onRestored={onRestored} />
          </div>
        </Sheet>
      )}
      {section === "online" && (
        <Sheet title="Online services" onClose={closeSection}>
          <div className="stack settings-sheet">
      <SpellbookPanel health={health} dataVersion={dataVersion} />
          </div>
        </Sheet>
      )}
      {section === "data" && (
        <Sheet title="Scanner & data" onClose={closeSection}>
          <div className="stack settings-sheet">
      <ScannerIndexPanel health={health} />
      <section className="card stack" aria-labelledby="prices-title">
        <h2 id="prices-title">Prices</h2>
        <p className="small muted" style={{ margin: 0 }}>Imports already fetch current prices. Refresh in between to update prices and card data for everything you own and every deck card.</p>
        <div className="row">
          <button type="button" className="btn" onClick={refreshPrices} disabled={refresh.busy || busy}>
            {refresh.busy ? <><span className="spinner" aria-hidden="true" /> Refreshing…</> : <><Icon.refresh /> Refresh prices</>}
          </button>

        </div>
        <ErrorNotice error={refresh.error} />
      </section>
          </div>
        </Sheet>
      )}

      <p className="footer-note">mtg-planner {health ? health.version : ""} · card data and images © Scryfall / Wizards of the Coast · unofficial fan tool</p>
    </div>
  );
}

// Scan tab: camera scanner, staging list, commit to binder / deck
// ===========================================================================

const SCAN_LANGS = [
  ["en", "English"], ["de", "Deutsch"], ["fr", "Français"], ["it", "Italiano"], ["es", "Español"], ["pt", "Português"],
  ["ja", "日本語"], ["ko", "한국어"], ["ru", "Русский"], ["zhs", "简体中文"], ["zht", "繁體中文"],
];
// Every language code Scryfall uses (owned copies can be any of them; the scanner reads SCAN_LANGS).
const CARD_LANGS = [
  ...SCAN_LANGS, ["he", "עברית"], ["la", "Latina"], ["grc", "Ancient Greek"], ["ar", "العربية"], ["sa", "Sanskrit"],
  ["ph", "Phyrexian"], ["qya", "Quenya"],
];

const CONDITIONS = [
  ["mint", "Mint", "M"], ["near_mint", "Near Mint", "NM"], ["excellent", "Excellent", "EX"], ["good", "Good", "GD"],
  ["light_played", "Light Played", "LP"], ["played", "Played", "PL"], ["poor", "Poor", "PR"],

const BOARDS = [["main", "Main deck"], ["side", "Sideboard"], ["commander", "Commander"], ["maybe", "Maybeboard"]];
const FINISH_LABEL = { nonfoil: "Non-foil", foil: "Foil", etched: "Etched" };
const STATUS_LABEL = { auto: "✓ matched", suggest: "? confirm", review: "✗ pick", failed: "✗ unknown", duplicate: "= same as last" };
const STATUS_COLOR = { auto: "#62d18d", suggest: "#f0c062", duplicate: "#f0c062", review: "#ff8274", failed: "#ff8274", error: "#ff8274" };
// (Sound settings moved to mtg.scan.sound, see loadSoundSettings.)
// storageLang "scanned" (beta.4 default): the collection keeps the detected printing and its language.
// autoClaude (beta.5): ask Claude once for a card that repeated probes can't recognise (public/autoask.js).
const SCAN_DEFAULTS = { storageLang: "scanned", foil: "auto", condition: "near_mint", setHint: "", auto: true, photo: true, calibration: false, autoClaude: true };

/** Array from an API answer that may be a bare array or wrap it in a key. */

  return [];
};
const normFinish = (f) => (f === "normal" || !f ? "nonfoil" : f);

/** One printing shape for index rows, candidates and scan rows. */
function normPrinting(p) {
  if (!p) return null;
  const face = jsonArr(p.faces)[0] || {};
  return {
    id: p.id ?? p.printing_id ?? p.scryfall_id ?? null,
    oracle_id: p.oracle_id ?? null,
    name: p.printed_name && p.lang && p.lang !== "en" ? p.printed_name : (p.name ?? face.name ?? "?"),
    en_name: p.name ?? face.name ?? "",
    set: String(p.set_code ?? p.set ?? "").toLowerCase(),
    set_name: p.set_name ?? "",
    cn: p.collector_number ?? p.number ?? "",
    lang: p.lang ?? p.language ?? "",

    img: p.image_normal ?? face.image_normal ?? p.image_small ?? face.image_small ?? null,
    imgSmall: p.image_small ?? face.image_small ?? p.image_normal ?? face.image_normal ?? null,
    finishes: jsonArr(p.finishes).map(normFinish),
    score: typeof p.score === "number" ? p.score : null,

    tags: [...new Set([
      ...jsonArr(p.promo_types), ...jsonArr(p.frame_effects).filter((f) => f !== "legendary"),
      p.full_art ? "full art" : null, p.textless ? "textless" : null,
      p.border_color && p.border_color !== "black" ? `${p.border_color} border` : null,
      p.frame && !["2015", "2003"].includes(String(p.frame)) ? `${p.frame} frame` : null,

}
const printingLabel = (p) => (p ? `${p.set.toUpperCase()} #${p.cn}${p.lang ? ` · ${p.lang.toUpperCase()}` : ""}` : "");

// Scan ids can be reused (Rescan/Undo delete the newest row, SQLite hands its id
// out again), so the URL carries the scan's created_at: a new capture never hits
// the browser's cached JPEG of the old one.
const scanFileUrl = (s, kind) => `/api/scans/${s.id}/${kind}${s.created_at ? `?v=${encodeURIComponent(s.created_at)}` : ""}`;
function scanThumb(s) {
  const st = s.store || s.store_printing || s.printing || {};
  return s.image_small || s.image_normal || st.image_small || st.image_normal || jsonArr(st.faces)[0]?.image_small || (s.image_path || s.has_image ? scanFileUrl(s, "image") : null);
}
function scanFinishes(s) {
  const st = s.store || s.store_printing || s.printing || {};
  const f = jsonArr(s.finishes).length ? jsonArr(s.finishes) : jsonArr(st.finishes);
  const list = [...new Set(f.map(normFinish))].filter((x) => FINISH_LABEL[x]);
  return list.length ? list : ["nonfoil", "foil"];
}
/**
 * The finish was not read from the card: it came from the session's foil

 */
const finishGuessed = (s) => Boolean(s) && (s.finish_source ?? s.finishSource) === "toggle" && scanFinishes(s).length > 1;
const candidatesOf = (result, scan) => {
  const r = jsonArr(result?.candidates);
  return (r.length ? r : jsonArr(scan?.candidates)).map(normPrinting).filter((p) => p && p.id);
};

// ---------------------------------------------------------------------------
// Feedback: scan sounds (scanlib createScanSounds, Web Audio unlocked on the
// "Start camera" tap) + vibration. Sound settings are per device in
// localStorage mtg.scan.sound {enabled, threshold}: a staged scan plays the
// success blip, or the cash sound when its EUR price is >= threshold.

const SOUND_DEFAULTS = { enabled: true, threshold: 5 };
function loadSoundSettings() {
  const s = store.get("mtg.scan.sound", null);

  const legacy = store.get("mtg.scan.settings", {})?.sound;
  const enabled = typeof s?.enabled === "boolean" ? s.enabled : legacy !== false;
  const t = Number(s?.threshold);
  return { enabled, threshold: Number.isFinite(t) && t >= 0 ? t : SOUND_DEFAULTS.threshold };
}
function vibrate(kind) {
  try { navigator.vibrate?.(kind === "auto" || kind === "increment" ? 40 : kind === "suggest" || kind === "duplicate" ? [30, 60, 30] : [120, 60, 120]); } catch { /* ignore */ }
}

// Record session (scanner tuning data): small frames + capture decision
// records go to POST /api/debug/frames. Off by default, auto-off after 15 min.
const RECORD_MAX_MS = 15 * 60 * 1000;
const RECORD_EVERY_MS = 500;
const RECORD_MAX_B64 = 300 * 1024;
function newRecordSession() {
  const d = new Date(), p = (n) => String(n).padStart(2, "0");
  const rnd = Math.random().toString(36).slice(2, 6).padEnd(4, "0");
  return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}-${rnd}`;
}
/**
 * Probe policy overrides for field tests (ProbeController cfg, e.g. {"stillMad":10}): localStorage
 * mtg.scan.capture (JSON object), then ?scancfg=<JSON> in the URL on top.
 * capture.js validates them and ignores unknown keys / wrong types.
 */
function readCaptureOverrides() {
  let over = {};
  const saved = store.get("mtg.scan.capture", null);
  if (saved && typeof saved === "object" && !Array.isArray(saved)) over = { ...saved };
  try {
    const q = new URLSearchParams(window.location.search).get("scancfg");
    const u = q ? JSON.parse(q) : null;
    if (u && typeof u === "object" && !Array.isArray(u)) over = { ...over, ...u };
  } catch { /* malformed ?scancfg */ }
  return over;
}
const fmtElapsed = (ms) => { const s = Math.max(0, Math.floor(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };

/**
 * Recorded sessions on the server (GET/DELETE /api/debug/sessions), shown in
 * the scan settings so old recordings can be cleaned up from the phone.
 * `recording` = the session being recorded now (not deletable, list reloads when it stops).
 */
function RecordedSessions({ recording }) {
  const [list, setList] = useState(null);
  const [error, setError] = useState(null);
  const [ask, setAsk] = useState(null); // id awaiting the inline "Delete?" confirm
  const [busy, setBusy] = useState(null);
  const load = useCallback(() => {
    api("/api/debug/sessions").then((d) => { setList(d.sessions || []); setError(null); })
      .catch((e) => setError(`Could not load recorded sessions: ${e.message}`));
  }, []);
  useEffect(load, [load, recording]);
  const remove = async (id) => {
    setBusy(id); setError(null);
    try { await api(`/api/debug/sessions/${encodeURIComponent(id)}`, { method: "DELETE" }); setAsk(null); load(); }
    catch (e) { setError(`Delete failed: ${e.message}`); setAsk(null); load(); }
    finally { setBusy(null); }
  };
  return (
    <div className="field rec-sessions" style={{ gridColumn: "1 / -1" }}>
      <span className="small" style={{ fontWeight: 600 }}>Recorded sessions</span>
      {error && <span className="small" style={{ color: "var(--bad)" }} role="alert">{error}</span>}
      {!list && !error && <span className="small muted">Loading…</span>}
      {list && list.length === 0 && <span className="small muted">No recorded sessions.</span>}
      {list && list.length > 0 && (
        <ul className="rec-list">
          {list.map((s) => (
            <li key={s.id}>
              <span className="grow small">
                <b>{fmtDate(s.started_at)}</b>
                <span className="muted"> · {plural(s.frames, "frame")} · {(s.bytes / 1048576).toFixed(1)} MB</span>
                {s.id === recording && <span className="badge accent" style={{ marginLeft: 6 }}>recording</span>}
              </span>
              {ask === s.id ? (
                <span className="row small" style={{ gap: 4 }} role="group" aria-label="Confirm delete">
                  <span>Delete?</span>
                  <button type="button" className="btn sm danger" disabled={busy === s.id} onClick={() => remove(s.id)}>Yes</button>
                  <button type="button" className="btn sm" disabled={busy === s.id} onClick={() => setAsk(null)}>No</button>
                </span>
              ) : (
                <button type="button" className="btn sm ghost danger" style={{ paddingInline: 8 }} disabled={s.id === recording || Boolean(busy)}
                  onClick={() => setAsk(s.id)} aria-label={`Delete recorded session from ${fmtDate(s.started_at)}`} title="Delete"><Icon.trash /></button>
              )}

}

function cameraErrorMessage(e) {
  const n = e?.name;
  if (n === "NotAllowedError" || n === "SecurityError") return "Camera access was denied. Allow the camera for this site in your browser settings, then tap Start camera again.";
  if (n === "NotFoundError" || n === "OverconstrainedError") return "No usable camera was found on this device.";
  if (n === "NotReadableError" || n === "AbortError") return "The camera is busy (another app or tab may be using it). Close it and try again.";
  return e?.message || "Could not start the camera.";
}

/**
 * Record session status line: elapsed time and frame counters, re-rendered once a second on its
 * own (the counters live in a ref the camera loop updates), so recording never re-renders ScanTab.
 */
function RecordStatus({ rec, statsRef }) {
  const [, tick] = useReducer((x) => x + 1, 0);
  useEffect(() => {
    const t = setInterval(tick, 1000);
    return () => clearInterval(t);
  }, []);
  const st = statsRef.current && statsRef.current.session === rec.session ? statsRef.current : { frames: 0, errors: 0, full: null };
  return (
    <span className="small rec-status" role="status">
      <span>● Recording {fmtElapsed(Date.now() - rec.startedAt)}</span>
      <span>{plural(st.frames, "frame")}</span>
      {st.errors > 0 && <span className="muted">{st.errors} not sent</span>}
      {st.full && <span style={{ color: "var(--warn)" }}>{st.full}</span>}
    </span>
  );
}

// ---------------------------------------------------------------------------
// Camera view: stream, analysis loop, overlay, probes and the shutter.

// Pill dot colour per ProbeController state.
const CAM_PHASE = { searching: "searching", tracking: "tracking", probing: "busy", waiting: "tracking", hold: "hold", unrecognised: "unrecognised", paused: "searching" };
const FOIL_CYCLE = { auto: "nonfoil", nonfoil: "foil", foil: "auto" };
const FOIL_SHORT = { auto: "Auto", nonfoil: "Non-foil", foil: "✦ Foil" };

// The camera box's aspect, fixed per viewport orientation: the first started stream's, then kept when the
// video's intrinsic size changes (a camera restart, a device-reported orientation flip: Android once came
// back as 1920x1080 landscape and the view shrank and the UI jumped). The video fills it (object-fit: cover)
// and the overlay maps video px with the same cover scale.
let camBoxLock = null; // {ratio, portrait}
const viewportPortrait = () => { try { return window.innerHeight >= window.innerWidth; } catch { return true; } };
function camBoxRatio(vw, vh) {
  const portrait = viewportPortrait();
  if (vw > 0 && vh > 0 && (!camBoxLock || camBoxLock.portrait !== portrait)) camBoxLock = { ratio: vw / vh, portrait };
  return camBoxLock && camBoxLock.portrait === portrait ? camBoxLock.ratio : 3 / 4;
}

/**
 * Keeps a render error in the camera view inside the camera box: the scan tab (its staged list, the
 * Record session) stays, the box says what happened and offers a restart (beta.1 field report: "it kind
 * of crashed and the recording was cancelled").
 */
class CameraBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null, key: 0 }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error) { try { console.error("Camera view error", error); } catch { /* ignore */ } }
  render() {
    const { error, key } = this.state;
    if (!error) return <React.Fragment key={key}>{this.props.children}</React.Fragment>;
    return (
      <div className="cam" style={{ aspectRatio: `${camBoxRatio(0, 0)}`, width: `min(100%, calc(72dvh * ${camBoxRatio(0, 0).toFixed(4)}))` }}>
        <div className="cam-start">
          <p role="alert" style={{ color: "#ffb4a8" }}>The camera view stopped ({String(error?.message || error).slice(0, 120)}).{this.props.recording ? " Recording is paused." : ""}</p>
          <button type="button" className="btn primary" onClick={() => this.setState({ error: null, key: key + 1 })}><Icon.camera /> Restart camera view</button>
        </div>
      </div>
    );
  }
}

/**
 * Scanner camera, recognition-driven: detector A2 (scanlib
 * createDetAnalyzer) tracks the card; the ProbeController (probeRef, owned by
 * ScanTab) decides when the tracked crop goes to the server as a probe
 * (sendProbe → the server stages it only when identified and not the last
 * card). The shutter sends a normal scan (Claude allowed) through onManual.

 * faintly. Also uploads the record-session frames while `record` is set,
 * each with a per-frame state record.
 */
function CameraView({ lib, probeRef, detRef, autoAskRef = null, active, settings, paused, busy, flash, queued, record, plusOne = true, sendProbe, onManual, onAutoAsk = null, onFoil, onRecorded, onError, onUnlock, onStart, overlay = null, valuePill = null, onPhoto = null, onSettings = null, photoBusy = null }) {
  const videoRef = useRef(null);
  const overlayRef = useRef(null);
  const streamRef = useRef(null);
  const trackRef = useRef(null);
  const cloneRef = useRef(null); // hidden <video> of the analysis clone (scanlib createDetAnalyzer cloneVideo)
  const obsRef = useRef(null);
  // false | "probe" (a probe crop: the analysis loop keeps running) | "shot" (shutter / auto-ask: the loop waits)
  const capturingRef = useRef(false);
  const pixelsRef = useRef(null); // scanlib createScanWorker client for the probe crops (null = inline)
  const perfRef = useRef(null); // scanperf PerfMonitor of the running camera (perf beacon)
  const pacerRef = useRef(null); // scanperf FramePacer of the running camera
  const recRef = useRef({ session: null, seq: 0, last: 0, busy: false, events: [], frames: 0, bytes: 0, errors: 0, full: null });
  const live = useRef({});
  live.current = { paused, busy, auto: settings.auto, photo: settings.photo, flash, record, queued, plusOne, sendProbe, onManual, onAutoAsk, onRecorded, onError };
  const [cam, setCam] = useState({ state: "off", error: null, vw: 0, vh: 0 });
  const [status, setStatus] = useState({ phase: "searching", hint: "", state: "searching" });
  const [torch, setTorchState] = useState({ supported: null, on: false });
  const [dbg, setDbg] = useState(null); // ?scandebug=1: detector timing + probe state
  const debugOn = useMemo(() => { try { return new URLSearchParams(window.location.search).get("scandebug") === "1"; } catch { return false; } }, []);
  // camera size + work-frame path, fixed per page load (scanlib cameraPlan: Android 1440p + the <video>
  // path, else 4K + auto; ?scanres=1080|1440|4k and ?scanframes= override); camInfoRef = what opened

  const stop = useCallback(() => {
    genRef.current++;

    else streamRef.current?.getTracks().forEach((t) => t.stop());

    trackRef.current = null;
    if (videoRef.current) videoRef.current.srcObject = null;
    setCam((c) => (c.state === "off" || c.state === "error" ? c : { ...c, state: "off" }));

    setCam({ state: "starting", error: null, vw: 0, vh: 0 });
    try {

      // Pixel 9 that restarted the camera as landscape 1080p and the view jumped)

        lib.stopStream(stream);

        return;
      }

      const track = stream.getVideoTracks()[0];
      trackRef.current = track;
      track?.addEventListener?.("ended", () => {
        // an old track's late event never stops the current stream
        if (trackRef.current !== track) return;
        stop();

      const body = perf.snapshot(Date.now(), {

        dpr: window.devicePixelRatio || 1, cores: nav.hardwareConcurrency ?? null, memory: nav.deviceMemory ?? null,
        video: { w: st.width ?? null, h: st.height ?? null, fps: st.frameRate ?? null, vw: v.videoWidth, vh: v.videoHeight, resize: st.resizeMode ?? null },
        worker: Boolean(detW?.available()), detect_worker: detW ? detW.state : "none", pixel_worker: pxW ? pxW.state : "none",
        encoder: Boolean(pxW?.available() && pxW.encoder), grab_mode: det.grabInfo ? det.grabInfo() : null, gap: pacer ? pacer.gap() : null,
        frame_path: det.path ?? null,
        // requested vs delivered camera size + the platform decision (try 0 = the requested constraints opened it)
        res: { pref: plan.res, why: plan.why, android: plan.android, frames: plan.frames, frames_why: plan.frames_why,
          ask_w: plan.width, ask_h: plan.height, try: camInfoRef.current?.try ?? null, got_w: st.width ?? null, got_h: st.height ?? null },
        dropped_frames: vq && vq0 ? vq.dropped - vq0.dropped : null, decoded_frames: vq && vq0 ? vq.total - vq0.total : null,
        record: Boolean(live.current.record?.session), visible: !document.hidden,
      });
      vq0 = vq;
      api("/api/debug/perf", { method: "POST", json: body }).catch(() => {});
    }, 5000);

    return () => {
      alive = false;
      clearWait();
      if (vfcId !== null) { try { v.cancelVideoFrameCallback?.(vfcId); } catch { /* ignore */ } vfcId = null; }
      clearInterval(beacon);
      if (rafId !== null) cancelAnimationFrame(rafId);
      try { longObs?.disconnect(); } catch { /* ignore */ }
      try { det.close?.(); } catch { /* ignore */ }
      detW?.close(); pxW?.close();
      if (pixelsRef.current === pxW) pixelsRef.current = null;
      if (perfRef.current === perf) perfRef.current = null;
      if (pacerRef.current === pacer) pacerRef.current = null;
      if (detRef.current === det) detRef.current = null;
    };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [cam.state, lib, runProbe]);

  const toggleTorch = async () => {
    const next = !torch.on;
    try {
      await lib.setTorch(trackRef.current, next);
      setTorchState((t) => ({ ...t, on: next, supported: true }));
    } catch {
      setTorchState({ supported: false, on: false });
      onError?.("The torch is not available on this camera.");
    }
  };

  const on = cam.state === "on";
  const ratio = camBoxRatio(cam.state === "on" ? cam.vw : 0, cam.state === "on" ? cam.vh : 0);
  const style = { aspectRatio: `${ratio}`, width: `min(100%, calc(72dvh * ${ratio.toFixed(4)}))` };
  const support = lib ? lib.cameraSupport() : null;
  const foil = settings.foil || "auto";
  const tapToCapture = status.state === "unrecognised" && !paused;

  return (
    <div className="cam" style={style}>
      <video ref={videoRef} playsInline muted autoPlay aria-label="Camera preview" />
      <video ref={cloneRef} className="cam-analysis" playsInline muted aria-hidden="true" tabIndex={-1} />
      <canvas ref={overlayRef} aria-hidden="true" hidden={!on} />
      {!on && (
        <div className="cam-start">
          {cam.state === "starting" ? <Spinner label="Starting camera…" /> : (
            <>
              {cam.error && <p role="alert" style={{ color: "#ffb4a8" }}>{cam.error}</p>}
              {record?.session && <p role="status">Recording is paused until the camera runs again.</p>}
              {support && !support.secure && <p role="alert" style={{ color: "#ffb4a8" }}>The camera only works over HTTPS.</p>}
              <div className="cam-start-actions">
                {onPhoto && <button type="button" className="cam-btn" aria-label="Scan from photos" title="Scan from photos" disabled={!lib || Boolean(photoBusy)} onClick={onPhoto}><Icon.image /></button>}
                <button type="button" className="btn primary" onClick={start} disabled={!lib}><Icon.camera /> {cam.error ? "Try again" : "Start camera"}</button>
                {onSettings && <button type="button" className="cam-btn" aria-label="Scan settings" title="Scan settings" onClick={onSettings}><Icon.gear /></button>}
              </div>
              <p>Lay a card in view and hold it still for a moment – it's added once it's recognised.</p>
            </>
          )}
        </div>
      )}
      {on && (
        <>
          <div className="cam-hud top">
            <span className="pills">
              {tapToCapture ? (
                <button type="button" className={`pill s-${status.phase}`} onClick={manualShot} aria-live="polite"><span className="dot" aria-hidden="true" />{status.hint}</button>
              ) : (
                <span className={`pill s-${status.phase}`} role="status" aria-live="polite"><span className="dot" aria-hidden="true" />{status.hint || "Ready"}</span>
              )}
              {record?.session && <span className="pill s-rec"><span className="dot" aria-hidden="true" />REC</span>}
              {settings?.calibration && <span className="pill" title="Calibration mode is on (Scan settings)">CAL</span>}
              {debugOn && dbg && (
                <span className="pill" style={{ whiteSpace: "normal", fontWeight: 500, fontSize: ".72rem" }}>
                  A2 {dbg.a50?.toFixed(0)}/{dbg.a90?.toFixed(0)} ms (main {dbg.m50?.toFixed(0)}, gap {dbg.gap}, {dbg.wk ? "worker" : "inline"}, {dbg.gm}) · {dbg.st} · {dbg.f ? "F" : "-"}{dbg.w ? "W" : "-"}{dbg.a ? "A" : "-"}{dbg.s ? "S" : "-"} · cmad {dbg.cmad?.toFixed(1) ?? "-"} · sharp {Math.round(dbg.sharp ?? 0)} · {dbg.mode}{dbg.prior ? " prior" : ""} · probes {dbg.sent} · {dbg.last || "-"}{dbg.lms != null ? ` ${dbg.lms} ms` : ""}
                </span>
              )}
            </span>
            <div className="cam-hud-right">
              {valuePill}
              {torch.supported !== false && (
                <button type="button" className="cam-btn" aria-pressed={torch.on} aria-label={torch.on ? "Turn torch off" : "Turn torch on"} onClick={toggleTorch}><Icon.bolt /></button>
              )}
            </div>
          </div>
          {overlay && <div className="cam-overlay">{overlay}</div>}
          <div className="cam-hud bottom">
            <button type="button" className="cam-btn" aria-label="Stop camera" onClick={stop}><Icon.close /></button>
            {onPhoto && <button type="button" className="cam-btn" aria-label="Scan from photos" title="Scan from photos" disabled={Boolean(photoBusy)} onClick={onPhoto}><Icon.image /></button>}
            <button type="button" className="shutter" aria-label="Take scan now" disabled={paused} onClick={manualShot} />
            <button type="button" className={`cam-btn finish ${foil}`} onClick={() => onFoil?.(FOIL_CYCLE[foil] || "auto")}
              aria-label={`Finish: ${FOIL_SHORT[foil] || foil}. Tap to change`} title="Finish when the card doesn't show it (foil pile: ✦ Foil)">{FOIL_SHORT[foil] || foil}</button>
            {onSettings && <button type="button" className="cam-btn" aria-label="Scan settings" title="Scan settings" onClick={onSettings}><Icon.gear /></button>}
          </div>
        </>
      )}
    </div>
  );
}

// ---------------------------------------------------------------------------
// Printing picker (candidates, all printings of a card, title search)

/**
 * Where a list of printings differs: per field, whether the values differ and
 * the common prefix/suffix length (so only the differing characters of a set
 * code or collector number get marked).
 */
function printingDiff(list) {
  const out = { set: null, cn: null, lang: false, finish: false, tags: new Set() };
  if (!list || list.length < 2) return out;
  const affix = (vals) => {
    if (new Set(vals).size < 2) return null;
    const min = Math.min(...vals.map((v) => v.length));
    let pre = 0;
    while (pre < min && vals.every((v) => v[pre] === vals[0][pre])) pre++;
    let suf = 0;
    while (suf < min - pre && vals.every((v) => v[v.length - 1 - suf] === vals[0][vals[0].length - 1 - suf])) suf++;
    return { pre, suf };
  };
  out.set = affix(list.map((p) => p.set.toUpperCase()));
  out.cn = affix(list.map((p) => String(p.cn)));
  out.lang = new Set(list.map((p) => p.lang)).size > 1;
  out.finish = new Set(list.map((p) => p.finishes.join("/"))).size > 1;
  const all = list.map((p) => new Set(p.tags || []));
  for (const t of new Set(list.flatMap((p) => p.tags || []))) if (!all.every((x) => x.has(t))) out.tags.add(t);
  return out;
}

/** Text with the differing middle part (between common prefix and suffix) marked. */
function DiffText({ text, d, prefix = "" }) {
  const t = String(text);
  if (!d) return <span className="same">{prefix}{t}</span>;
  const mid = t.slice(d.pre, t.length - d.suf);
  return <span>{prefix}{t.slice(0, d.pre)}{mid ? <mark>{mid}</mark> : null}{t.slice(t.length - d.suf)}</span>;
}

function PickTile({ p, current, onPick, diff }) {
  const d = diff || printingDiff([]);
  const tags = (p.tags || []).filter((t) => d.tags.has(t) || (p.tags || []).length <= 2);
  return (
    <button type="button" className="pick" aria-current={current || undefined} onClick={() => onPick(p)}
      aria-label={`${p.name}, ${p.set_name || p.set.toUpperCase()} number ${p.cn}${p.lang ? `, ${p.lang}` : ""}${p.tags?.length ? `, ${p.tags.join(", ")}` : ""}`}>
      <span className="pcode" aria-hidden="true">
        <span className="pset"><DiffText text={p.set.toUpperCase()} d={d.set} /></span>
        <span className="pcn"><DiffText text={p.cn} d={d.cn} prefix="#" /></span>
        {/* Language variants share set + number: then the language is the difference. */}
        {d.lang && p.lang ? <span className="pcn"><mark>{p.lang.toUpperCase()}</mark></span> : null}
      </span>
      {p.img ? <img src={p.img} alt="" loading="lazy" decoding="async" /> : <span className="ph">{p.name}</span>}
      <span className="cap">
        <b>{p.name}</b>
        {p.set_name && <span className="muted" style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{p.set_name}</span>}
        <span className="ptags">
          {p.lang && <span className={`badge${d.lang ? " diff" : ""}`}>{p.lang.toUpperCase()}</span>}
          {p.finishes.length > 0 && <span className={`badge${d.finish ? " diff" : ""}`}>{p.finishes.map((f) => (f === "nonfoil" ? "non-foil" : f)).join(" / ")}</span>}
          {tags.map((t) => <span key={t} className={`badge${d.tags.has(t) ? " diff" : ""}`}>{t}</span>)}
        </span>
        {p.score != null && <span className="muted">score {p.score.toFixed(2)}</span>}
      </span>
    </button>
  );
}

/**
 * The user's own capture of the collector line (the high-res bottom strip),
 * zoomed in so near-identical printings can be told apart. Tries each source in
 * turn (server copy, then the local capture) and hides itself when none loads.
 * Pinch (touch), ctrl+wheel or the buttons zoom.
 */
function ScanStrip({ srcs, startZoom = 2 }) {
  const list = useMemo(() => (srcs || []).filter(Boolean), [srcs]);
  const [i, setI] = useState(0);
  const [zoom, setZoom] = useState(startZoom);
  const zoomRef = useRef(startZoom);
  zoomRef.current = zoom;
  const boxRef = useRef(null);
  const placed = useRef(false);

  // Zoom around a point (box coordinates), keeping that point in place.
  const zoomTo = useCallback((z, cx, cy) => {
    const box = boxRef.current;
    const prev = zoomRef.current;
    const next = Math.max(1, Math.min(6, z));
    if (!box || next === prev) return;
    const x = cx ?? box.clientWidth / 2, y = cy ?? box.clientHeight / 2;
    const sl = box.scrollLeft, st = box.scrollTop;
    zoomRef.current = next;
    setZoom(next);
    requestAnimationFrame(() => {
      box.scrollLeft = (sl + x) * (next / prev) - x;
      box.scrollTop = (st + y) * (next / prev) - y;
    });
  }, []);

  useEffect(() => {
    const box = boxRef.current;
    if (!box) return;
    let start = null;
    const dist = (t) => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
    const mid = (t) => {
      const r = box.getBoundingClientRect();
      return [(t[0].clientX + t[1].clientX) / 2 - r.left, (t[0].clientY + t[1].clientY) / 2 - r.top];
    };
    const onStart = (e) => { if (e.touches.length === 2) start = { d: dist(e.touches), z: zoomRef.current }; };
    const onMove = (e) => {
      if (!start || e.touches.length !== 2) return;
      e.preventDefault();
      const [x, y] = mid(e.touches);
      zoomTo(start.z * dist(e.touches) / start.d, x, y);
    };
    const onEnd = (e) => { if (e.touches.length < 2) start = null; };
    const onWheel = (e) => {
      if (!e.ctrlKey) return;
      e.preventDefault();
      const r = box.getBoundingClientRect();
      zoomTo(zoomRef.current * Math.exp(-e.deltaY / 200), e.clientX - r.left, e.clientY - r.top);
    };
    box.addEventListener("touchstart", onStart, { passive: true });
    box.addEventListener("touchmove", onMove, { passive: false });
    box.addEventListener("touchend", onEnd, { passive: true });
    box.addEventListener("touchcancel", onEnd, { passive: true });
    box.addEventListener("wheel", onWheel, { passive: false });
    return () => {
      box.removeEventListener("touchstart", onStart);
      box.removeEventListener("touchmove", onMove);
      box.removeEventListener("touchend", onEnd);
      box.removeEventListener("touchcancel", onEnd);
      box.removeEventListener("wheel", onWheel);
    };
  }, [zoomTo, i, list.length]);

  if (i >= list.length) return null;
  const onLoad = () => {
    // M15+ frames: the collector line sits in the upper-left part of the strip,
    // start there. Older frames (startZoom 1) show the whole strip.
    const box = boxRef.current;
    if (!box || placed.current) return;
    placed.current = true;
    box.scrollLeft = 0;
    box.scrollTop = Math.max(0, (box.scrollHeight - box.clientHeight) * 0.25);
  };
  return (
    <figure className="scan-strip" style={{ margin: 0 }}>
      <div className="strip-box" ref={boxRef}>
        <img src={list[i]} alt="Your scan: the card's bottom edge with set code and collector number" draggable={false}
          style={{ width: `${zoom * 100}%` }} onLoad={onLoad} onError={() => { placed.current = false; setI((n) => n + 1); }} />
      </div>
      <figcaption className="strip-bar">
        <span className="grow">Your scan · compare the set code and number</span>
        <button type="button" className="btn ghost icon" aria-label="Zoom out" disabled={zoom <= 1} onClick={() => zoomTo(zoom / 1.4)}><Icon.zoomOut /></button>
        <button type="button" className="btn ghost icon" aria-label="Zoom in" disabled={zoom >= 6} onClick={() => zoomTo(zoom * 1.4)}><Icon.zoomIn /></button>
      </figcaption>
    </figure>
  );
}

function PrintingPicker({ title, candidates = [], oracleId = null, lang = "", currentId = null, startInSearch = false, strips = null, onPick, onClose }) {
  const cands = useMemo(() => candidates.map((c) => (c && c.set !== undefined && c.cn !== undefined ? c : normPrinting(c))).filter((c) => c && c.id), [candidates]);
  const [mode, setMode] = useState(startInSearch ? "search" : cands.length ? "cand" : oracleId ? "all" : "search");
  const [oid, setOid] = useState(oracleId || cands.find((c) => c.oracle_id)?.oracle_id || null);
  const [plang, setPlang] = useState(lang || "");
  const [all, setAll] = useState(null);
  const [q, setQ] = useState("");
  const dq = useDebounced(q.trim(), 300);
  const [hits, setHits] = useState(null);
  const [error, setError] = useState(null);
  const candDiff = useMemo(() => printingDiff(cands), [cands]);
  // Only the 2015 frame puts the collector line in the strip's upper-left
  // corner; for older frames (info at the centre/right) start with the whole strip.
  const stripZoom = cands.length && cands.every((c) => c.frame && c.frame !== "2015" && c.frame !== "future") ? 1 : 2;
  const allDiff = useMemo(() => printingDiff(all || []), [all]);

  useEffect(() => {
    if (mode !== "all" || !oid) return;
    let alive = true;
    setAll(null); setError(null);
    const params = new URLSearchParams({ oracle_id: oid });
    if (plang) params.set("lang", plang);
    api(`/api/printings?${params}`)
      .then((d) => { if (alive) setAll(asList(d, "printings", "rows").map(normPrinting).filter((p) => p && p.id)); })
      .catch((e) => { if (alive) setError(e.message); });
    return () => { alive = false; };
  }, [mode, oid, plang]);

  useEffect(() => {
    if (mode !== "search" || dq.length < 2) { setHits(null); return; }
    let alive = true;
    setError(null);
    const params = new URLSearchParams({ q: dq });
    if (plang) params.set("lang", plang);
    api(`/api/printings/search?${params}`)
      .then((d) => { if (alive) setHits(asList(d, "results", "rows", "printings")); })
      .catch((e) => { if (alive) setError(e.message); });
    return () => { alive = false; };
  }, [mode, dq, plang]);

  const langSelect = (
    <select className="select" style={{ width: "auto" }} aria-label="Language filter" value={plang} onChange={(e) => setPlang(e.target.value)}>
      <option value="">All languages</option>
      {SCAN_LANGS.map(([k, label]) => <option key={k} value={k}>{label}</option>)}
    </select>
  );

  return (
    <Sheet title={title} onClose={onClose} pinned={strips && strips.length ? <ScanStrip srcs={strips} startZoom={stripZoom} /> : null}>
      <div className="stack">
        <div className="row">
          <div className="segmented" role="group" aria-label="Show">
            {cands.length > 0 && <button type="button" aria-pressed={mode === "cand"} onClick={() => setMode("cand")}>Candidates ({cands.length})</button>}
            {oid && <button type="button" aria-pressed={mode === "all"} onClick={() => setMode("all")}>All printings</button>}
            <button type="button" aria-pressed={mode === "search"} onClick={() => setMode("search")}><Icon.search /> Name</button>
          </div>
          {mode !== "cand" && langSelect}
        </div>
        <ErrorNotice error={error} />
        {mode === "cand" && (
          <div className="pick-grid">{cands.map((p) => <PickTile key={p.id} p={p} diff={candDiff} current={p.id === currentId} onPick={onPick} />)}</div>
        )}
        {mode === "all" && (!all ? (!error && <Spinner />) : all.length === 0
          ? <p className="muted">No printings found{plang ? " in this language" : ""}.</p>
          : <div className="pick-grid">{all.map((p) => <PickTile key={p.id} p={p} diff={allDiff} current={p.id === currentId} onPick={onPick} />)}</div>)}
        {mode === "search" && (
          <div className="stack">
            <div className="search">
              <Icon.search />
              <label htmlFor="pick-q" className="sr-only">Card name</label>
              <input id="pick-q" className="input" type="search" autoFocus autoComplete="off" autoCorrect="off" spellCheck="false"
                placeholder="Card name (any language)…" value={q} onChange={(e) => setQ(e.target.value)} />
            </div>
            {hits && hits.length === 0 && <p className="muted">No card matches “{dq}”.</p>}
            {hits && hits.length > 0 && (
              <div className="hit-list">
                {hits.map((h, i) => (
                  <button key={`${h.id || h.oracle_id}-${i}`} type="button" className="hit"
                    onClick={() => { setOid(h.oracle_id); if (h.lang && !plang) setPlang(h.lang); setMode("all"); }}>
                    <span><b>{h.printed_name || h.name}</b>{h.printed_name && h.printed_name !== h.name && <span className="muted small"> · {h.name}</span>}</span>
                    {h.lang && <span className="badge">{String(h.lang).toUpperCase()}</span>}
                  </button>
                ))}
              </div>
            )}
          </div>
        )}
      </div>
    </Sheet>
  );
}

// ---------------------------------------------------------------------------
// Commit sheet: add staged scans to a binder or a deck

function CommitSheet({ ids, onClose, onDone }) {
  const saved = store.get("mtg.scan.target", {}) || {};
  const [type, setType] = useState(saved.type === "deck" ? "deck" : "binder");
  const [binders, setBinders] = useState(null);
  const [decks, setDecks] = useState(null);
  const [binder, setBinder] = useState(saved.type === "binder" && saved.name ? saved.name : "");
  const [newBinder, setNewBinder] = useState("");
  const [deckId, setDeckId] = useState(saved.type === "deck" && saved.id ? String(saved.id) : "");
  const [newDeck, setNewDeck] = useState({ name: "", format: "commander" });
  const [board, setBoard] = useState(saved.board || "main");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);

  useEffect(() => {
    api("/api/binders").then((d) => {
      // The unnamed bucket ("no binder") can't be a target: scans always go into a named binder.
      const list = asList(d, "binders").filter((x) => x.name);
      setBinders(list);
      setBinder((b) => (b && (b === "__new" || list.some((x) => x.name === b)) ? b : list[0]?.name || "__new"));
    }).catch(() => { setBinders([]); setBinder("__new"); });
    api("/api/decks").then((d) => {
      // Decks synced from ManaBox are rebuilt by the next replace import: not a target.
      const list = asList(d, "decks").filter((dk) => dk.source !== "manabox");
      setDecks(list);
      setDeckId((x) => (x && (x === "__new" || list.some((dk) => String(dk.id) === x)) ? x : list[0] ? String(list[0].id) : "__new"));
    }).catch(() => { setDecks([]); setDeckId("__new"); });
  }, []);

  let target = null, label = "";
  if (type === "binder") {
    const name = binder === "__new" ? newBinder.trim() : binder;
    if (name) { target = { type: "binder", name, create: binder === "__new" }; label = `binder “${name}”`; }
  } else if (deckId === "__new") {
    if (newDeck.name.trim()) { target = { type: "deck", name: newDeck.name.trim(), create: true, format: newDeck.format, board }; label = `new deck “${newDeck.name.trim()}”`; }
  } else if (deckId) {
    const dk = decks?.find((d) => String(d.id) === deckId);
    target = { type: "deck", id: Number(deckId), board };
    label = `deck “${dk?.name || deckId}”`;
  }

  const submit = async (e) => {
    e.preventDefault();
    if (!target || busy) return;
    setBusy(true); setError(null);
    try {
      const res = await api("/api/scans/commit", { method: "POST", json: { ids, target } });
      const resTarget = res?.target || {};
      store.set("mtg.scan.target", target.type === "binder"
        ? { type: "binder", name: target.name }
        : { type: "deck", id: resTarget.id ?? target.id ?? null, board });
      onDone(res, label);
    } catch (err) {
      setError(err.message);
    } finally {
      setBusy(false);
    }
  };

  return (
    <Sheet title={`Add ${plural(ids.length, "scan")} to…`} onClose={onClose}>
      <form className="stack" onSubmit={submit}>
        <div className="segmented" role="group" aria-label="Destination">
          <button type="button" aria-pressed={type === "binder"} onClick={() => setType("binder")}><Icon.collection /> Binder</button>
          <button type="button" aria-pressed={type === "deck"} onClick={() => setType("deck")}><Icon.decks /> Deck</button>
        </div>
        {type === "binder" && (
          <fieldset className="stack" style={{ border: 0, padding: 0, margin: 0 }}>
            <legend className="label" style={{ marginBottom: 8 }}>Binder (collection)</legend>
            {!binders && <Spinner />}
            {binders?.map((b) => (
              <label key={b.name} className="radio-card">
                <input type="radio" name="binder" checked={binder === b.name} onChange={() => setBinder(b.name)} />
                <span className="grow"><b>{b.name}</b><br /><span className="small muted">{plural(b.copies ?? b.cards ?? 0, "copy", "copies")}{b.sources ? ` · ${[].concat(b.sources).join(", ")}` : ""}</span></span>
              </label>
            ))}
            <label className="radio-card">
              <input type="radio" name="binder" checked={binder === "__new"} onChange={() => setBinder("__new")} />
              <span className="grow"><b>New binder…</b></span>
            </label>
            {binder === "__new" && (
              <input className="input" style={{ fontSize: 16 }} aria-label="New binder name" placeholder="New binder name, e.g. Trade binder" maxLength={100} autoFocus
                value={newBinder} onChange={(e) => setNewBinder(e.target.value)} />
            )}
          </fieldset>
        )}
        {type === "deck" && (
          <div className="stack">
            <div className="field">
              <label htmlFor="commit-deck">Deck</label>
              <select id="commit-deck" className="select" value={deckId} onChange={(e) => setDeckId(e.target.value)}>
                {decks?.map((d) => <option key={d.id} value={String(d.id)}>{d.name}{d.format ? ` (${d.format})` : ""}</option>)}
                <option value="__new">New deck…</option>
              </select>
            </div>
            {deckId === "__new" && (
              <div className="row" style={{ alignItems: "flex-end" }}>
                <div className="field grow" style={{ flexBasis: 200 }}>
                  <label htmlFor="commit-deck-name">Deck name</label>
                  <input id="commit-deck-name" className="input" required maxLength={200} value={newDeck.name} onChange={(e) => setNewDeck({ ...newDeck, name: e.target.value })} />
                </div>
                <div className="field" style={{ flexBasis: 150, flexGrow: 1 }}>
                  <label htmlFor="commit-deck-format">Format</label>
                  <select id="commit-deck-format" className="select" value={newDeck.format} onChange={(e) => setNewDeck({ ...newDeck, format: e.target.value })}>
                    {FORMATS.map((f) => <option key={f} value={f}>{cap(f)}</option>)}
                  </select>
                </div>
              </div>
            )}
            <div className="field">
              <label htmlFor="commit-board">Board</label>
              <select id="commit-board" className="select" value={board} onChange={(e) => setBoard(e.target.value)}>
                {BOARDS.map(([k, l]) => <option key={k} value={k}>{l}</option>)}
              </select>
            </div>
            <p className="small muted" style={{ margin: 0 }}>Deck cards are added to the deck list; they don't change your binders.</p>
          </div>
        )}
        <ErrorNotice error={error} />
        <button type="submit" className="btn primary" disabled={!target || busy}>
          {busy ? <><span className="spinner" aria-hidden="true" style={{ borderTopColor: "var(--accent-ink)" }} /> Adding…</> : <><Icon.check /> Add {plural(ids.length, "scan")}{label ? ` to ${label}` : ""}</>}
        </button>
      </form>
    </Sheet>
  );
}

// ---------------------------------------------------------------------------
// Calibration: confirm or correct the truth for each scan

// No finish is pre-selected (beta.1: the detected finish was pre-selected and 6 of 25 foil truths were
// saved as non-foil), and "Wrong: pick the printing" offers every finish, not just the wrong printing's.
// "Not a card / discard" deletes the staged scan; "Later" keeps it unconfirmed.
function TruthSheet({ entry, onClose, onDone, onPickNeeded, onDiscard }) {
  const { scan, result, preview } = entry;
  const detected = normPrinting(result?.printing || scan?.printing || (scan ? { ...scan, id: scan.printing_id } : null));
  const [finish, setFinish] = useState(null);
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);
  const confirm = async (printingId) => {
    if (!scan?.id || !printingId || !finish) return;
    setBusy(true); setError(null);
    try {
      await api(`/api/scans/${scan.id}/truth`, { method: "POST", json: { printing_id: printingId, finish } });
      onDone(`Truth saved for scan #${scan.id}`);
    } catch (e) { setError(e.message); } finally { setBusy(false); }
  };
  const fits = Boolean(finish && scan && scanFinishes(scan).includes(finish));
  return (
    <Sheet title="Calibration: is this right?" onClose={onClose}>
      <div className="stack">
        <div className="truth">
          <figure>{preview ? <img src={preview} alt="Your capture" /> : <div className="ph" />}<figcaption>Your capture</figcaption></figure>
          <figure>
            {detected?.img ? <img src={detected.img} alt={detected.name} /> : <div className="pick"><span className="ph">{detected?.name || "No match"}</span></div>}
            <figcaption>{detected ? `${detected.name} · ${printingLabel(detected)}` : `Identification: ${result?.status || "failed"}`}</figcaption>
          </figure>
        </div>
        <div className="row">
          <span className="label" id="truth-finish">Finish of your card</span>
          <div className="segmented" role="group" aria-labelledby="truth-finish">
            {["nonfoil", "foil", "etched"].map((f) => <button key={f} type="button" aria-pressed={finish === f} onClick={() => setFinish(f)}>{FINISH_LABEL[f]}</button>)}
          </div>
        </div>
        {!finish && <span className="small muted">Tap the finish first (look for the shine, or ★ vs • on the collector line).</span>}
        {finish && scan?.id && detected?.id && !fits && <span className="small muted">This printing has no {FINISH_LABEL[finish]} version: pick the right printing.</span>}
        <ErrorNotice error={error} />
        {!scan?.id && <div className="notice warn"><div className="grow">This scan was not staged. Pick the right printing to stage it and record the truth.</div></div>}
        <div className="row">
          {scan?.id && detected?.id && <button type="button" className="btn primary" disabled={busy || !fits} onClick={() => confirm(detected.id)}><Icon.check /> Correct</button>}
          <button type="button" className="btn" disabled={busy || !finish} onClick={() => onPickNeeded(finish)}>Wrong: pick the printing</button>
        </div>
        <div className="row">
          {scan?.id && onDiscard && <button type="button" className="btn danger" disabled={busy} onClick={() => onDiscard(scan)}><Icon.trash /> Not a card / discard</button>}
          <button type="button" className="btn ghost" onClick={onClose} title="Keep the scan unconfirmed">Later</button>
        </div>
        <p className="small muted" style={{ margin: 0 }}>Pick the exact printing <b>in the language printed on the card</b>. The scores and OCR output of this scan are kept to tune the scanner thresholds.</p>
      </div>
    </Sheet>
  );
}

// ---------------------------------------------------------------------------
// Staged scan row

function ScanRow({ s, status, selected, onSelect, onPatch, onDelete, onIncrement, onPick, onConfirm }) {
  const p = normPrinting({ ...s, id: s.store_printing_id || s.printing_id });
  const fins = scanFinishes(s);
  const finish = normFinish(s.finish);
  const nextFinish = fins[(fins.indexOf(finish) + 1) % fins.length];
  const variants = jsonArr(s.variants);
  const qty = s.quantity ?? 1;
  const thumb = scanThumb(s);
  const ld = (s.lang_detected || "").toUpperCase(), ls = (s.store_lang || "").toUpperCase();
  return (
    <div className={`scan-row st-${status}`} aria-selected={selected}>
      <label className="sel"><input type="checkbox" checked={selected} onChange={(e) => onSelect(e.target.checked)} aria-label={`Select ${s.name || "scan"}`} /></label>
      <button type="button" className="thb" onClick={onPick} aria-label={`Change printing of ${s.name || "scan"}`}>
        {thumb ? <img className="th" src={thumb} alt="" loading="lazy" decoding="async" /> : <span className="th" />}
      </button>
      <div className="info">
        <div className="top">
          <span className="nm" title={s.name}>{s.name || "Unidentified card"}</span>
          <span className={`badge st-chip ${status}`}>{status === "auto" && s.match_status === "confirmed" ? "✓ confirmed" : STATUS_LABEL[status] || status}</span>
        </div>
        <div className="sub">
          {s.set_code && <span>{String(s.set_code).toUpperCase()} #{s.collector_number}</span>}
          {ld && ls && ld !== ls
            ? <span className="badge" title="Detected language → stored language">{`${ld}→${ls}`}</span>
            : <LangTag lang={ls || ld} />}
          {s.method && <span className="muted">{s.method}{typeof s.confidence === "number" ? ` ${Math.round(s.confidence * 100)}%` : ""}</span>}
          {"price_eur" in s && <span className="scan-price" title="EUR price of the stored printing and finish (each copy)">{s.price_eur == null ? "no price" : fmtEur(s.price_eur)}</span>}
        </div>
      </div>
      <div className="ctrls">
        <div className="stepper" role="group" aria-label="Quantity">
          <button type="button" aria-label="One less" disabled={qty <= 1} onClick={() => onPatch({ quantity: qty - 1 })}><Icon.minus /></button>
          <output aria-live="polite">{qty}</output>
          <button type="button" aria-label="One more" onClick={onIncrement}><Icon.plus /></button>
        </div>
        <button type="button" className={`btn sm finish-btn ${finish}${finishGuessed(s) ? " finish-q" : ""}`} disabled={fins.length < 2}
          title={fins.length < 2 ? `Only printed ${FINISH_LABEL[finish] || finish}` : `${finishGuessed(s) ? "Not read from the card (session setting). " : ""}Switch to ${FINISH_LABEL[nextFinish]}`}
          onClick={() => onPatch({ finish: nextFinish })}>{finish !== "nonfoil" && "✦ "}{FINISH_LABEL[finish] || finish}{finishGuessed(s) ? "?" : ""}</button>
        <select className="select" aria-label="Condition" value={s.condition || "near_mint"} onChange={(e) => onPatch({ condition: e.target.value })}>
          {CONDITIONS.map(([k, , short]) => <option key={k} value={k}>{short}</option>)}
        </select>
        <select className="select" aria-label="Store as language" value={s.store_lang || "en"} onChange={(e) => onPatch({ store_lang: e.target.value })}>
          {SCAN_LANGS.map(([k]) => <option key={k} value={k}>{k.toUpperCase()}</option>)}
        </select>
        {status === "suggest" && <button type="button" className="btn sm" onClick={onConfirm}><Icon.check /> Confirm</button>}
        {(status === "review" || status === "failed") && <button type="button" className="btn sm danger" onClick={onPick}>Pick printing</button>}
        {variants.length > 0 && <button type="button" className="chip" onClick={onPick} title="Promo / List / other printings share this collector number">variant?</button>}
        <button type="button" className="btn ghost icon sm" aria-label={`Delete ${s.name || "scan"}`} onClick={onDelete} style={{ marginLeft: "auto" }}><Icon.trash /></button>
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------------
// Scan tab

// A discarded scan stays restorable this long ("Undo" in the toast); then it is deleted.
const DISCARD_UNDO_MS = 6000;
// A probe answer that takes longer is given up (the next still frame probes again).
const PROBE_TIMEOUT_MS = 30000;
const newProbeSession = () => `p-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;

function ScanTab({ active, health, onCommitted }) {
  const [lib, setLib] = useState(null);
  const [libError, setLibError] = useState(null);
  const [settings, setSettings] = useState(() => ({ ...SCAN_DEFAULTS, ...(store.get("mtg.scan.settings", {}) || {}) }));
  // One-time notice for users whose saved setting is the old default "Store as English".
  const [langNotice, setLangNotice] = useState(() => (store.get("mtg.scan.settings", {}) || {}).storageLang === "en" && !store.get("mtg.scan.langNoticeSeen", false));
  const closeLangNotice = () => { store.set("mtg.scan.langNoticeSeen", true); setLangNotice(false); };
  const [scans, setScans] = useState(null);
  const [scanTotals, setScanTotals] = useState(null); // GET /api/scans totals.staged (fallback for rows without price_eur)
  const [listError, setListError] = useState(null);
  const [busy, setBusy] = useState(false);
  const busyRef = useRef(false);
  const cancelRef = useRef(null); // aborts the scan request in flight
  // A scan that takes long: {since, warming} (warming = the server's fingerprint matcher is still loading).
  const [slow, setSlow] = useState(null);
  const [last, setLast] = useState(null); // {kind, scan, result, payload, preview, error, timeout, probe}
  const [sheet, setSheet] = useState(null);
  const [selected, setSelected] = useState(() => new Set());
  const [toast, setToast] = useState(null);
  const [flash, setFlash] = useState(null);
  const [statusById, setStatusById] = useState({});
  const settingsRef = useRef(settings);
  settingsRef.current = settings;
  const replaceRef = useRef(null);
  // Scanner: capture.js module, the ProbeController (shared with CameraView), the detector
  // analyzer, the upload queue (shutter scans and resends), the probe session id.
  const [capMod, setCapMod] = useState(null);
  const probeRef = useRef(null);
  const detRef = useRef(null);
  const queueRef = useRef(null);
  const probeSessionRef = useRef(newProbeSession());
  const handlers = useRef({}); // the queue's callbacks, refreshed every render
  const [queued, setQueued] = useState(0);
  const [busyPreview, setBusyPreview] = useState(null);
  const [sound, setSoundState] = useState(loadSoundSettings);
  const soundRef = useRef(sound);
  soundRef.current = sound;
  const soundsRef = useRef(null); // scanlib createScanSounds()
  const priceRef = useRef(new Map()); // scan id → price_eur (sound for +1)
  const [rec, setRec] = useState(null); // record session {session, startedAt}
  const recStatsRef = useRef(null); // {session, frames, bytes, errors, full}: RecordStatus polls it (no tab re-render per frame)
  // Discarded rows waiting for their delete: id → timer (hidden from the list until then).
  const discardsRef = useRef(new Map());
  const [discarding, setDiscarding] = useState(() => new Set());
  // Auto-ask Claude for hard cards (public/autoask.js): per-device setting autoClaude; off when the
  // server has no Claude or SCAN_CLAUDE_PER_HOUR is 0 (/healthz scanner.vision).
  const autoAskRef = useRef(null);
  const visionOkRef = useRef(true);
  visionOkRef.current = health?.claude_configured !== false && health?.scanner?.vision?.configured !== false && health?.scanner?.vision?.per_hour !== 0;

  useEffect(() => {
    if (!active || lib) return;
    let alive = true;
    Promise.all([import("./scanlib.js"), import("./capture.js")])
      .then(([m, c]) => {
        if (!alive) return;
        try { soundsRef.current = m.createScanSounds ? m.createScanSounds() : null; } catch { soundsRef.current = null; }
        setCapMod(c);
        setLib(m);
      })
      .catch((e) => { if (alive) setLibError(`Could not load the scanner: ${e.message}`); });
    // The auto-ask module is optional: without it the scanner works as before (shutter only).
    import("./autoask.js")
      .then((a) => {
        if (autoAskRef.current) return;
        autoAskRef.current = new a.AutoAsk({ enabled: () => settingsRef.current.autoClaude !== false && visionOkRef.current });
      })
      .catch(() => {});
    return () => { alive = false; };
  }, [active, lib]);

  const pushItem = useCallback((item) => {
    const q = queueRef.current;
    if (!item || !q) return;
    q.push(item);
    setQueued(q.length);
  }, []);

  useEffect(() => {
    if (!capMod) return;
    const q = new capMod.UploadQueue({
      send: (item) => handlers.current.send(item),
      onResult: (item, res) => handlers.current.onResult(item, res),
      onError: (item, err) => handlers.current.onError(item, err),
      onGiveUp: (item, err) => handlers.current.onGiveUp(item, err),
    });
    queueRef.current = q;
    return () => { if (queueRef.current === q) queueRef.current = null; };
  }, [capMod]);

  // One probe controller; field-test overrides from mtg.scan.capture / ?scancfg= (validated by probeConfig).
  useEffect(() => {
    if (!capMod?.ProbeController) return;
    const pc = new capMod.ProbeController({ cfg: readCaptureOverrides() });
    if (pc.ignored?.length) console.warn(`Scanner: ignored probe overrides ${pc.ignored.join(", ")}`);
    probeRef.current = pc;
  }, [capMod]);

  // Record session: auto-off after RECORD_MAX_MS (the elapsed time ticks inside RecordStatus).
  useEffect(() => {
    if (!rec) return;
    const t = setTimeout(() => {
      setRec(null);
      setToast({ text: "Recording stopped after 15 minutes." });
    }, Math.max(0, rec.startedAt + RECORD_MAX_MS - Date.now()));
    return () => clearTimeout(t);
  }, [rec?.session, rec?.startedAt]); // eslint-disable-line react-hooks/exhaustive-deps

  const setSetting = (k, v) => setSettings((s) => { const n = { ...s, [k]: v }; store.set("mtg.scan.settings", n); return n; });
  const setSound = (k, v) => setSoundState((s) => { const n = { ...s, [k]: v }; store.set("mtg.scan.sound", n); return n; });
  const unlockSounds = () => { try { soundsRef.current?.unlock?.()?.catch?.(() => {}); } catch { /* no audio */ } };

  const loadScans = useCallback(async () => {
    try {
      const d = await api("/api/scans?status=staged");
      const list = asList(d, "scans", "rows").slice().sort((a, b) => (b.id ?? 0) - (a.id ?? 0));
      setScans(list);
      setScanTotals(d && !Array.isArray(d) ? d.totals?.staged ?? null : null);
      setListError(null);
      setSelected((sel) => new Set([...sel].filter((id) => list.some((s) => s.id === id))));
    } catch (e) {
      setListError(e.status === 404 ? "The scanner is not available on this server (update the app)." : `Could not load scans: ${e.message}`);
      setScans((s) => s || []);
    }
  }, []);
  useEffect(() => { if (active) loadScans(); }, [active, loadScans]);

  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(null), toast.ms || 4000);
    return () => clearTimeout(t);
  }, [toast]);

  const statusOf = useCallback((s) => {
    if (!s) return "failed";
    if (statusById[s.id]) return statusById[s.id];
    const raw = s.result_status || s.identify_status || s.decision || s.status;
    if (["auto", "suggest", "review", "failed"].includes(raw)) return raw;
    if (!s.printing_id && !s.store_printing_id) return "review";
    return "auto";
  }, [statusById]);
  const markStatus = (id, st) => setStatusById((m) => ({ ...m, [id]: st }));
  // Scanning on settles the session's earlier "? confirm" rows (server: lib/scans.js confirmImplicitly);
  // their chips turn "✓ confirmed", a short toast says so (never over another toast). No extra taps.
  const noteConfirmed = (list) => {
    if (!Array.isArray(list) || !list.length) return;
    setStatusById((m) => { const n = { ...m }; for (const c of list) if (c?.id) n[c.id] = "auto"; return n; });
    setToast((t) => t || { text: list.length === 1 ? `✓ ${list[0].name || "Previous card"} confirmed` : `✓ ${list.length} cards confirmed`, ms: 2500 });
  };

  // kind: a scan status (auto|suggest|review|failed|duplicate|error) or "increment" (+1);
  // res: the /api/scan answer {scan, duplicate, result}, or {increment:true, price_eur} for +1.
  // scanlib's chooseScanSound picks success, cash (price ≥ threshold) or nothing.
  const feedback = (kind, res = null) => {
    try {
      const snd = res ? lib?.chooseScanSound?.(res, soundRef.current) : null;
      if (snd) soundsRef.current?.play?.(snd);
    } catch { /* never block scanning on audio */ }
    vibrate(kind);
    setFlash({ color: STATUS_COLOR[kind === "increment" ? "auto" : kind] || "#ffffff", until: Date.now() + 900 });
  };

  const showError = (msg) => setToast({ text: msg, ms: 5000 });

  // ifIdle: opened by an arriving result (queued shutter / auto-ask scans can take up to 90 s), not by a
  // tap: never replace a sheet the user has open (a pick, Add by name, the commit sheet); the row
  // stays in the list with its pick action.
  function openPickerFor(scan, result, { truthFinish = null, payload = null, ifIdle = false } = {}) {
    // The user's own collector line: the server's stored strip, else the local capture.
    const strips = [];
    if (scan?.id && scan.has_strip !== false) strips.push(scanFileUrl(scan, "strip"));
    if (payload?.strip) strips.push(`data:image/jpeg;base64,${payload.strip}`);
    const cands = [...candidatesOf(result, scan), ...jsonArr(result?.variants || scan?.variants).map(normPrinting)]
      .filter((p, i, a) => p && p.id && a.findIndex((x) => x.id === p.id) === i);
    const pick = {
      type: "pick", scan, candidates: cands, truthFinish, strips,
      oracleId: scan?.oracle_id || result?.printing?.oracle_id || cands[0]?.oracle_id || null,
      lang: scan?.lang_detected || result?.lang_detected || "",
    };
    setSheet((sh) => (ifIdle && sh ? sh : pick));
  }

  // Discard (result card, calibration sheet, staged list): the row disappears at once and is deleted
  // after DISCARD_UNDO_MS unless the toast's Undo brings it back. Leaving the tab or committing deletes
