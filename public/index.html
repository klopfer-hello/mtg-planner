<!doctype html>

<style>
/* ==========================================================================
   Theme tokens (light default, dark via prefers-color-scheme)
   ========================================================================== */
:root {
  color-scheme: light dark;
  --bg: #f6f5f2;
  --surface: #ffffff;
  --surface-2: #efede8;
  --surface-3: #e4e1da;
  --text: #1d1b18;
  --muted: #6b665e;
  --border: #dcd8d0;
  --accent: #5b3fd1;
  --accent-hover: #4a30b8;
  --accent-ink: #ffffff;
  --accent-soft: #ece8fb;
  --ok: #1f7a3d;
  --ok-soft: #e1f2e6;
  --bad: #b42318;
  --bad-soft: #fdeceb;
  --warn: #8a5a00;
  --warn-soft: #fcf1d8;
  --overlay: rgba(20, 18, 15, 0.45);
  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 14px rgba(0,0,0,.06);
  --shadow-lg: 0 10px 40px rgba(0,0,0,.22);
  --radius: 12px;
  --radius-sm: 8px;
  --tabbar-h: 64px;
  --header-h: 52px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121214;
    --surface: #1c1c20;
    --surface-2: #26262c;
    --surface-3: #313139;
    --text: #ececef;
    --muted: #a09fa8;
    --border: #36363e;
    --accent: #a38bff;
    --accent-hover: #b8a5ff;
    --accent-ink: #15102a;
    --accent-soft: #2a2444;
    --ok: #62d18d;
    --ok-soft: #16301f;
    --bad: #ff8274;
    --bad-soft: #3a1b18;
    --warn: #f0c062;
    --warn-soft: #3a2d10;
    --overlay: rgba(0, 0, 0, 0.6);
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
    --shadow-lg: 0 10px 40px rgba(0,0,0,.6);
  }
}

/* ==========================================================================
   Base
   ========================================================================== */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.45 var(--font);
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}
img { max-width: 100%; }
a { color: var(--accent); }
h1, h2, h3, h4 { line-height: 1.2; margin: 0; }
h2 { font-size: 1.25rem; }
h3 { font-size: 1.05rem; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.nowrap { white-space: nowrap; }
.mono { font-family: var(--mono); font-size: .9em; }
code { font-family: var(--mono); font-size: .9em; background: var(--surface-2); padding: .1em .35em; border-radius: 5px; }

/* ==========================================================================
   Layout: header, navigation (bottom tab bar on mobile, top nav on desktop)
   ========================================================================== */
.app-header {
  position: sticky; top: 0; z-index: 30;
  height: calc(var(--header-h) + env(safe-area-inset-top));
  padding: env(safe-area-inset-top) 16px 0;
  display: flex; align-items: center; gap: 16px;
  /* Solid on mobile: a backdrop-filter would become the containing block of
     the position:fixed tab bar inside the header and pin it to the top. */
  background: var(--bg);
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.05rem; white-space: nowrap; }
.brand img { width: 28px; height: 28px; border-radius: 7px; }
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  display: grid; grid-template-columns: repeat(5, 1fr);
  height: calc(var(--tabbar-h) + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom);
  background: var(--surface);
  border-top: 1px solid var(--border);
}
.tab {
  appearance: none; border: 0; background: none; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  min-height: 44px; color: var(--muted); font-size: .72rem; font-weight: 600; letter-spacing: .01em;
}
.tab svg { width: 24px; height: 24px; }
.tab[aria-selected="true"] { color: var(--accent); }
.tab[aria-selected="true"] svg { transform: translateY(-1px); }
main {
  max-width: 1200px; margin: 0 auto; min-width: 0;
  padding: 16px 16px calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 24px);
}
/* Tab panels are plain blocks; keep them from growing to a child's min-content width. */
main > [role="tabpanel"] { min-width: 0; max-width: 100%; }
@media (min-width: 768px) {
  .tabbar {
    position: static; display: flex; gap: 4px; height: auto; padding: 0;
    background: none; border: 0; margin-left: auto;
  }
  .tab { flex-direction: row; gap: 8px; padding: 0 14px; border-radius: 10px; font-size: .92rem; }
  .tab svg { width: 20px; height: 20px; }
  .tab:hover { background: var(--surface-2); color: var(--text); }
  .tab[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); }
  .tab[aria-selected="true"] svg { transform: none; }
  main { padding: 24px 24px 48px; }
  :root { --header-h: 60px; --tabbar-h: 0px; }
  .app-header {
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: saturate(1.4) blur(10px);
    -webkit-backdrop-filter: saturate(1.4) blur(10px);
  }
}

/* ==========================================================================
   Controls
   ========================================================================== */
.btn {
  appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 16px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
  font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap;
  transition: background .12s, border-color .12s;
}
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.danger { color: var(--bad); }
.btn.danger:hover { background: var(--bad-soft); }
.btn.ghost { border-color: transparent; background: none; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.icon { padding: 0; width: 44px; }
label.btn:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn.disabled { opacity: .55; cursor: not-allowed; pointer-events: none; }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: .88rem; }
.btn svg { width: 20px; height: 20px; flex: none; }
.input, .select, .textarea {
  width: 100%; min-height: 44px; padding: 10px 12px;
  border: 1px solid var(--border); border-radius: 10px; background: var(--surface);
}
.input:focus, .select:focus, .textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.select { padding-right: 32px; }
.textarea { min-height: 160px; resize: vertical; font-family: var(--mono); font-size: .88rem; line-height: 1.5; }
.field { display: grid; gap: 6px; }
.field > label, .label { font-weight: 600; font-size: .88rem; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.grow { flex: 1 1 auto; min-width: 0; }
.stack { display: grid; gap: 12px; }
.stack-lg { display: grid; gap: 20px; }
.segmented { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--surface); }
.segmented button {
  appearance: none; border: 0; background: none; min-height: 42px; padding: 0 12px; cursor: pointer;
  font-weight: 600; font-size: .88rem; color: var(--muted); display: inline-flex; align-items: center; gap: 6px;
}
.segmented button + button { border-left: 1px solid var(--border); }
.segmented button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.segmented svg { width: 18px; height: 18px; }
.chip {
  appearance: none; display: inline-flex; align-items: center; gap: 6px;
  min-height: 36px; padding: 0 12px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--border); background: var(--surface); font-size: .85rem; font-weight: 600;
}
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.badge {
  display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px;
  font-size: .74rem; font-weight: 700; line-height: 1.6; background: var(--surface-2); color: var(--muted);
  white-space: nowrap;
}
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.bad { background: var(--bad-soft); color: var(--bad); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.accent { background: var(--accent-soft); color: var(--accent); }
.radio-card {
  display: flex; gap: 10px; align-items: flex-start; padding: 12px; min-height: 44px;
  border: 1px solid var(--border); border-radius: 10px; background: var(--surface); cursor: pointer;
}
.radio-card:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.radio-card input { margin: 3px 0 0; width: 18px; height: 18px; accent-color: var(--accent); flex: none; }

/* ==========================================================================
   Surfaces, notices, states
   ========================================================================== */
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px; box-shadow: var(--shadow);
}
.notice {
  display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px;
  border-radius: var(--radius-sm); background: var(--surface-2); font-size: .92rem;
}
.notice.error { background: var(--bad-soft); color: var(--bad); }
.notice.warn { background: var(--warn-soft); color: var(--warn); }
.notice.ok { background: var(--ok-soft); color: var(--ok); }
.notice .grow { overflow-wrap: anywhere; }
.notice .btn { min-height: 32px; padding: 0 10px; color: inherit; }
.empty { text-align: center; padding: 40px 16px; color: var(--muted); display: grid; gap: 12px; justify-items: center; }
.empty h3 { color: var(--text); }
.spinner {
  width: 20px; height: 20px; border-radius: 50%; flex: none;
  border: 3px solid var(--surface-3); border-top-color: var(--accent);
  animation: spin .8s linear infinite;
}
.spinner.lg { width: 32px; height: 32px; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 32px; color: var(--muted); }
.progress { height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; position: relative; }
.progress::after {
  content: ""; position: absolute; inset: 0; width: 35%; border-radius: 3px; background: var(--accent);
  animation: indeterminate 1.3s ease-in-out infinite;
}
@keyframes indeterminate { 0% { transform: translateX(-100%); } 100% { transform: translateX(290%); } }
@media (prefers-reduced-motion: reduce) {
  .spinner, .progress::after, .typing span { animation-duration: 3s; }
}
details > summary { cursor: pointer; list-style: none; }
details > summary::-webkit-details-marker { display: none; }
.disclosure > summary { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; font-weight: 600; font-size: .88rem; color: var(--muted); }
.disclosure > summary::before { content: "▸"; transition: transform .15s; }
.disclosure[open] > summary::before { transform: rotate(90deg); }

/* Mana / card symbols */
.sym { width: 1.05em; height: 1.05em; vertical-align: -0.16em; margin: 0 1px; display: inline-block; }
.mana { white-space: nowrap; display: inline-flex; align-items: center; flex-wrap: wrap; }
.mana .sym { width: 16px; height: 16px; }

/* ==========================================================================
   Collection
   ========================================================================== */
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; min-width: 0; }
.stat .v { font-size: 1.2rem; font-weight: 750; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stat .k { font-size: .76rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
@media (min-width: 640px) { .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.search { position: relative; }
.search svg { position: absolute; left: 12px; top: 50%; width: 20px; height: 20px; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search .input { padding-left: 40px; padding-right: 44px; font-size: 16px; }
.search .clear { position: absolute; right: 0; top: 0; }
.help-list { margin: 8px 0 0; padding-left: 20px; display: grid; gap: 2px; font-size: .88rem; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.toolbar .select { width: auto; min-width: 0; }
.result-count { font-size: .88rem; color: var(--muted); }
.grid {
  display: grid; gap: 10px;
  grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
}
@media (min-width: 640px) { .grid { grid-template-columns: repeat(auto-fill, minmax(146px, 1fr)); gap: 14px; } }
.tile {
  appearance: none; border: 0; padding: 0; background: none; cursor: pointer; text-align: left;
  display: grid; gap: 4px; min-width: 0; border-radius: 10px;
}
.tile .img {
  position: relative; aspect-ratio: 488 / 680; border-radius: 6% / 4.3%; overflow: hidden;
  background: var(--surface-2); box-shadow: var(--shadow);
}
.tile .img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tile .img .ph { position: absolute; inset: 0; display: grid; place-items: center; padding: 8px; text-align: center; font-size: .8rem; font-weight: 600; color: var(--muted); }
.tile .qty {
  position: absolute; right: 5px; bottom: 5px; min-width: 26px; height: 22px; padding: 0 6px;
  display: grid; place-items: center; border-radius: 11px; font-size: .78rem; font-weight: 800;
  background: rgba(15, 12, 30, .82); color: #fff;
}
.tile .foil {
  position: absolute; left: 5px; bottom: 5px; height: 22px; padding: 0 6px; border-radius: 11px;
  display: grid; place-items: center; font-size: .7rem; font-weight: 800;
  background: linear-gradient(120deg, #f9d976, #b4f1ff, #e2b6ff); color: #222;
}
.tile .cap { display: flex; justify-content: space-between; gap: 6px; font-size: .78rem; min-width: 0; padding: 0 2px; }
.tile .cap .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.tile .cap .p { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.tile:hover .img { box-shadow: 0 0 0 2px var(--accent), var(--shadow); }
.list { display: grid; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.list-row {
  appearance: none; border: 0; background: none; text-align: left; cursor: pointer; width: 100%;
  display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 4px 10px; align-items: center;
  min-height: 52px; padding: 8px 12px; border-top: 1px solid var(--border);
}
.list-row:first-child { border-top: 0; }
.list-row:hover { background: var(--surface-2); }
.list-row .q { font-weight: 800; font-variant-numeric: tabular-nums; color: var(--muted); }
.list-row .main { min-width: 0; display: grid; gap: 1px; }
.list-row .nm { display: flex; gap: 6px; align-items: center; min-width: 0; }
.list-row .nm b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.list-row .sub { font-size: .8rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list-row .end { text-align: right; display: grid; gap: 2px; justify-items: end; font-size: .85rem; font-variant-numeric: tabular-nums; }

/* ==========================================================================
   Sheet / dialog (bottom sheet on mobile, centered modal on desktop)
   ========================================================================== */
.overlay { position: fixed; inset: 0; z-index: 100; background: var(--overlay); display: flex; align-items: flex-end; justify-content: center; animation: fade .15s; }
.sheet {
  position: relative; width: 100%; max-height: 92vh; max-height: 92dvh; overflow: auto; overscroll-behavior: contain;
  background: var(--surface); border-radius: 18px 18px 0 0; box-shadow: var(--shadow-lg);
  padding: 8px 16px calc(24px + env(safe-area-inset-bottom)); animation: slideup .2s ease-out;
}
.sheet-head {
  position: sticky; top: -8px; z-index: 2; display: flex; align-items: center; gap: 8px;
  margin: -8px -16px 8px; padding: 8px 8px 8px 16px; background: var(--surface); border-bottom: 1px solid var(--border);
}
.sheet-head.has-pin { flex-wrap: wrap; }
.sheet-pin { flex: 1 0 100%; min-width: 0; padding: 0 8px 8px 0; }
.sheet-head h2 { flex: 1; min-width: 0; font-size: 1.1rem; overflow-wrap: anywhere; }
@keyframes fade { from { opacity: 0; } }
@keyframes slideup { from { transform: translateY(30px); opacity: .5; } }
@media (min-width: 768px) {
  .overlay { align-items: center; padding: 24px; }
  .sheet { max-width: 920px; border-radius: 18px; max-height: 88vh; padding-bottom: 24px; }
}
.card-detail { display: grid; gap: 16px; }
.card-detail .big { width: 100%; max-width: 340px; margin: 0 auto; border-radius: 4.75% / 3.5%; box-shadow: var(--shadow); display: block; aspect-ratio: 488 / 680; background: var(--surface-2); }
@media (min-width: 768px) {
  .card-detail { grid-template-columns: 320px minmax(0, 1fr); align-items: start; }
  .card-detail .big { position: sticky; top: 64px; }
}
.oracle { background: var(--surface-2); border-radius: var(--radius-sm); padding: 12px 14px; display: grid; gap: 8px; }
.oracle p { margin: 0; }
.oracle hr { border: 0; border-top: 1px dashed var(--border); margin: 2px 0; width: 100%; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: .9rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.legal { display: flex; flex-wrap: wrap; gap: 6px; }
.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-sm); }
table.t { width: 100%; border-collapse: collapse; font-size: .86rem; }
table.t th, table.t td { padding: 8px 10px; text-align: left; border-top: 1px solid var(--border); white-space: nowrap; }
table.t thead th { border-top: 0; background: var(--surface-2); font-size: .76rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
table.t td.num, table.t th.num { text-align: right; font-variant-numeric: tabular-nums; }
.linkbtn { appearance: none; border: 0; background: none; padding: 0; color: var(--accent); font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; min-height: 32px; text-align: left; }

/* ==========================================================================
   Decks
   ========================================================================== */
.deck-list { display: grid; gap: 10px; }
@media (min-width: 768px) { .deck-list { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); } }
.deck-item {
  appearance: none; text-align: left; cursor: pointer; width: 100%;
  display: grid; gap: 6px; padding: 14px 16px; min-height: 44px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow);
}
.deck-item:hover { border-color: var(--accent); }
.deck-item .t { font-weight: 700; font-size: 1.02rem; overflow-wrap: anywhere; }
.deck-head { display: grid; gap: 10px; }
.deck-head h2 { font-size: 1.4rem; overflow-wrap: anywhere; }
.board { display: grid; gap: 10px; }
.board > h3 { display: flex; align-items: baseline; gap: 8px; padding-top: 8px; }
.type-group { display: grid; gap: 4px; }
.type-group > h4 { font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 4px 2px; }
.deck-row {
  appearance: none; border: 0; background: none; width: 100%; text-align: left; cursor: pointer;
  display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 2px 10px; align-items: center;
  min-height: 48px; padding: 6px 10px; border-radius: var(--radius-sm);
}
.deck-row:hover { background: var(--surface-2); }
.deck-row:disabled { cursor: default; }
.deck-row:disabled:hover { background: none; }
.deck-row .q { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.deck-row .nm { min-width: 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.deck-row .nm b { font-weight: 600; overflow-wrap: anywhere; }
.deck-row .end { display: flex; align-items: center; gap: 8px; font-size: .85rem; font-variant-numeric: tabular-nums; }
.deck-row .end .price { color: var(--muted); min-width: 52px; text-align: right; }
.deck-section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px; display: grid; gap: 6px; }
.deck-line { display: grid; grid-template-columns: minmax(0, 1fr) 44px; align-items: center; min-width: 0; }
.deck-line .row-more { color: var(--muted); }
.value-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }

.cmd-suggest .chip svg, .chip svg { width: 18px; height: 18px; flex: none; }
@media (max-width: 359px) { .deck-row { padding: 6px 4px; gap: 2px 8px; } .deck-row .end .price { min-width: 0; } }
.cmd-suggest .chip { max-width: 100%; text-align: left; overflow-wrap: anywhere; height: auto; min-height: 40px; padding: 6px 12px; }
.action-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
.action-grid .btn { white-space: normal; text-align: center; line-height: 1.2; }
.card-actions-head { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 12px; align-items: start; }
.card-actions-head img, .card-actions-head .ph { width: 72px; aspect-ratio: 488 / 680; border-radius: 5px; background: var(--surface-2); display: block; }
.peek { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 12px; padding: 8px 10px 12px 48px; }
.peek img { width: 92px; border-radius: 5px; box-shadow: var(--shadow); }

/* ==========================================================================
   Planner (chat)
   ========================================================================== */
.planner { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; min-width: 0; }
@media (min-width: 960px) {
  .planner { grid-template-columns: 280px minmax(0, 1fr); align-items: start; }
  .planner .drawer-toggle { display: none; }
}
.chat-side {
  display: grid; gap: 8px; align-content: start;
}
@media (min-width: 960px) {
  .chat-side { position: sticky; top: calc(var(--header-h) + 24px); max-height: calc(100vh - var(--header-h) - 48px); overflow: auto; }
}
@media (max-width: 959px) {
  .chat-side {
    position: fixed; z-index: 90; top: 0; bottom: 0; left: 0; width: min(86vw, 340px);
    background: var(--surface); box-shadow: var(--shadow-lg); padding: calc(16px + env(safe-area-inset-top)) 12px 16px;
    overflow: auto; transform: translateX(-105%); transition: transform .2s ease-out; visibility: hidden;
  }
  .chat-side.open { transform: none; visibility: visible; }
  .drawer-backdrop { position: fixed; inset: 0; z-index: 85; background: var(--overlay); }
}
.chat-link {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; border-radius: 10px;
}
.chat-link > button:first-child {
  appearance: none; border: 0; background: none; text-align: left; cursor: pointer; min-height: 48px;
  padding: 6px 10px; border-radius: 10px; display: grid; gap: 1px; min-width: 0;
}
.chat-link > button:first-child span:first-child { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chat-link:hover { background: var(--surface-2); }
.chat-link[aria-current="true"] { background: var(--accent-soft); }
.chat-link[aria-current="true"] > button:first-child span:first-child { color: var(--accent); }
/* Every grid on the way from the page to a bubble gets an explicit minmax(0, 1fr)
   track: an implicit `auto` track sizes to the content's min-content width, so one
   long URL, code line or table would widen the whole column past the phone screen. */
.chat-main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; min-width: 0; }
.messages { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; min-width: 0; }
.msg { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; min-width: 0; }
.msg > * { min-width: 0; max-width: 100%; }
.msg.user { justify-items: end; }
/* word-break: break-word is the fallback for Safari < 15.4 (no overflow-wrap: anywhere). */
.bubble { max-width: min(100%, 720px); padding: 10px 14px; border-radius: 16px; word-break: break-word; overflow-wrap: anywhere; min-width: 0; }
.msg.user .bubble { background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 4px; white-space: pre-wrap; }
.msg.assistant .bubble { background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 4px; width: 100%; max-width: 100%; }
.msg .meta { font-size: .74rem; color: var(--muted); padding: 0 4px; display: flex; gap: 8px; flex-wrap: wrap; }
.tools { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.tool-chip {
  display: inline-flex; align-items: center; gap: 4px; max-width: 100%;
  padding: 3px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border);
  font-size: .76rem; color: var(--muted);
}
.tool-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.tool-chip b { color: var(--text); font-weight: 600; }
.typing { display: inline-flex; gap: 4px; padding: 6px 2px; }
.typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite both; }
.typing span:nth-child(2) { animation-delay: .2s; }
.typing span:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
.composer {
  position: sticky; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom)); z-index: 20;
  padding: 10px 0 12px; background: linear-gradient(to bottom, transparent, var(--bg) 14px);
}
@media (min-width: 768px) { .composer { bottom: 0; padding-bottom: 20px; } }
.composer form {
  display: flex; gap: 8px; align-items: flex-end; padding: 6px 6px 6px 14px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 22px; box-shadow: var(--shadow);
}

  flex: 1; min-width: 0; border: 0; outline: none; background: none; resize: none;

}

.suggestions { display: grid; gap: 8px; }
@media (min-width: 640px) { .suggestions { grid-template-columns: 1fr 1fr; } }
.suggestion {
  appearance: none; text-align: left; cursor: pointer; padding: 12px 14px; min-height: 44px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); font-size: .92rem;
}

/* Markdown from Claude */
.md { overflow-wrap: anywhere; word-break: break-word; min-width: 0; max-width: 100%; }
.md a { word-break: break-all; }
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md p, .md ul, .md ol, .md pre, .md blockquote, .md table { margin: .6em 0; }
.md ul, .md ol { padding-left: 1.4em; }
.md li + li { margin-top: .2em; }
.md h1, .md h2, .md h3, .md h4 { margin: 1em 0 .4em; font-size: 1.05rem; }
.md h1 { font-size: 1.2rem; }
.md pre {
  background: var(--surface-2); padding: 10px 12px; border-radius: var(--radius-sm);
  max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; white-space: pre; word-break: normal; overflow-wrap: normal;

.md blockquote { border-left: 3px solid var(--border); padding-left: 12px; color: var(--muted); margin-left: 0; }
/* Tables scroll inside the bubble (renderMarkdown wraps them in .md-table).
   Cells wrap at spaces only; short cells (.nw) stay on one line, longer ones
   (.wide) keep a readable width instead of one-letter columns. */
.md .md-table { max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; margin: .6em 0; }
.md .md-table table { margin: 0; }
.md table { border-collapse: collapse; font-size: .88rem; }
.md th, .md td { border: 1px solid var(--border); padding: 5px 9px; text-align: left; vertical-align: top; overflow-wrap: normal; word-break: normal; }
.md th.nw, .md td.nw { white-space: nowrap; }
.md th.wide, .md td.wide { min-width: 8.5em; }
.md li, .md p, .md blockquote, .md h1, .md h2, .md h3, .md h4 { min-width: 0; }
.md th { background: var(--surface-2); }
.md img:not(.sym) { max-width: min(240px, 100%); height: auto; border-radius: 8px; }
.md hr { border: 0; border-top: 1px solid var(--border); }

/* ==========================================================================
   Import
   ========================================================================== */
.file-drop {
  position: relative; display: grid; gap: 6px; justify-items: center; text-align: center; padding: 22px 16px; cursor: pointer;

}

.summary-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (min-width: 640px) { .summary-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
ol.steps { margin: 0; padding-left: 1.3em; display: grid; gap: 4px; }

.page-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

.footer-note { text-align: center; font-size: .78rem; color: var(--muted); padding-top: 8px; }

/* ==========================================================================
   Scanner
   ========================================================================== */
.scan { display: grid; gap: 16px; }
@media (min-width: 960px) {
  .scan { grid-template-columns: minmax(0, 1fr) minmax(380px, 460px); align-items: start; }
  .scan-side { position: sticky; top: calc(var(--header-h) + 24px); }

.cam {

/* "Same card again?" chip (scanner v2): one at a time, next to the result card */

  border: 1px solid var(--border); border-left: 6px solid var(--warn); background: var(--surface); box-shadow: var(--shadow);
}

.cam-btn {
  appearance: none; width: 48px; height: 48px; border-radius: 50%; border: 0; cursor: pointer;
  display: grid; place-items: center; background: rgba(0, 0, 0, .58); color: #fff;

.shutter {

  border: 4px solid #fff; background: rgba(255, 255, 255, .22); box-shadow: 0 2px 10px rgba(0, 0, 0, .4);

.scan-settings { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.result {
  display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 4px 12px; align-items: start;
  padding: 12px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface);
  border-left: 6px solid var(--border); box-shadow: var(--shadow);
}

  width: 100%; aspect-ratio: 488 / 680; border-radius: 5px; object-fit: cover; display: block; background: var(--surface-2);
}

.st-chip { font-weight: 800; }

.st-chip.review, .st-chip.failed { background: var(--bad-soft); color: var(--bad); }

.scan-list { display: grid; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.scan-row {
  display: grid; grid-template-columns: 28px 52px minmax(0, 1fr); gap: 6px 10px; align-items: start;
  padding: 10px 12px 10px 8px; border-top: 1px solid var(--border); border-left: 4px solid transparent;
}

.scan-row.st-suggest { border-left-color: var(--warn); }
.scan-row.st-review, .scan-row.st-failed { border-left-color: var(--bad); }
.scan-row[aria-selected="true"] { background: var(--accent-soft); }
.scan-row .sel { display: grid; place-items: center; min-height: 44px; cursor: pointer; }

.scan-row .info { display: grid; gap: 3px; min-width: 0; }

.scan-row .ctrls .select { width: auto; min-height: 36px; padding: 4px 26px 4px 8px; font-size: .85rem; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); flex: none; }
.stepper button { appearance: none; border: 0; background: none; width: 36px; height: 36px; cursor: pointer; display: grid; place-items: center; color: var(--text); }
.stepper button:disabled { opacity: .35; cursor: not-allowed; }

.stepper output { min-width: 26px; text-align: center; font-weight: 800; font-variant-numeric: tabular-nums; }
.finish-btn { min-height: 36px; padding: 0 10px; font-size: .82rem; }
.finish-btn.foil { background: linear-gradient(120deg, #f9d976, #b4f1ff, #e2b6ff); color: #222; border-color: transparent; }
.finish-btn.etched { background: linear-gradient(120deg, #d9d9d9, #f5f5f5, #bdbdbd); color: #222; border-color: transparent; }
.list-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.commit-bar {
  position: sticky; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 8px); z-index: 20;
  display: flex; gap: 8px; align-items: center; padding: 8px; border-radius: 14px;
  background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-lg);
}
@media (min-width: 768px) { .commit-bar { bottom: 12px; } }

.pick-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); }
@media (min-width: 640px) { .pick-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); } }
.pick {
  appearance: none; border: 2px solid transparent; background: none; padding: 4px; border-radius: 12px; cursor: pointer;
  display: grid; gap: 4px; text-align: left; min-width: 0; color: inherit;
}

.pick img, .pick .ph { width: 100%; aspect-ratio: 488 / 680; border-radius: 4.75% / 3.5%; background: var(--surface-2); display: block; object-fit: cover; }
.pick .ph { display: grid; place-items: center; padding: 8px; text-align: center; font-size: .8rem; color: var(--muted); }
.pick .cap { font-size: .78rem; display: grid; gap: 1px; min-width: 0; }
.pick .pcode {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 8px; min-width: 0;
  font-family: var(--mono); font-size: 1.15rem; font-weight: 800; letter-spacing: .02em; line-height: 1.25; overflow-wrap: anywhere;
}

.scan-strip { display: grid; gap: 4px; min-width: 0; }
.scan-strip .strip-box {
  position: relative; overflow: auto; max-height: 150px; border-radius: var(--radius-sm); background: #0b0b0d;
  border: 2px solid var(--accent); touch-action: pan-x pan-y; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
}

.scan-strip .strip-bar { display: flex; align-items: center; gap: 6px; font-size: .8rem; color: var(--muted); }

.sched { display: grid; gap: 6px; font-size: .88rem; padding: 10px 12px; border-radius: var(--radius-sm); background: var(--surface-2); }

.pick .cap b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hit-list { display: grid; }
.hit {
  appearance: none; border: 0; border-top: 1px solid var(--border); background: none; text-align: left; cursor: pointer;
  min-height: 48px; padding: 8px 10px; display: flex; gap: 8px; align-items: center; justify-content: space-between; color: inherit;
}

.truth { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.truth figcaption { font-size: .8rem; color: var(--muted); }
.truth img { width: 100%; aspect-ratio: 488 / 680; object-fit: cover; border-radius: 4.75% / 3.5%; background: var(--surface-2); }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 70; max-width: calc(100vw - 32px);
  bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 76px);
  display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 16px; border-radius: 14px;
  background: var(--text); color: var(--bg); box-shadow: var(--shadow-lg); font-weight: 600; font-size: .9rem;
}

@media (min-width: 768px) { .toast { bottom: 24px; } }

      {onDismiss && <button type="button" className="btn ghost icon sm" aria-label="Dismiss" onClick={onDismiss}><Icon.close /></button>}
    </div>
  );
}

const SOURCE_BADGE = { manabox: "warn", claude: "accent", manual: "", scan: "ok", app: "accent" };

/**
 * Modal sheet: bottom sheet on phones, centered dialog on desktop.
 * Handles Escape, focus trap, focus restore and background scroll lock.
 */
function Sheet({ title, onClose, children, actions, pinned }) {
  const ref = useRef(null);
  const titleId = useMemo(() => `sheet-${Math.random().toString(36).slice(2)}`, []);
  useEffect(() => {
    const prevFocus = document.activeElement;
    const prevOverflow = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    ref.current?.focus();
    const onKey = (e) => {
      if (e.key === "Escape") { e.stopPropagation(); onClose(); }
      if (e.key === "Tab" && ref.current) {
        const f = ref.current.querySelectorAll('a[href], button:not([disabled]), input, select, textarea, [tabindex]:not([tabindex="-1"])');
        if (!f.length) return;
        const first = f[0], last = f[f.length - 1];
        if (e.shiftKey && (document.activeElement === first || document.activeElement === ref.current)) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    };
    document.addEventListener("keydown", onKey);
    return () => {
      document.removeEventListener("keydown", onKey);
      document.body.style.overflow = prevOverflow;
      if (prevFocus && prevFocus.focus) prevFocus.focus({ preventScroll: true });
    };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);
  return (
    <div className="overlay" onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="sheet" role="dialog" aria-modal="true" aria-labelledby={titleId} tabIndex={-1} ref={ref}>
        <div className={`sheet-head${pinned ? " has-pin" : ""}`}>
          <h2 id={titleId}>{title}</h2>
          {actions}
          <button type="button" className="btn ghost icon" aria-label="Close" onClick={onClose}><Icon.close /></button>
          {pinned && <div className="sheet-pin">{pinned}</div>}
        </div>
        {children}
      </div>
    </div>
  );
}

/** "owned 1 · used in 3 decks (2 built) · 1 short" */
function CardUsage({ usage }) {
  if (!usage || typeof usage !== "object" || usage.owned == null) return null;
  const decks = asList(usage.decks);
  const ids = new Set(decks.map((d) => d.id ?? d.name));
  const built = new Set(decks.filter((d) => d.status === "built").map((d) => d.id ?? d.name));
  const available = usage.available ?? (usage.owned - (usage.built_demand ?? 0));
  return (
    <div className="usage-line" aria-label="Copies and decks">
      <span>owned <b>{fmtInt(usage.owned)}</b></span>
      {ids.size > 0 && <span className="muted">· used in {plural(ids.size, "deck")}{built.size ? ` (${fmtInt(built.size)} built)` : ""}</span>}
      {available < 0
        ? <span className="badge bad">{fmtInt(-available)} short</span>
        : usage.built_demand > 0 && <span className="badge ok">{fmtInt(available)} free</span>}
    </div>
  );
}

function CollectionTab({ dataVersion, onOpenCard, onGoImport, onGoScan, onChanged }) {
  const [q, setQ] = useState(() => store.get("mtg.q", ""));
  const dq = useDebounced(q.trim(), 300);
  const [group, setGroup] = useState(() => store.get("mtg.group", "card"));
  const [sort, setSort] = useState(() => store.get("mtg.sort", "name"));
  const [dir, setDir] = useState(() => store.get("mtg.dir", "asc"));
  const [view, setView] = useState(() => store.get("mtg.view", "grid"));
  // Exact binder filter: null = all, "" = Unsorted, else the binder's name.
  const [binder, setBinder] = useState(() => store.get("mtg.binder", null));
  const binderList = useBinderList(dataVersion);
  const [selecting, setSelecting] = useState(false);
  const [selected, setSelected] = useState(() => new Map()); // key -> {key, oracle_id, scryfall_id, name}
  const [sheet, setSheet] = useState(null); // "new" | "manage" | "move"
  const [toast, setToast] = useState(null);
  const [guarded, masterDialog] = useMasterConfirm();
  const [rows, setRows] = useState([]);
  const [total, setTotal] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const reqId = useRef(0);
  const loadingRef = useRef(false);
  const sentinel = useRef(null);

  useEffect(() => { store.set("mtg.q", q); }, [q]);
  useEffect(() => { store.set("mtg.group", group); store.set("mtg.sort", sort); store.set("mtg.dir", dir); store.set("mtg.view", view); }, [group, sort, dir, view]);
  useEffect(() => { store.set("mtg.binder", binder); }, [binder]);
  // A filter on a binder that no longer exists (renamed, deleted) falls back to all cards.
  useEffect(() => {
    const d = binderList.data;
    if (d && binder && !d.binders.some((b) => sameName(b.name, binder))) setBinder(null);
  }, [binderList.data, binder]);
  // Selection keys depend on the grouping and the binder scope.
  useEffect(() => { setSelected(new Map()); }, [group, binder]);
  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(null), 4000);
    return () => clearTimeout(t);
  }, [toast]);

  const load = useCallback(async (offset) => {
    const id = ++reqId.current;
    loadingRef.current = true;
    setLoading(true);
    setError(null);
    try {
      const params = new URLSearchParams({ q: dq, group, sort, dir, limit: String(PAGE_SIZE), offset: String(offset) });
      if (binder != null) params.set("binder", binder);
      const data = await api(`/api/collection?${params}`);
      if (id !== reqId.current) return;
      setTotal(data.total);
      setRows((prev) => (offset === 0 ? data.rows : [...prev, ...data.rows]));
    } catch (e) {
      if (id !== reqId.current) return;
      setError(e.status === 400 ? `Search error: ${e.message}` : e.message);
      if (offset === 0) { setRows([]); setTotal(null); }
    } finally {
      if (id === reqId.current) { loadingRef.current = false; setLoading(false); }
    }
  }, [dq, group, sort, dir, binder]);

  useEffect(() => { load(0); }, [load, dataVersion]);

  const hasMore = total != null && rows.length < total;
  // Infinite scroll: auto-load when the sentinel nears the viewport.
  useEffect(() => {
    const el = sentinel.current;
    if (!el || !hasMore || error || typeof IntersectionObserver === "undefined") return;
    const io = new IntersectionObserver((entries) => {
      if (entries.some((e) => e.isIntersecting) && !loadingRef.current) load(rows.length);
    }, { rootMargin: "600px 0px" });
    io.observe(el);
    return () => io.disconnect();
  }, [hasMore, rows.length, load, error]);

  const tokens = tokenize(q);
  const toggleFilter = (term) => {
    const lower = term.toLowerCase();
    const has = tokens.some((t) => t.toLowerCase() === lower);
    setQ(has ? tokens.filter((t) => t.toLowerCase() !== lower).join(" ") : [q.trim(), term].filter(Boolean).join(" "));
  };
  const changeSort = (s) => {
    setSort(s);
    setDir(SORTS.find(([k]) => k === s)?.[2] || "asc");
  };

  const emptyCollection = total === 0 && !dq && binder == null;
  const keyOf = (r) => (group === "card" ? r.oracle_id || r.scryfall_id : r.scryfall_id);
  const toggleRow = (r) => setSelected((m) => {
    const n = new Map(m);
    const k = keyOf(r);
    if (n.has(k)) n.delete(k); else n.set(k, { key: k, oracle_id: r.oracle_id, scryfall_id: r.scryfall_id, name: r.name });
    return n;
  });
  const allOnPage = rows.length > 0 && rows.every((r) => selected.has(keyOf(r)));
  const selectPage = () => setSelected((m) => {
    const n = new Map(m);
    if (allOnPage) for (const r of rows) n.delete(keyOf(r));
    else for (const r of rows) n.set(keyOf(r), { key: keyOf(r), oracle_id: r.oracle_id, scryfall_id: r.scryfall_id, name: r.name });
    return n;
  });
  const stopSelecting = () => { setSelecting(false); setSelected(new Map()); };
  const binderName = binder == null ? null : binder || UNSORTED;
  const afterChange = (text) => { if (text) setToast(text); binderList.reload(); onChanged?.(); };

  return (
    <div className="stack-lg">
      <StatsBar dataVersion={dataVersion} />

      <div className="stack">
        <form className="search" role="search" onSubmit={(e) => { e.preventDefault(); e.currentTarget.querySelector("input")?.blur(); }}>
          <Icon.search />
          <label htmlFor="collection-q" className="sr-only">Search your collection</label>
          <input id="collection-q" className="input" type="search" inputMode="search" enterKeyHint="search"
            autoComplete="off" autoCorrect="off" autoCapitalize="off" spellCheck="false"
            placeholder='Search… e.g. t:creature c:g cmc<=3' value={q} onChange={(e) => setQ(e.target.value)} />
          {q && <button type="button" className="btn ghost icon clear" aria-label="Clear search" onClick={() => setQ("")}><Icon.close /></button>}
        </form>
        <div className="chips" role="group" aria-label="Quick filters">
          {QUICK_FILTERS.map(([label, term]) => (

/** Move every copy of the selected cards (or only those in the filtered binder). */
function BulkMoveSheet({ items, group, binder, guarded, onClose, onDone }) {
  const [scoped, setScoped] = useState(binder != null);
  const what = plural(items.length, group === "card" ? "card" : "printing");
  return (
    <MoveSheet title={`Move ${what}`} exclude={scoped ? binder : null} submitLabel="Move" onClose={onClose}
      intro={<span className="small muted" style={{ overflowWrap: "anywhere" }}>{items.slice(0, 6).map((i) => i.name).join(", ")}{items.length > 6 ? ` and ${items.length - 6} more` : ""}</span>}
      onMove={async ({ to_binder, create }) => {
        const from = scoped && binder != null ? { from_binder: binder } : {};
        const list = items.map((i) => (group === "card" && i.oracle_id ? { oracle_id: i.oracle_id, ...from } : { printing_id: i.scryfall_id, ...from }));
        const res = await guarded((confirm) => api("/api/collection/move", { method: "POST", json: { items: list, to_binder, create, confirm_master: confirm } }));
        if (!res) return false;
        onDone(res);
        return true;
      }}>
      {binder != null ? (
        <label className="radio-card">
          <input type="checkbox" checked={scoped} onChange={(e) => setScoped(e.target.checked)} />
          <span><b>Only copies in {binder || UNSORTED}</b><br /><span className="small muted">{scoped ? "Copies in other binders stay where they are." : `Every copy of the selected ${group === "card" ? "cards" : "printings"} moves, from all binders.`}</span></span>
        </label>
      ) : (
        <span className="small muted">Every copy of the selected {group === "card" ? "cards (all printings)" : "printings"} moves, from all binders.</span>
      )}
    </MoveSheet>
  );
}

function DeckImportForm({ onCreated, onCancel }) {
  const [name, setName] = useState("");
  const [format, setFormat] = useState("commander");
  const [text, setText] = useState("");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);

  const pickFile = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    try {
      setText(await file.text());
      if (!name) setName(file.name.replace(/\.[^.]+$/, ""));
    } catch (err) {
      setError(`Could not read the file: ${err.message}`);
    }
    e.target.value = "";
  };

  const submit = async (e) => {
    e.preventDefault();
    if (!name.trim() || !text.trim() || busy) return;
    setBusy(true);
    setError(null);
    try {
      const res = await api("/api/decks", { method: "POST", json: { name: name.trim(), format, text } });
      onCreated(res);
    } catch (err) {
      setError(err.message);
    } finally {
      setBusy(false);
    }
  };

  return (
    <form className="card stack" onSubmit={submit} aria-labelledby="deck-import-title">
      <div className="row between">
        <h2 id="deck-import-title">Import decklist</h2>
        <button type="button" className="btn ghost icon" aria-label="Close import form" onClick={onCancel}><Icon.close /></button>
      </div>
      <div className="row" style={{ alignItems: "flex-end" }}>
        <div className="field grow" style={{ flexBasis: 200 }}>
          <label htmlFor="deck-name">Name</label>
          <input id="deck-name" className="input" required maxLength={200} value={name} onChange={(e) => setName(e.target.value)} placeholder="e.g. Elves tribal" />
        </div>
        <div className="field" style={{ flexBasis: 150, flexGrow: 1 }}>
          <label htmlFor="deck-format">Format</label>
          <select id="deck-format" className="select" value={format} onChange={(e) => setFormat(e.target.value)}>
            {FORMATS.map((f) => <option key={f} value={f}>{cap(f)}</option>)}
          </select>
        </div>
      </div>
      <div className="field">
        <div className="row between">
          <label htmlFor="deck-text">Decklist</label>
          <label className="btn sm">
            <Icon.file /> Load .txt
            <input type="file" accept=".txt,.dec,.dek,text/plain" className="sr-only" onChange={pickFile} />
          </label>
        </div>
        <textarea id="deck-text" className="textarea" required value={text} onChange={(e) => setText(e.target.value)}
          placeholder={"Commander\n1 Lathril, Blade of the Elves\n\nDeck\n1 Sol Ring\n1x Llanowar Elves (M19) 314\n36 Forest"} />
        <span className="muted small">One card per line: <code>1 Sol Ring</code>, <code>1x Name (SET) 123</code>. Section headers like Commander / Deck / Sideboard / Maybeboard are recognised. Cards you own are matched to your printings.</span>
      </div>
      <ErrorNotice error={error} />
      <div className="row">
        <button type="submit" className="btn primary" disabled={busy || !name.trim() || !text.trim()}>
          {busy ? <><span className="spinner" aria-hidden="true" /> Importing…</> : "Import deck"}
        </button>
        <button type="button" className="btn ghost" onClick={onCancel}>Cancel</button>
      </div>
    </form>
  );
}

// Allocation per deck row (v0.3.1): to_buy = copies you don't own at all
// (the only "missing" ones); in_use = owned copies claimed by other built
// decks (can be moved). Older servers only send `missing`: then it is to_buy.
const cardToBuy = (c) => (c && !c.basic ? Math.max(0, Number(c.to_buy ?? c.missing) || 0) : 0);
const cardInUse = (c) => (c && !c.basic ? Math.max(0, Number(c.in_use) || 0) : 0);
/** Other BUILT decks that use this card (names for the visible in-use line). */
const builtElsewhereOf = (c) => {
  const own = asList(c?.in_use_decks).filter((u) => u && (u.name || typeof u === "string"));
  if (own.length) return own;
  return asList(c?.used_elsewhere).filter((u) => u && (typeof u === "string" || (u.name && (!u.status || u.status === "built"))));
};
const deckNames = (list) => list.map(refName).filter((n, i, a) => a.indexOf(n) === i).join(", ");
/** Deck-level counts with fallbacks to the pre-0.3.1 fields. */
function deckCounts(deck) {
  const cards = asList(deck?.cards).filter((c) => c && c.board !== "maybe");
  const toBuy = deck?.to_buy_count ?? deck?.missing_count ?? cards.reduce((a, c) => a + cardToBuy(c), 0);
  const inUse = deck?.in_use_count ?? cards.reduce((a, c) => a + cardInUse(c), 0);
  return {
    toBuy: Number(toBuy) || 0,
    inUse: Number(inUse) || 0,
    toBuyEur: deck?.to_buy_eur ?? deck?.missing_cost_eur ?? deck?.missing_eur ?? deck?.value?.to_buy_eur ?? null,
    inUseEur: deck?.in_use_eur ?? deck?.value?.in_use_eur ?? null,
  };
}

function DeckCardRow({ card, onOpenCard, onActions }) {
  const [peek, setPeek] = useState(false);
  const elsewhere = asList(card.used_elsewhere).filter((u) => u && (u.name || typeof u === "string"));
  const free = card.available_for_this;
  const hasFree = !card.basic && typeof free === "number";
  const freeText = hasFree ? `own ${card.owned ?? 0} · ${Math.max(0, free)} free` : null;
  const toBuy = cardToBuy(card);
  const inUse = cardInUse(card);
  const builtElsewhere = card.basic ? [] : builtElsewhereOf(card);
  const where = deckNames(builtElsewhere) || "another built deck";
  // Built deck + contested copies = conflict (red); idea deck = in use (amber).
  const conflict = Boolean(card.conflict) && !card.basic;
  const badges = [];
  if (card.basic) badges.push(<span key="b" className="badge" title="Basic land">basic</span>);
  else {
    if (inUse > 0) {
      const t = conflict
        ? `Conflict: ${inUse} of your copies ${inUse === 1 ? "is" : "are"} also in ${where} (own ${card.owned ?? 0})`
        : `In use: ${inUse} owned ${inUse === 1 ? "copy is" : "copies are"} in ${where}. You can move ${inUse === 1 ? "it" : "them"} to this deck.`;
      badges.push(<span key="u" className={`badge ${conflict ? "bad" : "warn"}`} role="img" aria-label={t} title={t}>{conflict ? "⚠" : "⇄"} {inUse}</span>);
    }
    if (conflict && !inUse) {
      // Shared with another built deck but no owned copy to contest: still a conflict.
      const t = `Conflict: also in ${where} (own ${card.owned ?? 0})`;
      badges.push(<span key="c" className="badge bad" role="img" aria-label={t} title={t}>⚠</span>);
    }
    if (toBuy > 0) {
      const t = `To buy: ${toBuy} (${freeText || `you own ${card.owned ?? 0}`})`;
      badges.push(<span key="m" className="badge bad" role="img" aria-label={t} title={t}>✗ {toBuy}</span>);
    }
    if (!inUse && !toBuy) {
      // Covered. Another built deck also using it (enough copies) stays a hint.
      const sharedTitle = builtElsewhere.length
        ? `${conflict ? `Not enough copies (own ${card.owned ?? 0}). ` : ""}Also used in: ${builtElsewhere.map((u) => (typeof u === "string" ? u : `${u.name}${u.quantity ? ` (${u.quantity}×)` : ""}`)).join(", ")}`
        : null;
      if (sharedTitle && !conflict) badges.push(<span key="s" className={`badge ${conflict ? "bad" : "warn"}`} role="img" aria-label={sharedTitle} title={sharedTitle}>⚠</span>);
      badges.push(<span key="ok" className="badge ok" aria-label={`Owned (${card.owned})`} title={`You own ${card.owned}`}>✓</span>);
    }
  }
  // Visible on phones (no hover): where the copies are and that they can move.
  const useLine = conflict
    ? <span className="use conf">conflict: also in {where}</span>
    : inUse > 0 ? <span className="use inuse">in {where} · can be moved</span> : null;
  const unresolved = !card.scryfall_id;
  return (
    <>
      <div className="deck-line">
      <button type="button" className="deck-row" disabled={unresolved} aria-expanded={unresolved ? undefined : peek}
        onClick={() => setPeek((p) => !p)} title={unresolved ? "Not found on Scryfall" : undefined}>
        <span className="q">{card.quantity}</span>
        <span className="nm">
          <b>{card.name}</b>
          <ManaCost cost={card.mana_cost} />
          {unresolved && <span className="badge warn">unresolved</span>}
          {!useLine && hasFree && free < (card.owned ?? 0) && <span className="free">{freeText}</span>}
        </span>
        <span className="end">
          <span className="price">{fmtPrice(card.price)}</span>
          {badges}
        </span>
        {useLine}
      </button>
      {onActions && (
        <button type="button" className="btn ghost icon row-more" aria-label={`Actions for ${card.name}`} title="Board, quantity, commander" onClick={() => onActions(card)}><Icon.more /></button>
      )}
      </div>
      {peek && !unresolved && (
        <div className="peek">
          {card.image_small ? <img src={card.image_small} alt={card.name} loading="lazy" /> : <span />}
          <div className="stack small" style={{ gap: 6, alignContent: "start" }}>
            <span>{card.type_line}</span>
            <span className="muted">{(card.set_code || "").toUpperCase()} #{card.collector_number} · {freeText || `own ${card.owned}`}</span>
            {elsewhere.length > 0 && (
              <span className="muted">Also in: {elsewhere.map((u) => (typeof u === "string" ? u : `${u.name}${u.status ? ` (${u.status})` : ""}${u.quantity ? ` ${u.quantity}×` : ""}`)).join(", ")}</span>
            )}
            <button type="button" className="btn sm" style={{ justifySelf: "start" }} onClick={() => onOpenCard(card.scryfall_id)}>Card details</button>
          </div>
        </div>
      )}
    </>
  );
}

const MOVE_BOARDS = ["main", "side", "maybe"];
/** commander_suggestions may be names or card objects. */
const commanderSuggestions = (deck) => asList(deck?.commander_suggestions, "cards", "suggestions")
  .map((x) => (typeof x === "string" ? { name: x } : x))
  .filter((x) => x && x.name)
  .filter((x, i, a) => a.findIndex((y) => y.name === x.name) === i);
// Same rule as the server (lib/decks.js isCommanderFormat): trimmed, case-insensitive.
const isCommanderFormat = (deck) => String(deck?.format || "").trim().toLowerCase() === "commander";
const hasCommander = (deck) => (deck?.counts?.commander ?? 0) > 0 || (deck?.cards || []).some((c) => c.board === "commander");

/** Per-card actions: commander, board moves, quantity, remove. */
function CardActionsSheet({ deck, card, busy, error, onRun, onOpenCard, onClose }) {
  const qty = card.quantity ?? 1;
  const isCmd = card.board === "commander";
  const cmdCount = (deck.cards || []).filter((c) => c.board === "commander").length;
  const cmdHint = isCmd ? null
    : cmdCount === 0 ? null
    : isCommanderFormat(deck) && cmdCount === 1 ? "Partners and backgrounds become a second commander; otherwise it replaces the current one (which moves to the main deck)."
    : cmdCount > 1 ? "Replaces the current commanders (they move to the main deck), or pick one to replace:"
    : "Replaces the current commander, which moves to the main deck.";
  const patch = (body, label) => onRun(`/api/decks/${deck.id}/cards`, "PATCH", { name: card.name, board: card.board, ...body }, label);
  const remove = () => {
    if (!window.confirm(`Remove ${card.name} from the ${(BOARD_LABEL[card.board] || card.board).toLowerCase()}?`)) return;
    patch({ quantity: 0 }, "remove");
  };
  return (
    <Sheet title={card.name} onClose={onClose}>
      <div className="stack">
        <div className="card-actions-head">
          {card.image_small ? <img src={card.image_small} alt="" /> : <span className="ph" />}
          <div className="stack small" style={{ gap: 4 }}>
            <span>{card.type_line || <span className="muted">Not found on Scryfall</span>}</span>
            <span className="row" style={{ gap: 6 }}>
              <span className="badge accent">{BOARD_LABEL[card.board] || card.board}</span>
              <span className="muted">{qty}× · {fmtPrice(card.price)}</span>
            </span>
            {card.scryfall_id && <button type="button" className="btn sm" style={{ justifySelf: "start" }} onClick={() => onOpenCard(card.scryfall_id)}>Card details</button>}
          </div>
        </div>

        {!isCmd && (
          <div className="stack" style={{ gap: 4 }}>
            <button type="button" className="btn primary" disabled={busy} onClick={() => onRun(`/api/decks/${deck.id}/commander`, "POST", { name: card.name }, "commander")}>
              <Icon.crown /> Set as commander
            </button>
            {cmdHint && <span className="small muted">{cmdHint}</span>}
            {cmdCount > 1 && (
              <div className="action-grid">
                {(deck.cards || []).filter((c) => c.board === "commander").map((c) => (
                  <button key={c.name} type="button" className="btn sm" disabled={busy}
                    onClick={() => onRun(`/api/decks/${deck.id}/commander`, "POST", { name: card.name, replace: c.name }, "commander")}>Replace {c.name}</button>
                ))}
              </div>
            )}
          </div>
        )}

        <div className="stack" style={{ gap: 6 }}>
          <span className="label">Move to</span>
          <div className="action-grid">
            {MOVE_BOARDS.filter((b) => b !== card.board).map((b) => (
              <button key={b} type="button" className="btn" disabled={busy} onClick={() => patch({ to_board: b }, "move")}>{BOARD_LABEL[b]}</button>
            ))}
          </div>
        </div>

        <div className="row between">
          <span className="label">Quantity</span>
          <div className="stepper" role="group" aria-label="Quantity">
            <button type="button" aria-label="One less" disabled={busy || qty <= 1} onClick={() => patch({ quantity: qty - 1 }, "qty")}><Icon.minus /></button>
            <output aria-live="polite">{qty}</output>
            <button type="button" aria-label="One more" disabled={busy} onClick={() => patch({ quantity: qty + 1 }, "qty")}><Icon.plus /></button>
          </div>
        </div>

        <ErrorNotice error={error} />
        {deck.source === "manabox" && (
          <p className="small muted" style={{ margin: 0 }}>Synced from ManaBox: board changes (commander, sideboard, maybeboard) survive the next sync while the card is still in the binder; quantities come from ManaBox again.</p>
        )}
        <button type="button" className="btn danger" disabled={busy} onClick={remove}><Icon.trash /> Remove from deck</button>
      </div>
    </Sheet>
  );
}

function DeckValue({ value }) {

    <div className="stack" style={{ gap: 6 }} aria-label="Deck value">
      <div className="value-grid">

      </div>

// Deck allocation: idea / built status, conflicts, shopping lists, deck boxes

const refName = (d) => (typeof d === "string" ? d : d?.name || "?");
function StatusBadge({ status }) {
  if (status !== "built" && status !== "idea") return null;
  return status === "built"
    ? <span className="badge ok" title="Built: this deck claims its cards">built</span>
    : <span className="badge" title="Idea: doesn't claim cards">idea</span>;
}

/** Line EUR of a shopping-list item: cost_eur (need × unit price_eur), or null when unpriced. */
function lineEurOf(qtyKey) {
  const qty = (it) => Math.max(1, Number(it[qtyKey]) || 1);
  return (it) => (it.cost_eur != null ? Number(it.cost_eur) : it.price_eur == null ? null : Number(it.price_eur) * qty(it));
}

function BuyList({ items, qtyKey, total, sub, label = "Total" }) {
  const lineEur = lineEurOf(qtyKey);
  return (
    <div className="deck-section" style={{ padding: 0, gap: 0 }}>
      <div className="buy-list">
        {items.map((it, i) => {
          const eur = lineEur(it);
          return (
            <div key={`${it.name}-${i}`} className="buy-row">
              <span className="q">{it[qtyKey] ?? 1}×</span>
              <span className="nm"><b>{it.name}</b>{sub && sub(it)}</span>
              <span className="p">{eur == null ? <span className="muted">no €</span> : fmtEur(eur)}</span>
            </div>
          );
        })}
      </div>
      {total != null && <div className="buy-total"><span>{label}</span><span>{fmtEur(total)}</span></div>}
    </div>
  );
}

/** "⚠ 2 cards are also in another built deck" + which decks. */
function ConflictBanner({ deck, onOpenDeck }) {
  const list = asList(deck.conflicts);
  const n = deck.conflict_count ?? list.length;
  if (!n) return null;
  return (
    <div className="notice error" role="status">
      <span aria-hidden="true">⚠</span>
      <div className="grow">
        <b>{n === 1 ? "1 card is" : `${fmtInt(n)} cards are`} also in another built deck</b> and you don't own enough copies for all of them.
        {list.length > 0 && (
          <ul className="conflict-list">
            {list.map((c, i) => {
              const others = asList(c.decks).filter((d) => !(d && typeof d === "object" && (d.deck_id ?? d.id) === deck.id));
              return (
                <li key={`${c.name}-${i}`}>
                  <b>{c.name}</b>: own {c.owned ?? "?"}, built decks need {c.demand ?? "?"}
                  {others.length > 0 && <>{" · "}{others.map((d, j) => (
                    <React.Fragment key={j}>{j > 0 && ", "}
                      {typeof d === "object" && (d.deck_id ?? d.id) != null && onOpenDeck
                        ? <button type="button" className="linkbtn" onClick={() => onOpenDeck(d.deck_id ?? d.id)}>{d.name}</button>
                        : refName(d)}
                      {typeof d === "object" && d.quantity ? ` ${d.quantity}×` : ""}
                    </React.Fragment>))}</>}

/** "80 to buy (~€X) · 8 in other decks (€Y to buy instead)" or "you own every card". */
function DeckNeedNotice({ deck }) {
  const { toBuy, inUse, toBuyEur, inUseEur } = deckCounts(deck);
  const built = deck?.status === "built";
  if (!toBuy && !inUse) {
    return <div className="notice ok"><span aria-hidden="true">✓</span><div className="grow"><b>You own every card in this deck.</b></div></div>;
  }
  return (
    <div className={`notice ${toBuy || built ? "warn" : "ok"} need-notice`} role="status">

      <div className="grow stack" style={{ gap: 2 }}>
        <span>
          {toBuy > 0
            ? <b>{fmtInt(toBuy)} to buy{toBuyEur != null ? ` (~${fmtEur(toBuyEur)})` : ""}</b>
            : <b>You own every card</b>}
          {inUse > 0 && <>
            {" · "}
            <span className="inuse-count"><span aria-hidden="true">{built ? "⚠" : "⇄"}</span> {fmtInt(inUse)} in other {built ? "built " : ""}decks{inUseEur != null && inUseEur > 0 ? ` (${fmtEur(inUseEur)} to buy instead)` : ""}</span>
          </>}
        </span>
        <span className="small">

/** In-use list: shopping.in_use from the server, else derived from the rows. */
function inUseItemsOf(deck) {
  const listed = asList(deck?.shopping?.in_use).filter((x) => x && x.name);
  if (listed.length || Array.isArray(deck?.shopping?.in_use)) return listed;
  const byName = new Map();
  for (const c of asList(deck?.cards)) {
    const n = cardInUse(c);
    if (!n || c.board === "maybe") continue;
    const prev = byName.get(c.name);
    const unit = c.eur ?? c.price_eur ?? null;
    if (prev) { prev.quantity += n; if (prev.price_eur != null) prev.cost_eur = prev.price_eur * prev.quantity; continue; }
    byName.set(c.name, {
      name: c.name, oracle_id: c.oracle_id, quantity: n,
      decks: builtElsewhereOf(c).map((u) => (typeof u === "string" ? { name: u } : { id: u.deck_id ?? u.id, name: u.name })),
      price_eur: unit == null ? null : Number(unit), cost_eur: unit == null ? null : Number(unit) * n,
    });
  }
  return [...byName.values()];
}

/** Deck names as links (tap opens that deck). */
function DeckLinks({ decks, onOpenDeck, shared = false }) {
  const list = asList(decks).filter(Boolean);
  if (!list.length) return null;
  return (
    <span className="sub">in {list.map((d, j) => {
      const did = typeof d === "object" ? (d.id ?? d.deck_id) : null;
      return (
        <React.Fragment key={j}>{j > 0 && ", "}
          {did != null && onOpenDeck
            ? <button type="button" className="linkbtn" onClick={() => onOpenDeck(did)}>{refName(d)}</button>
            : refName(d)}
        </React.Fragment>
      );
    })}{shared ? " · conflict" : " · can be moved"}</span>
  );
}

/** What to buy for this deck (copies you don't own), plus the owned copies
 *  that sit in other built decks (move them, or buy extra). */
function DeckShopping({ deck, onOpenDeck }) {
  const shopping = deck?.shopping;
  const items = asList(shopping?.items).filter((x) => x && x.name)
    .map((x) => ({ ...x, qty: x.to_buy ?? x.need ?? x.quantity ?? 1 }));
  const inUse = inUseItemsOf(deck).map((x) => ({ ...x, qty: x.quantity ?? x.in_use ?? x.need ?? 1 }));
  if (!items.length && !inUse.length) return null;
  const inUseCards = inUse.reduce((a, x) => a + (Number(x.qty) || 1), 0);
  const lineEur = lineEurOf("qty");
  const inUseTotal = shopping?.in_use_eur ?? deck?.in_use_eur ?? deck?.value?.in_use_eur
    ?? (inUse.some((x) => lineEur(x) != null) ? inUse.reduce((a, x) => a + (lineEur(x) || 0), 0) : null);
  const built = deck?.status === "built";
  return (
    <section className="stack" style={{ gap: 8 }} aria-labelledby="deck-shop-title">
      <h3 id="deck-shop-title" className="row" style={{ gap: 8 }}>To buy <span className="muted small">{items.length ? plural(items.reduce((a, x) => a + (Number(x.qty) || 1), 0), "card") : "nothing"}</span></h3>
      {items.length > 0
        ? <BuyList items={items} qtyKey="qty" total={shopping?.total_eur} />
        : <span className="small muted">You own every card. {built ? "Some copies are also claimed by other built decks." : "Some copies are in other decks."}</span>}
      {inUse.length > 0 && (
        <details className="disclosure inuse-list">
          <summary>
            <span>{built ? "Shared with other built decks" : "In other decks"}: {plural(inUseCards, "card")}{inUseTotal != null ? ` (buy instead: ${fmtEur(inUseTotal)})` : ""}</span>
          </summary>
          <span className="small muted">{built
            ? "You own these, but other built decks claim the copies. Move them between decks or buy extra copies to play all at once."
            : "You own these; they are in your built decks now. Move them over when you build this deck, or buy extra copies."}</span>
          <BuyList items={inUse} qtyKey="qty" total={inUseTotal} label="Buy instead"
            sub={(it) => <DeckLinks decks={it.decks} onOpenDeck={onOpenDeck} shared={built || it.conflict} />} />
        </details>
      )}
    </section>
  );
}

/** POST /api/decks/:id/to-binder: gather the deck's owned copies into one binder. */
function DeckBoxSheet({ deck, onClose, onDone }) {
  const [name, setName] = useState(deck.box_binder || `Deck box: ${deck.name}`.slice(0, 100));
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);
  const [result, setResult] = useState(null);
  const [guarded, masterDialog] = useMasterConfirm();
  const submit = async (e) => {
    e.preventDefault();
    if (!name.trim() || busy) return;
    setBusy(true); setError(null);
    try {
      const res = await guarded((confirm) => api(`/api/decks/${deck.id}/to-binder`, { method: "POST", json: { binder: name.trim(), confirm_master: confirm } }));
      if (res) { setResult(res); onDone?.(res); }
    } catch (err) { setError(err.message); } finally { setBusy(false); }
  };
  const moved = asList(result?.moved, "items", "cards");
  const missing = asList(result?.missing, "items", "cards");
  const movedCopies = result?.moved_copies ?? moved.reduce((a, m) => a + (Number(m.quantity ?? m.moved) || 0), 0);
  return (
    <Sheet title="Put into deck box" onClose={onClose}>
      {!result ? (
        <form className="stack" onSubmit={submit}>
          <p className="small" style={{ margin: 0 }}>
            Moves the copies <b>{deck.name}</b> needs into one binder: first from {UNSORTED}, then from your other binders.
            Copies already in this binder{deck.source === "manabox" ? " or in the deck's own ManaBox binder" : ""} count as boxed;
            copies in another built deck's box stay where they are.
          </p>
          <div className="field">
            <label htmlFor="deckbox-name">Binder</label>
            <input id="deckbox-name" className="input" style={{ fontSize: 16 }} maxLength={100} required value={name} onChange={(e) => setName(e.target.value)} />
          </div>
          <ErrorNotice error={error} />
          <button type="submit" className="btn primary" disabled={busy || !name.trim()}>{busy ? "Moving…" : <><Icon.box /> Move cards into “{name.trim() || "…"}”</>}</button>
        </form>
      ) : (
        <div className="stack">
          <div className="notice ok" role="status"><span aria-hidden="true">✓</span><div className="grow">
            Moved <b>{plural(movedCopies || 0, "copy", "copies")}</b> to {result.to_binder || result.binder || name.trim()}.
          </div></div>
          {moved.length > 0 && (
            <Collapsible label={`Moved: ${plural(moved.length, "card")}`}>
              <ul className="delta-list">
                {moved.map((m, i) => <li key={i}>{typeof m === "string" ? m : <><b>{m.quantity ?? m.moved ?? ""}{m.quantity ?? m.moved ? "× " : ""}</b>{m.name}{m.from_binder != null ? <span className="muted"> · from {m.from_binder || UNSORTED}</span>
                  : asList(m.from).length > 0 && <span className="muted"> · from {asList(m.from).map((f) => `${f.binder || UNSORTED}${asList(m.from).length > 1 ? ` ${f.quantity}×` : ""}`).join(", ")}</span>}</>}</li>)}
              </ul>
            </Collapsible>
          )}
          {missing.length > 0 ? (
            <div className="notice warn"><span aria-hidden="true">✗</span><div className="grow">
              <b>Still missing {plural(missing.length, "card")}:</b>
              <ul className="delta-list" style={{ marginTop: 4 }}>
                {missing.map((m, i) => <li key={i}>{typeof m === "string" ? m : <>{m.quantity ?? m.missing ?? m.need ?? 1}× {m.name}</>}</li>)}
              </ul>
            </div></div>
          ) : <span className="small muted">Every owned card the deck needs is in the deck box now.</span>}
          <button type="button" className="btn primary" onClick={onClose}>Done</button>
        </div>
      )}
      {masterDialog}
    </Sheet>
  );
}
