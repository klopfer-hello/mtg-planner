        ctx.strokeStyle = r.state === "cooldown" ? "#f0c062" : r.state === "stable" || r.state === "capture" ? "#62d18d" : "#a38bff";
        ctx.beginPath();
        q.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
        ctx.closePath();
        ctx.stroke();
      }
    };

    const loop = () => {
      if (!alive) return;
      const now = performance.now();
      if (now - last >= gap && v.readyState >= 2 && !capturingRef.current) {
        last = now;
        let o = null;
        try { o = analyze(v); } catch { o = null; }
        if (o) {
          if (o.vw !== cam.vw || o.vh !== cam.vh) setCam((c) => ({ ...c, vw: o.vw, vh: o.vh }));
          obsRef.current = o;
          const L = live.current;
          const r = acRef.current.step({ ...o, now: Date.now(), paused: L.busy || L.paused || !L.auto });
          draw(o, r);
          let hint = r.hint, phase = r.state;
          if (L.busy) { hint = "Identifying…"; phase = "busy"; }
          else if (L.paused) hint = "Paused";
          else if (!L.auto && r.state !== "cooldown") hint = o.found ? "Card found: tap the shutter" : "Place a card in the frame";
          if (hint !== shown.hint || phase !== shown.phase) { shown = { hint, phase }; setStatus(shown); }
          if (r.capture && !L.busy && !L.paused && L.auto) shoot(o, "auto");
        }
      }
      timer = setTimeout(loop, 30);
    };
    loop();
    return () => { alive = false; clearTimeout(timer); };
  }, [cam.state, cam.vw, cam.vh, lib, shoot]);

  const toggleTorch = async () => {
    const next = !torch.on;
    try {
      await lib.setTorch(trackRef.current, next);
      setTorchState((t) => ({ ...t, on: next, supported: true }));
    } catch {
      setTorchState({ supported: false, on: false });
      onError?.("The torch is not available on this camera.");
    }
  };

  const on = cam.state === "on";
  const ratio = cam.vw && cam.vh ? cam.vw / cam.vh : 3 / 4;
  const style = { aspectRatio: `${ratio}`, width: `min(100%, calc(72dvh * ${ratio.toFixed(4)}))` };
  const support = lib ? lib.cameraSupport() : null;

  return (
    <div className="cam" style={style}>
      <video ref={videoRef} playsInline muted autoPlay aria-label="Camera preview" />
      <canvas ref={overlayRef} aria-hidden="true" hidden={!on} />
      {!on && (
        <div className="cam-start">
          {cam.state === "starting" ? <Spinner label="Starting camera…" /> : (
            <>
              {cam.error && <p role="alert" style={{ color: "#ffb4a8" }}>{cam.error}</p>}
              {support && !support.secure && <p role="alert" style={{ color: "#ffb4a8" }}>The camera only works over HTTPS.</p>}
              <button type="button" className="btn primary" onClick={start} disabled={!lib}><Icon.camera /> {cam.error ? "Try again" : "Start camera"}</button>
              <p>Lay the card on a plain, light surface and fill the frame. Scanning starts automatically when the card is steady and sharp.</p>
            </>
          )}
        </div>
      )}
      {on && (
        <>
          <div className="cam-hud top">
            <span className={`pill s-${status.phase}`} role="status" aria-live="polite"><span className="dot" aria-hidden="true" />{status.hint || "Ready"}</span>
            {torch.supported !== false && (
              <button type="button" className="cam-btn" aria-pressed={torch.on} aria-label={torch.on ? "Turn torch off" : "Turn torch on"} onClick={toggleTorch}><Icon.bolt /></button>
            )}
          </div>
          <div className="cam-hud bottom">
            <button type="button" className="cam-btn" aria-label="Stop camera" onClick={stop}><Icon.close /></button>
            <button type="button" className="shutter" aria-label="Take scan now" disabled={busy || paused}
              onClick={() => shoot(obsRef.current, "manual")} />
            <button type="button" className="cam-btn" aria-label="Scan this card again" title="Re-arm auto capture" onClick={() => acRef.current?.rearm()}><Icon.refresh /></button>
          </div>
        </>
      )}
    </div>
  );
}

// Pill dot colour per CaptureController state.
const V2_PHASE = { searching: "searching", tracking: "tracking", settling: "tracking", capture: "capture", pending: "busy", cooldown: "cooldown", idle: "stable", stuck: "searching", fallback: "capture", paused: "searching" };

/**
 * Scanner v2 camera: detector A2 (scanlib createDetAnalyzer) feeds the shared
 * CaptureController (ctlRef, owned by ScanTab so upload answers reach it);
 * shots go to onUpload as queue items. No guide mask: the card may lie
 * anywhere; a learned box prior is drawn faintly. Also uploads the record
 * session frames while `record` is set.
 */
function CameraViewV2({ lib, ctlRef, detRef, active, settings, paused, flash, queued, record, buildPayload, onUpload, onChip, onRecorded, onError, onUnlock }) {
  const videoRef = useRef(null);
  const overlayRef = useRef(null);
  const streamRef = useRef(null);
  const trackRef = useRef(null);
  const obsRef = useRef(null);
  const capturingRef = useRef(false);
  const recRef = useRef({ session: null, seq: 0, last: 0, busy: false, queue: [], frames: 0, bytes: 0, errors: 0 });
  const live = useRef({});
  live.current = { paused, auto: settings.auto, photo: settings.photo, flash, record, queued, buildPayload, onUpload, onChip, onRecorded, onError };
  const [cam, setCam] = useState({ state: "off", error: null, vw: 0, vh: 0 });
  const [status, setStatus] = useState({ phase: "searching", hint: "" });
  const [torch, setTorchState] = useState({ supported: null, on: false });
  const [dbg, setDbg] = useState(null); // ?scandebug=1: detector timing + controller state
  const debugOn = useMemo(() => { try { return new URLSearchParams(window.location.search).get("scandebug") === "1"; } catch { return false; } }, []);
  const genRef = useRef(0);
  const activeRef = useRef(active);
  activeRef.current = active;

  // A held "+1?" photo is never lost: stop, tab change and page hide upload it (dup_of).
  const stop = useCallback(() => {
    genRef.current++;
    try { const h = ctlRef.current?.takeHeld(); if (h) live.current.onUpload?.(h); } catch { /* ignore */ }
    live.current.onChip?.(null);
    if (lib) lib.stopStream(streamRef.current);
    else streamRef.current?.getTracks().forEach((t) => t.stop());
    streamRef.current = null;
    trackRef.current = null;
    if (videoRef.current) videoRef.current.srcObject = null;
    setCam((c) => (c.state === "off" || c.state === "error" ? c : { ...c, state: "off" }));
    setTorchState((t) => ({ ...t, on: false }));
  }, [lib, ctlRef]);

  const start = async () => {
    if (!lib || cam.state === "starting") return;
    onUnlock?.();
    const gen = ++genRef.current;
    const stale = () => gen !== genRef.current || !activeRef.current || document.hidden;
    setCam({ state: "starting", error: null, vw: 0, vh: 0 });
    try {
      const stream = await lib.openCamera();
      if (stale()) {
        lib.stopStream(stream);
        if (gen === genRef.current) stop();
        return;
      }
      streamRef.current = stream;
      const track = stream.getVideoTracks()[0];
      trackRef.current = track;
      track?.addEventListener?.("ended", () => { stop(); setCam({ state: "error", error: "The camera stopped (another app may have taken it).", vw: 0, vh: 0 }); });
      const v = videoRef.current;
      v.muted = true;
      v.setAttribute("playsinline", "");
      v.setAttribute("muted", "");
      v.srcObject = stream;
      await v.play().catch(() => {});
      if (!v.videoWidth) {
        await new Promise((res) => { v.addEventListener("loadedmetadata", res, { once: true }); setTimeout(res, 4000); });
      }
      if (stale()) { if (gen === genRef.current) stop(); return; }
      lib.preferContinuousFocus(track);
      setTorchState({ supported: lib.torchCapability(track), on: false });
      ctlRef.current?.reset();
      setCam({ state: "on", error: null, vw: v.videoWidth, vh: v.videoHeight });
    } catch (e) {
      stop();
      setCam({ state: "error", error: cameraErrorMessage(e), vw: 0, vh: 0 });
    }
  };

  useEffect(() => { if (!active) stop(); }, [active, stop]);
  useEffect(() => {
    const h = () => { if (document.hidden) stop(); };
    document.addEventListener("visibilitychange", h);
    return () => { document.removeEventListener("visibilitychange", h); stop(); };
  }, [stop]);

  // Shoot capture `c` (from step() or forceCapture()) on frame analysis `o`.
  const shoot = useCallback(async (c, o) => {
    const v = videoRef.current, ctl = ctlRef.current;
    if (!lib || !v || !v.videoWidth || !ctl || !c?.quad || capturingRef.current) return;
    capturingRef.current = true;
    // The analyzer decides the source: the video frame while the learned box is active (corners
    // exact), else takePhoto + A2 re-detect; the "Full-resolution photo" setting can veto the photo.
    const det = detRef.current;
    const opts = det?.captureOpts ? det.captureOpts() : { preferPhoto: true };
    try {
      const shot = await lib.captureCard(v, trackRef.current, c.quad, { ...opts, preferPhoto: opts.preferPhoto !== false && live.current.photo !== false });
      if (c.rec) Object.assign(c.rec, { shot: shot.kind, shot_drift: shot.drift ?? null, orient_conf: Number.isFinite(o?.orientConf) ? Math.round(o.orientConf * 1000) / 1000 : null, prior_learned: Boolean(o?.priorLearned) });
      // precise: the crop comes from an accepted, stable tracked quad (not a fallback), so the
      // server may take its faster clean-crop path.
      const precise = Boolean(!c.fallback && o?.accepted && o?.stable && c.quad === o.corners);
      const item = ctl.captured(c, live.current.buildPayload(shot, c, { precise }));
      if (item) live.current.onUpload(item);
      // An accepted, tracked capture teaches the box prior (savePrior adds it, then persists).
      if (!c.fallback && o?.accepted && c.quad === o.corners) {
        try { det?.savePrior?.(c.quad); } catch { /* storage may be blocked */ }
      }
    } catch (e) {
      ctl.captureFailed();
      live.current.onError?.(`Capture failed: ${e.message}`);
    } finally {
      capturingRef.current = false;
    }
  }, [lib, ctlRef, detRef]);

  const manualShot = () => {
    const v = videoRef.current, ctl = ctlRef.current;
    if (!v || !ctl || capturingRef.current) return;
    const o = obsRef.current || { vw: v.videoWidth, vh: v.videoHeight };
    const c = ctl.forceCapture({ ...o, now: Date.now() });
    if (c.flush) live.current.onUpload(c.flush);
    live.current.onChip?.(null);
    if (c.quad) shoot(c, o);
  };
  const rearm = () => {
    const ctl = ctlRef.current;
    if (!ctl) return;
    const h = ctl.takeHeld(); // rearm() would drop a held photo: upload it first
    if (h) live.current.onUpload(h);
    live.current.onChip?.(null);
    ctl.rearm();
  };

  // Record session: one small frame every RECORD_EVERY_MS, plus every decision record (one per frame upload).
  const recordTick = (r) => {
    const R = live.current.record, S = recRef.current;
    if (!R?.session) { S.queue.length = 0; return; }
    if (S.session !== R.session) Object.assign(S, { session: R.session, seq: 0, last: 0, queue: [], frames: 0, bytes: 0, errors: 0 });
    if (r?.rec) { S.queue.push({ ...r.rec, t: Date.now(), state: r.state }); if (S.queue.length > 30) S.queue.shift(); }
    const now = performance.now();
    if (S.busy || (!S.queue.length && now - S.last < RECORD_EVERY_MS)) return;
    S.last = now;
    S.busy = true;
    const session = S.session, seq = S.seq++, rec = S.queue.shift() || null;
    const frame = async () => {
      // the analyzer's last 480 px work frame (what the detector saw)
      const d = detRef.current;
      let j = d?.frameJpeg?.(0.7) || null;
      if (j && j.length > RECORD_MAX_B64) j = d.frameJpeg(0.5);
      return j && j.length <= RECORD_MAX_B64 ? j : null;
    };
    frame()
      .then(async (jpeg) => {
        if (!jpeg) throw new Error("encode");
        await api("/api/debug/frames", { method: "POST", json: { session, seq, jpeg, ...(rec ? { record: rec } : {}) } });
        if (S.session === session) { S.frames++; S.bytes += Math.floor((jpeg.length * 3) / 4); }
      })
      .catch(() => { if (S.session === session) S.errors++; })
      .finally(() => {
        S.busy = false;
        if (S.session === session) live.current.onRecorded?.({ session, frames: S.frames, bytes: S.bytes, errors: S.errors });
      });
  };

  // Analysis loop (~8 fps) + overlay drawing.
  useEffect(() => {
    if (cam.state !== "on" || !lib) return;
    const v = videoRef.current;
    let det = null;
    try { det = lib.createDetAnalyzer(v, {}); } catch (e) {
      live.current.onError?.(`Could not start the card detector: ${e.message}`);
      return;
    }
    detRef.current = det;
    const gap = 1000 / (lib.CAPTURE_DEFAULTS?.fps || 8);
    let alive = true, timer = null, last = 0, shown = { phase: "", hint: "" }, dims = [cam.vw, cam.vh];
    let chipKey = "", fallbackUntil = 0;
    const msHist = [];
    let dbgAt = 0;
    const pct = (a, q) => { const b = [...a].sort((x, y) => x - y); return b.length ? b[Math.min(b.length - 1, Math.floor(q * b.length))] : null; };

    const poly = (ctx, q) => { ctx.beginPath(); q.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.closePath(); ctx.stroke(); };
    const draw = (o, r) => {
      const c = overlayRef.current;
      if (!c) return;
      const cw = c.clientWidth, ch = c.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
      if (!cw || !ch) return;
      if (c.width !== Math.round(cw * dpr) || c.height !== Math.round(ch * dpr)) { c.width = Math.round(cw * dpr); c.height = Math.round(ch * dpr); }
      const ctx = c.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, cw, ch);
      const sc = Math.max(cw / o.vw, ch / o.vh), dx = (cw - o.vw * sc) / 2, dy = (ch - o.vh * sc) / 2;
      const map = ([x, y]) => [x * sc + dx, y * sc + dy];
      const fl = live.current.flash;
      const flashOn = fl && Date.now() < fl.until;
      // The learned box prior, faintly.
      if (o.priorLearned && o.priorQuad) {
        ctx.setLineDash([]);
        ctx.lineWidth = 2;
        ctx.strokeStyle = "rgba(255,255,255,.28)";
        poly(ctx, o.priorQuad.map(map));
      }
      const weakOnly = Boolean(o.weak && !o.accepted);
      if (o.corners && (o.found || o.weak)) {
        ctx.lineWidth = flashOn ? 6 : 3;
        ctx.setLineDash(weakOnly && !flashOn ? [10, 8] : []);
        ctx.strokeStyle = flashOn ? fl.color
          : r.state === "cooldown" ? "#f0c062"
            : weakOnly ? "#f5e050"
              : o.stable || r.state === "capture" ? "#62d18d" : "#a38bff";
        poly(ctx, o.corners.map(map));
      } else if (flashOn) {
        ctx.setLineDash([]);
        ctx.lineWidth = 6;
        ctx.strokeStyle = fl.color;
        ctx.strokeRect(3, 3, cw - 6, ch - 6);
      }
    };

    const loop = () => {
      if (!alive) return;
      const now = performance.now();
      if (now - last >= gap && v.readyState >= 2 && !capturingRef.current) {
        last = now;
        let o = null;
        try { o = det.analyze(now); } catch { o = null; }
        const ctl = ctlRef.current;
        if (o && ctl) {
          if (o.vw !== dims[0] || o.vh !== dims[1]) { dims = [o.vw, o.vh]; setCam((c) => ({ ...c, vw: o.vw, vh: o.vh })); }
          obsRef.current = o;
          const L = live.current;
          let r = null;
          const t0 = performance.now();
          try { r = ctl.step({ ...o, now: Date.now(), busy: false, paused: L.paused || !L.auto }); } catch (e) { r = null; }
          if (debugOn) {
            msHist.push([o.ms, performance.now() - t0]);
            if (msHist.length > 60) msHist.shift();
            window.__scanDebug = { o: { ...o, thumb: undefined, cardThumb: undefined }, r: r && { ...r, capture: r.capture && { kind: r.capture.kind, fallback: r.capture.fallback } } };
            if (Date.now() - dbgAt > 500) {
              dbgAt = Date.now();
              setDbg({ a50: pct(msHist.map((x) => x[0]), 0.5), a90: pct(msHist.map((x) => x[0]), 0.9), s90: pct(msHist.map((x) => x[1]), 0.9), st: r?.state, f: o.found, w: o.weak, a: o.accepted, s: o.stable, mad: r?.mad, sharp: o.sharp, mode: o.mode, prior: o.priorLearned, armed: r?.armed?.join(",") });
            }
          }
          if (r) {
            if (r.flush) L.onUpload(r.flush);
            draw(o, r);
            const key = r.sameChip ? `${r.sameChip.scanId}:${r.sameChip.d}` : "";
            if (key !== chipKey) { chipKey = key; L.onChip?.(r.sameChip || null); }
            if (r.capture?.fallback) fallbackUntil = Date.now() + 2500;
            let hint = r.hint, phase = V2_PHASE[r.state] || "searching";
            if (o.weak && !o.accepted && phase === "tracking") phase = "weak";
            const workW = o.corners && o.found ? lib.quadSize(o.corners).w * (480 / Math.min(o.vw, o.vh)) : null;
            const looking = ["tracking", "settling", "stuck", "searching"].includes(r.state);
            if (L.paused) hint = "Paused";
            else if (!L.auto && r.state !== "cooldown") hint = o.found ? "Card found: tap the shutter" : "Place a card in view";
            else if (Date.now() < fallbackUntil) hint = "Couldn't find the edges – trying anyway";
            else if (o.glare?.advice && looking) hint = o.glare.advice;
            else if (r.state === "settling" && o.stable && r.hint === "Focusing…") hint = "Reflection – tilt slightly";
            else if (workW !== null && workW < 100 && (r.state === "tracking" || r.state === "settling")) hint = "Move closer";
            if (L.queued > 1) hint = `${hint} · ${L.queued - 1} waiting`;
            if (hint !== shown.hint || phase !== shown.phase) { shown = { hint, phase }; setStatus(shown); }
            recordTick(r);
            if (r.capture && L.auto && !L.paused) shoot(r.capture, o);
          } else recordTick(null);
        }
      }
      timer = setTimeout(loop, 30);
    };
    loop();
    return () => { alive = false; clearTimeout(timer); if (detRef.current === det) detRef.current = null; };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [cam.state, lib, shoot]);

  const toggleTorch = async () => {
    const next = !torch.on;
    try {
      await lib.setTorch(trackRef.current, next);
      setTorchState((t) => ({ ...t, on: next, supported: true }));
    } catch {
      setTorchState({ supported: false, on: false });
      onError?.("The torch is not available on this camera.");
    }
  };

  const on = cam.state === "on";
  const ratio = cam.vw && cam.vh ? cam.vw / cam.vh : 3 / 4;
  const style = { aspectRatio: `${ratio}`, width: `min(100%, calc(72dvh * ${ratio.toFixed(4)}))` };
  const support = lib ? lib.cameraSupport() : null;

  return (
    <div className="cam" style={style}>
      <video ref={videoRef} playsInline muted autoPlay aria-label="Camera preview" />
      <canvas ref={overlayRef} aria-hidden="true" hidden={!on} />
      {!on && (
        <div className="cam-start">
          {cam.state === "starting" ? <Spinner label="Starting camera…" /> : (
            <>
              {cam.error && <p role="alert" style={{ color: "#ffb4a8" }}>{cam.error}</p>}
              {support && !support.secure && <p role="alert" style={{ color: "#ffb4a8" }}>The camera only works over HTTPS.</p>}
              <button type="button" className="btn primary" onClick={start} disabled={!lib}><Icon.camera /> {cam.error ? "Try again" : "Start camera"}</button>
              <p>Lay or slide a card into view – it's captured automatically.</p>
            </>
          )}
        </div>
      )}
      {on && (
        <>
          <div className="cam-hud top">
            <span className="pills">
              <span className={`pill s-${status.phase}`} role="status" aria-live="polite"><span className="dot" aria-hidden="true" />{status.hint || "Ready"}</span>
              {record?.session && <span className="pill s-rec"><span className="dot" aria-hidden="true" />REC</span>}
              {debugOn && dbg && (
                <span className="pill" style={{ whiteSpace: "normal", fontWeight: 500, fontSize: ".72rem" }}>
                  A2 {dbg.a50?.toFixed(0)}/{dbg.a90?.toFixed(0)} ms · step p90 {dbg.s90?.toFixed(0)} ms · {dbg.st} · {dbg.f ? "F" : "-"}{dbg.w ? "W" : "-"}{dbg.a ? "A" : "-"}{dbg.s ? "S" : "-"} · mad {dbg.mad?.toFixed(1)} · sharp {Math.round(dbg.sharp ?? 0)} · {dbg.mode}{dbg.prior ? " prior" : ""} · {dbg.armed || "-"}
                </span>
              )}
            </span>
            {torch.supported !== false && (
              <button type="button" className="cam-btn" aria-pressed={torch.on} aria-label={torch.on ? "Turn torch off" : "Turn torch on"} onClick={toggleTorch}><Icon.bolt /></button>
            )}
          </div>
          <div className="cam-hud bottom">
            <button type="button" className="cam-btn" aria-label="Stop camera" onClick={stop}><Icon.close /></button>
            <button type="button" className="shutter" aria-label="Take scan now" disabled={paused} onClick={manualShot} />
            <button type="button" className="cam-btn" aria-label="Scan this card again" title="Scan the card in view again" onClick={rearm}><Icon.refresh /></button>
          </div>
        </>
      )}
    </div>
  );
}

// ---------------------------------------------------------------------------
// Printing picker (candidates, all printings of a card, title search)

/**
 * Where a list of printings differs: per field, whether the values differ and
 * the common prefix/suffix length (so only the differing characters of a set
 * code or collector number get marked).
 */
function printingDiff(list) {
  const out = { set: null, cn: null, lang: false, finish: false, tags: new Set() };
  if (!list || list.length < 2) return out;
  const affix = (vals) => {
    if (new Set(vals).size < 2) return null;
    const min = Math.min(...vals.map((v) => v.length));
    let pre = 0;
    while (pre < min && vals.every((v) => v[pre] === vals[0][pre])) pre++;
    let suf = 0;
    while (suf < min - pre && vals.every((v) => v[v.length - 1 - suf] === vals[0][vals[0].length - 1 - suf])) suf++;
    return { pre, suf };
  };
  out.set = affix(list.map((p) => p.set.toUpperCase()));
  out.cn = affix(list.map((p) => String(p.cn)));
  out.lang = new Set(list.map((p) => p.lang)).size > 1;
  out.finish = new Set(list.map((p) => p.finishes.join("/"))).size > 1;
  const all = list.map((p) => new Set(p.tags || []));
  for (const t of new Set(list.flatMap((p) => p.tags || []))) if (!all.every((x) => x.has(t))) out.tags.add(t);
  return out;
}

/** Text with the differing middle part (between common prefix and suffix) marked. */
function DiffText({ text, d, prefix = "" }) {
  const t = String(text);
  if (!d) return <span className="same">{prefix}{t}</span>;
  const mid = t.slice(d.pre, t.length - d.suf);
  return <span>{prefix}{t.slice(0, d.pre)}{mid ? <mark>{mid}</mark> : null}{t.slice(t.length - d.suf)}</span>;
}

function PickTile({ p, current, onPick, diff }) {
  const d = diff || printingDiff([]);
  const tags = (p.tags || []).filter((t) => d.tags.has(t) || (p.tags || []).length <= 2);
  return (
    <button type="button" className="pick" aria-current={current || undefined} onClick={() => onPick(p)}
      aria-label={`${p.name}, ${p.set_name || p.set.toUpperCase()} number ${p.cn}${p.lang ? `, ${p.lang}` : ""}${p.tags?.length ? `, ${p.tags.join(", ")}` : ""}`}>
      <span className="pcode" aria-hidden="true">
        <span className="pset"><DiffText text={p.set.toUpperCase()} d={d.set} /></span>
        <span className="pcn"><DiffText text={p.cn} d={d.cn} prefix="#" /></span>
        {/* Language variants share set + number: then the language is the difference. */}
        {d.lang && p.lang ? <span className="pcn"><mark>{p.lang.toUpperCase()}</mark></span> : null}
      </span>
      {p.img ? <img src={p.img} alt="" loading="lazy" decoding="async" /> : <span className="ph">{p.name}</span>}
      <span className="cap">
        <b>{p.name}</b>
        {p.set_name && <span className="muted" style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{p.set_name}</span>}
        <span className="ptags">
          {p.lang && <span className={`badge${d.lang ? " diff" : ""}`}>{p.lang.toUpperCase()}</span>}
          {p.finishes.length > 0 && <span className={`badge${d.finish ? " diff" : ""}`}>{p.finishes.map((f) => (f === "nonfoil" ? "non-foil" : f)).join(" / ")}</span>}
          {tags.map((t) => <span key={t} className={`badge${d.tags.has(t) ? " diff" : ""}`}>{t}</span>)}
        </span>
        {p.score != null && <span className="muted">score {p.score.toFixed(2)}</span>}
      </span>
    </button>
  );
}

/**
 * The user's own capture of the collector line (the high-res bottom strip),
 * zoomed in so near-identical printings can be told apart. Tries each source in
 * turn (server copy, then the local capture) and hides itself when none loads.
 * Pinch (touch), ctrl+wheel or the buttons zoom.
 */
function ScanStrip({ srcs, startZoom = 2 }) {
  const list = useMemo(() => (srcs || []).filter(Boolean), [srcs]);
  const [i, setI] = useState(0);
  const [zoom, setZoom] = useState(startZoom);
  const zoomRef = useRef(startZoom);
  zoomRef.current = zoom;
  const boxRef = useRef(null);
  const placed = useRef(false);

  // Zoom around a point (box coordinates), keeping that point in place.
  const zoomTo = useCallback((z, cx, cy) => {
    const box = boxRef.current;
    const prev = zoomRef.current;
    const next = Math.max(1, Math.min(6, z));
    if (!box || next === prev) return;
    const x = cx ?? box.clientWidth / 2, y = cy ?? box.clientHeight / 2;
    const sl = box.scrollLeft, st = box.scrollTop;
    zoomRef.current = next;
    setZoom(next);
    requestAnimationFrame(() => {
      box.scrollLeft = (sl + x) * (next / prev) - x;
      box.scrollTop = (st + y) * (next / prev) - y;
    });
  }, []);

  useEffect(() => {
    const box = boxRef.current;
    if (!box) return;
    let start = null;
    const dist = (t) => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
    const mid = (t) => {
      const r = box.getBoundingClientRect();
      return [(t[0].clientX + t[1].clientX) / 2 - r.left, (t[0].clientY + t[1].clientY) / 2 - r.top];
    };
    const onStart = (e) => { if (e.touches.length === 2) start = { d: dist(e.touches), z: zoomRef.current }; };
    const onMove = (e) => {
      if (!start || e.touches.length !== 2) return;
      e.preventDefault();
      const [x, y] = mid(e.touches);
      zoomTo(start.z * dist(e.touches) / start.d, x, y);
    };
    const onEnd = (e) => { if (e.touches.length < 2) start = null; };
    const onWheel = (e) => {
      if (!e.ctrlKey) return;
      e.preventDefault();
      const r = box.getBoundingClientRect();
      zoomTo(zoomRef.current * Math.exp(-e.deltaY / 200), e.clientX - r.left, e.clientY - r.top);
    };
    box.addEventListener("touchstart", onStart, { passive: true });
    box.addEventListener("touchmove", onMove, { passive: false });
    box.addEventListener("touchend", onEnd, { passive: true });
    box.addEventListener("touchcancel", onEnd, { passive: true });
    box.addEventListener("wheel", onWheel, { passive: false });
    return () => {
      box.removeEventListener("touchstart", onStart);
      box.removeEventListener("touchmove", onMove);
      box.removeEventListener("touchend", onEnd);
      box.removeEventListener("touchcancel", onEnd);
      box.removeEventListener("wheel", onWheel);
    };
  }, [zoomTo, i, list.length]);

  if (i >= list.length) return null;
  const onLoad = () => {
    // M15+ frames: the collector line sits in the upper-left part of the strip,
    // start there. Older frames (startZoom 1) show the whole strip.
    const box = boxRef.current;
    if (!box || placed.current) return;
    placed.current = true;
    box.scrollLeft = 0;
    box.scrollTop = Math.max(0, (box.scrollHeight - box.clientHeight) * 0.25);
  };
  return (
    <figure className="scan-strip" style={{ margin: 0 }}>
      <div className="strip-box" ref={boxRef}>
        <img src={list[i]} alt="Your scan: the card's bottom edge with set code and collector number" draggable={false}
          style={{ width: `${zoom * 100}%` }} onLoad={onLoad} onError={() => { placed.current = false; setI((n) => n + 1); }} />
      </div>
      <figcaption className="strip-bar">
        <span className="grow">Your scan · compare the set code and number</span>
        <button type="button" className="btn ghost icon" aria-label="Zoom out" disabled={zoom <= 1} onClick={() => zoomTo(zoom / 1.4)}><Icon.zoomOut /></button>
        <button type="button" className="btn ghost icon" aria-label="Zoom in" disabled={zoom >= 6} onClick={() => zoomTo(zoom * 1.4)}><Icon.zoomIn /></button>
      </figcaption>
    </figure>
  );
}

function PrintingPicker({ title, candidates = [], oracleId = null, lang = "", currentId = null, startInSearch = false, strips = null, onPick, onClose }) {
  const cands = useMemo(() => candidates.map((c) => (c && c.set !== undefined && c.cn !== undefined ? c : normPrinting(c))).filter((c) => c && c.id), [candidates]);
  const [mode, setMode] = useState(startInSearch ? "search" : cands.length ? "cand" : oracleId ? "all" : "search");
  const [oid, setOid] = useState(oracleId || cands.find((c) => c.oracle_id)?.oracle_id || null);
  const [plang, setPlang] = useState(lang || "");
  const [all, setAll] = useState(null);
  const [q, setQ] = useState("");
  const dq = useDebounced(q.trim(), 300);
  const [hits, setHits] = useState(null);
  const [error, setError] = useState(null);
  const candDiff = useMemo(() => printingDiff(cands), [cands]);
  // Only the 2015 frame puts the collector line in the strip's upper-left
  // corner; for older frames (info at the centre/right) start with the whole strip.
  const stripZoom = cands.length && cands.every((c) => c.frame && c.frame !== "2015" && c.frame !== "future") ? 1 : 2;
  const allDiff = useMemo(() => printingDiff(all || []), [all]);

  useEffect(() => {
    if (mode !== "all" || !oid) return;
    let alive = true;
    setAll(null); setError(null);
    const params = new URLSearchParams({ oracle_id: oid });
    if (plang) params.set("lang", plang);
    api(`/api/printings?${params}`)
      .then((d) => { if (alive) setAll(asList(d, "printings", "rows").map(normPrinting).filter((p) => p && p.id)); })
      .catch((e) => { if (alive) setError(e.message); });
    return () => { alive = false; };
  }, [mode, oid, plang]);

  useEffect(() => {
    if (mode !== "search" || dq.length < 2) { setHits(null); return; }
    let alive = true;
    setError(null);
    const params = new URLSearchParams({ q: dq });
    if (plang) params.set("lang", plang);
    api(`/api/printings/search?${params}`)
      .then((d) => { if (alive) setHits(asList(d, "results", "rows", "printings")); })
      .catch((e) => { if (alive) setError(e.message); });
    return () => { alive = false; };
  }, [mode, dq, plang]);

  const langSelect = (
    <select className="select" style={{ width: "auto" }} aria-label="Language filter" value={plang} onChange={(e) => setPlang(e.target.value)}>
      <option value="">All languages</option>
      {SCAN_LANGS.map(([k, label]) => <option key={k} value={k}>{label}</option>)}
    </select>
  );

  return (
    <Sheet title={title} onClose={onClose} pinned={strips && strips.length ? <ScanStrip srcs={strips} startZoom={stripZoom} /> : null}>
      <div className="stack">
        <div className="row">
          <div className="segmented" role="group" aria-label="Show">
            {cands.length > 0 && <button type="button" aria-pressed={mode === "cand"} onClick={() => setMode("cand")}>Candidates ({cands.length})</button>}
            {oid && <button type="button" aria-pressed={mode === "all"} onClick={() => setMode("all")}>All printings</button>}
            <button type="button" aria-pressed={mode === "search"} onClick={() => setMode("search")}><Icon.search /> Name</button>
          </div>
          {mode !== "cand" && langSelect}
        </div>
        <ErrorNotice error={error} />
        {mode === "cand" && (
          <div className="pick-grid">{cands.map((p) => <PickTile key={p.id} p={p} diff={candDiff} current={p.id === currentId} onPick={onPick} />)}</div>
        )}
        {mode === "all" && (!all ? (!error && <Spinner />) : all.length === 0
          ? <p className="muted">No printings found{plang ? " in this language" : ""}.</p>
          : <div className="pick-grid">{all.map((p) => <PickTile key={p.id} p={p} diff={allDiff} current={p.id === currentId} onPick={onPick} />)}</div>)}
        {mode === "search" && (
          <div className="stack">
            <div className="search">
              <Icon.search />
              <label htmlFor="pick-q" className="sr-only">Card name</label>
              <input id="pick-q" className="input" type="search" autoFocus autoComplete="off" autoCorrect="off" spellCheck="false"
                placeholder="Card name (any language)…" value={q} onChange={(e) => setQ(e.target.value)} />
            </div>
            {hits && hits.length === 0 && <p className="muted">No card matches “{dq}”.</p>}
            {hits && hits.length > 0 && (
              <div className="hit-list">
                {hits.map((h, i) => (
                  <button key={`${h.id || h.oracle_id}-${i}`} type="button" className="hit"
                    onClick={() => { setOid(h.oracle_id); if (h.lang && !plang) setPlang(h.lang); setMode("all"); }}>
                    <span><b>{h.printed_name || h.name}</b>{h.printed_name && h.printed_name !== h.name && <span className="muted small"> · {h.name}</span>}</span>
                    {h.lang && <span className="badge">{String(h.lang).toUpperCase()}</span>}
                  </button>
                ))}
              </div>
            )}
          </div>
        )}
      </div>
    </Sheet>
  );
}

// ---------------------------------------------------------------------------
// Commit sheet: add staged scans to a binder or a deck

function CommitSheet({ ids, onClose, onDone }) {
  const saved = store.get("mtg.scan.target", {}) || {};
  const [type, setType] = useState(saved.type === "deck" ? "deck" : "binder");
  const [binders, setBinders] = useState(null);
  const [decks, setDecks] = useState(null);
  const [binder, setBinder] = useState(saved.type === "binder" && saved.name ? saved.name : "");
  const [newBinder, setNewBinder] = useState("");
  const [deckId, setDeckId] = useState(saved.type === "deck" && saved.id ? String(saved.id) : "");
  const [newDeck, setNewDeck] = useState({ name: "", format: "commander" });
  const [board, setBoard] = useState(saved.board || "main");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);

  useEffect(() => {
    api("/api/binders").then((d) => {
      // The unnamed bucket ("no binder") can't be a target: scans always go into a named binder.
      const list = asList(d, "binders").filter((x) => x.name);
      setBinders(list);
      setBinder((b) => (b && (b === "__new" || list.some((x) => x.name === b)) ? b : list[0]?.name || "__new"));
    }).catch(() => { setBinders([]); setBinder("__new"); });
    api("/api/decks").then((d) => {
      // Decks synced from ManaBox are rebuilt by the next replace import: not a target.
      const list = asList(d, "decks").filter((dk) => dk.source !== "manabox");
      setDecks(list);
      setDeckId((x) => (x && (x === "__new" || list.some((dk) => String(dk.id) === x)) ? x : list[0] ? String(list[0].id) : "__new"));
    }).catch(() => { setDecks([]); setDeckId("__new"); });
  }, []);

  let target = null, label = "";
  if (type === "binder") {
    const name = binder === "__new" ? newBinder.trim() : binder;
    if (name) { target = { type: "binder", name, create: binder === "__new" }; label = `binder “${name}”`; }
  } else if (deckId === "__new") {
    if (newDeck.name.trim()) { target = { type: "deck", name: newDeck.name.trim(), create: true, format: newDeck.format, board }; label = `new deck “${newDeck.name.trim()}”`; }
  } else if (deckId) {
    const dk = decks?.find((d) => String(d.id) === deckId);
    target = { type: "deck", id: Number(deckId), board };
    label = `deck “${dk?.name || deckId}”`;
  }

  const submit = async (e) => {
    e.preventDefault();
    if (!target || busy) return;
    setBusy(true); setError(null);
    try {
      const res = await api("/api/scans/commit", { method: "POST", json: { ids, target } });
      const resTarget = res?.target || {};
      store.set("mtg.scan.target", target.type === "binder"
        ? { type: "binder", name: target.name }
        : { type: "deck", id: resTarget.id ?? target.id ?? null, board });
      onDone(res, label);
    } catch (err) {
      setError(err.message);
    } finally {
      setBusy(false);
    }
  };

  return (
    <Sheet title={`Add ${plural(ids.length, "scan")} to…`} onClose={onClose}>
      <form className="stack" onSubmit={submit}>
        <div className="segmented" role="group" aria-label="Destination">
          <button type="button" aria-pressed={type === "binder"} onClick={() => setType("binder")}><Icon.collection /> Binder</button>
          <button type="button" aria-pressed={type === "deck"} onClick={() => setType("deck")}><Icon.decks /> Deck</button>
        </div>
        {type === "binder" && (
          <fieldset className="stack" style={{ border: 0, padding: 0, margin: 0 }}>
            <legend className="label" style={{ marginBottom: 8 }}>Binder (collection)</legend>
            {!binders && <Spinner />}
            {binders?.map((b) => (
              <label key={b.name} className="radio-card">
                <input type="radio" name="binder" checked={binder === b.name} onChange={() => setBinder(b.name)} />
                <span className="grow"><b>{b.name}</b><br /><span className="small muted">{plural(b.copies ?? b.cards ?? 0, "copy", "copies")}{b.sources ? ` · ${[].concat(b.sources).join(", ")}` : ""}</span></span>
              </label>
            ))}
            <label className="radio-card">
              <input type="radio" name="binder" checked={binder === "__new"} onChange={() => setBinder("__new")} />
              <span className="grow"><b>New binder…</b></span>
            </label>
            {binder === "__new" && (
              <input className="input" style={{ fontSize: 16 }} aria-label="New binder name" placeholder="New binder name, e.g. Trade binder" maxLength={100} autoFocus
                value={newBinder} onChange={(e) => setNewBinder(e.target.value)} />
            )}
          </fieldset>
        )}
        {type === "deck" && (
          <div className="stack">
            <div className="field">
              <label htmlFor="commit-deck">Deck</label>
              <select id="commit-deck" className="select" value={deckId} onChange={(e) => setDeckId(e.target.value)}>
                {decks?.map((d) => <option key={d.id} value={String(d.id)}>{d.name}{d.format ? ` (${d.format})` : ""}</option>)}
                <option value="__new">New deck…</option>
              </select>
            </div>
            {deckId === "__new" && (
              <div className="row" style={{ alignItems: "flex-end" }}>
                <div className="field grow" style={{ flexBasis: 200 }}>
                  <label htmlFor="commit-deck-name">Deck name</label>
                  <input id="commit-deck-name" className="input" required maxLength={200} value={newDeck.name} onChange={(e) => setNewDeck({ ...newDeck, name: e.target.value })} />
                </div>
                <div className="field" style={{ flexBasis: 150, flexGrow: 1 }}>
                  <label htmlFor="commit-deck-format">Format</label>
                  <select id="commit-deck-format" className="select" value={newDeck.format} onChange={(e) => setNewDeck({ ...newDeck, format: e.target.value })}>
                    {FORMATS.map((f) => <option key={f} value={f}>{cap(f)}</option>)}
                  </select>
                </div>
              </div>
            )}
            <div className="field">
              <label htmlFor="commit-board">Board</label>
              <select id="commit-board" className="select" value={board} onChange={(e) => setBoard(e.target.value)}>
                {BOARDS.map(([k, l]) => <option key={k} value={k}>{l}</option>)}
              </select>
            </div>
            <p className="small muted" style={{ margin: 0 }}>Deck cards are added to the deck list; they don't change your binders.</p>
          </div>
        )}
        <ErrorNotice error={error} />
        <button type="submit" className="btn primary" disabled={!target || busy}>
          {busy ? <><span className="spinner" aria-hidden="true" style={{ borderTopColor: "var(--accent-ink)" }} /> Adding…</> : <><Icon.check /> Add {plural(ids.length, "scan")}{label ? ` to ${label}` : ""}</>}
        </button>
      </form>
    </Sheet>
  );
}

// ---------------------------------------------------------------------------
// Calibration: confirm or correct the truth for each scan

function TruthSheet({ entry, onClose, onDone, onPickNeeded }) {
  const { scan, result, preview } = entry;
  const detected = normPrinting(result?.printing || scan?.printing || (scan ? { ...scan, id: scan.printing_id } : null));
  const [finish, setFinish] = useState(normFinish(result?.finish || scan?.finish));
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);
  const confirm = async (printingId) => {
    if (!scan?.id || !printingId) return;
    setBusy(true); setError(null);
    try {
      await api(`/api/scans/${scan.id}/truth`, { method: "POST", json: { printing_id: printingId, finish } });
      onDone(`Truth saved for scan #${scan.id}`);
    } catch (e) { setError(e.message); } finally { setBusy(false); }
  };
  const fin = scan ? scanFinishes(scan) : ["nonfoil", "foil", "etched"];
  return (
    <Sheet title="Calibration: is this right?" onClose={onClose}>
      <div className="stack">
        <div className="truth">
          <figure>{preview ? <img src={preview} alt="Your capture" /> : <div className="ph" />}<figcaption>Your capture</figcaption></figure>
          <figure>
            {detected?.img ? <img src={detected.img} alt={detected.name} /> : <div className="pick"><span className="ph">{detected?.name || "No match"}</span></div>}
            <figcaption>{detected ? `${detected.name} · ${printingLabel(detected)}` : `Identification: ${result?.status || "failed"}`}</figcaption>
          </figure>
        </div>
        <div className="row">
          <span className="label">Finish</span>
          <div className="segmented" role="group" aria-label="Finish">
            {fin.map((f) => <button key={f} type="button" aria-pressed={finish === f} onClick={() => setFinish(f)}>{FINISH_LABEL[f]}</button>)}
          </div>
        </div>
        <ErrorNotice error={error} />
        {!scan?.id && <div className="notice warn"><div className="grow">This scan was not staged. Pick the right printing to stage it and record the truth.</div></div>}
        <div className="row">
          {scan?.id && detected?.id && <button type="button" className="btn primary" disabled={busy} onClick={() => confirm(detected.id)}><Icon.check /> Correct</button>}
          <button type="button" className="btn" disabled={busy} onClick={() => onPickNeeded(finish)}>Wrong: pick the printing</button>
          <button type="button" className="btn ghost" onClick={onClose}>Skip</button>
        </div>
        <p className="small muted" style={{ margin: 0 }}>Pick the exact printing <b>in the language printed on the card</b>. The scores and OCR output of this scan are kept to tune the scanner thresholds.</p>
      </div>
    </Sheet>
  );
}

// ---------------------------------------------------------------------------
// Staged scan row

function ScanRow({ s, status, selected, onSelect, onPatch, onDelete, onIncrement, onPick, onConfirm }) {
  const p = normPrinting({ ...s, id: s.store_printing_id || s.printing_id });
  const fins = scanFinishes(s);
  const finish = normFinish(s.finish);
  const nextFinish = fins[(fins.indexOf(finish) + 1) % fins.length];
  const variants = jsonArr(s.variants);
  const qty = s.quantity ?? 1;
  const thumb = scanThumb(s);
  const ld = (s.lang_detected || "").toUpperCase(), ls = (s.store_lang || "").toUpperCase();
  return (
    <div className={`scan-row st-${status}`} aria-selected={selected}>
      <label className="sel"><input type="checkbox" checked={selected} onChange={(e) => onSelect(e.target.checked)} aria-label={`Select ${s.name || "scan"}`} /></label>
      <button type="button" className="thb" onClick={onPick} aria-label={`Change printing of ${s.name || "scan"}`}>
        {thumb ? <img className="th" src={thumb} alt="" loading="lazy" decoding="async" /> : <span className="th" />}
      </button>
      <div className="info">
        <div className="top">
          <span className="nm" title={s.name}>{s.name || "Unidentified card"}</span>
          <span className={`badge st-chip ${status}`}>{STATUS_LABEL[status] || status}</span>
        </div>
        <div className="sub">
          {s.set_code && <span>{String(s.set_code).toUpperCase()} #{s.collector_number}</span>}
          {(ld || ls) && <span className="badge" title="Detected language → stored language">{ld && ls && ld !== ls ? `${ld}→${ls}` : ls || ld}</span>}
          {s.method && <span className="muted">{s.method}{typeof s.confidence === "number" ? ` ${Math.round(s.confidence * 100)}%` : ""}</span>}
        </div>
      </div>
      <div className="ctrls">
        <div className="stepper" role="group" aria-label="Quantity">
          <button type="button" aria-label="One less" disabled={qty <= 1} onClick={() => onPatch({ quantity: qty - 1 })}><Icon.minus /></button>
          <output aria-live="polite">{qty}</output>
          <button type="button" aria-label="One more" onClick={onIncrement}><Icon.plus /></button>
        </div>
        <button type="button" className={`btn sm finish-btn ${finish}`} disabled={fins.length < 2}
          title={fins.length < 2 ? `Only printed ${FINISH_LABEL[finish] || finish}` : `Switch to ${FINISH_LABEL[nextFinish]}`}
          onClick={() => onPatch({ finish: nextFinish })}>{finish !== "nonfoil" && "✦ "}{FINISH_LABEL[finish] || finish}</button>
        <select className="select" aria-label="Condition" value={s.condition || "near_mint"} onChange={(e) => onPatch({ condition: e.target.value })}>
          {CONDITIONS.map(([k, , short]) => <option key={k} value={k}>{short}</option>)}
        </select>
        <select className="select" aria-label="Store as language" value={s.store_lang || "en"} onChange={(e) => onPatch({ store_lang: e.target.value })}>
          {SCAN_LANGS.map(([k]) => <option key={k} value={k}>{k.toUpperCase()}</option>)}
        </select>
        {status === "suggest" && <button type="button" className="btn sm" onClick={onConfirm}><Icon.check /> Confirm</button>}
        {(status === "review" || status === "failed") && <button type="button" className="btn sm danger" onClick={onPick}>Pick printing</button>}
        {variants.length > 0 && <button type="button" className="chip" onClick={onPick} title="Promo / List / other printings share this collector number">variant?</button>}
        <button type="button" className="btn ghost icon sm" aria-label={`Delete ${s.name || "scan"}`} onClick={onDelete} style={{ marginLeft: "auto" }}><Icon.trash /></button>
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------------
// Scan tab

function ScanTab({ active, health, onCommitted }) {
  const [lib, setLib] = useState(null);
  const [libError, setLibError] = useState(null);
  const [settings, setSettings] = useState(() => ({ ...SCAN_DEFAULTS, ...(store.get("mtg.scan.settings", {}) || {}) }));
  const [scans, setScans] = useState(null);
  const [listError, setListError] = useState(null);
  const [busy, setBusy] = useState(false);
  const busyRef = useRef(false);
  const cancelRef = useRef(null); // aborts the scan request in flight
  // A scan that takes long: {since, warming} (warming = the server's fingerprint matcher is still loading).
  const [slow, setSlow] = useState(null);
  const [last, setLast] = useState(null); // {kind, scan, result, payload, preview, error, timeout}
  const [sheet, setSheet] = useState(null);
  const [selected, setSelected] = useState(() => new Set());
  const [toast, setToast] = useState(null);
  const [flash, setFlash] = useState(null);
  const [rearmKey, bumpRearm] = useReducer((x) => x + 1, 0);
  const [statusById, setStatusById] = useState({});
  const settingsRef = useRef(settings);
  settingsRef.current = settings;
  const replaceRef = useRef(null);
  // Scanner v2: capture.js module, the CaptureController (shared with CameraViewV2 so
  // upload answers reach it), the detector analyzer (for hash crops), the upload queue.
  const [capMod, setCapMod] = useState(null);
  const ctlRef = useRef(null);
  const detRef = useRef(null);
  const queueRef = useRef(null);
  const handlers = useRef({}); // the queue's callbacks, refreshed every render
  const [queued, setQueued] = useState(0);
  const [chip, setChip] = useState(null); // {scanId, d}: "Same card again?"
  const [busyPreview, setBusyPreview] = useState(null);
  const [detChoice, setDetChoice] = useState(readDetChoice);
  const [sound, setSoundState] = useState(loadSoundSettings);
  const soundRef = useRef(sound);
  soundRef.current = sound;
  const soundsRef = useRef(null); // scanlib createScanSounds()
  const priceRef = useRef(new Map()); // scan id → price_eur (sound for +1)
  const [rec, setRec] = useState(null); // record session {session, startedAt, frames, bytes, errors}
  const [, tick] = useReducer((x) => x + 1, 0);

  useEffect(() => {
    if (!active || lib) return;
    let alive = true;
    // capture.js only matters for v2; if it fails to load the classic scanner still works.
    Promise.all([import("./scanlib.js"), import("./capture.js").catch(() => null)])
      .then(([m, c]) => {
        if (!alive) return;
        try { soundsRef.current = m.createScanSounds ? m.createScanSounds() : null; } catch { soundsRef.current = null; }
        setCapMod(c);
        setLib(m);
      })
      .catch((e) => { if (alive) setLibError(`Could not load the scanner: ${e.message}`); });
    return () => { alive = false; };
  }, [active, lib]);

  // v2 needs scanlib's detector + capture.js; anything missing falls back to the classic scanner.
  const urlDet = detUrlOverride();
  const detVersion = lib ? (lib.scanDetVersion ? lib.scanDetVersion() : "v1") : (urlDet || detChoice);
  const v2 = Boolean(lib && capMod && detVersion === "v2" && lib.createDetAnalyzer);
  const v2Ref = useRef(v2);
  v2Ref.current = v2;

  const pushItem = useCallback((item) => {
    const q = queueRef.current;
    if (!item || !q) return;
    q.push(item);
    setQueued(q.length);
  }, []);

  useEffect(() => {
    if (!capMod) return;
    const q = new capMod.UploadQueue({
      send: (item) => handlers.current.send(item),
      onResult: (item, res) => handlers.current.onResult(item, res),
      onError: (item, err) => handlers.current.onError(item, err),
      onGiveUp: (item, err) => handlers.current.onGiveUp(item, err),
    });
    queueRef.current = q;
    return () => { if (queueRef.current === q) queueRef.current = null; };
  }, [capMod]);

  // One controller per calibration setting; a held photo is uploaded before it is replaced
  // and upload ids keep counting (answers for the old controller's uploads must not collide).
  useEffect(() => {
    if (!capMod) return;
    const old = ctlRef.current;
    if (old) pushItem(old.takeHeld());
    const crop = (o, quad) => {
      try {
        const img = detRef.current?.hashCrop?.(quad);
        return img ? { width: img.width, height: img.height, channels: img.channels || 4, data: img.data } : null;
      } catch { return null; }
    };
    const ctl = new capMod.CaptureController({ crop, cfg: readCaptureOverrides(), calibration: settings.calibration });
    if (ctl.ignored?.length) console.warn(`Scanner: ignored capture overrides ${ctl.ignored.join(", ")}`);
    if (old) { ctl.nextId = old.nextId; ctl.plus = old.plus || []; } // deferred "+1"s still wait for their row
    ctlRef.current = ctl;
    setChip(null);
  }, [capMod, settings.calibration, pushItem]);

  // Record session: elapsed time ticks; auto-off after RECORD_MAX_MS.
  useEffect(() => {
    if (!rec) return;
    const t = setInterval(() => {
      if (Date.now() - rec.startedAt >= RECORD_MAX_MS) {
        setRec(null);
        setToast({ text: "Recording stopped after 15 minutes." });
      } else tick();
    }, 1000);
    return () => clearInterval(t);
  }, [rec?.session, rec?.startedAt]); // eslint-disable-line react-hooks/exhaustive-deps

  const setSetting = (k, v) => setSettings((s) => { const n = { ...s, [k]: v }; store.set("mtg.scan.settings", n); return n; });
  const setSound = (k, v) => setSoundState((s) => { const n = { ...s, [k]: v }; store.set("mtg.scan.sound", n); return n; });
  const unlockSounds = () => { try { soundsRef.current?.unlock?.()?.catch?.(() => {}); } catch { /* no audio */ } };

  const loadScans = useCallback(async () => {
    try {
      const d = await api("/api/scans?status=staged");
      const list = asList(d, "scans", "rows").slice().sort((a, b) => (b.id ?? 0) - (a.id ?? 0));
      setScans(list);
      setListError(null);
      setSelected((sel) => new Set([...sel].filter((id) => list.some((s) => s.id === id))));
    } catch (e) {
      setListError(e.status === 404 ? "The scanner is not available on this server (update the app)." : `Could not load scans: ${e.message}`);
      setScans((s) => s || []);
    }
  }, []);
  useEffect(() => { if (active) loadScans(); }, [active, loadScans]);

  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(null), toast.ms || 4000);
    return () => clearTimeout(t);
  }, [toast]);

  const statusOf = useCallback((s) => {
    if (!s) return "failed";
    if (statusById[s.id]) return statusById[s.id];
    const raw = s.result_status || s.identify_status || s.decision || s.status;
    if (["auto", "suggest", "review", "failed"].includes(raw)) return raw;
    if (!s.printing_id && !s.store_printing_id) return "review";
    return "auto";
  }, [statusById]);
  const markStatus = (id, st) => setStatusById((m) => ({ ...m, [id]: st }));

  // kind: a scan status (auto|suggest|review|failed|duplicate|error) or "increment" (+1);
  // res: the /api/scan answer {scan, duplicate, result}, or {increment:true, price_eur} for +1.
  // scanlib's chooseScanSound picks success, cash (price ≥ threshold) or nothing.
  const feedback = (kind, res = null) => {
    try {
      const snd = res ? lib?.chooseScanSound?.(res, soundRef.current) : null;
      if (snd) soundsRef.current?.play?.(snd);
    } catch { /* never block scanning on audio */ }
    vibrate(kind);
    setFlash({ color: STATUS_COLOR[kind === "increment" ? "auto" : kind] || "#ffffff", until: Date.now() + 900 });
  };

  const showError = (msg) => setToast({ text: msg, ms: 5000 });

  // itemId: the v2 upload that produced it (a pick adopts the card in view, see onPicked).
  function openPickerFor(scan, result, { truthFinish = null, payload = null, itemId = null } = {}) {
    // The user's own collector line: the server's stored strip, else the local capture.
    const strips = [];
    if (scan?.id && scan.has_strip !== false) strips.push(scanFileUrl(scan, "strip"));
    if (payload?.strip) strips.push(`data:image/jpeg;base64,${payload.strip}`);
    const cands = [...candidatesOf(result, scan), ...jsonArr(result?.variants || scan?.variants).map(normPrinting)]
      .filter((p, i, a) => p && p.id && a.findIndex((x) => x.id === p.id) === i);
    setSheet({
      type: "pick", scan, candidates: cands, truthFinish, strips, itemId,
      oracleId: scan?.oracle_id || result?.printing?.oracle_id || cands[0]?.oracle_id || null,
      lang: scan?.lang_detected || result?.lang_detected || "",
    });
  }

  // The controller's last upload no longer counts (review/failed/error): the card in view is
  // uploaded again after the next motion. A held photo comes back as an upload item.
  // "+1" answers given while this upload was still being identified are uploaded as rows of their own.
  const forgetFor = (item) => {
    const ctl = ctlRef.current;
    if (!ctl || item?.id == null) return;
    for (const it of ctl.uploadLost?.(item.id) || []) pushItem(it);
    if (ctl.cap?.id === item.id) pushItem(ctl.forgetCapture());
  };
  // Row `id` was undone/committed/deleted (no id: unknown row, forget anyway).
  const forgetRow = (id) => {
    const ctl = ctlRef.current;
    if (ctl) pushItem(ctl.forgetCapture(id ?? undefined));
  };

  // item: the v2 upload-queue item (null for v1 and manual sends).
  async function handleResult(res, payload, preview, item = null) {
    const r = res?.result || {};
    const scan = res?.scan || null;
    const ctl = item ? ctlRef.current : null;
    if (scan?.id && r.price_eur != null) priceRef.current.set(scan.id, r.price_eur);
    if (res?.duplicate) {
      if (ctl && item.id != null && scan?.id) applyPlus(ctl.uploaded(item.id, scan.id));
      setLast({ kind: "duplicate", scan, result: r, payload, preview });
      feedback("duplicate", res);
      // An unanswered "+1?" chip came back as a duplicate: nothing was counted. Say so until
      // dismissed (the next card's result would cover the result card within a second).
      const chipLabel = item?.capture?.chip?.label;
      if (scan?.id && (chipLabel === "ignored" || chipLabel === "forgotten")) {
        const id = scan.id;
        setToast({ text: `Not counted: ${scan.name || "same card"} (another copy?)`, ms: 600000, action: { label: "+1", run: () => increment(id) } });
      }
      return;
    }
    const status = ["auto", "suggest", "review", "failed"].includes(r.status) ? r.status : scan ? statusOf(scan) : "failed";
    if (ctl && item.id != null) {
      if (scan?.id && (status === "auto" || status === "suggest")) applyPlus(ctl.uploaded(item.id, scan.id));
      else forgetFor(item);
    }
    if (scan?.id) markStatus(scan.id, status);
    setLast({ kind: status, scan, result: r, payload, preview });
    feedback(status, res);
    loadScans();
    if (settingsRef.current.calibration) setSheet({ type: "truth", entry: { scan, result: r, preview, payload } });
    else if (status === "review" || status === "failed") {
      if (candidatesOf(r, scan).length) openPickerFor(scan, r, { payload, itemId: item?.id ?? null });
    }
  }

  // One POST /api/scan with the busy/slow/cancel UI. Resolves with the answer; throws the
  // ApiError (status kept: the v2 queue retries 429) or an Error with timeout:true when
  // cancelled/timed out.
  async function requestScan(payload, preview) {
    busyRef.current = true;
    setBusy(true);
    setSlow(null);
    setBusyPreview(preview || null);
    // After a server start the first scan waits for the scanner's warm-up
    // (fingerprints loading): say so instead of looking hung. After
    // SCAN_CANCEL_MS the user may cancel (with a retry); SCAN_TIMEOUT_MS is
    // above the server's own bound (warm-up wait + OCR + Claude), so a slow
    // but working scan is never cut off. A cancelled request is dropped by
    // the server (nothing staged), so Retry can't add the card twice.
    const ctl = new AbortController();
    cancelRef.current = () => ctl.abort(new DOMException("Cancelled", "AbortError"));
    const since = Date.now();
    const checkWarm = async () => {
      let warming = null;
      try {
        const h = await api("/healthz", { signal: ctl.signal });
        const st = h?.scanner?.matcher?.state;
        warming = st === "loading" || st === "idle";
      } catch { warming = null; }
      if (!ctl.signal.aborted) setSlow({ since, warming, cancellable: Date.now() - since >= SCAN_CANCEL_MS });
    };
    const slowTimer = setTimeout(checkWarm, SCAN_SLOW_MS);
    const pollTimer = setInterval(checkWarm, SCAN_SLOW_MS * 2);
    const cancelTimer = setTimeout(() => { if (!ctl.signal.aborted) setSlow((s) => ({ since, warming: s?.warming ?? null, cancellable: true })); }, SCAN_CANCEL_MS);
    const abortTimer = setTimeout(() => ctl.abort(), SCAN_TIMEOUT_MS);
    try {
      return await api("/api/scan", { method: "POST", json: payload, signal: ctl.signal });
    } catch (e) {
      if (e.name !== "AbortError") throw e;
      const error = Date.now() - since < SCAN_TIMEOUT_MS - 1000
        ? `Cancelled after ${Math.round((Date.now() - since) / 1000)} s; nothing was added. The scanner may still be warming up after a server start; try again in a moment.`
        : `No answer after ${Math.round(SCAN_TIMEOUT_MS / 1000)} s; nothing was added. Try again in a moment.`;
      throw Object.assign(new Error(error), { timeout: true });
    } finally {
      clearTimeout(slowTimer);
      clearInterval(pollTimer);
      clearTimeout(cancelTimer);
      clearTimeout(abortTimer);
      ctl.abort();
      cancelRef.current = null;
      busyRef.current = false;
      setBusy(false);
      setSlow(null);
      setBusyPreview(null);
    }
  }

  // v1 (and resends without the queue): single flight, as before.
  async function postScan(payload, preview) {
    if (busyRef.current) return;
    let res;
    try {
      res = await requestScan(payload, preview);
    } catch (e) {
      setLast({ kind: "error", error: e.message, timeout: Boolean(e.timeout), payload, preview });
      feedback("error");
      bumpRearm(); // let the same card be captured again
      return;
    }
    await handleResult(res, payload, preview);
  }

  /** The scan request body for a capture (settings at capture time). */
  const scanBody = (shot, consumeReplace = true, precise = false) => {
    const s = settingsRef.current;
    const body = {
      card: shot.card,
      strip: shot.strip,
      settings: { storageLang: s.storageLang, foil: s.foil, condition: s.condition, ...(s.setHint.trim() ? { setHint: s.setHint.trim().toLowerCase() } : {}), ...(precise ? { precise: true } : {}) },
      ...(s.calibration ? { calibration: true } : {}),
      ...(replaceRef.current ? { replace_id: replaceRef.current } : {}),
    };
    if (consumeReplace) replaceRef.current = null;
    return body;
  };

  const onCapture = (cap) => postScan(scanBody(cap), cap.cardPreview);

  // v2: CaptureController payload = {body, preview}; a "+1?" chip photo never takes the Rescan replace_id.
  const buildPayload = (shot, c, meta) => ({ body: scanBody(shot, !c?.hold, Boolean(meta?.precise)), preview: shot.cardPreview, kind: shot.kind });

  // Re-send a body already sent once (Send again, Retry, Different card, Ask Claude).
  const resend = (body, preview, extra = {}) => {
    const b = { ...body, ...extra };
    for (const k of Object.keys(b)) if (b[k] == null) delete b[k];
    if (!v2Ref.current || !queueRef.current) { postScan(b, preview); return; }
    const { capture, allowClaude, dup_of: dupOf, force, ...rest } = b;
    pushItem({ id: null, payload: { body: rest, preview }, capture: capture || null, allowClaude: allowClaude !== false, dup_of: dupOf ?? null, force: Boolean(force) });
  };

  // The v2 upload queue's callbacks (latest closures).
  handlers.current = {
    send: (item) => {
      const { capture: _c, allowClaude: _a, dup_of: _d, force: _f, ...rest } = item.payload?.body || {};
      const body = { ...rest, allowClaude: item.allowClaude !== false };
      if (item.capture) body.capture = item.capture;
      if (item.dup_of != null) body.dup_of = item.dup_of;
      if (item.force) body.force = true;
      item.sent = body;
      return requestScan(body, item.payload?.preview);
    },
    onResult: (item, res) => {
      setQueued(queueRef.current?.length ?? 0);
      handleResult(res, item.sent, item.payload?.preview, item);
    },
    onError: (item, err) => {
      setQueued(queueRef.current?.length ?? 0);
      setLast({ kind: "error", error: err?.message || "Scan failed", timeout: Boolean(err?.timeout), payload: item.sent, preview: item.payload?.preview });
      feedback("error");
      forgetFor(item);
    },
    onGiveUp: () => {
      setQueued(queueRef.current?.length ?? 0);
      setToast({ text: "The server is busy, scans are waiting.", ms: 600000, action: { label: "Retry", run: () => queueRef.current?.retry() } });
    },
  };

  // Chip answers. "+1": increment the chip's row; if that row is gone (404/409) the photo is
  // uploaded with dup_of so the server asks instead. "Scan as new": forced upload.
  // "+1" before the first copy has a row id: chipAnswer defers it and uploaded() hands it back.
  const chipPlus = async () => {
    const a = ctlRef.current?.chipAnswer("plus");
    setChip(null);
    if (!a) return;
    if (a.action === "upload") { pushItem(a.item); return; }
    if (a.action === "deferred") { setToast({ text: "+1 once the card is identified" }); return; }
    await runIncrement(a);
  };
  // Deferred "+1"s whose row is now known (ctl.uploaded()'s answer).
  const applyPlus = (actions) => { for (const a of actions || []) runIncrement(a); };
  const runIncrement = async (a) => {
    const capture = { ...a.capture, chip: a.event };
    try {
      await api(`/api/scans/${a.scanId}/increment`, { method: "POST", json: { capture } });
      setToast({ text: "+1 copy" });
      feedback("increment", { increment: true, price_eur: priceRef.current.get(a.scanId) ?? null });
      await loadScans();
    } catch (e) {
      if (e.status === 404 || e.status === 409) pushItem({ id: null, payload: a.payload, capture, allowClaude: false, dup_of: a.scanId, force: false });
      else showError(e.message);
    }
  };
  const chipNew = () => {
    const a = ctlRef.current?.chipAnswer("new");
    setChip(null);
    if (a?.item) pushItem(a.item);
  };
  const flushHeld = () => pushItem(ctlRef.current?.takeHeld());

  const patchScan = async (id, body, { status } = {}) => {
    try {
      await api(`/api/scans/${id}`, { method: "PATCH", json: body });
      if (status) markStatus(id, status);
      await loadScans();
      setLast((l) => (l?.scan?.id === id ? { ...l, kind: status || l.kind, scan: { ...l.scan, ...body } } : l));
    } catch (e) { showError(e.message); }
  };
  const deleteScan = async (id) => {
    try {
      await api(`/api/scans/${id}`, { method: "DELETE" });
      forgetRow(id);
      setLast((l) => (l?.scan?.id === id ? null : l));
      await loadScans();
    } catch (e) { showError(e.message); }
  };
  const increment = async (id) => {
    try {
      await api(`/api/scans/${id}/increment`, { method: "POST", json: {} });
      setToast({ text: "+1 copy" });
      feedback("increment", { increment: true, price_eur: priceRef.current.get(id) ?? null });
      await loadScans();
    } catch (e) { showError(e.message); }
  };
  const undo = async () => {
    try {
      const r = await api("/api/scans/undo", { method: "POST", json: {} });
      forgetRow(r?.scan?.id ?? r?.id ?? null);
      setLast(null);
      setToast({ text: r?.scan?.name || r?.name ? `Removed ${r.scan?.name || r.name}` : "Last scan undone" });
      await loadScans();
    } catch (e) { showError(e.status === 404 ? "Nothing to undo." : e.message); }
  };
  const forceAdd = () => {
    if (!last?.payload) return;
    resend(last.payload, last.preview, { force: true, dup_of: null });
  };
  // "Ask Claude" on a review/failed card: the same photo again, Claude allowed, replacing the review row.
  const askClaude = () => {
    if (!last?.payload) return;
    const replace = last.scan?.id && last.kind === "review" ? { replace_id: last.scan.id } : {};
    const { replace_id: _r, ...body } = last.payload;
    resend(body, last.preview, { allowClaude: true, dup_of: null, force: false, ...replace });
  };

  async function onPicked(p) {
    const sh = sheet;
    setSheet(null);
    if (!sh) return;
    const s = settingsRef.current;
    const singleFinish = p.finishes?.length === 1 ? p.finishes[0] : null;
    try {
      if (sh.type === "manual" || !sh.scan?.id) {
        const finish = sh.truthFinish || singleFinish || (s.foil === "foil" ? "foil" : "nonfoil");
        const res = await api("/api/scans/manual", { method: "POST", json: { printing_id: p.id, finish, quantity: 1, storageLang: s.storageLang, condition: s.condition } });
        const scan = res?.scan || (res?.id ? res : null);
        if (scan?.id) markStatus(scan.id, "auto");
        if (scan?.id && sh.itemId != null) ctlRef.current?.adopt?.(sh.itemId, scan.id);
        if (sh.truthFinish && scan?.id) {
          await api(`/api/scans/${scan.id}/truth`, { method: "POST", json: { printing_id: p.id, finish } }).catch(() => {});
        }
        setToast({ text: `Added ${p.name}` });
        feedback("auto");
      } else {
        await api(`/api/scans/${sh.scan.id}`, { method: "PATCH", json: { printing_id: p.id } });
        markStatus(sh.scan.id, "auto");
        // the card still in view is decided now: no re-upload (and second picker) on the next motion
        if (sh.itemId != null) ctlRef.current?.adopt?.(sh.itemId, sh.scan.id);
        if (sh.truthFinish) {
          await api(`/api/scans/${sh.scan.id}/truth`, { method: "POST", json: { printing_id: p.id, finish: sh.truthFinish } });
          setToast({ text: "Truth saved" });
        }
        setLast((l) => (l?.scan?.id === sh.scan.id ? { ...l, kind: "auto", scan: { ...l.scan, printing_id: p.id, name: p.name, set_code: p.set, collector_number: p.cn, image_normal: p.img } } : l));
      }
      await loadScans();
    } catch (e) { showError(e.message); }
  }

  const list = scans || [];
  const committable = list.filter((s) => (s.printing_id || s.store_printing_id) && !["review", "failed"].includes(statusOf(s)));
  const selIds = [...selected];
  // Review/failed rows can't be committed (the server refuses the whole batch): leave them out of a selection too.
  const committableIds = new Set(committable.map((s) => s.id));
  const selCommit = selIds.filter((id) => committableIds.has(id));
  const commitIds = selIds.length ? selCommit : committable.map((s) => s.id);
  const copies = list.reduce((a, s) => a + (s.quantity ?? 1), 0);
  const allSelected = list.length > 0 && selected.size === list.length;
  const scanner = health?.scanner;
  const sheetOpen = Boolean(sheet);

  return (
    <div className="scan">
      <div className="scan-main">
        {libError && <ErrorNotice error={libError} />}
        {scanner && scanner.index_ready === false && (
          <div className="notice warn" role="status"><span aria-hidden="true">⏳</span><div className="grow">The card index is still being built. Scanning works once it's ready (see Import → Scanner index).</div></div>
        )}
        {scanner && (scanner.tesseract === false || scanner.djpeg === false) && (
          <div className="notice warn" role="status"><div className="grow">Text recognition is not installed on the server{scanner.tesseract === false ? " (tesseract missing)" : ""}{scanner.djpeg === false ? " (djpeg missing)" : ""}. Scans will be less accurate.</div></div>
        )}
        <CameraView key={v2 ? "v2" : "v1"} v2={v2} lib={lib} active={active} settings={settings} busy={busy} paused={sheetOpen} flash={flash} rearmKey={rearmKey}
          onCapture={onCapture} onError={showError} onUnlock={unlockSounds}
          ctlRef={ctlRef} detRef={detRef} queued={queued} record={rec} buildPayload={buildPayload} onUpload={pushItem} onChip={setChip}
          onRecorded={(p) => setRec((r) => (r && r.session === p.session ? { ...r, frames: p.frames, bytes: p.bytes, errors: p.errors } : r))} />
        {v2 && chip && (
          <div className="same-chip" role="status" aria-live="polite">
            <span className="grow">Same card again?</span>
            <button type="button" className="btn sm primary" onClick={chipPlus}><Icon.plus /> +1</button>
            <button type="button" className="btn sm" onClick={chipNew}>Scan as new</button>
          </div>
        )}
        {(busy || last) && <ResultCard busy={busy} slow={slow} last={last} busyPreview={busyPreview} queued={v2 ? queued : 0} onCancel={() => cancelRef.current?.()} onPick={() => openPickerFor(last?.scan, last?.result, { payload: last?.payload })}
          onConfirm={() => last?.scan?.id && patchScan(last.scan.id, { printing_id: last.scan.printing_id }, { status: "auto" })}
          onIncrement={() => last?.scan?.id && increment(last.scan.id)} onForce={forceAdd} onUndo={undo}
          onResend={() => last?.payload && resend(last.payload, last.preview)}
          onAskClaude={v2 ? askClaude : null}
          onRetry={() => {
            // A rescan replaces the open review row of this card instead of adding a second one.
            replaceRef.current = last?.scan?.id && ["review", "failed"].includes(last.kind) ? last.scan.id : null;
            setLast(null);
            if (v2) { flushHeld(); setChip(null); ctlRef.current?.rearm(); } else bumpRearm();
          }} onSearch={() => setSheet({ type: "manual" })} />}

        <div className="scan-settings">
          <div className="segmented" role="group" aria-label="Foil">
            {[["auto", "Auto"], ["nonfoil", "Non-foil"], ["foil", "✦ Foil"]].map(([k, l]) => (
              <button key={k} type="button" aria-pressed={settings.foil === k} onClick={() => setSetting("foil", k)}>{l}</button>
            ))}
          </div>
          <label className="sr-only" htmlFor="scan-lang">Store cards as language</label>
          <select id="scan-lang" className="select" value={settings.storageLang} onChange={(e) => setSetting("storageLang", e.target.value)} title="Store scanned cards in this language">
            {SCAN_LANGS.map(([k, l]) => <option key={k} value={k}>Store as {l}</option>)}
          </select>
          <label className="switch"><input type="checkbox" checked={settings.auto} onChange={(e) => setSetting("auto", e.target.checked)} /> Auto-scan</label>
        </div>
        <details className="disclosure">
          <summary>More scan settings{settings.calibration ? " · calibration on" : ""}</summary>
          <div className="settings-grid">
            <div className="field">
              <label htmlFor="scan-cond">Condition for new scans</label>
              <select id="scan-cond" className="select" value={settings.condition} onChange={(e) => setSetting("condition", e.target.value)}>
                {CONDITIONS.map(([k, l]) => <option key={k} value={k}>{l}</option>)}
              </select>
            </div>
            <div className="field">
              <label htmlFor="scan-set">Set hint (optional)</label>
              <input id="scan-set" className="input" placeholder="e.g. dmu" maxLength={8} autoCapitalize="off" autoCorrect="off" spellCheck="false"
                value={settings.setHint} onChange={(e) => setSetting("setHint", e.target.value.replace(/[^a-z0-9]/gi, ""))} />
            </div>
            <label className="switch"><input type="checkbox" checked={sound.enabled} onChange={(e) => setSound("enabled", e.target.checked)} /> Scan sounds</label>
            <div className="field">
              <label htmlFor="scan-cash">Cash sound from (€)</label>
              <input id="scan-cash" className="input num-input" type="number" inputMode="decimal" min="0" step="0.5" disabled={!sound.enabled}
                defaultValue={sound.threshold} onChange={(e) => { const v = parseFloat(e.target.value); if (Number.isFinite(v) && v >= 0) setSound("threshold", v); }} />
            </div>
            <label className="switch"><input type="checkbox" checked={settings.photo} onChange={(e) => setSetting("photo", e.target.checked)} /> Full-resolution photo (Android)</label>
            <label className="switch" style={{ gridColumn: "1 / -1" }}><input type="checkbox" checked={settings.calibration} onChange={(e) => setSetting("calibration", e.target.checked)} /> Calibration mode: confirm the true printing after each scan</label>
            <div className="field" style={{ gridColumn: "1 / -1" }}>
              <span className="small" style={{ fontWeight: 600 }} id="scan-det-label">Scanner</span>
              <div className="segmented" role="group" aria-labelledby="scan-det-label">
                {[["v2", "New"], ["v1", "Classic"]].map(([k, l]) => (
                  <button key={k} type="button" aria-pressed={detVersion === k} disabled={Boolean(urlDet)}
                    onClick={() => { writeDetChoice(k); setDetChoice(k); }}>{l}</button>
                ))}
              </div>
              {urlDet && <span className="small muted">Set by ?det={urlDet} in the address.</span>}
              {lib && detVersion === "v2" && !v2 && <span className="small muted">The new scanner could not be loaded; using the classic one.</span>}
            </div>
            {v2 && (
              <div className="field" style={{ gridColumn: "1 / -1" }}>
                <label className="switch"><input type="checkbox" checked={Boolean(rec)}
                  onChange={(e) => setRec(e.target.checked ? { session: newRecordSession(), startedAt: Date.now(), frames: 0, bytes: 0, errors: 0 } : null)} /> Record session</label>
                <span className="small muted">Sends small camera frames and capture decisions to your server to tune the scanner. Stops by itself after 15 minutes.</span>
                {rec && (
                  <span className="small rec-status" role="status">
                    <span>● Recording {fmtElapsed(Date.now() - rec.startedAt)}</span>
                    <span>{plural(rec.frames, "frame")}</span>
                    {rec.errors > 0 && <span className="muted">{rec.errors} not sent</span>}
                  </span>
                )}
              </div>
            )}
            <RecordedSessions recording={rec?.session ?? null} />
          </div>
        </details>
      </div>

      <div className="scan-side">

        <div className="list-head">
          <h2 style={{ fontSize: "1.1rem" }}>Scanned {list.length > 0 && <span className="muted small">{plural(list.length, "card")} · {plural(copies, "copy", "copies")}</span>}</h2>
          <div className="row">
            <button type="button" className="btn sm" onClick={() => setSheet({ type: "manual" })}><Icon.plus /> Add by name</button>
            <button type="button" className="btn sm" onClick={undo} disabled={!list.length}><Icon.undo /> Undo</button>
          </div>
        </div>
        <ErrorNotice error={listError} onRetry={loadScans} />
        {!scans && !listError && <Spinner />}
        {scans && list.length === 0 && !listError && (
          <div className="empty card"><h3>No scans yet</h3><p style={{ margin: 0 }}>Scanned cards collect here. Check them, then add them to a binder or a deck.</p></div>
        )}
        {list.length > 0 && (
          <>
            <label className="switch"><input type="checkbox" checked={allSelected} onChange={(e) => setSelected(e.target.checked ? new Set(list.map((s) => s.id)) : new Set())} /> Select all</label>
            <div className="scan-list">
              {list.map((s) => (
                <ScanRow key={s.id} s={s} status={statusOf(s)} selected={selected.has(s.id)}
                  onSelect={(on) => setSelected((sel) => { const n = new Set(sel); if (on) n.add(s.id); else n.delete(s.id); return n; })}
                  onPatch={(body) => patchScan(s.id, body)} onDelete={() => deleteScan(s.id)} onIncrement={() => increment(s.id)}
