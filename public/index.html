                  onPick={() => openPickerFor(s, null, { payload: last?.scan?.id === s.id ? last.payload : null })} onConfirm={() => patchScan(s.id, { printing_id: s.printing_id }, { status: "auto" })} />
              ))}
            </div>
            <div className="commit-bar">
              <span className="grow small">{selIds.length ? `${plural(selIds.length, "scan")} selected` : `${plural(committable.length, "scan")} ready`}
                {!selIds.length && committable.length < list.length && <span className="muted"> · {list.length - committable.length} need a pick</span>}
                {selIds.length > selCommit.length && <span className="muted"> · {selIds.length - selCommit.length} need a pick first</span>}</span>
              <button type="button" className="btn primary" disabled={!commitIds.length} onClick={() => { flushHeld(); setChip(null); setSheet({ type: "commit", ids: commitIds }); }}>
                Add {selIds.length ? "selected" : "all"} to…
              </button>
            </div>
          </>
        )}
      </div>

      {sheet?.type === "pick" && (
        <PrintingPicker title={sheet.scan?.name ? `Which printing? ${sheet.scan.name}` : "Which card is it?"} candidates={sheet.candidates}
          oracleId={sheet.oracleId} lang={sheet.lang} currentId={sheet.scan?.printing_id} strips={sheet.strips} onPick={onPicked} onClose={() => setSheet(null)} />
      )}
      {sheet?.type === "manual" && (
        <PrintingPicker title="Add a card by name" startInSearch lang="" onPick={onPicked} onClose={() => setSheet(null)} />
      )}
      {sheet?.type === "commit" && (
        <CommitSheet ids={sheet.ids} onClose={() => setSheet(null)} onDone={(res, label) => {
          setSheet(null);
          setSelected(new Set());
          sheet.ids.forEach((id) => forgetRow(id));
          const n = res?.committed ?? sheet.ids.length;
          setToast({ text: `Added ${typeof n === "number" ? plural(n, "scan") : "scans"} to ${label}` });
          setLast(null);
          loadScans();
          onCommitted?.();
        }} />
      )}
      {sheet?.type === "truth" && (
        <TruthSheet entry={sheet.entry} onClose={() => setSheet(null)}
          onDone={(msg) => { setSheet(null); setToast({ text: msg }); }}
          onPickNeeded={(finish) => openPickerFor(sheet.entry.scan, sheet.entry.result, { truthFinish: finish, payload: sheet.entry.payload })} />
      )}
      {toast && (
        <div className="toast" role="status" aria-live="polite">
          <span>{toast.text}</span>
          {toast.action && <button type="button" className="btn ghost sm" onClick={() => { const a = toast.action; setToast(null); a.run(); }}>{toast.action.label}</button>}
          <button type="button" className="btn ghost icon sm" aria-label="Dismiss" onClick={() => setToast(null)} style={{ textDecoration: "none" }}><Icon.close /></button>
        </div>
      )}
    </div>
  );
}

// A scan slower than SCAN_SLOW_MS shows the warm-up state; from SCAN_CANCEL_MS on it can be
// cancelled (then retried); SCAN_TIMEOUT_MS (above the server's 30 s warm-up wait + OCR + 90 s
// Claude) aborts it for good.
const SCAN_SLOW_MS = 4000;
const SCAN_CANCEL_MS = 60000;
const SCAN_TIMEOUT_MS = 180000;

/** Seconds since `since`, ticking once a second. */
function ScanElapsed({ since }) {
  const [now, setNow] = useState(Date.now());
  useEffect(() => {
    const t = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(t);
  }, []);
  return <span className="small muted">{Math.max(0, Math.round((now - since) / 1000))} s</span>;
}

function ResultCard({ busy, slow, last, busyPreview, queued = 0, onCancel, onPick, onConfirm, onIncrement, onForce, onResend, onUndo, onRetry, onSearch, onAskClaude }) {
  if (busy) {
    // slow.warming: true = the matcher is loading, false = it is ready (just slow), null = /healthz unknown.
    const title = !slow ? "Identifying…" : slow.warming === false ? "Still identifying…" : "Identifying… (warming up the scanner)";
    const detail = !slow ? "Reading the collector line and matching the art."
      : slow.warming === false ? "The server is busy; this is taking longer than usual."
        : "The first scan after a server start waits for the card fingerprints to load. This can take up to a minute.";
    return (
      <div className="result st-busy" role="status" aria-live="polite">
        {busyPreview || last?.preview ? <img className="th" src={busyPreview || last.preview} alt="" /> : <span className="th" />}
        <div className="body"><span className="nm">{title}</span><span className="small muted">{detail}</span>
          {queued > 1 && <span className="small muted">{plural(queued - 1, "more card")} waiting</span>}
          {slow && <ScanElapsed since={slow.since} />}
          <div className="progress" aria-hidden="true" /></div>
        {slow?.cancellable && onCancel && (
          <div className="actions"><button type="button" className="btn sm" onClick={onCancel}><Icon.close /> Cancel</button></div>
        )}
      </div>
    );
  }
  if (!last) return null;
  const { kind, scan, result: r = {} } = last;
  if (kind === "error") {
    return (
      <div className="result st-error" role="alert">
        {last.preview ? <img className="th" src={last.preview} alt="" /> : <span className="th" />}
        <div className="body"><span className="nm">{last.timeout ? "Scan stopped" : "Scan failed"}</span><span className="small">{last.error}</span></div>
        <div className="actions">
          {last.payload && <button type="button" className={`btn sm${last.timeout ? " primary" : ""}`} onClick={onResend}>{last.timeout ? <><Icon.refresh /> Retry</> : "Send again"}</button>}
          <button type="button" className="btn sm" onClick={onRetry}><Icon.camera /> Rescan</button>
        </div>
      </div>
    );
  }
  const store_ = normPrinting(r.store || r.printing) || (scan ? normPrinting({ ...scan, id: scan.store_printing_id || scan.printing_id }) : null);
  const name = scan?.name || store_?.name || "Unknown card";
  const thumb = (scan && scanThumb(scan)) || store_?.imgSmall || last.preview;
  const ld = (r.lang_detected || scan?.lang_detected || "").toUpperCase(), ls = (scan?.store_lang || r.store?.lang || "").toUpperCase();
  const finish = normFinish(r.finish || scan?.finish);
  return (
    <div className={`result st-${kind}`} role="status" aria-live="polite">
      {thumb ? <img className="th" src={thumb} alt="" /> : <span className="th" />}
      <div className="body">
        <span className="row" style={{ gap: 6 }}><span className={`badge st-chip ${kind}`}>{STATUS_LABEL[kind] || kind}</span>{r.claude_used && <span className="badge accent">✦ Claude</span>}</span>
        <span className="nm">{kind === "failed" && !scan ? "Card not recognised" : name}</span>
        {store_ && (scan || kind !== "failed") && (
          <span className="small muted">{printingLabel(store_)}{ld && ls && ld !== ls ? ` · read ${ld}, stored ${ls}` : ""} · {FINISH_LABEL[finish] || finish}</span>
        )}
        {kind === "duplicate" && <span className="small">Same printing as your last scan, so it was not added again.</span>}
        {kind === "suggest" && <span className="small">Probably right: please confirm.</span>}
        {kind === "review" && <span className="small">Not sure: pick the right printing.</span>}
        {kind === "failed" && last.payload?.capture?.fallback && <span className="small">Couldn't identify – adjust the card and retry.</span>}
      </div>
      <div className="actions">
        {kind === "duplicate" && scan?.id && <button type="button" className="btn sm primary" onClick={onIncrement}><Icon.plus /> +1 copy</button>}
        {kind === "duplicate" && last.payload && <button type="button" className="btn sm" onClick={onForce}>Different card, add it</button>}
        {kind === "suggest" && scan?.id && <button type="button" className="btn sm primary" onClick={onConfirm}><Icon.check /> Confirm</button>}
        {(kind === "suggest" || kind === "review" || ((kind === "auto") && jsonArr(r.variants || scan?.variants).length > 0)) && (
          <button type="button" className={`btn sm${kind === "review" ? " primary" : ""}`} onClick={onPick}>{kind === "auto" ? "variant?" : "Pick printing"}</button>
        )}
        {kind === "failed" && <button type="button" className="btn sm primary" onClick={onSearch}><Icon.search /> Find by name</button>}
        {(kind === "failed" || kind === "review") && <button type="button" className="btn sm" onClick={onRetry}><Icon.camera /> Rescan</button>}
        {(kind === "failed" || kind === "review") && onAskClaude && last.payload?.allowClaude === false && !r.claude_used && (
          <button type="button" className="btn sm" onClick={onAskClaude}><Icon.sparkle /> Ask Claude</button>
        )}
        {(kind === "auto" || kind === "suggest") && scan?.id && <button type="button" className="btn sm" onClick={onIncrement}><Icon.plus /> +1</button>}
        {scan?.id && kind !== "duplicate" && <button type="button" className="btn sm danger undo-btn" onClick={onUndo} style={{ marginLeft: "auto" }}><Icon.undo /> Undo</button>}
      </div>
    </div>
  );
}

// ===========================================================================
// Binders: filter bar, create / manage, move copies (collection tab, card sheet)
// ===========================================================================

const UNSORTED = "Unsorted";
const sameName = (a, b) => a != null && b != null && String(a).toLowerCase() === String(b).toLowerCase();

/** GET /api/binders → {binders, unsorted, master}; reloads with dataVersion. */
function useBinderList(dataVersion = 0) {
  const [data, setData] = useState(null);
  const [error, setError] = useState(null);
  const load = useCallback(() => {
    api("/api/binders")
      .then((d) => {
        setData({ binders: asList(d, "binders").filter((b) => b.name), unsorted: d?.unsorted || { copies: 0, cards: 0 }, master: d?.collection_master || "manabox" });
        setError(null);
      })
      .catch((e) => setError(e.message));
  }, []);
  useEffect(load, [load, dataVersion]);
  return { data, error, reload: load };
}

/**
 * Moves that touch ManaBox copies need the user's one-time OK (the server
 * answers 409 {code:'confirm_master'}). guarded(run) calls run(false), asks on
 * that 409, then calls run(true); it resolves null when the user cancels.
 */
function useMasterConfirm() {
  const [ask, setAsk] = useState(null); // {copies, resolve}
  const guarded = useCallback(async (run) => {
    try {
      return await run(false);
    } catch (e) {
      if (!(e instanceof ApiError && e.status === 409 && e.data?.code === "confirm_master")) throw e;
      const ok = await new Promise((resolve) => setAsk({ copies: e.data.manabox_copies, resolve }));
      setAsk(null);
      return ok ? run(true) : null;
    }
  }, []);
  const dialog = ask ? <MasterConfirmSheet copies={ask.copies} onAnswer={ask.resolve} /> : null;
  return [guarded, dialog];
}

function MasterConfirmSheet({ copies, onAnswer }) {
  return (
    <Sheet title="Organise ManaBox cards here?" onClose={() => onAnswer(false)}>
      <div className="stack">
        <p style={{ margin: 0 }}>This changes {copies ? plural(copies, "copy", "copies") : "cards"} imported from ManaBox. From now on <b>mtg-planner is the master of your collection</b>:</p>
        <ul className="small" style={{ margin: 0, paddingLeft: 20, display: "grid", gap: 4 }}>
          <li>Cards you move here stay where you put them. A ManaBox import can't move them back.</li>
          <li>ManaBox imports only <b>add new copies</b> (compared with the last export) instead of replacing the collection.</li>
          <li>A full replace stays possible in <b>Import</b>, behind a warning. You can switch back there too.</li>
        </ul>
        <p className="small muted" style={{ margin: 0 }}>You are only asked once.</p>
        <div className="row">
          <button type="button" className="btn primary grow" onClick={() => onAnswer(true)}><Icon.check /> Yes, organise here</button>
          <button type="button" className="btn ghost" onClick={() => onAnswer(false)}>Cancel</button>
        </div>
      </div>
    </Sheet>
  );
}

/** Collection tab: binder filter chips (+ Unsorted), New binder, Manage binders. */
function BinderBar({ data, error, onRetry, filter, onFilter, onNew, onManage }) {
  const list = data?.binders || [];
  const unsorted = data?.unsorted?.copies ?? 0;
  const chip = (key, label, count, pressed, onClick, extra = "") => (
    <button key={key} type="button" className={`chip lg${extra}`} aria-pressed={pressed} onClick={onClick}>
      {label}{count != null && <span className="cnt">{fmtInt(count)}</span>}
    </button>
  );
  return (
    <div className="binder-bar">
      <div className="row between">
        <span className="label">Binders</span>
        <div className="row" style={{ gap: 6 }}>
          <button type="button" className="btn" onClick={onNew}><Icon.plus /> New binder</button>
          <button type="button" className="btn ghost" onClick={onManage} disabled={!data}><Icon.edit /> Manage</button>
        </div>
      </div>
      {error && <ErrorNotice error={`Could not load binders: ${error}`} onRetry={onRetry} />}
      <div className="chips scroll" role="group" aria-label="Show binder">
        {chip("__all", "All", null, filter == null, () => onFilter(null))}
        {list.map((b) => chip(b.name, <><Icon.collection /> {b.name}</>, b.copies ?? 0, sameName(filter, b.name), () => onFilter(sameName(filter, b.name) ? null : b.name)))}
        {chip("__unsorted", UNSORTED, unsorted, filter === "", () => onFilter(filter === "" ? null : ""), " dashed")}
      </div>
      {data && list.length === 0 && (
        <span className="small muted">No binders yet. Create one, then tap <b>Select</b> to move cards into it.</span>
      )}
    </div>
  );
}

function NewBinderSheet({ onClose, onCreated }) {
  const [name, setName] = useState("");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);
  const submit = async (e) => {
    e.preventDefault();
    if (!name.trim() || busy) return;
    setBusy(true); setError(null);
    try {
      const b = await api("/api/binders", { method: "POST", json: { name: name.trim() } });
      onCreated(b?.name || name.trim());
    } catch (err) { setError(err.message); } finally { setBusy(false); }
  };
  return (
    <Sheet title="New binder" onClose={onClose}>
      <form className="stack" onSubmit={submit}>
        <div className="field">
          <label htmlFor="new-binder-name">Name</label>
          <input id="new-binder-name" className="input" style={{ fontSize: 16 }} autoFocus maxLength={100} required placeholder="e.g. Trade binder"
            value={name} onChange={(e) => setName(e.target.value)} />
        </div>
        <ErrorNotice error={error} />
        <button type="submit" className="btn primary" disabled={!name.trim() || busy}>{busy ? "Creating…" : <><Icon.plus /> Create binder</>}</button>
      </form>
    </Sheet>
  );
}

/** Rename and delete binders. Delete asks what happens to the cards (Unsorted or delete). */
function ManageBindersSheet({ data, onClose, onChanged }) {
  const [guarded, masterDialog] = useMasterConfirm();
  const [editing, setEditing] = useState(null); // {name, value}
  const [deleting, setDeleting] = useState(null); // {binder, cards}
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);
  const list = data?.binders || [];
  const master = data?.master || "manabox";

  const run = async (fn) => {
    setBusy(true); setError(null);
    try { const r = await fn(); if (r) { setEditing(null); setDeleting(null); onChanged(); } } catch (err) { setError(err.message); } finally { setBusy(false); }
  };
  const rename = (e) => {
    e.preventDefault();
    const to = editing.value.trim();
    if (!to || to === editing.name) { setEditing(null); return; }
    const exists = list.find((b) => sameName(b.name, to) && !sameName(b.name, editing.name));
    if (exists && !window.confirm(`“${exists.name}” already exists. Merge “${editing.name}” into it?`)) return;
    run(() => guarded((confirm) => api(`/api/binders/${encodeURIComponent(editing.name)}`, { method: "PATCH", json: { name: to, confirm_master: confirm } })));
  };
  const remove = () => {
    const { binder, cards } = deleting;
    run(() => guarded((confirm) => api(`/api/binders/${encodeURIComponent(binder.name)}?cards=${cards}${confirm ? "&confirm_master=1" : ""}`, { method: "DELETE" })));
  };

  return (
    <Sheet title="Manage binders" onClose={onClose}>
      <div className="stack">
        {error && <ErrorNotice error={error} onDismiss={() => setError(null)} />}
        {list.length === 0 && <p className="muted" style={{ margin: 0 }}>No binders yet.</p>}
        <div>
          {list.map((b) => {
            const mb = b.by_source?.manabox?.copies ?? 0;
            if (deleting && sameName(deleting.binder.name, b.name)) {
              const canDelete = !mb || master === "app";
              return (
                <div key={b.name} className="binder-row" style={{ display: "grid" }}>
                  <b>Delete “{b.name}”?</b>
                  {b.copies > 0 ? (
                    <div className="stack" style={{ gap: 8 }} role="radiogroup" aria-label="What happens to the cards">
                      <label className="radio-card">
                        <input type="radio" name="del-cards" checked={deleting.cards === "unsort"} onChange={() => setDeleting({ ...deleting, cards: "unsort" })} />
                        <span><b>Keep the cards</b><br /><span className="small muted">Its {plural(b.copies, "copy", "copies")} move to {UNSORTED}.</span></span>
                      </label>
                      <label className="radio-card" style={canDelete ? undefined : { opacity: .6 }}>
                        <input type="radio" name="del-cards" disabled={!canDelete} checked={deleting.cards === "delete"} onChange={() => setDeleting({ ...deleting, cards: "delete" })} />
                        <span><b>Delete the cards too</b><br /><span className="small muted">
                          {canDelete ? `Removes ${plural(b.copies, "copy", "copies")} from your collection.` : `Not possible: ${plural(mb, "copy", "copies")} came from ManaBox and ManaBox is the master. Delete them in ManaBox or keep them here.`}
                        </span></span>
                      </label>
                    </div>
                  ) : <span className="small muted">The binder is empty.</span>}
                  <div className="row">
                    <button type="button" className={`btn ${deleting.cards === "delete" ? "danger" : "primary"}`} disabled={busy} onClick={remove}>
                      <Icon.trash /> {deleting.cards === "delete" && b.copies ? `Delete binder and ${plural(b.copies, "copy", "copies")}` : "Delete binder"}
                    </button>
                    <button type="button" className="btn ghost" onClick={() => setDeleting(null)}>Cancel</button>
                  </div>
                </div>
              );
            }
            return (
              <div key={b.name} className="binder-row">
                {editing && sameName(editing.name, b.name) ? (
                  <form className="row grow" onSubmit={rename}>
                    <input className="input grow" style={{ flexBasis: 160, fontSize: 16 }} aria-label={`New name for ${b.name}`} autoFocus maxLength={100}
                      value={editing.value} onChange={(e) => setEditing({ ...editing, value: e.target.value })} />
                    <button type="submit" className="btn primary" disabled={busy || !editing.value.trim()}>Save</button>
                    <button type="button" className="btn ghost" onClick={() => setEditing(null)}>Cancel</button>
                  </form>
                ) : (
                  <>
                    <span className="grow" style={{ minWidth: 0, overflowWrap: "anywhere" }}><b>{b.name}</b><br />
                      <span className="muted small">{b.copies ? `${plural(b.copies, "copy", "copies")} · ${plural(b.unique_cards ?? b.cards ?? 0, "card")}` : "empty"}</span></span>
                    {(b.sources || []).map((s) => <SourceBadge key={s} source={s} />)}
                    <button type="button" className="btn ghost icon" aria-label={`Rename ${b.name}`} title="Rename" disabled={busy}
                      onClick={() => { setDeleting(null); setEditing({ name: b.name, value: b.name }); }}><Icon.edit /></button>
                    <button type="button" className="btn ghost icon danger" aria-label={`Delete ${b.name}`} title="Delete" disabled={busy}
                      onClick={() => { setEditing(null); setDeleting({ binder: b, cards: "unsort" }); }}><Icon.trash /></button>
                  </>
                )}
              </div>
            );
          })}
        </div>
        <p className="small muted" style={{ margin: 0 }}>
          {master === "app"
            ? "mtg-planner is the master of your collection: binders you organise here win over ManaBox."
            : "Renaming or emptying a binder with ManaBox cards makes mtg-planner the master of your collection (you'll be asked first)."}
        </p>
      </div>
      {masterDialog}
    </Sheet>
  );
}

/**
 * Pick a target binder (+ quantity when maxQty is set) and run onMove({quantity,
 * to_binder, create}); onMove resolves false when the user cancelled.
 */
function MoveSheet({ title, intro, maxQty = null, exclude = null, children, submitLabel, onMove, onClose }) {
  const { data, error: listError, reload } = useBinderList();
  const last = store.get("mtg.move.target", null);
  const [qty, setQty] = useState(maxQty ?? 1);
  const [target, setTarget] = useState(null); // binder name | "" (Unsorted) | "__new"
  const [newName, setNewName] = useState("");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);
  const options = data ? [...data.binders.map((b) => ({ name: b.name, copies: b.copies })), { name: "", copies: data.unsorted?.copies ?? 0 }]
    .filter((o) => exclude == null || !sameName(o.name, exclude)) : null;
  useEffect(() => {
    if (!options || target != null) return;
    const pick = last != null && options.find((o) => sameName(o.name, last) || (last === "" && o.name === ""));
    setTarget(pick ? pick.name : (options.find((o) => o.name) ?? options[0])?.name ?? "__new");
  }, [options, target, last]);

  const to = target === "__new" ? newName.trim() : target;
  const ready = target != null && (target !== "__new" || to);
  const submit = async (e) => {
    e.preventDefault();
    if (!ready || busy) return;
    setBusy(true); setError(null);
    try {
      const ok = await onMove({ quantity: qty, to_binder: to, create: target === "__new" });
      if (ok !== false) store.set("mtg.move.target", to);
    } catch (err) { setError(err.message); } finally { setBusy(false); }
  };
  const targetLabel = target === "__new" ? (to ? `new binder “${to}”` : "a new binder") : target === "" ? UNSORTED : target ? `“${target}”` : "…";
  return (
    <Sheet title={title} onClose={onClose}>
      <form className="stack" onSubmit={submit}>
        {intro}
        {maxQty != null && maxQty > 1 && (
          <div className="row between">
            <span className="label">Copies to move</span>
            <div className="stepper" role="group" aria-label="Copies to move">
              <button type="button" aria-label="One less" disabled={qty <= 1} onClick={() => setQty(qty - 1)} style={{ width: 44, height: 44 }}><Icon.minus /></button>
              <output aria-live="polite">{qty}</output>
              <button type="button" aria-label="One more" disabled={qty >= maxQty} onClick={() => setQty(qty + 1)} style={{ width: 44, height: 44 }}><Icon.plus /></button>
            </div>
          </div>
        )}
        {children}
        <fieldset className="stack" style={{ border: 0, padding: 0, margin: 0, minWidth: 0 }}>
          <legend className="label" style={{ marginBottom: 8 }}>Move to</legend>
          {listError && <ErrorNotice error={listError} onRetry={reload} />}
          {!options && !listError && <Spinner />}
          <div className="radio-list">
            {options?.map((o) => (
              <label key={o.name || "__unsorted"} className="radio-card">
                <input type="radio" name="move-target" checked={target === o.name} onChange={() => setTarget(o.name)} />
                <span className="grow" style={{ minWidth: 0, overflowWrap: "anywhere" }}><b>{o.name || UNSORTED}</b> <span className="small muted">{o.copies ? plural(o.copies, "copy", "copies") : "empty"}</span></span>
              </label>
            ))}
            <label className="radio-card">
              <input type="radio" name="move-target" checked={target === "__new"} onChange={() => setTarget("__new")} />
              <span className="grow"><b>New binder…</b></span>
            </label>
          </div>
          {target === "__new" && (
            <input className="input" style={{ fontSize: 16 }} aria-label="New binder name" placeholder="New binder name, e.g. Trade binder" maxLength={100} autoFocus
              value={newName} onChange={(e) => setNewName(e.target.value)} />
          )}
        </fieldset>
        <ErrorNotice error={error} />
        <button type="submit" className="btn primary" disabled={!ready || busy}>
          {busy ? "Moving…" : <>{submitLabel || `Move ${maxQty != null ? plural(qty, "copy", "copies") : ""}`} to {targetLabel}</>}
        </button>
      </form>
    </Sheet>
  );
}

function JobLine({ label, job }) {
  if (!job || typeof job !== "object") return null;
  const state = job.state || job.status || (job.running ? "running" : job.error ? "error" : job.finished_at || job.done_at ? "done" : "idle");
  const done = job.done ?? job.processed ?? job.progress ?? null, total = job.total ?? null;
  const pct = total ? Math.min(100, Math.round((Number(done) || 0) * 100 / total)) : null;
  return (
    <div className="stack" style={{ gap: 4 }}>
      <div className="row between small">
        <span><b>{label}</b> <span className={`badge ${state === "running" || state === "queued" ? "accent" : state === "error" || state === "failed" ? "bad" : state === "done" ? "ok" : ""}`}>{state}</span></span>
        {total ? <span className="muted">{fmtInt(done)} / {fmtInt(total)}{job.phase ? ` · ${job.phase}` : ""}</span> : job.phase ? <span className="muted">{job.phase}</span> : null}
      </div>
      {pct != null && <div className="meter" role="progressbar" aria-valuemin={0} aria-valuemax={100} aria-valuenow={pct} aria-label={`${label} progress`}><span style={{ width: `${pct}%` }} /></div>}
      {job.error && <span className="small" style={{ color: "var(--bad)" }}>{String(job.error)}</span>}
    </div>
  );
}

/** Short text for a scheduler step result ({ran}, {skipped}, {error}, ...). */
function schedResult(x) {
  if (x == null) return null;
  if (typeof x !== "object") return String(x);
  if (x.error) return `error: ${x.error}`;
  if (x.skipped) return `skipped (${x.skipped})`;
  if (x.ran || x.started) return "ran";
  if (x.status) return String(x.status);
  return null;
}

/**
 * Scheduler block of /api/index/status: {enabled, hour, next_run,
 * last_index_refresh, last_index_check, last_index_result, last_price_refresh,
 * last_run: {at, index, prices}, running}. Read defensively: missing fields hide.
 */
function readScheduler(st) {
  const sch = st?.scheduler;
  if (!sch || typeof sch !== "object") return null;
  const lasts = [];
  const add = (label, at, note = null) => { if (at != null && at !== "") lasts.push({ label, at, note }); };
  add("Card data refreshed", sch.last_index_refresh);
  add("Scryfall bulk data checked", sch.last_index_check, schedResult(sch.last_index_result));
  add("Prices refreshed", sch.last_price_refresh);
  const lr = sch.last_run && typeof sch.last_run === "object" ? sch.last_run : null;
  if (lr) {
    const parts = [["card data", lr.index], ["prices", lr.prices]].map(([k, v]) => (schedResult(v) ? `${k}: ${schedResult(v)}` : null)).filter(Boolean);
    add("Last nightly run", lr.at, parts.join(" · ") || null);
  }
  return {
    enabled: sch.enabled !== false, hour: sch.hour ?? null, next: sch.next_run ?? null,
    running: typeof sch.running === "string" ? sch.running : sch.running ? "running" : null, lasts,
  };
}

function SchedulerInfo({ st }) {
  const sc = readScheduler(st);
  if (!sc) return null;
  return (
    <div className="sched" aria-label="Automatic refresh">
      <div className="row">
        <b>Automatic refresh</b>
        <span className={`badge ${sc.enabled ? "ok" : ""}`}>{sc.enabled ? "on" : "off"}</span>
        {sc.running && <span className="badge accent">running: {sc.running}</span>}
        {sc.enabled && sc.hour != null && <span className="muted small">nightly at {String(sc.hour).padStart(2, "0")}:00 server time</span>}
      </div>
      {sc.enabled && sc.next && (
        <div className="row"><span className="muted">Next scheduled check</span> <b title={fmtDate(sc.next)}>{fmtAgo(sc.next)}</b></div>
      )}
      {sc.lasts.map((l) => (
        <div key={l.label} className="row">
          <span className="muted">{l.label}</span>
          <b title={fmtDate(l.at)}>{fmtAgo(l.at)}</b>
          {l.note && <span className={`small ${/^error|error:/.test(l.note) ? "" : "muted"}`} style={{ overflowWrap: "anywhere", color: /error/.test(l.note) ? "var(--bad)" : undefined }}>{l.note}</span>}
        </div>
      ))}
      {!sc.enabled && <span className="small muted">The nightly index and price refresh is turned off on the server (SCHEDULER_ENABLED=false).</span>}
    </div>
  );
}

function ScannerIndexPanel({ health }) {
  const [st, setSt] = useState(null);
  const [error, setError] = useState(null);
  const [missing, setMissing] = useState(false);
  const [busy, setBusy] = useState(null);
  const load = useCallback(async () => {
    try { setSt(await api("/api/index/status")); setError(null); }
    catch (e) { if (e.status === 404) setMissing(true); else setError(e.message); }
  }, []);
  useEffect(() => { load(); }, [load]);
  const jobs = st ? [["Card index", st.refresh_job || st.index_job || st.metadata_job || st.job], ["Fingerprints", st.fingerprint_job]] : [];
  const running = jobs.some(([, j]) => j && (j.running || ["running", "queued"].includes(j.state || j.status)));
  useEffect(() => {
    if (!running) return;
    const t = setInterval(load, 3000);
    return () => clearInterval(t);
  }, [running, load]);
  const start = async (path, label) => {
    setBusy(label); setError(null);
    try { await api(path, { method: "POST", json: {} }); await load(); }
    catch (e) { setError(e.message); } finally { setBusy(null); }
  };
  if (missing) return null;
  const sc = health?.scanner;
  return (
    <section className="card stack" aria-labelledby="index-title">
      <h2 id="index-title">Scanner index</h2>
      <p className="small muted" style={{ margin: 0 }}>The scanner identifies cards against a local copy of Scryfall's card data and art fingerprints. It refreshes on its own at night; use the buttons after a new set comes out.</p>
      <ErrorNotice error={error} onRetry={load} />
      {!st && !error && <Spinner />}
      {st && (
        <>
          <div className="summary-grid">
            <div className="stat"><div className="v">{fmtInt(st.printings)}</div><div className="k">Printings</div></div>
            <div className="stat"><div className="v">{fmtInt(st.sets)}</div><div className="k">Sets</div></div>
            <div className="stat"><div className="v">{fmtInt(typeof st.fingerprints === "object" ? st.fingerprints?.count : st.fingerprints)}</div><div className="k">Fingerprints</div></div>
            <div className="stat"><div className="v" style={{ fontSize: "1rem" }} title={st.last_refresh ? fmtDate(st.last_refresh) : undefined}>{st.last_refresh ? fmtAgo(st.last_refresh) : "never"}</div><div className="k">Last refresh</div></div>
          </div>
          {jobs.map(([label, job]) => <JobLine key={label} label={label} job={job} />)}
          <SchedulerInfo st={st} />
        </>
      )}
      {sc && (
        <div className="kv-inline">
          <span>OCR <span className={`badge ${sc.tesseract ? "ok" : "bad"}`}>{sc.tesseract ? "✓ tesseract" : "✗ tesseract"}</span></span>
          <span>JPEG <span className={`badge ${sc.djpeg ? "ok" : "bad"}`}>{sc.djpeg ? "✓ djpeg" : "✗ djpeg"}</span></span>
        </div>
      )}
      <div className="row">
        <button type="button" className="btn" disabled={Boolean(busy) || running} onClick={() => start("/api/index/refresh", "refresh")}>
          {busy === "refresh" ? <><span className="spinner" aria-hidden="true" /> Starting…</> : <><Icon.refresh /> Refresh index</>}
        </button>
        <button type="button" className="btn" disabled={Boolean(busy) || running} onClick={() => start("/api/index/fingerprints", "fp")}>
          {busy === "fp" ? <><span className="spinner" aria-hidden="true" /> Starting…</> : <><Icon.sparkle /> Build fingerprints</>}
        </button>
      </div>
      <details className="disclosure">
        <summary>Calibration data</summary>
        <div className="stack" style={{ marginTop: 6 }}>
          <p className="small muted" style={{ margin: 0 }}>Scans made in calibration mode keep their scores, OCR output and the printing you confirmed. Export them to tune the scanner thresholds.</p>
          <a className="btn" href="/api/calibration/export" download="mtg-scan-calibration.json" style={{ justifySelf: "start" }}><Icon.download /> Export calibration (JSON)</a>
        </div>
      </details>
    </section>
  );
}

const TABS = [
  { id: "scan", label: "Scan", icon: Icon.scan },
  { id: "collection", label: "Collection", icon: Icon.collection },
  { id: "decks", label: "Decks", icon: Icon.decks },
  { id: "planner", label: "Planner", icon: Icon.planner },
  { id: "import", label: "Import", icon: Icon.import },
];
const isTab = (t) => TABS.some((x) => x.id === t);

function App() {
  const [tab, setTab] = useState(() => {
    const h = location.hash.slice(1);
    return isTab(h) ? h : store.get("mtg.tab", "collection");
  });
  const [visited, setVisited] = useState(() => new Set([isTab(tab) ? tab : "collection"]));
  // Collection data (imports, prices) and deck data (deck edits, planner
  // save_deck) are versioned separately so a deck rename doesn't reset the
  // collection list. An import changes both.
  const [dataVersion, bumpData] = useReducer((x) => x + 1, 0);
  const [deckVersion, bumpDecks] = useReducer((x) => x + 1, 0);
  const onImported = useCallback(() => { bumpData(); bumpDecks(); }, []);
  // After a restore every tab remounts (epoch key) and reloads its data.
  const [epoch, bumpEpoch] = useReducer((x) => x + 1, 0);
  const [restored, setRestored] = useState(null);
  const [cardId, setCardId] = useState(null);
  const [deck, setDeck] = useState({ id: null, notice: null });
  const [plannerRequest, setPlannerRequest] = useState(null);
  const [health, setHealth] = useState(null);
  const scrollPos = useRef({});
  const tabRefs = useRef({});

  useEffect(() => {
    api("/healthz").then(setHealth).catch(() => setHealth(null));
  }, []);

  const switchTab = useCallback((next) => {
    if (!isTab(next)) return;
    setTab((cur) => {
      if (cur !== next) scrollPos.current[cur] = window.scrollY;
      return next;
    });
  }, []);

  useLayoutEffect(() => {
    store.set("mtg.tab", tab);
    if (location.hash.slice(1) !== tab) history.replaceState(null, "", `#${tab}`);
    setVisited((v) => (v.has(tab) ? v : new Set([...v, tab])));
    window.scrollTo(0, scrollPos.current[tab] || 0);
  }, [tab]);

  useEffect(() => {
    const onHash = () => { const h = location.hash.slice(1); if (isTab(h)) switchTab(h); };
    window.addEventListener("hashchange", onHash);
    return () => window.removeEventListener("hashchange", onHash);
  }, [switchTab]);

  // Tapping the active Decks tab returns to the deck list (also from the shopping list).
  const [decksHome, goDecksHome] = useReducer((x) => x + 1, 0);
  const openDeck = useCallback((id, notice = null) => {
    setDeck({ id, notice });
    setCardId(null);
    scrollPos.current.decks = 0;
    if (id) switchTab("decks");
    window.scrollTo(0, 0);
  }, [switchTab]);

  const askAboutDeck = useCallback((d) => {
    const prompt = `Let's work on my deck #${d.id} "${d.name}"${d.format ? ` (${d.format})` : ""}. `
      + `Load it with get_deck and give me a short analysis: mana curve, card-type balance, key synergies, weak spots, `
      + `and which of the missing cards matter most. Suggest improvements, preferring cards I already own.`;
    setPlannerRequest({ prompt, title: `Deck: ${d.name}`.slice(0, 60), nonce: Date.now() });
    switchTab("planner");
  }, [switchTab]);

  const onTabKey = (e) => {
    const i = TABS.findIndex((t) => t.id === tab);
    let j = null;
    if (e.key === "ArrowRight") j = (i + 1) % TABS.length;
    else if (e.key === "ArrowLeft") j = (i - 1 + TABS.length) % TABS.length;
    else if (e.key === "Home") j = 0;
    else if (e.key === "End") j = TABS.length - 1;
    if (j == null) return;
    e.preventDefault();
    switchTab(TABS[j].id);
    tabRefs.current[TABS[j].id]?.focus();
  };

  const panel = (id, content) => (
    <section key={id} id={`panel-${id}`} role="tabpanel" aria-labelledby={`tab-${id}`} hidden={tab !== id}>
      {visited.has(id) && <React.Fragment key={epoch}>{content}</React.Fragment>}
    </section>
  );

  return (
    <>
      <header className="app-header">
        <div className="brand"><img src="icon.svg" alt="" width="28" height="28" /> MTG Planner</div>
        <nav className="tabbar" role="tablist" aria-label="Sections" onKeyDown={onTabKey}>
          {TABS.map((t) => (
            <button key={t.id} id={`tab-${t.id}`} ref={(el) => { tabRefs.current[t.id] = el; }} type="button" role="tab" className="tab"
              aria-selected={tab === t.id} aria-controls={`panel-${t.id}`} tabIndex={tab === t.id ? 0 : -1}
              onClick={() => {
                if (t.id === "decks" && tab === "decks") { if (deck.id) openDeck(null); goDecksHome(); }
                switchTab(t.id);
              }}>
              <t.icon />
              <span>{t.label}</span>
            </button>
          ))}
        </nav>
      </header>
      <main>
        {panel("scan", <ScanTab active={tab === "scan"} health={health} onCommitted={onImported} />)}
        {panel("collection", <CollectionTab dataVersion={dataVersion} onOpenCard={setCardId} onGoImport={() => switchTab("import")}
          onGoScan={() => switchTab("scan")} onChanged={onImported} />)}
        {panel("decks", <DecksTab dataVersion={deckVersion} homeKey={decksHome} deckId={deck.id} deckNotice={deck.notice} onOpenDeck={openDeck}
          onOpenCard={setCardId} onAsk={askAboutDeck} onChanged={bumpDecks} onCollectionChanged={onImported} />)}
        {panel("planner", <PlannerTab active={tab === "planner"} health={health} request={plannerRequest}
          onRequestHandled={() => setPlannerRequest(null)} onChanged={bumpDecks} />)}
        {panel("import", <ImportTab dataVersion={dataVersion} health={health} onImported={onImported} restored={restored}
          onDismissRestored={() => setRestored(null)}
          onRestored={(r) => { setRestored(r); setCardId(null); setDeck({ id: null, notice: null }); bumpEpoch(); onImported(); window.scrollTo(0, 0); }} />)}
      </main>
      {cardId && <CardSheet id={cardId} onClose={() => setCardId(null)} onOpenCard={setCardId} onOpenDeck={(id) => openDeck(id)} onChanged={onImported} />}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
