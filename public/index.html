function CameraView({ lib, active, settings, busy, paused, flash, rearmKey, onCapture, onError }) {
  const videoRef = useRef(null);
  const overlayRef = useRef(null);
  const streamRef = useRef(null);
  const trackRef = useRef(null);
  const acRef = useRef(null);
  const obsRef = useRef(null);
  const capturingRef = useRef(false);
  const live = useRef({});
  live.current = { busy, paused, auto: settings.auto, photo: settings.photo, onCapture, onError, flash };
  const [cam, setCam] = useState({ state: "off", error: null, vw: 0, vh: 0 });
  const [status, setStatus] = useState({ phase: "searching", hint: "" });
  const [torch, setTorchState] = useState({ supported: null, on: false });
  // Every stop() bumps the generation; a start() that resumes after it (the
  // permission prompt or camera warm-up was still pending) drops its stream.
  const genRef = useRef(0);
  const activeRef = useRef(active);
  activeRef.current = active;

  const stop = useCallback(() => {
    genRef.current++;
    if (lib) lib.stopStream(streamRef.current);
    else streamRef.current?.getTracks().forEach((t) => t.stop());
    streamRef.current = null;
    trackRef.current = null;
    if (videoRef.current) videoRef.current.srcObject = null;
    setCam((c) => (c.state === "off" || c.state === "error" ? c : { ...c, state: "off" }));
    setTorchState((t) => ({ ...t, on: false }));
  }, [lib]);

  const start = async () => {
    if (!lib || cam.state === "starting") return;
    unlockAudio();
    const gen = ++genRef.current;
    const stale = () => gen !== genRef.current || !activeRef.current || document.hidden;
    setCam({ state: "starting", error: null, vw: 0, vh: 0 });
    try {
      const stream = await lib.openCamera();
      if (stale()) {
        lib.stopStream(stream);
        if (gen === genRef.current) stop();
        return;
      }
      streamRef.current = stream;
      const track = stream.getVideoTracks()[0];
      trackRef.current = track;
      track?.addEventListener?.("ended", () => { stop(); setCam({ state: "error", error: "The camera stopped (another app may have taken it).", vw: 0, vh: 0 }); });
      const v = videoRef.current;
      v.muted = true;
      v.setAttribute("playsinline", "");
      v.setAttribute("muted", "");
      v.srcObject = stream;
      await v.play().catch(() => {});
      if (!v.videoWidth) {
        await new Promise((res) => { v.addEventListener("loadedmetadata", res, { once: true }); setTimeout(res, 4000); });
      }
      if (stale()) { if (gen === genRef.current) stop(); return; }
      lib.preferContinuousFocus(track);
      setTorchState({ supported: lib.torchCapability(track), on: false });
      acRef.current = new lib.AutoCapture();
      setCam({ state: "on", error: null, vw: v.videoWidth, vh: v.videoHeight });
    } catch (e) {
      stop();
      setCam({ state: "error", error: cameraErrorMessage(e), vw: 0, vh: 0 });
    }
  };

  // Stop the camera when the tab is left or the page is hidden.
  useEffect(() => { if (!active) stop(); }, [active, stop]);
  useEffect(() => {
    const h = () => { if (document.hidden) stop(); };
    document.addEventListener("visibilitychange", h);
    return () => { document.removeEventListener("visibilitychange", h); stop(); };
  }, [stop]);
  useEffect(() => { acRef.current?.rearm(); }, [rearmKey]);

  const shoot = useCallback(async (o, mode) => {
    const v = videoRef.current;
    if (!lib || !v || !v.videoWidth || capturingRef.current || live.current.busy) return;
    capturingRef.current = true;
    const found = Boolean(o && o.found);
    const corners = found ? o.corners : lib.rectQuad(lib.guideRect(v.videoWidth, v.videoHeight));
    if (mode === "manual") acRef.current?.captured(o || {});
    try {
      const cap = await lib.captureCard(v, trackRef.current, corners, { preferPhoto: live.current.photo !== false });
      live.current.onCapture({ ...cap, mode, detected: found });
    } catch (e) {
      acRef.current?.rearm();
      live.current.onError?.(`Capture failed: ${e.message}`);
    } finally {
      capturingRef.current = false;
    }
  }, [lib]);

  // Analysis loop (~8 fps) + overlay drawing.
  useEffect(() => {
    if (cam.state !== "on" || !lib) return;
    const v = videoRef.current;
    const analyze = lib.createAnalyzer();
    const gap = 1000 / lib.CAPTURE_DEFAULTS.fps;
    let alive = true, timer = null, last = 0, shown = { phase: "", hint: "" };

    const draw = (o, r) => {
      const c = overlayRef.current;
      if (!c) return;
      const cw = c.clientWidth, ch = c.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
      if (!cw || !ch) return;
      if (c.width !== Math.round(cw * dpr) || c.height !== Math.round(ch * dpr)) { c.width = Math.round(cw * dpr); c.height = Math.round(ch * dpr); }
      const ctx = c.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, cw, ch);
      const sc = Math.max(cw / o.vw, ch / o.vh), dx = (cw - o.vw * sc) / 2, dy = (ch - o.vh * sc) / 2;
      const map = ([x, y]) => [x * sc + dx, y * sc + dy];
      const g = lib.rectQuad(o.guide).map(map);
      ctx.fillStyle = "rgba(0,0,0,.38)";
      ctx.beginPath();
      ctx.rect(0, 0, cw, ch);
      ctx.moveTo(g[0][0], g[0][1]); ctx.lineTo(g[3][0], g[3][1]); ctx.lineTo(g[2][0], g[2][1]); ctx.lineTo(g[1][0], g[1][1]); ctx.closePath();
      ctx.fill();
      const fl = live.current.flash;
      const flashOn = fl && Date.now() < fl.until;
      ctx.lineWidth = flashOn ? 6 : 2.5;
      ctx.setLineDash(flashOn || o.found ? [] : [10, 8]);
      ctx.strokeStyle = flashOn ? fl.color : "rgba(255,255,255,.85)";
      ctx.strokeRect(g[0][0], g[0][1], g[2][0] - g[0][0], g[2][1] - g[0][1]);
      if (o.found && o.corners) {
        const q = o.corners.map(map);
        ctx.setLineDash([]);
        ctx.lineWidth = 3;
        ctx.strokeStyle = r.state === "cooldown" ? "#f0c062" : r.state === "stable" || r.state === "capture" ? "#62d18d" : "#a38bff";
        ctx.beginPath();
        q.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
        ctx.closePath();
        ctx.stroke();
      }
    };

    const loop = () => {
      if (!alive) return;
      const now = performance.now();
      if (now - last >= gap && v.readyState >= 2 && !capturingRef.current) {
        last = now;
        let o = null;
        try { o = analyze(v); } catch { o = null; }
        if (o) {
          if (o.vw !== cam.vw || o.vh !== cam.vh) setCam((c) => ({ ...c, vw: o.vw, vh: o.vh }));
          obsRef.current = o;
          const L = live.current;
          const r = acRef.current.step({ ...o, now: Date.now(), paused: L.busy || L.paused || !L.auto });
          draw(o, r);
          let hint = r.hint, phase = r.state;
          if (L.busy) { hint = "Identifying…"; phase = "busy"; }
          else if (L.paused) hint = "Paused";
          else if (!L.auto && r.state !== "cooldown") hint = o.found ? "Card found: tap the shutter" : "Place a card in the frame";
          if (hint !== shown.hint || phase !== shown.phase) { shown = { hint, phase }; setStatus(shown); }
          if (r.capture && !L.busy && !L.paused && L.auto) shoot(o, "auto");
        }
      }
      timer = setTimeout(loop, 30);
    };
    loop();
    return () => { alive = false; clearTimeout(timer); };
  }, [cam.state, cam.vw, cam.vh, lib, shoot]);

  const toggleTorch = async () => {
    const next = !torch.on;
    try {
      await lib.setTorch(trackRef.current, next);
      setTorchState((t) => ({ ...t, on: next, supported: true }));
    } catch {
      setTorchState({ supported: false, on: false });
      onError?.("The torch is not available on this camera.");
    }
  };

  const on = cam.state === "on";
  const ratio = cam.vw && cam.vh ? cam.vw / cam.vh : 3 / 4;
  const style = { aspectRatio: `${ratio}`, width: `min(100%, calc(72dvh * ${ratio.toFixed(4)}))` };
  const support = lib ? lib.cameraSupport() : null;

  return (
    <div className="cam" style={style}>
      <video ref={videoRef} playsInline muted autoPlay aria-label="Camera preview" />
      <canvas ref={overlayRef} aria-hidden="true" hidden={!on} />
      {!on && (
        <div className="cam-start">
          {cam.state === "starting" ? <Spinner label="Starting camera…" /> : (
            <>
              {cam.error && <p role="alert" style={{ color: "#ffb4a8" }}>{cam.error}</p>}
              {support && !support.secure && <p role="alert" style={{ color: "#ffb4a8" }}>The camera only works over HTTPS.</p>}
              <button type="button" className="btn primary" onClick={start} disabled={!lib}><Icon.camera /> {cam.error ? "Try again" : "Start camera"}</button>
              <p>Lay the card on a plain, light surface and fill the frame. Scanning starts automatically when the card is steady and sharp.</p>
            </>
          )}
        </div>
      )}
      {on && (
        <>
          <div className="cam-hud top">
            <span className={`pill s-${status.phase}`} role="status" aria-live="polite"><span className="dot" aria-hidden="true" />{status.hint || "Ready"}</span>
            {torch.supported !== false && (
              <button type="button" className="cam-btn" aria-pressed={torch.on} aria-label={torch.on ? "Turn torch off" : "Turn torch on"} onClick={toggleTorch}><Icon.bolt /></button>
            )}
          </div>
          <div className="cam-hud bottom">
            <button type="button" className="cam-btn" aria-label="Stop camera" onClick={stop}><Icon.close /></button>
            <button type="button" className="shutter" aria-label="Take scan now" disabled={busy || paused}
              onClick={() => shoot(obsRef.current, "manual")} />
            <button type="button" className="cam-btn" aria-label="Scan this card again" title="Re-arm auto capture" onClick={() => acRef.current?.rearm()}><Icon.refresh /></button>
          </div>
        </>
      )}
    </div>
  );
}

// ---------------------------------------------------------------------------
// Printing picker (candidates, all printings of a card, title search)

/**
 * Where a list of printings differs: per field, whether the values differ and
 * the common prefix/suffix length (so only the differing characters of a set
 * code or collector number get marked).
 */
function printingDiff(list) {
  const out = { set: null, cn: null, lang: false, finish: false, tags: new Set() };
  if (!list || list.length < 2) return out;
  const affix = (vals) => {
    if (new Set(vals).size < 2) return null;
    const min = Math.min(...vals.map((v) => v.length));
    let pre = 0;
    while (pre < min && vals.every((v) => v[pre] === vals[0][pre])) pre++;
    let suf = 0;
    while (suf < min - pre && vals.every((v) => v[v.length - 1 - suf] === vals[0][vals[0].length - 1 - suf])) suf++;
    return { pre, suf };
  };
  out.set = affix(list.map((p) => p.set.toUpperCase()));
  out.cn = affix(list.map((p) => String(p.cn)));
  out.lang = new Set(list.map((p) => p.lang)).size > 1;
  out.finish = new Set(list.map((p) => p.finishes.join("/"))).size > 1;
  const all = list.map((p) => new Set(p.tags || []));
  for (const t of new Set(list.flatMap((p) => p.tags || []))) if (!all.every((x) => x.has(t))) out.tags.add(t);
  return out;
}

/** Text with the differing middle part (between common prefix and suffix) marked. */
function DiffText({ text, d, prefix = "" }) {
  const t = String(text);
  if (!d) return <span className="same">{prefix}{t}</span>;
  const mid = t.slice(d.pre, t.length - d.suf);
  return <span>{prefix}{t.slice(0, d.pre)}{mid ? <mark>{mid}</mark> : null}{t.slice(t.length - d.suf)}</span>;
}

function PickTile({ p, current, onPick, diff }) {
  const d = diff || printingDiff([]);
  const tags = (p.tags || []).filter((t) => d.tags.has(t) || (p.tags || []).length <= 2);
  return (
    <button type="button" className="pick" aria-current={current || undefined} onClick={() => onPick(p)}
      aria-label={`${p.name}, ${p.set_name || p.set.toUpperCase()} number ${p.cn}${p.lang ? `, ${p.lang}` : ""}${p.tags?.length ? `, ${p.tags.join(", ")}` : ""}`}>
      <span className="pcode" aria-hidden="true">
        <span className="pset"><DiffText text={p.set.toUpperCase()} d={d.set} /></span>
        <span className="pcn"><DiffText text={p.cn} d={d.cn} prefix="#" /></span>
        {/* Language variants share set + number: then the language is the difference. */}
        {d.lang && p.lang ? <span className="pcn"><mark>{p.lang.toUpperCase()}</mark></span> : null}
      </span>
      {p.img ? <img src={p.img} alt="" loading="lazy" decoding="async" /> : <span className="ph">{p.name}</span>}
      <span className="cap">
        <b>{p.name}</b>
        {p.set_name && <span className="muted" style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{p.set_name}</span>}
        <span className="ptags">
          {p.lang && <span className={`badge${d.lang ? " diff" : ""}`}>{p.lang.toUpperCase()}</span>}
          {p.finishes.length > 0 && <span className={`badge${d.finish ? " diff" : ""}`}>{p.finishes.map((f) => (f === "nonfoil" ? "non-foil" : f)).join(" / ")}</span>}
          {tags.map((t) => <span key={t} className={`badge${d.tags.has(t) ? " diff" : ""}`}>{t}</span>)}
        </span>
        {p.score != null && <span className="muted">score {p.score.toFixed(2)}</span>}
      </span>
    </button>
  );
}

/**
 * The user's own capture of the collector line (the high-res bottom strip),
 * zoomed in so near-identical printings can be told apart. Tries each source in
 * turn (server copy, then the local capture) and hides itself when none loads.
 * Pinch (touch), ctrl+wheel or the buttons zoom.
 */
function ScanStrip({ srcs, startZoom = 2 }) {
  const list = useMemo(() => (srcs || []).filter(Boolean), [srcs]);
  const [i, setI] = useState(0);
  const [zoom, setZoom] = useState(startZoom);
  const zoomRef = useRef(startZoom);
  zoomRef.current = zoom;
  const boxRef = useRef(null);
  const placed = useRef(false);

  // Zoom around a point (box coordinates), keeping that point in place.
  const zoomTo = useCallback((z, cx, cy) => {
    const box = boxRef.current;
    const prev = zoomRef.current;
    const next = Math.max(1, Math.min(6, z));
    if (!box || next === prev) return;
    const x = cx ?? box.clientWidth / 2, y = cy ?? box.clientHeight / 2;
    const sl = box.scrollLeft, st = box.scrollTop;
    zoomRef.current = next;
    setZoom(next);
    requestAnimationFrame(() => {
      box.scrollLeft = (sl + x) * (next / prev) - x;
      box.scrollTop = (st + y) * (next / prev) - y;
    });
  }, []);

  useEffect(() => {
    const box = boxRef.current;
    if (!box) return;
    let start = null;
    const dist = (t) => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
    const mid = (t) => {
      const r = box.getBoundingClientRect();
      return [(t[0].clientX + t[1].clientX) / 2 - r.left, (t[0].clientY + t[1].clientY) / 2 - r.top];
    };
    const onStart = (e) => { if (e.touches.length === 2) start = { d: dist(e.touches), z: zoomRef.current }; };
    const onMove = (e) => {
      if (!start || e.touches.length !== 2) return;
      e.preventDefault();
      const [x, y] = mid(e.touches);
      zoomTo(start.z * dist(e.touches) / start.d, x, y);
    };
    const onEnd = (e) => { if (e.touches.length < 2) start = null; };
    const onWheel = (e) => {
      if (!e.ctrlKey) return;
      e.preventDefault();
      const r = box.getBoundingClientRect();
      zoomTo(zoomRef.current * Math.exp(-e.deltaY / 200), e.clientX - r.left, e.clientY - r.top);
    };
    box.addEventListener("touchstart", onStart, { passive: true });
    box.addEventListener("touchmove", onMove, { passive: false });
    box.addEventListener("touchend", onEnd, { passive: true });
    box.addEventListener("touchcancel", onEnd, { passive: true });
    box.addEventListener("wheel", onWheel, { passive: false });
    return () => {
      box.removeEventListener("touchstart", onStart);
      box.removeEventListener("touchmove", onMove);
      box.removeEventListener("touchend", onEnd);
      box.removeEventListener("touchcancel", onEnd);
      box.removeEventListener("wheel", onWheel);
    };
  }, [zoomTo, i, list.length]);

  if (i >= list.length) return null;
  const onLoad = () => {
    // M15+ frames: the collector line sits in the upper-left part of the strip,
    // start there. Older frames (startZoom 1) show the whole strip.
    const box = boxRef.current;
    if (!box || placed.current) return;
    placed.current = true;
    box.scrollLeft = 0;
    box.scrollTop = Math.max(0, (box.scrollHeight - box.clientHeight) * 0.25);
  };
  return (
    <figure className="scan-strip" style={{ margin: 0 }}>
      <div className="strip-box" ref={boxRef}>
        <img src={list[i]} alt="Your scan: the card's bottom edge with set code and collector number" draggable={false}
          style={{ width: `${zoom * 100}%` }} onLoad={onLoad} onError={() => { placed.current = false; setI((n) => n + 1); }} />
      </div>
      <figcaption className="strip-bar">
        <span className="grow">Your scan · compare the set code and number</span>
        <button type="button" className="btn ghost icon" aria-label="Zoom out" disabled={zoom <= 1} onClick={() => zoomTo(zoom / 1.4)}><Icon.zoomOut /></button>
        <button type="button" className="btn ghost icon" aria-label="Zoom in" disabled={zoom >= 6} onClick={() => zoomTo(zoom * 1.4)}><Icon.zoomIn /></button>
      </figcaption>
    </figure>
  );
}

function PrintingPicker({ title, candidates = [], oracleId = null, lang = "", currentId = null, startInSearch = false, strips = null, onPick, onClose }) {
  const cands = useMemo(() => candidates.map((c) => (c && c.set !== undefined && c.cn !== undefined ? c : normPrinting(c))).filter((c) => c && c.id), [candidates]);
  const [mode, setMode] = useState(startInSearch ? "search" : cands.length ? "cand" : oracleId ? "all" : "search");
  const [oid, setOid] = useState(oracleId || cands.find((c) => c.oracle_id)?.oracle_id || null);
  const [plang, setPlang] = useState(lang || "");
  const [all, setAll] = useState(null);
  const [q, setQ] = useState("");
  const dq = useDebounced(q.trim(), 300);
  const [hits, setHits] = useState(null);
  const [error, setError] = useState(null);
  const candDiff = useMemo(() => printingDiff(cands), [cands]);
  // Only the 2015 frame puts the collector line in the strip's upper-left
  // corner; for older frames (info at the centre/right) start with the whole strip.
  const stripZoom = cands.length && cands.every((c) => c.frame && c.frame !== "2015" && c.frame !== "future") ? 1 : 2;
  const allDiff = useMemo(() => printingDiff(all || []), [all]);

  useEffect(() => {
    if (mode !== "all" || !oid) return;
    let alive = true;
    setAll(null); setError(null);
    const params = new URLSearchParams({ oracle_id: oid });
    if (plang) params.set("lang", plang);
    api(`/api/printings?${params}`)
      .then((d) => { if (alive) setAll(asList(d, "printings", "rows").map(normPrinting).filter((p) => p && p.id)); })
      .catch((e) => { if (alive) setError(e.message); });
    return () => { alive = false; };
  }, [mode, oid, plang]);

  useEffect(() => {
    if (mode !== "search" || dq.length < 2) { setHits(null); return; }
    let alive = true;
    setError(null);
    const params = new URLSearchParams({ q: dq });
    if (plang) params.set("lang", plang);
    api(`/api/printings/search?${params}`)
      .then((d) => { if (alive) setHits(asList(d, "results", "rows", "printings")); })
      .catch((e) => { if (alive) setError(e.message); });
    return () => { alive = false; };
  }, [mode, dq, plang]);

  const langSelect = (
    <select className="select" style={{ width: "auto" }} aria-label="Language filter" value={plang} onChange={(e) => setPlang(e.target.value)}>
      <option value="">All languages</option>
      {SCAN_LANGS.map(([k, label]) => <option key={k} value={k}>{label}</option>)}
    </select>
  );

  return (
    <Sheet title={title} onClose={onClose} pinned={strips && strips.length ? <ScanStrip srcs={strips} startZoom={stripZoom} /> : null}>
      <div className="stack">
        <div className="row">
          <div className="segmented" role="group" aria-label="Show">
            {cands.length > 0 && <button type="button" aria-pressed={mode === "cand"} onClick={() => setMode("cand")}>Candidates ({cands.length})</button>}
            {oid && <button type="button" aria-pressed={mode === "all"} onClick={() => setMode("all")}>All printings</button>}
            <button type="button" aria-pressed={mode === "search"} onClick={() => setMode("search")}><Icon.search /> Name</button>
          </div>
          {mode !== "cand" && langSelect}
        </div>
        <ErrorNotice error={error} />
        {mode === "cand" && (
          <div className="pick-grid">{cands.map((p) => <PickTile key={p.id} p={p} diff={candDiff} current={p.id === currentId} onPick={onPick} />)}</div>
        )}
        {mode === "all" && (!all ? (!error && <Spinner />) : all.length === 0
          ? <p className="muted">No printings found{plang ? " in this language" : ""}.</p>
          : <div className="pick-grid">{all.map((p) => <PickTile key={p.id} p={p} diff={allDiff} current={p.id === currentId} onPick={onPick} />)}</div>)}
        {mode === "search" && (
          <div className="stack">
            <div className="search">
              <Icon.search />
              <label htmlFor="pick-q" className="sr-only">Card name</label>
              <input id="pick-q" className="input" type="search" autoFocus autoComplete="off" autoCorrect="off" spellCheck="false"
                placeholder="Card name (any language)…" value={q} onChange={(e) => setQ(e.target.value)} />
            </div>
            {hits && hits.length === 0 && <p className="muted">No card matches “{dq}”.</p>}
            {hits && hits.length > 0 && (
              <div className="hit-list">
                {hits.map((h, i) => (
                  <button key={`${h.id || h.oracle_id}-${i}`} type="button" className="hit"
                    onClick={() => { setOid(h.oracle_id); if (h.lang && !plang) setPlang(h.lang); setMode("all"); }}>
                    <span><b>{h.printed_name || h.name}</b>{h.printed_name && h.printed_name !== h.name && <span className="muted small"> · {h.name}</span>}</span>
                    {h.lang && <span className="badge">{String(h.lang).toUpperCase()}</span>}
                  </button>
                ))}
              </div>
            )}
          </div>
        )}
      </div>
    </Sheet>
  );
}

// ---------------------------------------------------------------------------
// Commit sheet: add staged scans to a binder or a deck

function CommitSheet({ ids, onClose, onDone }) {
  const saved = store.get("mtg.scan.target", {}) || {};
  const [type, setType] = useState(saved.type === "deck" ? "deck" : "binder");
  const [binders, setBinders] = useState(null);
  const [decks, setDecks] = useState(null);
  const [binder, setBinder] = useState(saved.type === "binder" && saved.name ? saved.name : "");
  const [newBinder, setNewBinder] = useState("");
  const [deckId, setDeckId] = useState(saved.type === "deck" && saved.id ? String(saved.id) : "");
  const [newDeck, setNewDeck] = useState({ name: "", format: "commander" });
  const [board, setBoard] = useState(saved.board || "main");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);

  useEffect(() => {
    api("/api/binders").then((d) => {
      // The unnamed bucket ("no binder") can't be a target: scans always go into a named binder.
      const list = asList(d, "binders").filter((x) => x.name);
      setBinders(list);
      setBinder((b) => (b && (b === "__new" || list.some((x) => x.name === b)) ? b : list[0]?.name || "__new"));
    }).catch(() => { setBinders([]); setBinder("__new"); });
    api("/api/decks").then((d) => {
      // Decks synced from ManaBox are rebuilt by the next replace import: not a target.
      const list = asList(d, "decks").filter((dk) => dk.source !== "manabox");
      setDecks(list);
      setDeckId((x) => (x && (x === "__new" || list.some((dk) => String(dk.id) === x)) ? x : list[0] ? String(list[0].id) : "__new"));
    }).catch(() => { setDecks([]); setDeckId("__new"); });
  }, []);

  let target = null, label = "";
  if (type === "binder") {
    const name = binder === "__new" ? newBinder.trim() : binder;
    if (name) { target = { type: "binder", name, create: binder === "__new" }; label = `binder “${name}”`; }
  } else if (deckId === "__new") {
    if (newDeck.name.trim()) { target = { type: "deck", name: newDeck.name.trim(), create: true, format: newDeck.format, board }; label = `new deck “${newDeck.name.trim()}”`; }
  } else if (deckId) {
    const dk = decks?.find((d) => String(d.id) === deckId);
    target = { type: "deck", id: Number(deckId), board };
    label = `deck “${dk?.name || deckId}”`;
  }

  const submit = async (e) => {
    e.preventDefault();
    if (!target || busy) return;
    setBusy(true); setError(null);
    try {
      const res = await api("/api/scans/commit", { method: "POST", json: { ids, target } });
      const resTarget = res?.target || {};
      store.set("mtg.scan.target", target.type === "binder"
        ? { type: "binder", name: target.name }
        : { type: "deck", id: resTarget.id ?? target.id ?? null, board });
      onDone(res, label);
    } catch (err) {
      setError(err.message);
    } finally {
      setBusy(false);
    }
  };

  return (
    <Sheet title={`Add ${plural(ids.length, "scan")} to…`} onClose={onClose}>
      <form className="stack" onSubmit={submit}>
        <div className="segmented" role="group" aria-label="Destination">
          <button type="button" aria-pressed={type === "binder"} onClick={() => setType("binder")}><Icon.collection /> Binder</button>
          <button type="button" aria-pressed={type === "deck"} onClick={() => setType("deck")}><Icon.decks /> Deck</button>
        </div>
        {type === "binder" && (
          <fieldset className="stack" style={{ border: 0, padding: 0, margin: 0 }}>
            <legend className="label" style={{ marginBottom: 8 }}>Binder (collection)</legend>
            {!binders && <Spinner />}
            {binders?.map((b) => (
              <label key={b.name} className="radio-card">
                <input type="radio" name="binder" checked={binder === b.name} onChange={() => setBinder(b.name)} />
                <span className="grow"><b>{b.name}</b><br /><span className="small muted">{plural(b.copies ?? b.cards ?? 0, "copy", "copies")}{b.sources ? ` · ${[].concat(b.sources).join(", ")}` : ""}</span></span>
              </label>
            ))}
            <label className="radio-card">
              <input type="radio" name="binder" checked={binder === "__new"} onChange={() => setBinder("__new")} />
              <span className="grow stack" style={{ gap: 6 }}>
                <b>New binder…</b>
                {binder === "__new" && (
                  <input className="input" aria-label="New binder name" placeholder="e.g. Trade binder" maxLength={120} autoFocus
                    value={newBinder} onChange={(e) => setNewBinder(e.target.value)} />
                )}
              </span>
            </label>
          </fieldset>
        )}
        {type === "deck" && (
          <div className="stack">
            <div className="field">
              <label htmlFor="commit-deck">Deck</label>
              <select id="commit-deck" className="select" value={deckId} onChange={(e) => setDeckId(e.target.value)}>
                {decks?.map((d) => <option key={d.id} value={String(d.id)}>{d.name}{d.format ? ` (${d.format})` : ""}</option>)}
                <option value="__new">New deck…</option>
              </select>
            </div>
            {deckId === "__new" && (
              <div className="row" style={{ alignItems: "flex-end" }}>
                <div className="field grow" style={{ flexBasis: 200 }}>
                  <label htmlFor="commit-deck-name">Deck name</label>
                  <input id="commit-deck-name" className="input" required maxLength={200} value={newDeck.name} onChange={(e) => setNewDeck({ ...newDeck, name: e.target.value })} />
                </div>
                <div className="field" style={{ flexBasis: 150, flexGrow: 1 }}>
                  <label htmlFor="commit-deck-format">Format</label>
                  <select id="commit-deck-format" className="select" value={newDeck.format} onChange={(e) => setNewDeck({ ...newDeck, format: e.target.value })}>
                    {FORMATS.map((f) => <option key={f} value={f}>{cap(f)}</option>)}
                  </select>
                </div>
              </div>
            )}
            <div className="field">
              <label htmlFor="commit-board">Board</label>
              <select id="commit-board" className="select" value={board} onChange={(e) => setBoard(e.target.value)}>
                {BOARDS.map(([k, l]) => <option key={k} value={k}>{l}</option>)}
              </select>
            </div>
            <p className="small muted" style={{ margin: 0 }}>Deck cards are added to the deck list; they don't change your binders.</p>
          </div>
        )}
        <ErrorNotice error={error} />
        <button type="submit" className="btn primary" disabled={!target || busy}>
          {busy ? <><span className="spinner" aria-hidden="true" style={{ borderTopColor: "var(--accent-ink)" }} /> Adding…</> : <><Icon.check /> Add {plural(ids.length, "scan")}{label ? ` to ${label}` : ""}</>}
        </button>
      </form>
    </Sheet>
  );
}

// ---------------------------------------------------------------------------
// Calibration: confirm or correct the truth for each scan

function TruthSheet({ entry, onClose, onDone, onPickNeeded }) {
  const { scan, result, preview } = entry;
  const detected = normPrinting(result?.printing || scan?.printing || (scan ? { ...scan, id: scan.printing_id } : null));
  const [finish, setFinish] = useState(normFinish(result?.finish || scan?.finish));
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);
  const confirm = async (printingId) => {
    if (!scan?.id || !printingId) return;
    setBusy(true); setError(null);
    try {
      await api(`/api/scans/${scan.id}/truth`, { method: "POST", json: { printing_id: printingId, finish } });
      onDone(`Truth saved for scan #${scan.id}`);
    } catch (e) { setError(e.message); } finally { setBusy(false); }
  };
  const fin = scan ? scanFinishes(scan) : ["nonfoil", "foil", "etched"];
  return (
    <Sheet title="Calibration: is this right?" onClose={onClose}>
      <div className="stack">
        <div className="truth">
          <figure>{preview ? <img src={preview} alt="Your capture" /> : <div className="ph" />}<figcaption>Your capture</figcaption></figure>
          <figure>
            {detected?.img ? <img src={detected.img} alt={detected.name} /> : <div className="pick"><span className="ph">{detected?.name || "No match"}</span></div>}
            <figcaption>{detected ? `${detected.name} · ${printingLabel(detected)}` : `Identification: ${result?.status || "failed"}`}</figcaption>
          </figure>
        </div>
        <div className="row">
          <span className="label">Finish</span>
          <div className="segmented" role="group" aria-label="Finish">
            {fin.map((f) => <button key={f} type="button" aria-pressed={finish === f} onClick={() => setFinish(f)}>{FINISH_LABEL[f]}</button>)}
          </div>
        </div>
        <ErrorNotice error={error} />
        {!scan?.id && <div className="notice warn"><div className="grow">This scan was not staged. Pick the right printing to stage it and record the truth.</div></div>}
        <div className="row">
          {scan?.id && detected?.id && <button type="button" className="btn primary" disabled={busy} onClick={() => confirm(detected.id)}><Icon.check /> Correct</button>}
          <button type="button" className="btn" disabled={busy} onClick={() => onPickNeeded(finish)}>Wrong: pick the printing</button>
          <button type="button" className="btn ghost" onClick={onClose}>Skip</button>
        </div>
        <p className="small muted" style={{ margin: 0 }}>Pick the exact printing <b>in the language printed on the card</b>. The scores and OCR output of this scan are kept to tune the scanner thresholds.</p>
      </div>
    </Sheet>
  );
}

// ---------------------------------------------------------------------------
// Staged scan row

function ScanRow({ s, status, selected, onSelect, onPatch, onDelete, onIncrement, onPick, onConfirm }) {
  const p = normPrinting({ ...s, id: s.store_printing_id || s.printing_id });
  const fins = scanFinishes(s);
  const finish = normFinish(s.finish);
  const nextFinish = fins[(fins.indexOf(finish) + 1) % fins.length];
  const variants = jsonArr(s.variants);
  const qty = s.quantity ?? 1;
  const thumb = scanThumb(s);
  const ld = (s.lang_detected || "").toUpperCase(), ls = (s.store_lang || "").toUpperCase();
  return (
    <div className={`scan-row st-${status}`} aria-selected={selected}>
      <label className="sel"><input type="checkbox" checked={selected} onChange={(e) => onSelect(e.target.checked)} aria-label={`Select ${s.name || "scan"}`} /></label>
      <button type="button" className="thb" onClick={onPick} aria-label={`Change printing of ${s.name || "scan"}`}>
        {thumb ? <img className="th" src={thumb} alt="" loading="lazy" decoding="async" /> : <span className="th" />}
      </button>
      <div className="info">
        <div className="top">
          <span className="nm" title={s.name}>{s.name || "Unidentified card"}</span>
          <span className={`badge st-chip ${status}`}>{STATUS_LABEL[status] || status}</span>
        </div>
        <div className="sub">
          {s.set_code && <span>{String(s.set_code).toUpperCase()} #{s.collector_number}</span>}
          {(ld || ls) && <span className="badge" title="Detected language → stored language">{ld && ls && ld !== ls ? `${ld}→${ls}` : ls || ld}</span>}
          {s.method && <span className="muted">{s.method}{typeof s.confidence === "number" ? ` ${Math.round(s.confidence * 100)}%` : ""}</span>}
        </div>
      </div>
      <div className="ctrls">
        <div className="stepper" role="group" aria-label="Quantity">
          <button type="button" aria-label="One less" disabled={qty <= 1} onClick={() => onPatch({ quantity: qty - 1 })}><Icon.minus /></button>
          <output aria-live="polite">{qty}</output>
          <button type="button" aria-label="One more" onClick={onIncrement}><Icon.plus /></button>
        </div>
        <button type="button" className={`btn sm finish-btn ${finish}`} disabled={fins.length < 2}
          title={fins.length < 2 ? `Only printed ${FINISH_LABEL[finish] || finish}` : `Switch to ${FINISH_LABEL[nextFinish]}`}
          onClick={() => onPatch({ finish: nextFinish })}>{finish !== "nonfoil" && "✦ "}{FINISH_LABEL[finish] || finish}</button>
        <select className="select" aria-label="Condition" value={s.condition || "near_mint"} onChange={(e) => onPatch({ condition: e.target.value })}>
          {CONDITIONS.map(([k, , short]) => <option key={k} value={k}>{short}</option>)}
        </select>
        <select className="select" aria-label="Store as language" value={s.store_lang || "en"} onChange={(e) => onPatch({ store_lang: e.target.value })}>
          {SCAN_LANGS.map(([k]) => <option key={k} value={k}>{k.toUpperCase()}</option>)}
        </select>
        {status === "suggest" && <button type="button" className="btn sm" onClick={onConfirm}><Icon.check /> Confirm</button>}
        {(status === "review" || status === "failed") && <button type="button" className="btn sm danger" onClick={onPick}>Pick printing</button>}
        {variants.length > 0 && <button type="button" className="chip" onClick={onPick} title="Promo / List / other printings share this collector number">variant?</button>}
        <button type="button" className="btn ghost icon sm" aria-label={`Delete ${s.name || "scan"}`} onClick={onDelete} style={{ marginLeft: "auto" }}><Icon.trash /></button>
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------------
// Scan tab

function ScanTab({ active, health, onCommitted }) {
  const [lib, setLib] = useState(null);
  const [libError, setLibError] = useState(null);
  const [settings, setSettings] = useState(() => ({ ...SCAN_DEFAULTS, ...(store.get("mtg.scan.settings", {}) || {}) }));
  const [scans, setScans] = useState(null);
  const [listError, setListError] = useState(null);
  const [busy, setBusy] = useState(false);
  const busyRef = useRef(false);
  const [last, setLast] = useState(null); // {kind, scan, result, payload, preview, error}
  const [sheet, setSheet] = useState(null);
  const [selected, setSelected] = useState(() => new Set());
  const [toast, setToast] = useState(null);
  const [flash, setFlash] = useState(null);
  const [rearmKey, bumpRearm] = useReducer((x) => x + 1, 0);
  const [statusById, setStatusById] = useState({});
  const settingsRef = useRef(settings);
  settingsRef.current = settings;
  const replaceRef = useRef(null);

  useEffect(() => {
    if (!active || lib) return;
    let alive = true;
    import("./scanlib.js").then((m) => { if (alive) setLib(m); })
      .catch((e) => { if (alive) setLibError(`Could not load the scanner: ${e.message}`); });
    return () => { alive = false; };
  }, [active, lib]);

  const setSetting = (k, v) => setSettings((s) => { const n = { ...s, [k]: v }; store.set("mtg.scan.settings", n); return n; });

  const loadScans = useCallback(async () => {
    try {
      const d = await api("/api/scans?status=staged");
      const list = asList(d, "scans", "rows").slice().sort((a, b) => (b.id ?? 0) - (a.id ?? 0));
      setScans(list);
      setListError(null);
      setSelected((sel) => new Set([...sel].filter((id) => list.some((s) => s.id === id))));
    } catch (e) {
      setListError(e.status === 404 ? "The scanner is not available on this server (update the app)." : `Could not load scans: ${e.message}`);
      setScans((s) => s || []);
    }
  }, []);
  useEffect(() => { if (active) loadScans(); }, [active, loadScans]);

  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(null), toast.ms || 4000);
    return () => clearTimeout(t);
  }, [toast]);

  const statusOf = useCallback((s) => {
    if (!s) return "failed";
    if (statusById[s.id]) return statusById[s.id];
    const raw = s.result_status || s.identify_status || s.decision || s.status;
    if (["auto", "suggest", "review", "failed"].includes(raw)) return raw;
    if (!s.printing_id && !s.store_printing_id) return "review";
    return "auto";
  }, [statusById]);
  const markStatus = (id, st) => setStatusById((m) => ({ ...m, [id]: st }));

  const feedback = (kind) => {
    if (settingsRef.current.sound) beep(kind);
    vibrate(kind);
    setFlash({ color: STATUS_COLOR[kind] || "#ffffff", until: Date.now() + 900 });
  };

  const showError = (msg) => setToast({ text: msg, ms: 5000 });

  function openPickerFor(scan, result, { truthFinish = null, payload = null } = {}) {
    // The user's own collector line: the server's stored strip, else the local capture.
    const strips = [];
    if (scan?.id && scan.has_strip !== false) strips.push(scanFileUrl(scan, "strip"));
    if (payload?.strip) strips.push(`data:image/jpeg;base64,${payload.strip}`);
    const cands = [...candidatesOf(result, scan), ...jsonArr(result?.variants || scan?.variants).map(normPrinting)]
      .filter((p, i, a) => p && p.id && a.findIndex((x) => x.id === p.id) === i);
    setSheet({
      type: "pick", scan, candidates: cands, truthFinish, strips,
      oracleId: scan?.oracle_id || result?.printing?.oracle_id || cands[0]?.oracle_id || null,
      lang: scan?.lang_detected || result?.lang_detected || "",
    });
  }

  async function handleResult(res, payload, preview) {
    const r = res?.result || {};
    const scan = res?.scan || null;
    if (res?.duplicate) {
      setLast({ kind: "duplicate", scan, result: r, payload, preview });
      feedback("duplicate");
      return;
    }
    const status = ["auto", "suggest", "review", "failed"].includes(r.status) ? r.status : scan ? statusOf(scan) : "failed";
    if (scan?.id) markStatus(scan.id, status);
    setLast({ kind: status, scan, result: r, payload, preview });
    feedback(status);
    loadScans();
    if (settingsRef.current.calibration) setSheet({ type: "truth", entry: { scan, result: r, preview, payload } });
    else if (status === "review" || status === "failed") {
      if (candidatesOf(r, scan).length) openPickerFor(scan, r, { payload });
    }
  }

  async function postScan(payload, preview) {
    if (busyRef.current) return;
    busyRef.current = true;
    setBusy(true);
    try {
      const res = await api("/api/scan", { method: "POST", json: payload });
      await handleResult(res, payload, preview);
    } catch (e) {
      setLast({ kind: "error", error: e.message, payload, preview });
      feedback("error");
      bumpRearm(); // let the same card be captured again
    } finally {
      busyRef.current = false;
      setBusy(false);
    }
  }

  const onCapture = (cap) => {
    const s = settingsRef.current;
    const payload = {
      card: cap.card,
      strip: cap.strip,
      settings: { storageLang: s.storageLang, foil: s.foil, condition: s.condition, ...(s.setHint.trim() ? { setHint: s.setHint.trim().toLowerCase() } : {}) },
      ...(s.calibration ? { calibration: true } : {}),
      ...(replaceRef.current ? { replace_id: replaceRef.current } : {}),
    };
    replaceRef.current = null;
    postScan(payload, cap.cardPreview);
  };

  const patchScan = async (id, body, { status } = {}) => {
    try {
      await api(`/api/scans/${id}`, { method: "PATCH", json: body });
      if (status) markStatus(id, status);
      await loadScans();
      setLast((l) => (l?.scan?.id === id ? { ...l, kind: status || l.kind, scan: { ...l.scan, ...body } } : l));
    } catch (e) { showError(e.message); }
  };
  const deleteScan = async (id) => {
    try {
      await api(`/api/scans/${id}`, { method: "DELETE" });
      setLast((l) => (l?.scan?.id === id ? null : l));
      await loadScans();
    } catch (e) { showError(e.message); }
  };
  const increment = async (id) => {
    try {
      await api(`/api/scans/${id}/increment`, { method: "POST", json: {} });
      setToast({ text: "+1 copy" });
      feedback("auto");
      await loadScans();
    } catch (e) { showError(e.message); }
  };
  const undo = async () => {
    try {
      const r = await api("/api/scans/undo", { method: "POST", json: {} });
      setLast(null);
      setToast({ text: r?.scan?.name || r?.name ? `Removed ${r.scan?.name || r.name}` : "Last scan undone" });
      await loadScans();
    } catch (e) { showError(e.status === 404 ? "Nothing to undo." : e.message); }
  };
  const forceAdd = () => {
    if (!last?.payload) return;
    postScan({ ...last.payload, force: true }, last.preview);
  };

  async function onPicked(p) {
    const sh = sheet;
    setSheet(null);
    if (!sh) return;
    const s = settingsRef.current;
    const singleFinish = p.finishes?.length === 1 ? p.finishes[0] : null;
    try {
      if (sh.type === "manual" || !sh.scan?.id) {
        const finish = sh.truthFinish || singleFinish || (s.foil === "foil" ? "foil" : "nonfoil");
        const res = await api("/api/scans/manual", { method: "POST", json: { printing_id: p.id, finish, quantity: 1, storageLang: s.storageLang, condition: s.condition } });
        const scan = res?.scan || (res?.id ? res : null);
        if (scan?.id) markStatus(scan.id, "auto");
        if (sh.truthFinish && scan?.id) {
          await api(`/api/scans/${scan.id}/truth`, { method: "POST", json: { printing_id: p.id, finish } }).catch(() => {});
        }
        setToast({ text: `Added ${p.name}` });
        feedback("auto");
      } else {
        await api(`/api/scans/${sh.scan.id}`, { method: "PATCH", json: { printing_id: p.id } });
        markStatus(sh.scan.id, "auto");
        if (sh.truthFinish) {
          await api(`/api/scans/${sh.scan.id}/truth`, { method: "POST", json: { printing_id: p.id, finish: sh.truthFinish } });
          setToast({ text: "Truth saved" });
        }
        setLast((l) => (l?.scan?.id === sh.scan.id ? { ...l, kind: "auto", scan: { ...l.scan, printing_id: p.id, name: p.name, set_code: p.set, collector_number: p.cn, image_normal: p.img } } : l));
      }
      await loadScans();
    } catch (e) { showError(e.message); }
  }

  const list = scans || [];
  const committable = list.filter((s) => (s.printing_id || s.store_printing_id) && !["review", "failed"].includes(statusOf(s)));
  const selIds = [...selected];
  // Review/failed rows can't be committed (the server refuses the whole batch): leave them out of a selection too.
  const committableIds = new Set(committable.map((s) => s.id));
  const selCommit = selIds.filter((id) => committableIds.has(id));
  const commitIds = selIds.length ? selCommit : committable.map((s) => s.id);
  const copies = list.reduce((a, s) => a + (s.quantity ?? 1), 0);
  const allSelected = list.length > 0 && selected.size === list.length;
  const scanner = health?.scanner;
  const sheetOpen = Boolean(sheet);

  return (
    <div className="scan">
      <div className="scan-main">
        {libError && <ErrorNotice error={libError} />}
        {scanner && scanner.index_ready === false && (
          <div className="notice warn" role="status"><span aria-hidden="true">⏳</span><div className="grow">The card index is still being built. Scanning works once it's ready (see Import → Scanner index).</div></div>
        )}
        {scanner && (scanner.tesseract === false || scanner.djpeg === false) && (
          <div className="notice warn" role="status"><div className="grow">Text recognition is not installed on the server{scanner.tesseract === false ? " (tesseract missing)" : ""}{scanner.djpeg === false ? " (djpeg missing)" : ""}. Scans will be less accurate.</div></div>
        )}
        <CameraView lib={lib} active={active} settings={settings} busy={busy} paused={sheetOpen} flash={flash} rearmKey={rearmKey}
          onCapture={onCapture} onError={showError} />
        {(busy || last) && <ResultCard busy={busy} last={last} onPick={() => openPickerFor(last?.scan, last?.result, { payload: last?.payload })}
          onConfirm={() => last?.scan?.id && patchScan(last.scan.id, { printing_id: last.scan.printing_id }, { status: "auto" })}
          onIncrement={() => last?.scan?.id && increment(last.scan.id)} onForce={forceAdd} onUndo={undo}
          onResend={() => last?.payload && postScan(last.payload, last.preview)}
          onRetry={() => {
            // A rescan replaces the open review row of this card instead of adding a second one.
            replaceRef.current = last?.scan?.id && ["review", "failed"].includes(last.kind) ? last.scan.id : null;
            setLast(null); bumpRearm();
          }} onSearch={() => setSheet({ type: "manual" })} />}

        <div className="scan-settings">
          <div className="segmented" role="group" aria-label="Foil">
            {[["auto", "Auto"], ["nonfoil", "Non-foil"], ["foil", "✦ Foil"]].map(([k, l]) => (
              <button key={k} type="button" aria-pressed={settings.foil === k} onClick={() => setSetting("foil", k)}>{l}</button>
            ))}
          </div>
          <label className="sr-only" htmlFor="scan-lang">Store cards as language</label>

function ResultCard({ busy, last, onPick, onConfirm, onIncrement, onForce, onResend, onUndo, onRetry, onSearch }) {
  if (busy) {
    return (
      <div className="result st-busy" role="status" aria-live="polite">
        {last?.preview ? <img className="th" src={last.preview} alt="" /> : <span className="th" />}
        <div className="body"><span className="nm">Identifying…</span><span className="small muted">Reading the collector line and matching the art.</span><div className="progress" aria-hidden="true" /></div>
      </div>
    );
  }
  if (!last) return null;
  const { kind, scan, result: r = {} } = last;
  if (kind === "error") {
    return (
      <div className="result st-error" role="alert">
        {last.preview ? <img className="th" src={last.preview} alt="" /> : <span className="th" />}
        <div className="body"><span className="nm">Scan failed</span><span className="small">{last.error}</span></div>
        <div className="actions">
          {last.payload && <button type="button" className="btn sm" onClick={onResend}>Send again</button>}
          <button type="button" className="btn sm" onClick={onRetry}><Icon.camera /> Rescan</button>
        </div>
      </div>
    );
  }
  const store_ = normPrinting(r.store || r.printing) || (scan ? normPrinting({ ...scan, id: scan.store_printing_id || scan.printing_id }) : null);
  const name = scan?.name || store_?.name || "Unknown card";
  const thumb = (scan && scanThumb(scan)) || store_?.imgSmall || last.preview;
  const ld = (r.lang_detected || scan?.lang_detected || "").toUpperCase(), ls = (scan?.store_lang || r.store?.lang || "").toUpperCase();
  const finish = normFinish(r.finish || scan?.finish);
  return (
    <div className={`result st-${kind}`} role="status" aria-live="polite">
      {thumb ? <img className="th" src={thumb} alt="" /> : <span className="th" />}
      <div className="body">
        <span className="row" style={{ gap: 6 }}><span className={`badge st-chip ${kind}`}>{STATUS_LABEL[kind] || kind}</span>{r.claude_used && <span className="badge accent">✦ Claude</span>}</span>
        <span className="nm">{kind === "failed" && !scan ? "Card not recognised" : name}</span>
        {store_ && (scan || kind !== "failed") && (
          <span className="small muted">{printingLabel(store_)}{ld && ls && ld !== ls ? ` · read ${ld}, stored ${ls}` : ""} · {FINISH_LABEL[finish] || finish}</span>
        )}
        {kind === "duplicate" && <span className="small">Same printing as your last scan, so it was not added again.</span>}
        {kind === "suggest" && <span className="small">Probably right: please confirm.</span>}
        {kind === "review" && <span className="small">Not sure: pick the right printing.</span>}
      </div>
      <div className="actions">
        {kind === "duplicate" && scan?.id && <button type="button" className="btn sm primary" onClick={onIncrement}><Icon.plus /> +1 copy</button>}
        {kind === "duplicate" && last.payload && <button type="button" className="btn sm" onClick={onForce}>Different card, add it</button>}
        {kind === "suggest" && scan?.id && <button type="button" className="btn sm primary" onClick={onConfirm}><Icon.check /> Confirm</button>}
        {(kind === "suggest" || kind === "review" || ((kind === "auto") && jsonArr(r.variants || scan?.variants).length > 0)) && (
          <button type="button" className={`btn sm${kind === "review" ? " primary" : ""}`} onClick={onPick}>{kind === "auto" ? "variant?" : "Pick printing"}</button>
        )}
        {kind === "failed" && <button type="button" className="btn sm primary" onClick={onSearch}><Icon.search /> Find by name</button>}
        {(kind === "failed" || kind === "review") && <button type="button" className="btn sm" onClick={onRetry}><Icon.camera /> Rescan</button>}
        {(kind === "auto" || kind === "suggest") && scan?.id && <button type="button" className="btn sm" onClick={onIncrement}><Icon.plus /> +1</button>}
        {scan?.id && kind !== "duplicate" && <button type="button" className="btn sm danger undo-btn" onClick={onUndo} style={{ marginLeft: "auto" }}><Icon.undo /> Undo</button>}
      </div>
    </div>
  );
}

                    {sources.map((s) => <SourceBadge key={s} source={s} />)}

function JobLine({ label, job }) {
  if (!job || typeof job !== "object") return null;
  const state = job.state || job.status || (job.running ? "running" : job.error ? "error" : job.finished_at || job.done_at ? "done" : "idle");
  const done = job.done ?? job.processed ?? job.progress ?? null, total = job.total ?? null;
  const pct = total ? Math.min(100, Math.round((Number(done) || 0) * 100 / total)) : null;
  return (
    <div className="stack" style={{ gap: 4 }}>
      <div className="row between small">
        <span><b>{label}</b> <span className={`badge ${state === "running" || state === "queued" ? "accent" : state === "error" || state === "failed" ? "bad" : state === "done" ? "ok" : ""}`}>{state}</span></span>
        {total ? <span className="muted">{fmtInt(done)} / {fmtInt(total)}{job.phase ? ` · ${job.phase}` : ""}</span> : job.phase ? <span className="muted">{job.phase}</span> : null}
      </div>
      {pct != null && <div className="meter" role="progressbar" aria-valuemin={0} aria-valuemax={100} aria-valuenow={pct} aria-label={`${label} progress`}><span style={{ width: `${pct}%` }} /></div>}
      {job.error && <span className="small" style={{ color: "var(--bad)" }}>{String(job.error)}</span>}
    </div>
  );
}

/** Short text for a scheduler step result ({ran}, {skipped}, {error}, ...). */
function schedResult(x) {
  if (x == null) return null;
  if (typeof x !== "object") return String(x);
  if (x.error) return `error: ${x.error}`;
  if (x.skipped) return `skipped (${x.skipped})`;
  if (x.ran || x.started) return "ran";
  if (x.status) return String(x.status);
  return null;
}

/**
 * Scheduler block of /api/index/status: {enabled, hour, next_run,
 * last_index_refresh, last_index_check, last_index_result, last_price_refresh,
 * last_run: {at, index, prices}, running}. Read defensively: missing fields hide.
 */
function readScheduler(st) {
  const sch = st?.scheduler;
  if (!sch || typeof sch !== "object") return null;
  const lasts = [];
  const add = (label, at, note = null) => { if (at != null && at !== "") lasts.push({ label, at, note }); };
  add("Card data refreshed", sch.last_index_refresh);
  add("Scryfall bulk data checked", sch.last_index_check, schedResult(sch.last_index_result));
  add("Prices refreshed", sch.last_price_refresh);
  const lr = sch.last_run && typeof sch.last_run === "object" ? sch.last_run : null;
  if (lr) {
    const parts = [["card data", lr.index], ["prices", lr.prices]].map(([k, v]) => (schedResult(v) ? `${k}: ${schedResult(v)}` : null)).filter(Boolean);
    add("Last nightly run", lr.at, parts.join(" · ") || null);
  }
  return {
    enabled: sch.enabled !== false, hour: sch.hour ?? null, next: sch.next_run ?? null,
    running: typeof sch.running === "string" ? sch.running : sch.running ? "running" : null, lasts,
  };
}

function SchedulerInfo({ st }) {
  const sc = readScheduler(st);
  if (!sc) return null;
  return (
    <div className="sched" aria-label="Automatic refresh">
      <div className="row">
        <b>Automatic refresh</b>
        <span className={`badge ${sc.enabled ? "ok" : ""}`}>{sc.enabled ? "on" : "off"}</span>
        {sc.running && <span className="badge accent">running: {sc.running}</span>}
        {sc.enabled && sc.hour != null && <span className="muted small">nightly at {String(sc.hour).padStart(2, "0")}:00 server time</span>}
      </div>
      {sc.enabled && sc.next && (
        <div className="row"><span className="muted">Next scheduled check</span> <b title={fmtDate(sc.next)}>{fmtAgo(sc.next)}</b></div>
      )}
      {sc.lasts.map((l) => (
        <div key={l.label} className="row">
          <span className="muted">{l.label}</span>
          <b title={fmtDate(l.at)}>{fmtAgo(l.at)}</b>
          {l.note && <span className={`small ${/^error|error:/.test(l.note) ? "" : "muted"}`} style={{ overflowWrap: "anywhere", color: /error/.test(l.note) ? "var(--bad)" : undefined }}>{l.note}</span>}
        </div>
      ))}
      {!sc.enabled && <span className="small muted">The nightly index and price refresh is turned off on the server (SCHEDULER_ENABLED=false).</span>}
    </div>
  );
}

function ScannerIndexPanel({ health }) {
  const [st, setSt] = useState(null);

  const [missing, setMissing] = useState(false);
  const [busy, setBusy] = useState(null);
  const load = useCallback(async () => {
    try { setSt(await api("/api/index/status")); setError(null); }
    catch (e) { if (e.status === 404) setMissing(true); else setError(e.message); }
  }, []);
  useEffect(() => { load(); }, [load]);
  const jobs = st ? [["Card index", st.refresh_job || st.index_job || st.metadata_job || st.job], ["Fingerprints", st.fingerprint_job]] : [];
  const running = jobs.some(([, j]) => j && (j.running || ["running", "queued"].includes(j.state || j.status)));
  useEffect(() => {
    if (!running) return;
    const t = setInterval(load, 3000);
    return () => clearInterval(t);
  }, [running, load]);
  const start = async (path, label) => {
    setBusy(label); setError(null);
    try { await api(path, { method: "POST", json: {} }); await load(); }

      <ErrorNotice error={error} onRetry={load} />

          </div>
          {jobs.map(([label, job]) => <JobLine key={label} label={label} job={job} />)}
          <SchedulerInfo st={st} />
        </>
      )}
      {sc && (
        <div className="kv-inline">
          <span>OCR <span className={`badge ${sc.tesseract ? "ok" : "bad"}`}>{sc.tesseract ? "✓ tesseract" : "✗ tesseract"}</span></span>
          <span>JPEG <span className={`badge ${sc.djpeg ? "ok" : "bad"}`}>{sc.djpeg ? "✓ djpeg" : "✗ djpeg"}</span></span>
        </div>
      )}
      <div className="row">
        <button type="button" className="btn" disabled={Boolean(busy) || running} onClick={() => start("/api/index/refresh", "refresh")}>
          {busy === "refresh" ? <><span className="spinner" aria-hidden="true" /> Starting…</> : <><Icon.refresh /> Refresh index</>}
        </button>
        <button type="button" className="btn" disabled={Boolean(busy) || running} onClick={() => start("/api/index/fingerprints", "fp")}>
          {busy === "fp" ? <><span className="spinner" aria-hidden="true" /> Starting…</> : <><Icon.sparkle /> Build fingerprints</>}
        </button>
      </div>
      <details className="disclosure">
        <summary>Calibration data</summary>
        <div className="stack" style={{ marginTop: 6 }}>
          <p className="small muted" style={{ margin: 0 }}>Scans made in calibration mode keep their scores, OCR output and the printing you confirmed. Export them to tune the scanner thresholds.</p>
          <a className="btn" href="/api/calibration/export" download="mtg-scan-calibration.json" style={{ justifySelf: "start" }}><Icon.download /> Export calibration (JSON)</a>
        </div>
      </details>
    </section>
  );
}

const TABS = [
  { id: "scan", label: "Scan", icon: Icon.scan },
  { id: "collection", label: "Collection", icon: Icon.collection },
  { id: "decks", label: "Decks", icon: Icon.decks },
  { id: "planner", label: "Planner", icon: Icon.planner },
  { id: "import", label: "Import", icon: Icon.import },
];
const isTab = (t) => TABS.some((x) => x.id === t);

function App() {
  const [tab, setTab] = useState(() => {
    const h = location.hash.slice(1);
    return isTab(h) ? h : store.get("mtg.tab", "collection");
  });
  const [visited, setVisited] = useState(() => new Set([isTab(tab) ? tab : "collection"]));
  // Collection data (imports, prices) and deck data (deck edits, planner
  // save_deck) are versioned separately so a deck rename doesn't reset the
  // collection list. An import changes both.
  const [dataVersion, bumpData] = useReducer((x) => x + 1, 0);
  const [deckVersion, bumpDecks] = useReducer((x) => x + 1, 0);
  const onImported = useCallback(() => { bumpData(); bumpDecks(); }, []);
  const [cardId, setCardId] = useState(null);
  const [deck, setDeck] = useState({ id: null, notice: null });
  const [plannerRequest, setPlannerRequest] = useState(null);
  const [health, setHealth] = useState(null);
  const scrollPos = useRef({});
  const tabRefs = useRef({});

  useEffect(() => {
    api("/healthz").then(setHealth).catch(() => setHealth(null));
  }, []);

  const switchTab = useCallback((next) => {
    if (!isTab(next)) return;
    setTab((cur) => {
      if (cur !== next) scrollPos.current[cur] = window.scrollY;
      return next;
    });
  }, []);

  useLayoutEffect(() => {
    store.set("mtg.tab", tab);
    if (location.hash.slice(1) !== tab) history.replaceState(null, "", `#${tab}`);
    setVisited((v) => (v.has(tab) ? v : new Set([...v, tab])));
    window.scrollTo(0, scrollPos.current[tab] || 0);
  }, [tab]);

  useEffect(() => {
    const onHash = () => { const h = location.hash.slice(1); if (isTab(h)) switchTab(h); };
    window.addEventListener("hashchange", onHash);
    return () => window.removeEventListener("hashchange", onHash);
  }, [switchTab]);

  const openDeck = useCallback((id, notice = null) => {
    setDeck({ id, notice });
    setCardId(null);
    scrollPos.current.decks = 0;
    if (id) switchTab("decks");
    window.scrollTo(0, 0);
  }, [switchTab]);

  const askAboutDeck = useCallback((d) => {
    const prompt = `Let's work on my deck #${d.id} "${d.name}"${d.format ? ` (${d.format})` : ""}. `
      + `Load it with get_deck and give me a short analysis: mana curve, card-type balance, key synergies, weak spots, `
      + `and which of the missing cards matter most. Suggest improvements, preferring cards I already own.`;
    setPlannerRequest({ prompt, title: `Deck: ${d.name}`.slice(0, 60), nonce: Date.now() });
    switchTab("planner");
  }, [switchTab]);

  const onTabKey = (e) => {
    const i = TABS.findIndex((t) => t.id === tab);
    let j = null;
    if (e.key === "ArrowRight") j = (i + 1) % TABS.length;
    else if (e.key === "ArrowLeft") j = (i - 1 + TABS.length) % TABS.length;
    else if (e.key === "Home") j = 0;
    else if (e.key === "End") j = TABS.length - 1;
    if (j == null) return;
    e.preventDefault();
    switchTab(TABS[j].id);
    tabRefs.current[TABS[j].id]?.focus();
  };

  const panel = (id, content) => (
    <section key={id} id={`panel-${id}`} role="tabpanel" aria-labelledby={`tab-${id}`} hidden={tab !== id}>
      {visited.has(id) && content}
    </section>
  );

  return (
    <>
      <header className="app-header">
        <div className="brand"><img src="icon.svg" alt="" width="28" height="28" /> MTG Planner</div>
        <nav className="tabbar" role="tablist" aria-label="Sections" onKeyDown={onTabKey}>
          {TABS.map((t) => (
            <button key={t.id} id={`tab-${t.id}`} ref={(el) => { tabRefs.current[t.id] = el; }} type="button" role="tab" className="tab"
              aria-selected={tab === t.id} aria-controls={`panel-${t.id}`} tabIndex={tab === t.id ? 0 : -1}
              onClick={() => {
                if (t.id === "decks" && tab === "decks" && deck.id) openDeck(null);
                switchTab(t.id);
              }}>
              <t.icon />
              <span>{t.label}</span>
            </button>
          ))}
        </nav>
      </header>
      <main>
        {panel("scan", <ScanTab active={tab === "scan"} health={health} onCommitted={onImported} />)}
        {panel("collection", <CollectionTab dataVersion={dataVersion} onOpenCard={setCardId} onGoImport={() => switchTab("import")}
          onGoScan={() => switchTab("scan")} onChanged={onImported} />)}
        {panel("decks", <DecksTab dataVersion={deckVersion} deckId={deck.id} deckNotice={deck.notice} onOpenDeck={openDeck}
          onOpenCard={setCardId} onAsk={askAboutDeck} onChanged={bumpDecks} />)}
        {panel("planner", <PlannerTab active={tab === "planner"} health={health} request={plannerRequest}
          onRequestHandled={() => setPlannerRequest(null)} onChanged={bumpDecks} />)}
        {panel("import", <ImportTab dataVersion={dataVersion} health={health} onImported={onImported} />)}
      </main>
      {cardId && <CardSheet id={cardId} onClose={() => setCardId(null)} onOpenCard={setCardId} onOpenDeck={(id) => openDeck(id)} />}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
