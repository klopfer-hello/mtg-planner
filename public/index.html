<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121214" media="(prefers-color-scheme: dark)">
<meta name="description" content="Magic: The Gathering collection and deck planner with a Claude-powered assistant.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MTG Planner">
<title>MTG Planner</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="root">
  <noscript>MTG Planner needs JavaScript.</noscript>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js" crossorigin="anonymous"></script>

<!-- The app: React components in JSX, compiled in the browser by Babel standalone.
     data-presets="react" only: the "env" preset would rewrite async/await to
     regenerator calls that need a runtime we don't load. data-plugins="" turns off
     Babel standalone's default plugins (class properties, object rest/spread): the
     browsers have both, and their helpers (const _excluded) would be declared again
     in every file. The scripts run in this order as classic scripts sharing one
     global scope, so top-level code may only use names from the same or an earlier
     file (test/ui-structure.test.js). -->
<script type="text/babel" data-presets="react" data-plugins="" src="ui/core.jsx"></script>
<script type="text/babel" data-presets="react" data-plugins="" src="ui/common.jsx"></script>
<script type="text/babel" data-presets="react" data-plugins="" src="ui/cardsheet.jsx"></script>
<script type="text/babel" data-presets="react" data-plugins="" src="ui/collection.jsx"></script>
<script type="text/babel" data-presets="react" data-plugins="" src="ui/decks.jsx"></script>
<script type="text/babel" data-presets="react" data-plugins="" src="ui/deckneeds.jsx"></script>
<script type="text/babel" data-presets="react" data-plugins="" src="ui/deckbuild.jsx"></script>
<script type="text/babel" data-presets="react" data-plugins="" src="ui/deckpower.jsx"></script>
<script type="text/babel" data-presets="react" data-plugins="" src="ui/deckguide.jsx"></script>
<script type="text/babel" data-presets="react" data-plugins="" src="ui/deckdetail.jsx"></script>
<script type="text/babel" data-presets="react" data-plugins="" src="ui/planner.jsx"></script>
<script type="text/babel" data-presets="react" data-plugins="" src="ui/settings.jsx"></script>
<script type="text/babel" data-presets="react" data-plugins="" src="ui/scan-camera.jsx"></script>
<script type="text/babel" data-presets="react" data-plugins="" src="ui/scan-pick.jsx"></script>
<script type="text/babel" data-presets="react" data-plugins="" src="ui/scan-tab.jsx"></script>
<script type="text/babel" data-presets="react" data-plugins="" src="ui/binders.jsx"></script>
<script type="text/babel" data-presets="react" data-plugins="" src="ui/copies.jsx"></script>
<script type="text/babel" data-presets="react" data-plugins="" src="ui/scanindex.jsx"></script>
<script type="text/babel" data-presets="react" data-plugins="" src="ui/market.jsx"></script>
<script type="text/babel" data-presets="react" data-plugins="" src="ui/app.jsx"></script>
</body>
</html>
