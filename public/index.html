<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121214" media="(prefers-color-scheme: dark)">
<meta name="description" content="Magic: The Gathering collection and deck planner with a Claude-powered assistant.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MTG Planner">
<title>MTG Planner</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
/* ==========================================================================
   Theme tokens (light default, dark via prefers-color-scheme)
   ========================================================================== */
:root {
  color-scheme: light dark;
  --bg: #f6f5f2;
  --surface: #ffffff;
  --surface-2: #efede8;
  --surface-3: #e4e1da;
  --text: #1d1b18;
  --muted: #6b665e;
  --border: #dcd8d0;
  --accent: #5b3fd1;
  --accent-hover: #4a30b8;
  --accent-ink: #ffffff;
  --accent-soft: #ece8fb;
  --ok: #1f7a3d;
  --ok-soft: #e1f2e6;
  --bad: #b42318;
  --bad-soft: #fdeceb;
  --warn: #8a5a00;
  --warn-soft: #fcf1d8;
  --overlay: rgba(20, 18, 15, 0.45);
  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 14px rgba(0,0,0,.06);
  --shadow-lg: 0 10px 40px rgba(0,0,0,.22);
  --radius: 12px;
  --radius-sm: 8px;
  --tabbar-h: 64px;
  --header-h: 52px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121214;
    --surface: #1c1c20;
    --surface-2: #26262c;
    --surface-3: #313139;
    --text: #ececef;
    --muted: #a09fa8;
    --border: #36363e;
    --accent: #a38bff;
    --accent-hover: #b8a5ff;
    --accent-ink: #15102a;
    --accent-soft: #2a2444;
    --ok: #62d18d;
    --ok-soft: #16301f;
    --bad: #ff8274;
    --bad-soft: #3a1b18;
    --warn: #f0c062;
    --warn-soft: #3a2d10;
    --overlay: rgba(0, 0, 0, 0.6);
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
    --shadow-lg: 0 10px 40px rgba(0,0,0,.6);
  }
}

/* ==========================================================================
   Base
   ========================================================================== */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.45 var(--font);
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}
img { max-width: 100%; }
a { color: var(--accent); }
h1, h2, h3, h4 { line-height: 1.2; margin: 0; }
h2 { font-size: 1.25rem; }
h3 { font-size: 1.05rem; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.nowrap { white-space: nowrap; }
.mono { font-family: var(--mono); font-size: .9em; }
code { font-family: var(--mono); font-size: .9em; background: var(--surface-2); padding: .1em .35em; border-radius: 5px; }

/* ==========================================================================
   Layout: header, navigation (bottom tab bar on mobile, top nav on desktop)
   ========================================================================== */
.app-header {
  position: sticky; top: 0; z-index: 30;
  height: calc(var(--header-h) + env(safe-area-inset-top));
  padding: env(safe-area-inset-top) 16px 0;
  display: flex; align-items: center; gap: 16px;
  /* Solid on mobile: a backdrop-filter would become the containing block of
     the position:fixed tab bar inside the header and pin it to the top. */
  background: var(--bg);
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.05rem; white-space: nowrap; }
.brand img { width: 28px; height: 28px; border-radius: 7px; }
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  display: grid; grid-template-columns: repeat(4, 1fr);
  height: calc(var(--tabbar-h) + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom);
  background: var(--surface);
  border-top: 1px solid var(--border);
}
.tab {
  appearance: none; border: 0; background: none; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  min-height: 44px; color: var(--muted); font-size: .72rem; font-weight: 600; letter-spacing: .01em;
}
.tab svg { width: 24px; height: 24px; }
.tab[aria-selected="true"] { color: var(--accent); }
.tab[aria-selected="true"] svg { transform: translateY(-1px); }
main {
  max-width: 1200px; margin: 0 auto;
  padding: 16px 16px calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 24px);
}
@media (min-width: 768px) {
  .tabbar {
    position: static; display: flex; gap: 4px; height: auto; padding: 0;
    background: none; border: 0; margin-left: auto;
  }
  .tab { flex-direction: row; gap: 8px; padding: 0 14px; border-radius: 10px; font-size: .92rem; }
  .tab svg { width: 20px; height: 20px; }
  .tab:hover { background: var(--surface-2); color: var(--text); }
  .tab[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); }
  .tab[aria-selected="true"] svg { transform: none; }
  main { padding: 24px 24px 48px; }
  :root { --header-h: 60px; --tabbar-h: 0px; }
  .app-header {
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: saturate(1.4) blur(10px);
    -webkit-backdrop-filter: saturate(1.4) blur(10px);
  }
}

/* ==========================================================================
   Controls
   ========================================================================== */
.btn {
  appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 16px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
  font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap;
  transition: background .12s, border-color .12s;
}
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.danger { color: var(--bad); }
.btn.danger:hover { background: var(--bad-soft); }
.btn.ghost { border-color: transparent; background: none; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.icon { padding: 0; width: 44px; }
label.btn:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: .88rem; }
.btn svg { width: 20px; height: 20px; flex: none; }
.input, .select, .textarea {
  width: 100%; min-height: 44px; padding: 10px 12px;
  border: 1px solid var(--border); border-radius: 10px; background: var(--surface);
}
.input:focus, .select:focus, .textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.select { padding-right: 32px; }
.textarea { min-height: 160px; resize: vertical; font-family: var(--mono); font-size: .88rem; line-height: 1.5; }
.field { display: grid; gap: 6px; }
.field > label, .label { font-weight: 600; font-size: .88rem; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.grow { flex: 1 1 auto; min-width: 0; }
.stack { display: grid; gap: 12px; }
.stack-lg { display: grid; gap: 20px; }
.segmented { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--surface); }
.segmented button {
  appearance: none; border: 0; background: none; min-height: 42px; padding: 0 12px; cursor: pointer;
  font-weight: 600; font-size: .88rem; color: var(--muted); display: inline-flex; align-items: center; gap: 6px;
}
.segmented button + button { border-left: 1px solid var(--border); }
.segmented button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.segmented svg { width: 18px; height: 18px; }
.chip {
  appearance: none; display: inline-flex; align-items: center; gap: 6px;
  min-height: 36px; padding: 0 12px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--border); background: var(--surface); font-size: .85rem; font-weight: 600;
}
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.badge {
  display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px;
  font-size: .74rem; font-weight: 700; line-height: 1.6; background: var(--surface-2); color: var(--muted);
  white-space: nowrap;
}
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.bad { background: var(--bad-soft); color: var(--bad); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.accent { background: var(--accent-soft); color: var(--accent); }
.radio-card {
  display: flex; gap: 10px; align-items: flex-start; padding: 12px; min-height: 44px;
  border: 1px solid var(--border); border-radius: 10px; background: var(--surface); cursor: pointer;
}
.radio-card:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.radio-card input { margin: 3px 0 0; width: 18px; height: 18px; accent-color: var(--accent); flex: none; }

/* ==========================================================================
   Surfaces, notices, states
   ========================================================================== */
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px; box-shadow: var(--shadow);
}
.notice {
  display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px;
  border-radius: var(--radius-sm); background: var(--surface-2); font-size: .92rem;
}
.notice.error { background: var(--bad-soft); color: var(--bad); }
.notice.warn { background: var(--warn-soft); color: var(--warn); }
.notice.ok { background: var(--ok-soft); color: var(--ok); }
.notice .grow { overflow-wrap: anywhere; }
.notice .btn { min-height: 32px; padding: 0 10px; color: inherit; }
.empty { text-align: center; padding: 40px 16px; color: var(--muted); display: grid; gap: 12px; justify-items: center; }
.empty h3 { color: var(--text); }
.spinner {
  width: 20px; height: 20px; border-radius: 50%; flex: none;
  border: 3px solid var(--surface-3); border-top-color: var(--accent);
  animation: spin .8s linear infinite;
}
.spinner.lg { width: 32px; height: 32px; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 32px; color: var(--muted); }
.progress { height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; position: relative; }
.progress::after {
  content: ""; position: absolute; inset: 0; width: 35%; border-radius: 3px; background: var(--accent);
  animation: indeterminate 1.3s ease-in-out infinite;
}
@keyframes indeterminate { 0% { transform: translateX(-100%); } 100% { transform: translateX(290%); } }
@media (prefers-reduced-motion: reduce) {
  .spinner, .progress::after, .typing span { animation-duration: 3s; }
}
details > summary { cursor: pointer; list-style: none; }
details > summary::-webkit-details-marker { display: none; }
.disclosure > summary { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; font-weight: 600; font-size: .88rem; color: var(--muted); }
.disclosure > summary::before { content: "▸"; transition: transform .15s; }
.disclosure[open] > summary::before { transform: rotate(90deg); }

/* Mana / card symbols */
.sym { width: 1.05em; height: 1.05em; vertical-align: -0.16em; margin: 0 1px; display: inline-block; }
.mana { white-space: nowrap; display: inline-flex; align-items: center; flex-wrap: wrap; }
.mana .sym { width: 16px; height: 16px; }

/* ==========================================================================
   Collection
   ========================================================================== */
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; min-width: 0; }
.stat .v { font-size: 1.2rem; font-weight: 750; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stat .k { font-size: .76rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
@media (min-width: 640px) { .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.search { position: relative; }
.search svg { position: absolute; left: 12px; top: 50%; width: 20px; height: 20px; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search .input { padding-left: 40px; padding-right: 44px; font-size: 16px; }
.search .clear { position: absolute; right: 0; top: 0; }
.help-list { margin: 8px 0 0; padding-left: 20px; display: grid; gap: 2px; font-size: .88rem; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.toolbar .select { width: auto; min-width: 0; }
.result-count { font-size: .88rem; color: var(--muted); }
.grid {
  display: grid; gap: 10px;
  grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
}
@media (min-width: 640px) { .grid { grid-template-columns: repeat(auto-fill, minmax(146px, 1fr)); gap: 14px; } }
.tile {
  appearance: none; border: 0; padding: 0; background: none; cursor: pointer; text-align: left;
  display: grid; gap: 4px; min-width: 0; border-radius: 10px;
}
.tile .img {
  position: relative; aspect-ratio: 488 / 680; border-radius: 6% / 4.3%; overflow: hidden;
  background: var(--surface-2); box-shadow: var(--shadow);
}
.tile .img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tile .img .ph { position: absolute; inset: 0; display: grid; place-items: center; padding: 8px; text-align: center; font-size: .8rem; font-weight: 600; color: var(--muted); }
.tile .qty {
  position: absolute; right: 5px; bottom: 5px; min-width: 26px; height: 22px; padding: 0 6px;
  display: grid; place-items: center; border-radius: 11px; font-size: .78rem; font-weight: 800;
  background: rgba(15, 12, 30, .82); color: #fff;
}
.tile .foil {
  position: absolute; left: 5px; bottom: 5px; height: 22px; padding: 0 6px; border-radius: 11px;
  display: grid; place-items: center; font-size: .7rem; font-weight: 800;
  background: linear-gradient(120deg, #f9d976, #b4f1ff, #e2b6ff); color: #222;
}
.tile .cap { display: flex; justify-content: space-between; gap: 6px; font-size: .78rem; min-width: 0; padding: 0 2px; }
.tile .cap .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.tile .cap .p { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.tile:hover .img { box-shadow: 0 0 0 2px var(--accent), var(--shadow); }
.list { display: grid; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.list-row {
  appearance: none; border: 0; background: none; text-align: left; cursor: pointer; width: 100%;
  display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 4px 10px; align-items: center;
  min-height: 52px; padding: 8px 12px; border-top: 1px solid var(--border);
}
.list-row:first-child { border-top: 0; }
.list-row:hover { background: var(--surface-2); }
.list-row .q { font-weight: 800; font-variant-numeric: tabular-nums; color: var(--muted); }
.list-row .main { min-width: 0; display: grid; gap: 1px; }
.list-row .nm { display: flex; gap: 6px; align-items: center; min-width: 0; }
.list-row .nm b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.list-row .sub { font-size: .8rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list-row .end { text-align: right; display: grid; gap: 2px; justify-items: end; font-size: .85rem; font-variant-numeric: tabular-nums; }

/* ==========================================================================
   Sheet / dialog (bottom sheet on mobile, centered modal on desktop)
   ========================================================================== */
.overlay { position: fixed; inset: 0; z-index: 100; background: var(--overlay); display: flex; align-items: flex-end; justify-content: center; animation: fade .15s; }
.sheet {
  position: relative; width: 100%; max-height: 92vh; max-height: 92dvh; overflow: auto; overscroll-behavior: contain;
  background: var(--surface); border-radius: 18px 18px 0 0; box-shadow: var(--shadow-lg);
  padding: 8px 16px calc(24px + env(safe-area-inset-bottom)); animation: slideup .2s ease-out;
}
.sheet-head {
  position: sticky; top: -8px; z-index: 2; display: flex; align-items: center; gap: 8px;
  margin: -8px -16px 8px; padding: 8px 8px 8px 16px; background: var(--surface); border-bottom: 1px solid var(--border);
}
.sheet-head h2 { flex: 1; min-width: 0; font-size: 1.1rem; overflow-wrap: anywhere; }
@keyframes fade { from { opacity: 0; } }
@keyframes slideup { from { transform: translateY(30px); opacity: .5; } }
@media (min-width: 768px) {
  .overlay { align-items: center; padding: 24px; }
  .sheet { max-width: 920px; border-radius: 18px; max-height: 88vh; padding-bottom: 24px; }
}
.card-detail { display: grid; gap: 16px; }
.card-detail .big { width: 100%; max-width: 340px; margin: 0 auto; border-radius: 4.75% / 3.5%; box-shadow: var(--shadow); display: block; aspect-ratio: 488 / 680; background: var(--surface-2); }
@media (min-width: 768px) {
  .card-detail { grid-template-columns: 320px minmax(0, 1fr); align-items: start; }
  .card-detail .big { position: sticky; top: 64px; }
}
.oracle { background: var(--surface-2); border-radius: var(--radius-sm); padding: 12px 14px; display: grid; gap: 8px; }
.oracle p { margin: 0; }
.oracle hr { border: 0; border-top: 1px dashed var(--border); margin: 2px 0; width: 100%; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: .9rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.legal { display: flex; flex-wrap: wrap; gap: 6px; }
.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-sm); }
table.t { width: 100%; border-collapse: collapse; font-size: .86rem; }
table.t th, table.t td { padding: 8px 10px; text-align: left; border-top: 1px solid var(--border); white-space: nowrap; }
table.t thead th { border-top: 0; background: var(--surface-2); font-size: .76rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
table.t td.num, table.t th.num { text-align: right; font-variant-numeric: tabular-nums; }
.linkbtn { appearance: none; border: 0; background: none; padding: 0; color: var(--accent); font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; min-height: 32px; text-align: left; }

/* ==========================================================================
   Decks
   ========================================================================== */
.deck-list { display: grid; gap: 10px; }
@media (min-width: 768px) { .deck-list { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); } }
.deck-item {
  appearance: none; text-align: left; cursor: pointer; width: 100%;
  display: grid; gap: 6px; padding: 14px 16px; min-height: 44px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow);
}
.deck-item:hover { border-color: var(--accent); }
.deck-item .t { font-weight: 700; font-size: 1.02rem; overflow-wrap: anywhere; }
.deck-head { display: grid; gap: 10px; }
.deck-head h2 { font-size: 1.4rem; overflow-wrap: anywhere; }
.board { display: grid; gap: 10px; }
.board > h3 { display: flex; align-items: baseline; gap: 8px; padding-top: 8px; }
.type-group { display: grid; gap: 4px; }
.type-group > h4 { font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 4px 2px; }
.deck-row {
  appearance: none; border: 0; background: none; width: 100%; text-align: left; cursor: pointer;
  display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 2px 10px; align-items: center;
  min-height: 48px; padding: 6px 10px; border-radius: var(--radius-sm);
}
.deck-row:hover { background: var(--surface-2); }
.deck-row:disabled { cursor: default; }
.deck-row:disabled:hover { background: none; }
.deck-row .q { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.deck-row .nm { min-width: 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.deck-row .nm b { font-weight: 600; overflow-wrap: anywhere; }
.deck-row .end { display: flex; align-items: center; gap: 8px; font-size: .85rem; font-variant-numeric: tabular-nums; }
.deck-row .end .price { color: var(--muted); min-width: 52px; text-align: right; }
.deck-section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px; display: grid; gap: 6px; }
.peek { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 12px; padding: 8px 10px 12px 48px; }
.peek img { width: 92px; border-radius: 5px; box-shadow: var(--shadow); }

/* ==========================================================================
   Planner (chat)
   ========================================================================== */
.planner { display: grid; gap: 16px; }
@media (min-width: 960px) {
  .planner { grid-template-columns: 280px minmax(0, 1fr); align-items: start; }
  .planner .drawer-toggle { display: none; }
}
.chat-side {
  display: grid; gap: 8px; align-content: start;
}

          <h2 id={titleId}>{title}</h2>
          {actions}
          <button type="button" className="btn ghost icon" aria-label="Close" onClick={onClose}><Icon.close /></button>
        </div>
        {children}
      </div>
    </div>
  );
}

];
const PRICE_KEYS = [

  ["usd", "USD", "$"], ["usd_foil", "USD foil", "$"], ["usd_etched", "USD etched", "$"],
];

function CardSheet({ id, onClose, onOpenCard, onOpenDeck }) {
  const [data, setData] = useState(null);

                  <span className={`badge ${totalOwned ? "ok" : "bad"}`}>{totalOwned ? `✓ own ${totalOwned}` : "✗ not owned"}</span>
                </span>
              </div>
              <div><b>{card.type_line}</b></div>
              <div className="oracle"><OracleText text={card.oracle_text} /></div>
              <dl className="kv">

                <dd>{card.set_name} <span className="muted">({(card.set_code || "").toUpperCase()} #{card.collector_number})</span></dd>
                <dt>Mana value</dt><dd>{card.cmc ?? "—"}</dd>

                  <span key={k} className="badge accent">{label} {sym}{Number(card.prices[k]).toFixed(2)}</span>

            <section className="stack" aria-label="Format legality">
              <h3>Legality</h3>
              <div className="legal">

                  return <span key={k} className={`badge ${ok ? "ok" : ""}`} title={s || "unknown"}>{ok ? "✓" : "✗"} {label}{s === "restricted" ? " (R)" : ""}</span>;
                })}

              <h3>Owned printings <span className="muted small">({plural(totalOwned, "copy", "copies")})</span></h3>

                  <div className="table-wrap">
                    <table className="t">
                      <thead><tr><th>Set</th><th>Finish</th><th>Lang</th><th>Condition</th><th>Binder</th><th className="num">Qty</th></tr></thead>
                      <tbody>

                          <tr key={i} aria-current={r.scryfall_id === id || undefined}>

                            </td>
                            <td>{r.finish === "normal" ? "—" : r.finish}</td>
                            <td>{(r.language || "").toUpperCase()}</td>

  );

const PAGE_SIZE = 60;
const QUICK_FILTERS = [
  ["Commanders", "is:commander"],
  ["Creatures", "t:creature"],
  ["Lands", "t:land"],
  ["Foils", "is:foil"],
  ["Valuable", "eur>5"],
  ["Mythics", "r:mythic"],
];
const SORTS = [
  ["name", "Name", "asc"], ["price", "Price", "desc"], ["cmc", "Mana value", "asc"],
  ["qty", "Quantity", "desc"], ["set", "Set", "asc"], ["rarity", "Rarity", "desc"],
];
const tokenize = (q) => q.match(/-?[a-z]*(?:[:<>=!]+)?(?:"[^"]*"|\S+)/gi) || [];

function StatsBar({ dataVersion }) {
  const [stats, setStats] = useState(null);
  const [error, setError] = useState(null);
  const load = useCallback(() => {
    setError(null);
    api("/api/stats").then(setStats).catch((e) => setError(`Could not load stats: ${e.message}`));
  }, []);
  useEffect(load, [load, dataVersion]);
  if (error) return <ErrorNotice error={error} onRetry={load} />;
  const s = stats || {};
  return (
    <div className="stats" aria-busy={!stats}>
      <div className="stat"><div className="v">{stats ? fmtInt(s.unique_cards) : "…"}</div><div className="k">Unique cards</div></div>
      <div className="stat"><div className="v">{stats ? fmtInt(s.total_cards) : "…"}</div><div className="k">Total copies</div></div>
      <div className="stat"><div className="v">{stats ? fmtEur(s.value_eur) : "…"}</div><div className="k">Est. value</div></div>
      <div className="stat"><div className="v" style={{ fontSize: "1rem" }} title={stats?.last_import ? fmtDate(s.last_import) : undefined}>{stats ? (s.last_import ? fmtAgo(s.last_import) : "never") : "…"}</div><div className="k">Last import</div></div>
    </div>
  );
}

function QueryHelp() {
  const [help, setHelp] = useState(null);
  const [error, setError] = useState(null);
  const load = () => {
    if (help) return;
    setError(null);
    api("/api/query-help").then((d) => setHelp(d.help)).catch((e) => setError(e.message));
  };
  return (
    <details className="disclosure" onToggle={(e) => { if (e.currentTarget.open) load(); }}>
      <summary>Search syntax</summary>
      {error && <ErrorNotice error={error} onRetry={load} />}
      {!help && !error && <p className="muted small">Loading…</p>}
      {help && (
        <>
          <ul className="help-list">
            {help.split(/;\s*/).map((h) => <li key={h}><code>{h}</code></li>)}
          </ul>
          <p className="muted small" style={{ marginBottom: 0 }}>

}

function CollectionTab({ dataVersion, onOpenCard, onGoImport }) {
  const [q, setQ] = useState(() => store.get("mtg.q", ""));
  const dq = useDebounced(q.trim(), 300);
  const [group, setGroup] = useState(() => store.get("mtg.group", "card"));
  const [sort, setSort] = useState(() => store.get("mtg.sort", "name"));
  const [dir, setDir] = useState(() => store.get("mtg.dir", "asc"));
  const [view, setView] = useState(() => store.get("mtg.view", "grid"));
  const [rows, setRows] = useState([]);
  const [total, setTotal] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const reqId = useRef(0);
  const loadingRef = useRef(false);
  const sentinel = useRef(null);

  useEffect(() => { store.set("mtg.q", q); }, [q]);
  useEffect(() => { store.set("mtg.group", group); store.set("mtg.sort", sort); store.set("mtg.dir", dir); store.set("mtg.view", view); }, [group, sort, dir, view]);

  const load = useCallback(async (offset) => {
    const id = ++reqId.current;
    loadingRef.current = true;
    setLoading(true);
    setError(null);
    try {
      const params = new URLSearchParams({ q: dq, group, sort, dir, limit: String(PAGE_SIZE), offset: String(offset) });
      const data = await api(`/api/collection?${params}`);
      if (id !== reqId.current) return;
      setTotal(data.total);
      setRows((prev) => (offset === 0 ? data.rows : [...prev, ...data.rows]));
    } catch (e) {
      if (id !== reqId.current) return;
      setError(e.status === 400 ? `Search error: ${e.message}` : e.message);
      if (offset === 0) { setRows([]); setTotal(null); }
    } finally {
      if (id === reqId.current) { loadingRef.current = false; setLoading(false); }
    }
  }, [dq, group, sort, dir]);

  useEffect(() => { load(0); }, [load, dataVersion]);

  const hasMore = total != null && rows.length < total;
  // Infinite scroll: auto-load when the sentinel nears the viewport.
  useEffect(() => {
    const el = sentinel.current;
    if (!el || !hasMore || error || typeof IntersectionObserver === "undefined") return;
    const io = new IntersectionObserver((entries) => {
      if (entries.some((e) => e.isIntersecting) && !loadingRef.current) load(rows.length);
    }, { rootMargin: "600px 0px" });
    io.observe(el);
    return () => io.disconnect();
  }, [hasMore, rows.length, load, error]);

  const tokens = tokenize(q);
  const toggleFilter = (term) => {
    const lower = term.toLowerCase();
    const has = tokens.some((t) => t.toLowerCase() === lower);
    setQ(has ? tokens.filter((t) => t.toLowerCase() !== lower).join(" ") : [q.trim(), term].filter(Boolean).join(" "));
  };
  const changeSort = (s) => {
    setSort(s);
    setDir(SORTS.find(([k]) => k === s)?.[2] || "asc");
  };

  const emptyCollection = total === 0 && !dq;

  return (
    <div className="stack-lg">
      <StatsBar dataVersion={dataVersion} />

      <div className="stack">
        <form className="search" role="search" onSubmit={(e) => { e.preventDefault(); e.currentTarget.querySelector("input")?.blur(); }}>
          <Icon.search />
          <label htmlFor="collection-q" className="sr-only">Search your collection</label>
          <input id="collection-q" className="input" type="search" inputMode="search" enterKeyHint="search"
            autoComplete="off" autoCorrect="off" autoCapitalize="off" spellCheck="false"
            placeholder='Search… e.g. t:creature c:g cmc<=3' value={q} onChange={(e) => setQ(e.target.value)} />
          {q && <button type="button" className="btn ghost icon clear" aria-label="Clear search" onClick={() => setQ("")}><Icon.close /></button>}
        </form>
        <div className="chips" role="group" aria-label="Quick filters">
          {QUICK_FILTERS.map(([label, term]) => (
            <button key={term} type="button" className="chip" aria-pressed={tokens.some((t) => t.toLowerCase() === term.toLowerCase())}
              onClick={() => toggleFilter(term)}>{label}</button>
          ))}
        </div>
        <QueryHelp />
        <div className="toolbar">
          <div className="segmented" role="group" aria-label="Group by">
            <button type="button" aria-pressed={group === "card"} onClick={() => setGroup("card")}>Cards</button>
            <button type="button" aria-pressed={group === "printing"} onClick={() => setGroup("printing")}>Printings</button>
          </div>
          <label htmlFor="collection-sort" className="sr-only">Sort by</label>
          <select id="collection-sort" className="select grow" style={{ maxWidth: 170 }} value={sort} onChange={(e) => changeSort(e.target.value)}>
            {SORTS.map(([k, label]) => <option key={k} value={k}>{label}</option>)}
          </select>
          <button type="button" className="btn icon" onClick={() => setDir(dir === "asc" ? "desc" : "asc")}
            aria-label={dir === "asc" ? "Ascending, switch to descending" : "Descending, switch to ascending"} title={dir === "asc" ? "Ascending" : "Descending"}>
            {dir === "asc" ? <Icon.up /> : <Icon.down />}
          </button>
          <div className="segmented" role="group" aria-label="View" style={{ marginLeft: "auto" }}>
            <button type="button" aria-pressed={view === "grid"} aria-label="Grid view" onClick={() => setView("grid")}><Icon.grid /></button>
            <button type="button" aria-pressed={view === "list"} aria-label="List view" onClick={() => setView("list")}><Icon.list /></button>
          </div>
        </div>
      </div>

      <div className="stack">
        <div className="result-count" aria-live="polite">
          {total != null && !emptyCollection && `${plural(total, group === "card" ? "card" : "printing")}${dq ? " match" + (total === 1 ? "es" : "") : ""}`}
        </div>

        {error && <ErrorNotice error={error} onRetry={() => load(rows.length && hasMore ? rows.length : 0)} />}

        {emptyCollection && (
          <div className="empty card">
            <h3>Your collection is empty</h3>
            <p style={{ margin: 0 }}>Export your collection from ManaBox as CSV and import it here.</p>
            <button type="button" className="btn primary" onClick={onGoImport}><Icon.import /> Import from ManaBox</button>
          </div>
        )}
        {total === 0 && dq && !error && (
          <div className="empty"><h3>No matches</h3><p style={{ margin: 0 }}>Nothing in your collection matches <code>{dq}</code>.</p></div>
        )}

        {rows.length > 0 && (view === "grid"
          ? <div className="grid">{rows.map((r) => <CardTile key={r.scryfall_id} row={r} group={group} onOpen={onOpenCard} />)}</div>
          : <div className="list">{rows.map((r) => <CardListRow key={r.scryfall_id} row={r} group={group} onOpen={onOpenCard} />)}</div>)}

        {loading && <Spinner label={rows.length ? "Loading more…" : "Searching…"} />}
        <div ref={sentinel} aria-hidden="true" />
        {hasMore && !loading && !error && (
          <button type="button" className="btn" onClick={() => load(rows.length)}>
            Load more ({fmtInt(total - rows.length)} left)
          </button>
        )}
      </div>
    </div>
  );
}

const FORMATS = ["commander", "standard", "modern", "pioneer", "pauper", "legacy", "vintage", "brawl", "other"];
const BOARD_LABEL = { commander: "Commander", main: "Main deck", side: "Sideboard", maybe: "Maybeboard" };

function DeckImportForm({ onCreated, onCancel }) {
  const [name, setName] = useState("");
  const [format, setFormat] = useState("commander");
  const [text, setText] = useState("");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);

  const pickFile = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    try {
      setText(await file.text());
      if (!name) setName(file.name.replace(/\.[^.]+$/, ""));
    } catch (err) {
      setError(`Could not read the file: ${err.message}`);
    }
    e.target.value = "";
  };

  const submit = async (e) => {
    e.preventDefault();
    if (!name.trim() || !text.trim() || busy) return;
    setBusy(true);
    setError(null);
    try {
      const res = await api("/api/decks", { method: "POST", json: { name: name.trim(), format, text } });
      onCreated(res);
    } catch (err) {
      setError(err.message);
    } finally {
      setBusy(false);
    }
  };

  return (
    <form className="card stack" onSubmit={submit} aria-labelledby="deck-import-title">
      <div className="row between">
        <h2 id="deck-import-title">Import decklist</h2>
        <button type="button" className="btn ghost icon" aria-label="Close import form" onClick={onCancel}><Icon.close /></button>
      </div>
      <div className="row" style={{ alignItems: "flex-end" }}>
        <div className="field grow" style={{ flexBasis: 200 }}>
          <label htmlFor="deck-name">Name</label>
          <input id="deck-name" className="input" required maxLength={200} value={name} onChange={(e) => setName(e.target.value)} placeholder="e.g. Elves tribal" />
        </div>
        <div className="field" style={{ flexBasis: 150, flexGrow: 1 }}>
          <label htmlFor="deck-format">Format</label>
          <select id="deck-format" className="select" value={format} onChange={(e) => setFormat(e.target.value)}>
            {FORMATS.map((f) => <option key={f} value={f}>{cap(f)}</option>)}
          </select>
        </div>
      </div>
      <div className="field">
        <div className="row between">
          <label htmlFor="deck-text">Decklist</label>
          <label className="btn sm">
            <Icon.file /> Load .txt
            <input type="file" accept=".txt,.dec,.dek,text/plain" className="sr-only" onChange={pickFile} />
          </label>
        </div>
        <textarea id="deck-text" className="textarea" required value={text} onChange={(e) => setText(e.target.value)}
          placeholder={"Commander\n1 Lathril, Blade of the Elves\n\nDeck\n1 Sol Ring\n1x Llanowar Elves (M19) 314\n36 Forest"} />
        <span className="muted small">One card per line: <code>1 Sol Ring</code>, <code>1x Name (SET) 123</code>. Section headers like Commander / Deck / Sideboard / Maybeboard are recognised. Cards you own are matched to your printings.</span>
      </div>
      <ErrorNotice error={error} />
      <div className="row">
        <button type="submit" className="btn primary" disabled={busy || !name.trim() || !text.trim()}>
          {busy ? <><span className="spinner" aria-hidden="true" /> Importing…</> : "Import deck"}
        </button>
        <button type="button" className="btn ghost" onClick={onCancel}>Cancel</button>
      </div>
    </form>
  );
}

function DeckList({ dataVersion, onOpen, refreshKey }) {
  const [decks, setDecks] = useState(null);
  const [error, setError] = useState(null);
  const [showForm, setShowForm] = useState(false);
  const load = useCallback(() => {
    setError(null);
    api("/api/decks").then(setDecks).catch((e) => setError(`Could not load decks: ${e.message}`));
  }, []);
  useEffect(load, [load, dataVersion, refreshKey]);

  return (
    <div className="stack-lg">
      <div className="page-title">
        <h1>Decks</h1>
        {!showForm && <button type="button" className="btn primary" onClick={() => setShowForm(true)}><Icon.plus /> Import decklist</button>}
      </div>
      {showForm && (
        <DeckImportForm onCancel={() => setShowForm(false)}
          onCreated={(res) => {
            setShowForm(false);
            const issues = [];
            if (res.unresolved?.length) issues.push(`Not found on Scryfall: ${res.unresolved.join(", ")}`);
            if (res.parse_errors?.length) issues.push(`Skipped lines: ${res.parse_errors.join(" | ")}`);
            onOpen(res.id, issues.length ? issues.join(" — ") : null);
          }} />
      )}
      <ErrorNotice error={error} onRetry={load} />
      {!decks && !error && <Spinner label="Loading decks…" />}
      {decks && decks.length === 0 && !showForm && (
        <div className="empty card">
          <h3>No decks yet</h3>
          <p style={{ margin: 0, maxWidth: 460 }}>Paste a decklist, import ManaBox deck binders with your collection CSV, or ask the planner to build one from your cards.</p>
          <button type="button" className="btn primary" onClick={() => setShowForm(true)}><Icon.plus /> Import decklist</button>
        </div>
      )}
      {decks && decks.length > 0 && (
        <div className="deck-list">
          {decks.map((d) => (
            <button key={d.id} type="button" className="deck-item" onClick={() => onOpen(d.id)}>
              <span className="t">{d.name}</span>
              <span className="row small">
                {d.format && <span className="badge">{d.format}</span>}
                <SourceBadge source={d.source} />
                <span className="muted">{plural(d.card_count, "card")}</span>
                <span className="muted">· updated {fmtAgo(d.updated_at)}</span>
              </span>
            </button>
          ))}
        </div>
      )}

  );
}

function DeckCardRow({ card, onOpenCard }) {
  const [peek, setPeek] = useState(false);
  let badge;
  if (card.basic) badge = <span className="badge" title="Basic land">basic</span>;
  else if (!card.missing) badge = <span className="badge ok" aria-label={`Owned (${card.owned})`} title={`You own ${card.owned}`}>✓</span>;
  else badge = <span className="badge bad" aria-label={`Missing ${card.missing}, own ${card.owned}`} title={`Missing ${card.missing} (you own ${card.owned})`}>✗ {card.missing}</span>;
  const unresolved = !card.scryfall_id;
  return (
    <>
      <button type="button" className="deck-row" disabled={unresolved} aria-expanded={unresolved ? undefined : peek}
        onClick={() => setPeek((p) => !p)} title={unresolved ? "Not found on Scryfall" : undefined}>
        <span className="q">{card.quantity}</span>
        <span className="nm">
          <b>{card.name}</b>
          <ManaCost cost={card.mana_cost} />
          {unresolved && <span className="badge warn">unresolved</span>}
        </span>
        <span className="end">
          <span className="price">{fmtPrice(card.price)}</span>
          {badge}
        </span>
      </button>
      {peek && !unresolved && (
        <div className="peek">
          {card.image_small ? <img src={card.image_small} alt={card.name} loading="lazy" /> : <span />}
          <div className="stack small" style={{ gap: 6, alignContent: "start" }}>
            <span>{card.type_line}</span>
            <span className="muted">{(card.set_code || "").toUpperCase()} #{card.collector_number} · own {card.owned}</span>
            <button type="button" className="btn sm" style={{ justifySelf: "start" }} onClick={() => onOpenCard(card.scryfall_id)}>Card details</button>
          </div>
        </div>
      )}
    </>
  );
}

function DeckDetail({ id, dataVersion, initialNotice, onBack, onOpenCard, onAsk, onChanged }) {
  const [deck, setDeck] = useState(null);
  const [error, setError] = useState(null);
  const [actionError, setActionError] = useState(null);
  const [notice, setNotice] = useState(initialNotice);
  const [editing, setEditing] = useState(false);
  const [form, setForm] = useState({ name: "", format: "", description: "" });
  const [saving, setSaving] = useState(false);
  const [onlyMissing, setOnlyMissing] = useState(false);

  const load = useCallback(() => {
    setError(null);
    api(`/api/decks/${id}`).then(setDeck).catch((e) => setError(e.status === 404 ? "This deck no longer exists." : e.message));
  }, [id]);
  useEffect(load, [load, dataVersion]); // also after the planner saved this deck

  const startEdit = () => {
    setForm({ name: deck.name, format: deck.format || "", description: deck.description || "" });
    setEditing(true);
  };
  const saveEdit = async (e) => {
    e.preventDefault();
    if (!form.name.trim()) return;
    setSaving(true);
    setActionError(null);
    try {
      const updated = await api(`/api/decks/${id}`, { method: "PATCH", json: { name: form.name.trim(), format: form.format || "", description: form.description } });
      setDeck((d) => ({ ...d, ...updated }));
      setEditing(false);
      onChanged();
    } catch (err) {
      setActionError(err.message);
    } finally {
      setSaving(false);
    }
  };
  const remove = async () => {
    if (!window.confirm(`Delete the deck "${deck.name}"? This cannot be undone. Your collection is not affected.`)) return;
    setActionError(null);
    try {
      await api(`/api/decks/${id}`, { method: "DELETE" });
      onChanged();
      onBack();
    } catch (err) {
      setActionError(err.message);
    }
  };

  const grouped = useMemo(() => {
    if (!deck) return [];
    return ["commander", "main", "side", "maybe"].map((board) => {
      const cards = deck.cards.filter((c) => c.board === board && (!onlyMissing || c.missing > 0));
      const byType = DISPLAY_TYPES.map((t) => ({ type: t, cards: cards.filter((c) => mainType(c.type_line) === t) }))
        .filter((g) => g.cards.length);
      return { board, count: deck.counts?.[board] ?? 0, cards, byType };
    }).filter((b) => b.cards.length);
  }, [deck, onlyMissing]);

  const exportHref = `/api/decks/${id}/export`;

  return (
    <div className="stack-lg">
      <div>
        <button type="button" className="btn ghost" onClick={onBack} style={{ marginLeft: -8 }}><Icon.back /> All decks</button>
      </div>
      {error && <ErrorNotice error={error} onRetry={load} />}
      {!deck && !error && <Spinner label="Loading deck…" />}
      {deck && (
        <>
          <header className="deck-head">
            {!editing ? (
              <>
                <h2>{deck.name}</h2>
                <div className="row small">
                  {deck.format && <span className="badge">{deck.format}</span>}
                  <SourceBadge source={deck.source} />
                  <span className="muted">updated {fmtAgo(deck.updated_at)}</span>
                </div>
                {deck.description && <p style={{ margin: 0, whiteSpace: "pre-wrap" }}>{deck.description}</p>}
              </>
            ) : (
              <form className="card stack" onSubmit={saveEdit} aria-label="Edit deck">
                <div className="field">
                  <label htmlFor="edit-name">Name</label>
                  <input id="edit-name" className="input" required maxLength={200} value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} autoFocus />
                </div>
                <div className="field">
                  <label htmlFor="edit-format">Format</label>
                  <select id="edit-format" className="select" value={form.format} onChange={(e) => setForm({ ...form, format: e.target.value })}>
                    <option value="">—</option>
                    {[...new Set([...FORMATS, form.format].filter(Boolean))].map((f) => <option key={f} value={f}>{cap(f)}</option>)}
                  </select>
                </div>
                <div className="field">
                  <label htmlFor="edit-desc">Description</label>
                  <textarea id="edit-desc" className="input" rows={3} maxLength={5000} value={form.description} onChange={(e) => setForm({ ...form, description: e.target.value })} />
                </div>
                <div className="row">
                  <button type="submit" className="btn primary" disabled={saving || !form.name.trim()}>{saving ? "Saving…" : "Save"}</button>
                  <button type="button" className="btn ghost" onClick={() => setEditing(false)}>Cancel</button>
                </div>
              </form>
            )}
            <div className="stats">
              {["commander", "main", "side", "maybe"].filter((b) => b === "main" || deck.counts?.[b]).map((b) => (
                <div className="stat" key={b}><div className="v">{deck.counts?.[b] ?? 0}</div><div className="k">{BOARD_LABEL[b]}</div></div>
              ))}
            </div>
            {deck.missing_count > 0
              ? <div className="notice warn"><span aria-hidden="true">✗</span><div className="grow"><b>Missing: {plural(deck.missing_count, "card")} (~{fmtEur(deck.missing_cost_eur)})</b> <span className="small">— maybeboard not counted</span></div></div>
              : <div className="notice ok"><span aria-hidden="true">✓</span><div className="grow"><b>You own every card in this deck.</b></div></div>}
            <div className="row">
              <button type="button" className="btn primary" onClick={() => onAsk(deck)}><Icon.sparkle /> Ask the planner</button>
              <a className="btn" href={exportHref} download><Icon.download /> Export</a>
              {!editing && <button type="button" className="btn" onClick={startEdit}><Icon.edit /> Rename</button>}
              <button type="button" className="btn danger" onClick={remove}><Icon.trash /> Delete</button>
            </div>
            <ErrorNotice error={actionError} onDismiss={() => setActionError(null)} />
            {notice && <div className="notice warn" role="status"><div className="grow">{notice}</div><button type="button" className="btn ghost icon sm" aria-label="Dismiss" onClick={() => setNotice(null)}><Icon.close /></button></div>}
          </header>

          {deck.cards.length > 0 && deck.missing_count > 0 && (
            <label className="row" style={{ minHeight: 44, cursor: "pointer" }}>
              <input type="checkbox" checked={onlyMissing} onChange={(e) => setOnlyMissing(e.target.checked)} style={{ width: 20, height: 20, accentColor: "var(--accent)" }} />
              Only show missing cards
            </label>
          )}

          {deck.cards.length === 0 && <div className="empty"><h3>This deck is empty</h3></div>}

          {grouped.map((b) => (
            <section key={b.board} className="board" aria-label={BOARD_LABEL[b.board]}>
              <h3>{BOARD_LABEL[b.board]} <span className="muted small">{b.count}</span></h3>
              <div className="deck-section">
                {b.byType.map((g) => (
                  <div key={g.type} className="type-group">
                    <h4>{g.type} ({g.cards.reduce((a, c) => a + c.quantity, 0)})</h4>
                    {g.cards.map((c) => <DeckCardRow key={`${c.board}|${c.name}`} card={c} onOpenCard={onOpenCard} />)}
                  </div>
                ))}
              </div>
            </section>
          ))}
        </>
      )}
    </div>
  );
}

function DecksTab({ dataVersion, deckId, deckNotice, onOpenDeck, onOpenCard, onAsk, onChanged }) {
  const [listKey, bumpList] = useReducer((x) => x + 1, 0);
  if (deckId) {

      <DeckDetail key={deckId} id={deckId} dataVersion={dataVersion} initialNotice={deckNotice} onBack={() => { onOpenDeck(null); bumpList(); }}

  return <DeckList dataVersion={dataVersion} refreshKey={listKey} onOpen={onOpenDeck} />;
}

function toolIcon(name = "") {
  if (/search|find|check_owned|alternatives|staples|synerg/.test(name)) return "🔍";
  if (/deck|mana_base|brawl/.test(name)) return "🃏";
  if (/price/.test(name)) return "💶";
  if (/rules/.test(name)) return "📖";
  if (/overview|get_card|batch|random|sets/.test(name)) return "📋";
  return "🔧";
}
function ToolChip({ tool }) {
  const label = `${tool.name}${tool.input ? `: ${tool.input}` : ""}`;
  return (
    <span className="tool-chip" title={label}>
      <span aria-hidden="true">{toolIcon(tool.name)}</span>
      <span><b>{tool.name}</b>{tool.input ? `: ${tool.input}` : ""}</span>
    </span>
  );
}

function Message({ msg }) {
  if (msg.role === "user") {
    return <div className="msg user"><div className="bubble">{msg.content}</div></div>;
  }
  const tools = msg.tools || [];
  return (
    <div className="msg assistant">
      {tools.length > 0 && (
        <details className="disclosure">
          <summary>Used {plural(tools.length, "tool")}</summary>

        put the token into the app's <code>.env</code> as <code>CLAUDE_CODE_OAUTH_TOKEN=…</code>, then recreate the container.
      </div>
