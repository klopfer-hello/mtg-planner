<!doctype html>
<html lang="en">

<meta name="theme-color" content="#121214" media="(prefers-color-scheme: dark)">
<meta name="description" content="Magic: The Gathering collection and deck planner with a Claude-powered assistant.">

<title>MTG Planner</title>

<link rel="apple-touch-icon" href="icon.svg">
<style>
/* ==========================================================================
   Theme tokens (light default, dark via prefers-color-scheme)
   ========================================================================== */
:root {
  color-scheme: light dark;
  --bg: #f6f5f2;
  --surface: #ffffff;
  --surface-2: #efede8;
  --surface-3: #e4e1da;
  --text: #1d1b18;
  --muted: #6b665e;
  --border: #dcd8d0;
  --accent: #5b3fd1;
  --accent-hover: #4a30b8;
  --accent-ink: #ffffff;
  --accent-soft: #ece8fb;
  --ok: #1f7a3d;
  --ok-soft: #e1f2e6;
  --bad: #b42318;
  --bad-soft: #fdeceb;
  --warn: #8a5a00;
  --warn-soft: #fcf1d8;
  /* Chart colours (≥3:1 on --surface; creature/other pass the CVD check). Mana colours always sit next to their mana symbol. */
  --mana-w: #a5821f;
  --mana-u: #2f6fb5;
  --mana-b: #4a443f;
  --mana-r: #c4442b;
  --mana-g: #2e8540;
  --mana-c: #8a8580;
  --chart-creature: var(--accent);
  --chart-other: #00897b;
  --overlay: rgba(20, 18, 15, 0.45);
  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 14px rgba(0,0,0,.06);
  --shadow-lg: 0 10px 40px rgba(0,0,0,.22);
  --radius: 12px;
  --radius-sm: 8px;
  --tabbar-h: 64px;
  --header-h: 52px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121214;
    --surface: #1c1c20;
    --surface-2: #26262c;
    --surface-3: #313139;
    --text: #ececef;
    --muted: #a09fa8;
    --border: #36363e;
    --accent: #a38bff;
    --accent-hover: #b8a5ff;
    --accent-ink: #15102a;
    --accent-soft: #2a2444;
    --ok: #62d18d;
    --ok-soft: #16301f;
    --bad: #ff8274;
    --bad-soft: #3a1b18;
    --warn: #f0c062;
    --warn-soft: #3a2d10;
    --mana-w: #e0c065;
    --mana-u: #6fa8e8;
    --mana-b: #b0a8a2;
    --mana-r: #f07a62;
    --mana-g: #62c27b;
    --mana-c: #8f8a86;
    --chart-creature: #9479f2;
    --chart-other: #2fa89c;
    --overlay: rgba(0, 0, 0, 0.6);
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
    --shadow-lg: 0 10px 40px rgba(0,0,0,.6);
  }
}

/* ==========================================================================
   Base
   ========================================================================== */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.45 var(--font);
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}
img { max-width: 100%; }
a { color: var(--accent); }
h1, h2, h3, h4 { line-height: 1.2; margin: 0; }
h2 { font-size: 1.25rem; }
h3 { font-size: 1.05rem; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.nowrap { white-space: nowrap; }
.mono { font-family: var(--mono); font-size: .9em; }
code { font-family: var(--mono); font-size: .9em; background: var(--surface-2); padding: .1em .35em; border-radius: 5px; }

/* ==========================================================================
   Layout: header, navigation (bottom tab bar on mobile, top nav on desktop)
   ========================================================================== */
.app-header {
  position: sticky; top: 0; z-index: 30;
  height: calc(var(--header-h) + env(safe-area-inset-top));
  padding: env(safe-area-inset-top) 16px 0;
  display: flex; align-items: center; gap: 16px;
  /* Solid on mobile: a backdrop-filter would become the containing block of
     the position:fixed tab bar inside the header and pin it to the top. */
  background: var(--bg);
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.05rem; white-space: nowrap; }
.brand img { width: 28px; height: 28px; border-radius: 7px; }
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  display: grid; grid-template-columns: repeat(6, minmax(0, 1fr));
  height: calc(var(--tabbar-h) + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom);
  background: var(--surface);
  border-top: 1px solid var(--border);
}
.tab {
  appearance: none; border: 0; background: none; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  min-height: 44px; color: var(--muted); font-size: .72rem; font-weight: 600; letter-spacing: .01em;
}
.tab svg { width: 24px; height: 24px; }
.tab > span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 2px; }
/* Six tabs on a phone: smaller labels below 420 px. */
@media (max-width: 419px) {
  .tab { font-size: .68rem; letter-spacing: 0; }
}
@media (max-width: 359px) {
  .tab { font-size: .62rem; }
  .tab > span { padding: 0; }
}
.tab[aria-selected="true"] { color: var(--accent); }
.tab[aria-selected="true"] svg { transform: translateY(-1px); }
main {
  max-width: 1200px; margin: 0 auto; min-width: 0;
  padding: 16px 16px calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 24px);
}
/* Tab panels are plain blocks; keep them from growing to a child's min-content width. */
main > [role="tabpanel"] { min-width: 0; max-width: 100%; }
@media (min-width: 768px) {
  .tabbar {
    position: static; display: flex; gap: 4px; height: auto; padding: 0;
    background: none; border: 0; margin-left: auto;
  }
  .tab { flex-direction: row; gap: 8px; padding: 0 14px; border-radius: 10px; font-size: .92rem; }
  .tab svg { width: 20px; height: 20px; }
  .tab:hover { background: var(--surface-2); color: var(--text); }
  .tab[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); }
  .tab[aria-selected="true"] svg { transform: none; }
  main { padding: 24px 24px 48px; }
  :root { --header-h: 60px; --tabbar-h: 0px; }
  .app-header {
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: saturate(1.4) blur(10px);
    -webkit-backdrop-filter: saturate(1.4) blur(10px);
  }
}

/* ==========================================================================
   Controls
   ========================================================================== */
.btn {
  appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 16px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
  font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap;
  transition: background .12s, border-color .12s;
}
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.danger { color: var(--bad); }
.btn.danger:hover { background: var(--bad-soft); }
.btn.ghost { border-color: transparent; background: none; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.icon { padding: 0; width: 44px; }
label.btn:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn.disabled { opacity: .55; cursor: not-allowed; pointer-events: none; }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: .88rem; }
.btn.wrap { white-space: normal; text-align: center; line-height: 1.25; padding-block: 8px; overflow-wrap: anywhere; }
.btn svg { width: 20px; height: 20px; flex: none; }
.input, .select, .textarea {
  width: 100%; min-height: 44px; padding: 10px 12px;
  border: 1px solid var(--border); border-radius: 10px; background: var(--surface);
}
.input:focus, .select:focus, .textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.select { padding-right: 32px; }
.textarea { min-height: 160px; resize: vertical; font-family: var(--mono); font-size: .88rem; line-height: 1.5; }
.field { display: grid; gap: 6px; }
.field > label, .label { font-weight: 600; font-size: .88rem; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.grow { flex: 1 1 auto; min-width: 0; }
.stack { display: grid; gap: 12px; }
.stack-lg { display: grid; gap: 20px; }
.segmented { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--surface); }
.segmented button {
  appearance: none; border: 0; background: none; min-height: 42px; padding: 0 12px; cursor: pointer;
  font-weight: 600; font-size: .88rem; color: var(--muted); display: inline-flex; align-items: center; gap: 6px;
}
.segmented button + button { border-left: 1px solid var(--border); }
.segmented button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.segmented svg { width: 18px; height: 18px; }
.segmented.wrap { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.segmented.wrap button { justify-content: center; }
.segmented.wrap button + button { border-left: 0; }
.segmented.wrap button:nth-child(even) { border-left: 1px solid var(--border); }
.segmented.wrap button:nth-child(n+3) { border-top: 1px solid var(--border); }
/* Market tab: three sub-views share the row (icons drop on narrow phones). */
.segmented.market-views { display: flex; width: 100%; max-width: 520px; }
.market-views button { flex: 1 1 0; min-width: 0; justify-content: center; padding: 0 8px; white-space: nowrap; }
@media (max-width: 399px) { .market-views svg { display: none; } }
.chip {
  appearance: none; display: inline-flex; align-items: center; gap: 6px;
  min-height: 36px; padding: 0 12px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--border); background: var(--surface); font-size: .85rem; font-weight: 600;
}
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip.sym-chip { padding: 0 10px; }
.chip.sym-chip .sym { width: 20px; height: 20px; margin: 0; vertical-align: middle; }
.chip.sym-chip[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--accent-ink) inset; }
.fav-btn span { font-size: 22px; line-height: 1; }
.fav-btn.on { color: var(--warn); }
.fav-star { color: var(--warn); }
.deck-colours { display: inline-flex; gap: 1px; align-items: center; }
.deck-colours .sym { width: 15px; height: 15px; margin: 0; }
.filter-summary { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.badge {
  display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px;
  font-size: .74rem; font-weight: 700; line-height: 1.6; background: var(--surface-2); color: var(--muted);
  white-space: nowrap;
}
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.bad { background: var(--bad-soft); color: var(--bad); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.accent { background: var(--accent-soft); color: var(--accent); }
.radio-card {
  display: flex; gap: 10px; align-items: flex-start; padding: 12px; min-height: 44px;
  border: 1px solid var(--border); border-radius: 10px; background: var(--surface); cursor: pointer;
}
.radio-card:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.radio-card input { margin: 3px 0 0; width: 18px; height: 18px; accent-color: var(--accent); flex: none; }

/* ==========================================================================
   Surfaces, notices, states
   ========================================================================== */
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px; box-shadow: var(--shadow);
}
.notice {
  display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px;
  border-radius: var(--radius-sm); background: var(--surface-2); font-size: .92rem;
}
.notice.error { background: var(--bad-soft); color: var(--bad); }
.notice.warn { background: var(--warn-soft); color: var(--warn); }
.notice.ok { background: var(--ok-soft); color: var(--ok); }
.notice .grow { overflow-wrap: anywhere; }
.notice .btn { min-height: 32px; padding: 0 10px; color: inherit; }
.empty { text-align: center; padding: 40px 16px; color: var(--muted); display: grid; gap: 12px; justify-items: center; }
.empty h3 { color: var(--text); }
.spinner {
  width: 20px; height: 20px; border-radius: 50%; flex: none;
  border: 3px solid var(--surface-3); border-top-color: var(--accent);
  animation: spin .8s linear infinite;
}
.spinner.lg { width: 32px; height: 32px; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 32px; color: var(--muted); }
.progress { height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; position: relative; }
.progress::after {
  content: ""; position: absolute; inset: 0; width: 35%; border-radius: 3px; background: var(--accent);
  animation: indeterminate 1.3s ease-in-out infinite;
}
@keyframes indeterminate { 0% { transform: translateX(-100%); } 100% { transform: translateX(290%); } }
@media (prefers-reduced-motion: reduce) {
  .spinner, .progress::after, .typing span { animation-duration: 3s; }
}
details > summary { cursor: pointer; list-style: none; }
details > summary::-webkit-details-marker { display: none; }
.disclosure > summary { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; font-weight: 600; font-size: .88rem; color: var(--muted); }
.disclosure > summary::before { content: "▸"; transition: transform .15s; }
.disclosure[open] > summary::before { transform: rotate(90deg); }

/* Mana / card symbols */
.sym { width: 1.05em; height: 1.05em; vertical-align: -0.16em; margin: 0 1px; display: inline-block; }
.mana { white-space: nowrap; display: inline-flex; align-items: center; flex-wrap: wrap; }
.mana .sym { width: 16px; height: 16px; }

/* ==========================================================================
   Collection
   ========================================================================== */
.stats-wrap { display: grid; gap: 6px; min-width: 0; }
.stats-scope { margin: 0; overflow-wrap: anywhere; }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; min-width: 0; }
.stat .v { font-size: 1.2rem; font-weight: 750; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stat .k { font-size: .76rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
@media (min-width: 640px) { .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
/* Binder detail: three small stats in one row. */
.stats.compact { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.stats.compact .stat { padding: 6px 10px; }
.stats.compact .stat .v { font-size: 1rem; }
.stats.compact .stat .k { font-size: .68rem; letter-spacing: .02em; }
.search { position: relative; }
.search svg { position: absolute; left: 12px; top: 50%; width: 20px; height: 20px; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search .input { padding-left: 40px; padding-right: 44px; font-size: 16px; }
.search .clear { position: absolute; right: 0; top: 0; }
.help-list { margin: 8px 0 0; padding-left: 20px; display: grid; gap: 2px; font-size: .88rem; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.toolbar .select { width: auto; min-width: 0; }
.result-count { font-size: .88rem; color: var(--muted); }
.grid {
  display: grid; gap: 10px;
  grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
}
@media (min-width: 640px) { .grid { grid-template-columns: repeat(auto-fill, minmax(146px, 1fr)); gap: 14px; } }
.tile {
  appearance: none; border: 0; padding: 0; background: none; cursor: pointer; text-align: left;
  display: grid; gap: 4px; min-width: 0; border-radius: 10px;
}
.tile .img {
  position: relative; aspect-ratio: 488 / 680; border-radius: 6% / 4.3%; overflow: hidden;
  background: var(--surface-2); box-shadow: var(--shadow);
}
.tile .img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tile .img .ph { position: absolute; inset: 0; display: grid; place-items: center; padding: 8px; text-align: center; font-size: .8rem; font-weight: 600; color: var(--muted); }
.tile .qty {
  position: absolute; right: 5px; bottom: 5px; min-width: 26px; height: 22px; padding: 0 6px;
  display: grid; place-items: center; border-radius: 11px; font-size: .78rem; font-weight: 800;
  background: rgba(15, 12, 30, .82); color: #fff;
}
.tile .foil {
  position: absolute; left: 5px; bottom: 5px; height: 22px; padding: 0 6px; border-radius: 11px;
  display: grid; place-items: center; font-size: .7rem; font-weight: 800;
  background: linear-gradient(120deg, #f9d976, #b4f1ff, #e2b6ff); color: #222;
}
.tile .cap { display: flex; justify-content: space-between; gap: 6px; font-size: .78rem; min-width: 0; padding: 0 2px; }
.tile .cap .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.tile .cap .p { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.tile:hover .img { box-shadow: 0 0 0 2px var(--accent), var(--shadow); }
.list { display: grid; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.list-row {
  appearance: none; border: 0; background: none; text-align: left; cursor: pointer; width: 100%;
  display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 4px 10px; align-items: center;
  min-height: 52px; padding: 8px 12px; border-top: 1px solid var(--border);
}
.list-row:first-child { border-top: 0; }
.list-row:hover { background: var(--surface-2); }
.list-row .q { font-weight: 800; font-variant-numeric: tabular-nums; color: var(--muted); }
.list-row .main { min-width: 0; display: grid; gap: 1px; }
.list-row .nm { display: flex; gap: 6px; align-items: center; min-width: 0; }
.list-row .nm b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.list-row .sub { font-size: .8rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list-row .end { text-align: right; display: grid; gap: 2px; justify-items: end; font-size: .85rem; font-variant-numeric: tabular-nums; }

/* ==========================================================================
   Sheet / dialog (bottom sheet on mobile, centered modal on desktop)
   ========================================================================== */
.overlay { position: fixed; inset: 0; z-index: 100; background: var(--overlay); display: flex; align-items: flex-end; justify-content: center; animation: fade .15s; }
.sheet {
  position: relative; width: 100%; max-height: 92vh; max-height: 92dvh; overflow: auto; overscroll-behavior: contain;
  background: var(--surface); border-radius: 18px 18px 0 0; box-shadow: var(--shadow-lg);
  padding: 8px 16px calc(24px + env(safe-area-inset-bottom)); animation: slideup .2s ease-out;
}
.sheet-head {
  position: sticky; top: -8px; z-index: 2; display: flex; align-items: center; gap: 8px;
  margin: -8px -16px 8px; padding: 8px 8px 8px 16px; background: var(--surface); border-bottom: 1px solid var(--border);
}
.sheet-head.has-pin { flex-wrap: wrap; }
.sheet-pin { flex: 1 0 100%; min-width: 0; padding: 0 8px 8px 0; }
.sheet-head h2 { flex: 1; min-width: 0; font-size: 1.1rem; overflow-wrap: anywhere; }
@keyframes fade { from { opacity: 0; } }
@keyframes slideup { from { transform: translateY(30px); opacity: .5; } }
@media (min-width: 768px) {
  .overlay { align-items: center; padding: 24px; }
  .sheet { max-width: 920px; border-radius: 18px; max-height: 88vh; padding-bottom: 24px; }
}
.card-detail { display: grid; gap: 16px; }
.card-detail .big { width: 100%; max-width: 340px; margin: 0 auto; border-radius: 4.75% / 3.5%; box-shadow: var(--shadow); display: block; aspect-ratio: 488 / 680; background: var(--surface-2); }
@media (min-width: 768px) {
  .card-detail { grid-template-columns: 320px minmax(0, 1fr); align-items: start; }
  .card-detail .big { position: sticky; top: 64px; }
}
.oracle { background: var(--surface-2); border-radius: var(--radius-sm); padding: 12px 14px; display: grid; gap: 8px; }
.oracle p { margin: 0; }
.oracle hr { border: 0; border-top: 1px dashed var(--border); margin: 2px 0; width: 100%; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: .9rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.legal { display: flex; flex-wrap: wrap; gap: 6px; }

/* Every grid on the way from the page to a bubble gets an explicit minmax(0, 1fr)

/** localStorage that never throws (private mode, blocked storage, ...). */
const store = {
  get(key, fallback) {
    try {
      const v = localStorage.getItem(key);
      return v == null ? fallback : JSON.parse(v);
    } catch { return fallback; }
  },
  set(key, value) {
    try {
      if (value == null) localStorage.removeItem(key);
      else localStorage.setItem(key, JSON.stringify(value));
    } catch { /* ignore */ }
  },
};

class ApiError extends Error {
  constructor(status, message, data = null) {
    super(message);
    this.status = status;
    this.data = data; // the JSON error body ({error, code, ...}) when there is one
  }
}

/**
 * fetch() wrapper: JSON in/out, every failure becomes an ApiError with a
 * human-readable message ({error} from the server when present).
 */
async function api(path, { method = "GET", json, body, headers = {}, signal } = {}) {
  const opts = { method, headers: { ...headers }, signal };
  if (json !== undefined) {
    opts.body = JSON.stringify(json);
    opts.headers["Content-Type"] = "application/json";
  } else if (body !== undefined) {
    opts.body = body;
  }
  let res;
  try {
    res = await fetch(path, opts);
  } catch (err) {
    if (err.name === "AbortError") throw err;
    throw new ApiError(0, `Network error: ${err.message}. Is the server reachable?`);
  }
  if (res.status === 204) return null;
  const type = res.headers.get("content-type") || "";
  let data = null;
  if (type.includes("application/json")) {
    try { data = await res.json(); } catch { data = null; }
  } else {
    data = await res.text().catch(() => "");
  }
  if (!res.ok) {
    let message = data && typeof data === "object" && data.error;
    if (!message && typeof data === "string" && data.trim() && !data.trim().startsWith("<")) message = data.trim().slice(0, 300);
    throw new ApiError(res.status, message || `Request failed: HTTP ${res.status} ${res.statusText}`.trim(), data && typeof data === "object" ? data : null);
  }
  return data;
}

/** Parse a Server-Sent Events body into JSON events ("data: <json>" lines). */
async function* readSse(body) {
  const reader = body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";
  try {
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true }).replace(/\r\n/g, "\n");
      let idx;
      while ((idx = buffer.indexOf("\n\n")) >= 0) {
        const block = buffer.slice(0, idx);
        buffer = buffer.slice(idx + 2);
        const data = block.split("\n")
          .filter((l) => l.startsWith("data:"))
          .map((l) => l.slice(5).replace(/^ /, ""))
          .join("\n");
        if (!data) continue; // ": ping" keep-alive comments
        let ev;
        try { ev = JSON.parse(data); } catch { continue; }
        yield ev;
      }
    }
  } finally {
    reader.cancel().catch(() => {});
  }
}

function useDebounced(value, ms) {

/** SQLite datetime('now') is "YYYY-MM-DD HH:MM:SS" in UTC without a zone. */
function parseTs(s) {
  if (!s) return null;
  if (typeof s === "number") { const d = new Date(s); return Number.isNaN(d.getTime()) ? null : d; }
  if (s instanceof Date) return s;
  s = String(s);
  const iso = /[zZ]|[+-]\d\d:?\d\d$/.test(s) ? s : s.replace(" ", "T") + "Z";
  const d = new Date(iso);
  return Number.isNaN(d.getTime()) ? null : d;
}
function fmtDate(s) {
  const d = parseTs(s);
  return d ? d.toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" }) : "—";
}
const RTF = typeof Intl !== "undefined" && Intl.RelativeTimeFormat ? new Intl.RelativeTimeFormat(undefined, { numeric: "auto" }) : null;
function fmtAgo(s) {
  const d = parseTs(s);
  if (!d) return "—";
  const sec = (d.getTime() - Date.now()) / 1000;
  if (!RTF) return fmtDate(s);
  const abs = Math.abs(sec);
  if (abs < 60) return RTF.format(Math.round(sec), "second");
  if (abs < 3600) return RTF.format(Math.round(sec / 60), "minute");
  if (abs < 86400) return RTF.format(Math.round(sec / 3600), "hour");
  if (abs < 86400 * 30) return RTF.format(Math.round(sec / 86400), "day");

}

const SYMBOL_RE = /\{([^{}\s]{1,8})\}/g;

  if (code === "∞") code = "INFINITY";
  return `https://svgs.scryfall.io/card-symbols/${encodeURIComponent(code)}.svg`;
}

/** Text with {X} symbols replaced by inline Scryfall SVGs. */
function SymbolText({ text }) {
  if (!text) return null;
  const parts = String(text).split(/(\{[^{}\s]{1,8}\})/g);
  return (
    <>
      {parts.map((p, i) => (/^\{[^{}\s]{1,8}\}$/.test(p)

        : p ? <React.Fragment key={i}>{p}</React.Fragment> : null))}
    </>
  );
}

}

/** Oracle text: paragraphs, "//" face separators, italic reminder text. */
function OracleText({ text }) {
  if (!text) return <p className="muted">No rules text.</p>;
  return (
    <>
      {String(text).split("\n").map((line, i) => {
        if (line.trim() === "//") return <hr key={i} />;
        const parts = line.split(/(\([^)]*\))/g);
        return (
          <p key={i}>

              : <SymbolText key={j} text={p} />))}
          </p>
        );
      })}
    </>
  );
}

const MD_SYMBOL_RE = /\{((?:[WUBRGCSXYZTQEP0-9]|HALF|½|∞)(?:\/[WUBRGCP0-9])?)\}/g;

function renderMarkdown(text) {
  const src = text || "";
  try {
    let html = window.marked ? marked.parse(src, { gfm: true, breaks: true }) : escapeHtml(src).replace(/\n/g, "<br>");

/**
 * Phone-friendly tables: each table gets its own horizontal scroller, short
 * cells stay on one line and longer ones get a readable minimum width, so a
 * wide table scrolls inside the bubble instead of being squeezed into columns
 * a few letters wide.
 */
function layoutTables(html) {
  if (!html.includes("<table")) return html;
  const t = document.createElement("template");
  t.innerHTML = html;
  for (const table of t.content.querySelectorAll("table")) {
    for (const cell of table.querySelectorAll("th, td")) cell.className = (cell.textContent || "").trim().length <= 14 ? "nw" : "wide";
    const wrap = document.createElement("div");
    wrap.className = "md-table";
    table.replaceWith(wrap);
    wrap.appendChild(table);
  }
  return t.innerHTML;
}

}

/** Small "IT" / "DE" tag for a copy printed in another language than English (names stay English). */

/**
 * Toast for collection edits/deletes with Undo (POST /api/collection/edits/:id/undo).
 * show({text, editId?}); onUndone runs after a successful undo. `portal` renders it on
 * document.body above open sheets.
 */
function useEditToast(onUndone, { portal = false } = {}) {
  const [t, setT] = useState(null); // {text, editId, ms}
  const cb = useRef(onUndone);
  cb.current = onUndone;
  useEffect(() => {
    if (!t) return;
    const h = setTimeout(() => setT(null), t.ms || (t.editId ? 10000 : 4000));
    return () => clearTimeout(h);
  }, [t]);
  const undo = async () => {
    const id = t?.editId;
    if (id == null) return;
    setT({ text: "Undoing…", ms: 30000 });
    try {
      await api(`/api/collection/edits/${encodeURIComponent(id)}/undo`, { method: "POST" });
      setT({ text: "Undone" });
      cb.current?.();
    } catch (e) {
      setT({ text: e.data?.code === "conflict" ? "Can't undo: these copies changed since." : `Undo failed: ${e.message}`, ms: 6000 });
    }
  };
  const el = t ? (
    <div className={`toast${portal ? " over" : ""}`} role="status" aria-live="polite">
      <span>{t.text}</span>
      {t.editId != null && <button type="button" className="btn ghost sm" onClick={undo}><Icon.undo /> Undo</button>}
      <button type="button" className="btn ghost icon sm" aria-label="Dismiss" onClick={() => setT(null)} style={{ textDecoration: "none" }}><Icon.close /></button>
    </div>
  ) : null;
  return [setT, portal && el ? ReactDOM.createPortal(el, document.body) : el];
}

 * Modal sheet: bottom sheet on phones, centered dialog on desktop.
 * Handles Escape, focus trap, focus restore and background scroll lock.

    const prevFocus = document.activeElement;
    const prevOverflow = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    ref.current?.focus();
    const onKey = (e) => {
      if (e.key === "Escape") {
        // Sheets stack (the card sheet opens above the build list): only the top one closes.
        const overlays = document.querySelectorAll(".overlay");
        if (ref.current && overlays[overlays.length - 1] !== ref.current.parentElement) return;
        e.stopPropagation(); onClose();
      }
      if (e.key === "Tab" && ref.current) {
        const f = ref.current.querySelectorAll('a[href], button:not([disabled]), input, select, textarea, [tabindex]:not([tabindex="-1"])');
        if (!f.length) return;
        const first = f[0], last = f[f.length - 1];
        if (e.shiftKey && (document.activeElement === first || document.activeElement === ref.current)) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    };
    document.addEventListener("keydown", onKey);
    return () => {
      document.removeEventListener("keydown", onKey);
      document.body.style.overflow = prevOverflow;
      if (prevFocus && prevFocus.focus) prevFocus.focus({ preventScroll: true });
    };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);
  return (
    <div className="overlay" onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="sheet" role="dialog" aria-modal="true" aria-labelledby={titleId} tabIndex={-1} ref={ref}>
        <div className={`sheet-head${pinned ? " has-pin" : ""}`}>
          <h2 id={titleId}>{title}</h2>
          {actions}
          <button type="button" className="btn ghost icon" aria-label="Close" onClick={onClose}><Icon.close /></button>
          {pinned && <div className="sheet-pin">{pinned}</div>}
        </div>
        {children}
      </div>
    </div>
  );
}

/** Copy text: the async clipboard API (secure contexts), else a hidden textarea + execCommand. */
async function copyText(text) {
  try {
    if (navigator.clipboard?.writeText) { await navigator.clipboard.writeText(text); return true; }
  } catch { /* fall through */ }
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand("copy");
    ta.remove();
    return ok;
  } catch { return false; }
}

/** Link to a view of this server (same host the user opened, e.g. #decks/6 or #collection/binder/Trade). */
const shareUrl = (hash) => `${location.origin}${location.pathname}${hash}`;

/**
 * Share a deep link to a deck or binder with someone on the same network: the share
 * sheet on phones (navigator.share), else the link goes to the clipboard ("Link copied").
 */
function ShareButton({ title, hash }) {
  const [toast, toastEl] = useEditToast(null);
  const run = async () => {
    const url = shareUrl(hash);
    if (typeof navigator.share === "function") {
      try { await navigator.share({ title, url }); return; } catch (e) { if (e?.name === "AbortError") return; }
    }
    if (await copyText(url)) toast({ text: "Link copied" });
    else window.prompt("Copy this link:", url);
  };
  return (
    <>
      <button type="button" className="btn ghost icon share-btn" aria-label={`Share a link to ${title}`} title="Share link" onClick={run}><Icon.share /></button>
      {toastEl}
    </>
  );
}

/** "owned 1 · used in 3 decks (2 built) · 1 short" */
function CardUsage({ usage }) {
  if (!usage || typeof usage !== "object" || usage.owned == null) return null;
  const decks = asList(usage.decks);
  const ids = new Set(decks.map((d) => d.id ?? d.name));
  const built = new Set(decks.filter((d) => d.status === "built").map((d) => d.id ?? d.name));
  const available = usage.available ?? (usage.owned - (usage.built_demand ?? 0));
  return (
    <div className="usage-line" aria-label="Copies and decks">
      <span>owned <b>{fmtInt(usage.owned)}</b></span>
      {ids.size > 0 && <span className="muted">· used in {plural(ids.size, "deck")}{built.size ? ` (${fmtInt(built.size)} built)` : ""}</span>}
      {usage.boxed > 0 && <span className="muted">· 🔒 {fmtInt(usage.boxed)} in locked binders</span>}
      {available < 0
        ? <span className="badge bad">{fmtInt(-available)} short</span>
        : (usage.built_demand > 0 || usage.boxed > 0) && <span className="badge ok">{fmtInt(available)} free</span>}
    </div>
  );
}

      {moveRow && card && (
        <MoveSheet title={`Move ${card.name}`} maxQty={moveRow.quantity} exclude={moveRow.binder}

            const res = await guarded((confirm) => api("/api/collection/move", { method: "POST", json: { items: [item], to_binder, create, confirm_master: confirm } }));

const QUICK_FILTERS = [
  ["Commanders", "is:commander"],
  ["Creatures", "t:creature"],
  ["Lands", "t:land"],
  ["Foils", "is:foil"],
  ["Valuable", "eur>5"],

];
const SORTS = [
  ["name", "Name", "asc"], ["price", "Price", "desc"], ["cmc", "Mana value", "asc"],
  ["qty", "Quantity", "desc"], ["set", "Set", "asc"], ["rarity", "Rarity", "desc"],
];
const tokenize = (q) => q.match(/-?[a-z]*(?:[:<>=!]+)?(?:"[^"]*"|\S+)/gi) || [];
/** q plus a filter chip's term; a search with a bare `or` is wrapped first, so the chip applies to all of it. */
const appendTerm = (q, term) => {
  const base = q.trim();
  if (!base) return term;
  return tokenize(base).some((t) => t.toLowerCase() === "or") ? `(${base}) ${term}` : `${base} ${term}`;
};

// binder: null = whole collection, "" = Unsorted, else that binder (GET /api/stats?binder=, exact, case-insensitive).
function StatsBar({ dataVersion, binder = null, scopeLine = true, compact = false }) {
  const [stats, setStats] = useState(null);
  const [error, setError] = useState(null);
  const reqId = useRef(0);
  const load = useCallback(() => {
    const id = ++reqId.current;
    setError(null);
    setStats(null);
    const qs = binder == null ? "" : `?${new URLSearchParams({ binder })}`;
    api(`/api/stats${qs}`)
      .then((d) => { if (id === reqId.current) setStats(d); })
      .catch((e) => { if (id === reqId.current) setError(`Could not load stats: ${e.message}`); });
  }, [binder]);
  useEffect(load, [load, dataVersion]);
  if (error) return <ErrorNotice error={error} onRetry={load} />;
  const s = stats || {};
  const scope = binder == null ? null : binder || UNSORTED;
  return (
    <div className="stats-wrap">
      {scope != null && scopeLine && (
        <p className="stats-scope small muted" aria-live="polite">Showing <b>{scope}</b> only</p>
      )}
      <div className={`stats${compact ? " compact" : ""}`} aria-busy={!stats}>
        <div className="stat"><div className="v">{stats ? fmtInt(s.unique_cards) : "…"}</div><div className="k">{compact ? "Cards" : "Unique cards"}</div></div>
        <div className="stat"><div className="v">{stats ? fmtInt(s.total_cards) : "…"}</div><div className="k">{compact ? "Copies" : "Total copies"}</div></div>
        <div className="stat"><div className="v">{stats ? fmtEur(s.value_eur) : "…"}</div><div className="k">{compact ? "Value" : scope != null ? "Binder value" : "Est. value"}</div></div>
        {!compact && <div className="stat"><div className="v" style={{ fontSize: "1rem" }} title={stats?.last_import ? fmtDate(s.last_import) : undefined}>{stats ? (s.last_import ? fmtAgo(s.last_import) : "never") : "…"}</div><div className="k">Last import</div></div>}
      </div>
    </div>
  );
}

}

// Collection routes (URL hash, so the browser's back button works):
// #collection = binder overview, #collection/all = every card,
// #collection/binder/<name> = one binder, #collection/unsorted = copies without a binder.
function parseCollectionRoute(hash) {
  // A binder search from the overview travels as ?q=… (binder names are encoded, so "?" is never part of one).
  const raw = String(hash || "").replace(/^#/, "");
  const qi = raw.indexOf("?");
  let q = null;
  if (qi >= 0) { try { q = new URLSearchParams(raw.slice(qi + 1)).get("q") || null; } catch { /* ignore */ } }
  const parts = (qi < 0 ? raw : raw.slice(0, qi)).split("/");
  if (parts[0] !== "collection") return null;
  const withQ = (r) => (q ? { ...r, q } : r);
  if (parts[1] === "all") return withQ({ view: "all" });
  if (parts[1] === "sets") return { view: "sets" };
  if (parts[1] === "set" && /^[a-z0-9]{2,8}$/i.test(parts[2] || "")) return { view: "set", code: parts[2].toLowerCase() };
  if (parts[1] === "unsorted") return withQ({ view: "binder", binder: "" });
  if (parts[1] === "binder" && parts.length > 2) {
    try { return withQ({ view: "binder", binder: decodeURIComponent(parts.slice(2).join("/")) }); } catch { /* bad escape */ }
  }
  return { view: "overview" };
}
const collectionHash = (r) => (r.view === "all" ? "#collection/all"
  : r.view === "sets" ? "#collection/sets"
  : r.view === "set" ? `#collection/set/${r.code}`
  : r.view === "binder" ? (r.binder ? `#collection/binder/${encodeURIComponent(r.binder)}` : "#collection/unsorted")
  : "#collection") + (r.q && r.view !== "overview" ? `?q=${encodeURIComponent(r.q)}` : "");
/** Change the hash (push, or replace keeping the history state) and tell the listeners. */
function goHash(h, { replace = false } = {}) {
  if (location.hash === h) return;
  if (replace) history.replaceState(history.state, "", h);
  else history.pushState({ mtgNav: true }, "", h);
  window.dispatchEvent(new HashChangeEvent("hashchange"));
}
// Binders above this many copies open in sections by set (each section loads on demand).
const BIG_BINDER_COPIES = 300;
const SECTION_OPTIONS = [["none", "No sections"], ["set", "By set"], ["color", "By colour"], ["rarity", "By rarity"], ["type", "By type"]];

/**
 * Collection tab: the binder overview (one entry per binder, grouped by type), a binder's
 * detail page or All cards. The view lives in the URL hash and in localStorage
 * (mtg.collection.route), so a reload or the back button lands where the user was.
 */
function CollectionTab({ dataVersion, homeKey = 0, onOpenCard, onOpenDeck, onGoImport, onGoScan, onChanged }) {
  const [route, setRoute] = useState(() => {
    const r = parseCollectionRoute(location.hash);
    if (r && r.view !== "overview") return r;
    const last = store.get("mtg.collection.route", null);
    return last && (last.view === "all" || (last.view === "binder" && typeof last.binder === "string")) ? last : { view: "overview" };
  });
  const binderList = useBinderList(dataVersion);
  // The search (?q=) is not remembered: a restored view opens without it.
  useEffect(() => { store.set("mtg.collection.route", route.view === "binder" ? { view: "binder", binder: route.binder } : { view: route.view }); }, [route]);
  // A restored view puts its hash in the URL (only while the Collection tab is shown).
  useEffect(() => {
    if (location.hash.slice(1).split("/")[0] === "collection" && location.hash !== collectionHash(route)) goHash(collectionHash(route), { replace: true });
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);
  useEffect(() => {
    const onHash = () => { const r = parseCollectionRoute(location.hash); if (r) { setRoute(r); window.scrollTo(0, 0); } };
    window.addEventListener("hashchange", onHash);
    return () => window.removeEventListener("hashchange", onHash);
  }, []);
  // Tapping the active Collection tab returns to the overview.
  const firstHome = useRef(homeKey);
  useEffect(() => { if (homeKey !== firstHome.current) goHash("#collection"); }, [homeKey]);

  const open = useCallback((r, opts) => goHash(collectionHash(r), opts), []);
  // Back: pop our own history entry when there is one, else replace with the overview.
  const back = useCallback(() => { if (history.state?.mtgNav) history.back(); else goHash("#collection", { replace: true }); }, []);

  const data = binderList.data;
  const entry = route.view === "binder" && data
    ? (route.binder === "" ? { ...data.unsorted, name: "" } : data.binders.find((b) => sameName(b.name, route.binder)) ?? null)
    : null;
  // A binder that no longer exists (renamed, deleted elsewhere) falls back to the overview.
  useEffect(() => {
    if (route.view === "binder" && route.binder && data && !entry) goHash("#collection", { replace: true });
  }, [route, data, entry]);

  if (route.view === "overview") {
    return <BinderOverview list={binderList} onOpen={open} onGoImport={onGoImport} onGoScan={onGoScan} onChanged={onChanged} />;
  }
  if (route.view === "sets") return <SetsView key="sets" dataVersion={dataVersion} onOpen={open} onBack={back} />;
  if (route.view === "set") return <SetView key={route.code} code={route.code} dataVersion={dataVersion} onBack={back} onOpenCard={onOpenCard} onChanged={onChanged} />;
  if (route.view === "binder" && !entry) {
    return binderList.error ? <ErrorNotice error={`Could not load binders: ${binderList.error}`} onRetry={binderList.reload} /> : <Spinner />;
  }
  const key = collectionHash(route);
  return (
    <CollectionBrowser key={key} binder={route.view === "binder" ? entry.name : null} entry={entry} binderList={binderList} initialQ={route.q ?? null}
      dataVersion={dataVersion} onBack={back} onOpen={open} onOpenCard={onOpenCard} onOpenDeck={onOpenDeck}
      onGoImport={onGoImport} onGoScan={onGoScan} onChanged={onChanged} />
  );
}

/** Tiles or list rows of collection rows (search results or one section). */
function CardRows({ rows, view, group, onOpenCard, selecting, isSelected, onToggle }) {
  return view === "grid"
    ? <div className="grid">{rows.map((r) => <CardTile key={r.scryfall_id} row={r} group={group} onOpen={onOpenCard}
        selecting={selecting} selected={isSelected(r)} onToggle={() => onToggle(r)} />)}</div>
    : <div className="list">{rows.map((r) => <CardListRow key={r.scryfall_id} row={r} group={group} onOpen={onOpenCard}
        selecting={selecting} selected={isSelected(r)} onToggle={() => onToggle(r)} />)}</div>;
}

/**
 * Search, sort, select/move/delete over one binder (binder = name, "" = Unsorted) or the
 * whole collection (binder = null). Optional sections (by set / colour / rarity / type):
 * only the headers load first, each section fetches its cards when opened.
 */
function CollectionBrowser({ binder, entry, binderList, initialQ = null, dataVersion, onBack, onOpen, onOpenCard, onOpenDeck, onGoImport, onGoScan, onChanged }) {
  const all = binder == null;
  // initialQ: the search the Binders overview found this binder with.
  const [q, setQ] = useState(() => initialQ ?? (all ? store.get("mtg.q", "") : ""));
  const dq = useDebounced(q.trim(), 300);
  const [group, setGroup] = useState(() => store.get("mtg.group", "card"));
  const [sort, setSort] = useState(() => store.get("mtg.sort", "name"));
  const [dir, setDir] = useState(() => store.get("mtg.dir", "asc"));
  const [view, setView] = useState(() => store.get("mtg.view", "grid"));
  // Sections per view (mtg.sections {<binder | "*all">: by}); big binders default to sets.
  const scopeKey = all ? "*all" : (binder || "*unsorted").toLowerCase();
  const [sectionPref, setSectionPref] = useState(() => store.get("mtg.sections", {})?.[scopeKey] ?? null);
  const sectionBy = sectionPref ?? (all ? "none" : entry ? (entry.copies > BIG_BINDER_COPIES ? "set" : "none") : null);
  const changeSections = (by) => {
    setSectionPref(by);
    store.set("mtg.sections", { ...(store.get("mtg.sections", {}) || {}), [scopeKey]: by });
  };
  const [selecting, setSelecting] = useState(false);
  const [selected, setSelected] = useState(() => new Map()); // key -> {key, oracle_id, scryfall_id, name}
  const [sheet, setSheet] = useState(null); // "new" | "manage" | "move" | "delete" | "menu"
  const [guarded, masterDialog] = useMasterConfirm();
  const [rows, setRows] = useState([]);
  const [total, setTotal] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const reqId = useRef(0);
  const loadingRef = useRef(false);
  const sentinel = useRef(null);
  const sectioned = sectionBy != null && sectionBy !== "none";

  useEffect(() => { if (all) store.set("mtg.q", q); }, [q, all]);
  useEffect(() => { store.set("mtg.group", group); store.set("mtg.sort", sort); store.set("mtg.dir", dir); store.set("mtg.view", view); }, [group, sort, dir, view]);
  // Selection keys depend on the grouping.
  useEffect(() => { setSelected(new Map()); }, [group]);

  const baseParams = useCallback((extra = {}) => {
    const p = new URLSearchParams({ q: dq, group, sort, dir, ...extra });
    if (binder != null) p.set("binder", binder);
    return p;
  }, [dq, group, sort, dir, binder]);

  const load = useCallback(async (offset) => {
    const id = ++reqId.current;
    loadingRef.current = true;
    setLoading(true);
    setError(null);
    try {
      const data = await api(`/api/collection?${baseParams({ limit: String(PAGE_SIZE), offset: String(offset) })}`);
      if (id !== reqId.current) return;
      setTotal(data.total);
      setRows((prev) => (offset === 0 ? data.rows : [...prev, ...data.rows]));
    } catch (e) {
      if (id !== reqId.current) return;
      setError(e.status === 400 ? `Search error: ${e.message}` : e.message);
      if (offset === 0) { setRows([]); setTotal(null); }
    } finally {
      if (id === reqId.current) { loadingRef.current = false; setLoading(false); }
    }
  }, [baseParams]);

  // Flat list: loads pages. Sectioned: the sections load themselves (SectionList).
  useEffect(() => {
    if (sectionBy == null) return;
    if (!sectioned) { load(0); return; }
    reqId.current++;
    setRows([]); setTotal(null); setLoading(false); loadingRef.current = false;
  }, [load, dataVersion, sectionBy, sectioned]);

  const hasMore = !sectioned && total != null && rows.length < total;
  // Infinite scroll: auto-load when the sentinel nears the viewport.
  useEffect(() => {
    const el = sentinel.current;
    if (!el || !hasMore || error || typeof IntersectionObserver === "undefined") return;
    const io = new IntersectionObserver((entries) => {
      if (entries.some((e) => e.isIntersecting) && !loadingRef.current) load(rows.length);
    }, { rootMargin: "600px 0px" });
    io.observe(el);
    return () => io.disconnect();
  }, [hasMore, rows.length, load, error]);

  const tokens = tokenize(q);
  const toggleFilter = (term) => {
    const lower = term.toLowerCase();
    const has = tokens.some((t) => t.toLowerCase() === lower);
    setQ(has ? tokens.filter((t) => t.toLowerCase() !== lower).join(" ") : appendTerm(q, term));
  };
  const changeSort = (s) => {
    setSort(s);
    setDir(SORTS.find(([k]) => k === s)?.[2] || "asc");
  };

  const copies = all ? null : entry?.copies ?? null;
  const emptyCollection = all && total === 0 && !dq;
  const emptyBinder = !all && copies === 0 && !dq;
  const keyOf = (r) => (group === "card" ? r.oracle_id || r.scryfall_id : r.scryfall_id);
  const isSelected = (r) => selected.has(keyOf(r));
  const toggleRow = (r) => setSelected((m) => {
    const n = new Map(m);
    const k = keyOf(r);
    if (n.has(k)) n.delete(k); else n.set(k, { key: k, oracle_id: r.oracle_id, scryfall_id: r.scryfall_id, name: r.name });
    return n;
  });
  // "All" means every card of the current view (search + binder), not just the loaded pages: it pages
  // through /api/collection. Capped at SELECT_ALL_MAX, the server's per-action item limit.
  const [selectingAll, setSelectingAll] = useState(false);
  const [selectCapped, setSelectCapped] = useState(false);
  const [viewTotal, setViewTotal] = useState(null); // sectioned: cards in the view (for "All")
  const totalForAll = sectioned ? viewTotal : total;
  const allSelected = totalForAll != null && totalForAll > 0 && selected.size >= Math.min(totalForAll, SELECT_ALL_MAX);
  const selectAll = async () => {
    if (allSelected) { setSelected(new Map()); setSelectCapped(false); return; }
    setSelectingAll(true);
    try {
      const picked = new Map();
      for (let offset = 0; picked.size < SELECT_ALL_MAX; offset += 500) {
        const data = await api(`/api/collection?${baseParams({ limit: "500", offset: String(offset) })}`);
        for (const r of data.rows) if (picked.size < SELECT_ALL_MAX) picked.set(keyOf(r), { key: keyOf(r), oracle_id: r.oracle_id, scryfall_id: r.scryfall_id, name: r.name });
        setViewTotal(data.total);
        if (data.rows.length < 500 || offset + 500 >= data.total) { setSelectCapped(data.total > SELECT_ALL_MAX); break; }
      }
      setSelected(picked);
    } catch (e) {
      setError(e.message);
    } finally {
      setSelectingAll(false);
    }
  };
  const stopSelecting = () => { setSelecting(false); setSelected(new Map()); };
  const binderName = all ? null : binder || UNSORTED;
  const [showToast, toastEl] = useEditToast(() => { binderList.reload(); onChanged?.(); });
  const afterChange = (text, editId = null) => { if (text) showToast({ text, editId }); binderList.reload(); onChanged?.(); };
  const canSelect = sectioned ? !emptyBinder : rows.length > 0;

  return (
    <div className="stack-lg">
      <BinderHeader binder={binder} entry={entry} list={binderList.data} onBack={onBack} onOpen={onOpen} onOpenDeck={onOpenDeck}
        onMenu={() => setSheet("menu")} onChanged={() => afterChange(null)} />
      <StatsBar dataVersion={dataVersion} binder={binder} scopeLine={false} compact={!all} />

      <div className="stack">
        <form className="search" role="search" onSubmit={(e) => { e.preventDefault(); e.currentTarget.querySelector("input")?.blur(); }}>
          <Icon.search />
          <label htmlFor="collection-q" className="sr-only">{all ? "Search your collection" : `Search ${binderName}`}</label>
          <input id="collection-q" className="input" type="search" inputMode="search" enterKeyHint="search"
            autoComplete="off" autoCorrect="off" autoCapitalize="off" spellCheck="false"
            placeholder={all ? "Search… e.g. t:creature c:g cmc<=3" : `Search in ${binderName}…`} value={q} onChange={(e) => setQ(e.target.value)} />
          {q && <button type="button" className="btn ghost icon clear" aria-label="Clear search" onClick={() => setQ("")}><Icon.close /></button>}
        </form>
        <div className="chips" role="group" aria-label="Quick filters">
          {QUICK_FILTERS.map(([label, term]) => (
            <button key={term} type="button" className="chip" aria-pressed={tokens.some((t) => t.toLowerCase() === term.toLowerCase())}
              onClick={() => toggleFilter(term)}>{label}</button>
          ))}
        </div>
        <QueryHelp />
        <div className="toolbar">
          <div className="segmented" role="group" aria-label="Group by">
            <button type="button" aria-pressed={group === "card"} onClick={() => setGroup("card")}>Cards</button>
            <button type="button" aria-pressed={group === "printing"} onClick={() => setGroup("printing")}>Printings</button>
          </div>
          <label htmlFor="collection-sort" className="sr-only">Sort by</label>
          <select id="collection-sort" className="select grow" style={{ maxWidth: 170 }} value={sort} onChange={(e) => changeSort(e.target.value)}>
            {SORTS.map(([k, label]) => <option key={k} value={k}>{label}</option>)}
          </select>
          <button type="button" className="btn icon" onClick={() => setDir(dir === "asc" ? "desc" : "asc")}
            aria-label={dir === "asc" ? "Ascending, switch to descending" : "Descending, switch to ascending"} title={dir === "asc" ? "Ascending" : "Descending"}>
            {dir === "asc" ? <Icon.up /> : <Icon.down />}
          </button>
          <label htmlFor="collection-sections" className="sr-only">Sections</label>
          <select id="collection-sections" className="select grow" style={{ maxWidth: 160 }} value={sectionBy ?? "none"} onChange={(e) => changeSections(e.target.value)}>
            {SECTION_OPTIONS.map(([k, label]) => <option key={k} value={k}>{label}</option>)}
          </select>
          <button type="button" className={`btn${selecting ? " primary" : ""}`} aria-pressed={selecting} onClick={() => (selecting ? stopSelecting() : setSelecting(true))}
            disabled={!canSelect && !selecting}><Icon.check /> {selecting ? "Done" : "Select"}</button>
          <div className="segmented" role="group" aria-label="View" style={{ marginLeft: "auto" }}>
            <button type="button" aria-pressed={view === "grid"} aria-label="Grid view" onClick={() => setView("grid")}><Icon.grid /></button>
            <button type="button" aria-pressed={view === "list"} aria-label="List view" onClick={() => setView("list")}><Icon.list /></button>
          </div>
        </div>
      </div>

      <div className="stack">
        {!sectioned && (
          <div className="result-count" aria-live="polite">
            {total != null && !emptyCollection && !emptyBinder && `${plural(total, group === "card" ? "card" : "printing")}${dq ? " match" + (total === 1 ? "es" : "") : ""}${binderName ? ` in ${binderName}` : ""}`}
          </div>
        )}

        {error && <ErrorNotice error={error} onRetry={() => load(rows.length && hasMore ? rows.length : 0)} />}

        {emptyCollection && (
          <div className="empty card">
            <h3>Your collection is empty</h3>
            <p style={{ margin: 0 }}>Scan your cards with the camera, or export your collection from ManaBox as CSV and import it here.</p>
            <div className="row" style={{ justifyContent: "center" }}>
              <button type="button" className="btn primary" onClick={onGoScan}><Icon.scan /> Scan cards</button>
              <button type="button" className="btn" onClick={onGoImport}><Icon.import /> Import from ManaBox</button>
            </div>
          </div>
        )}
        {emptyBinder && (
          <div className="empty card">
            <h3>{binder ? `“${binder}” is empty` : "Nothing unsorted"}</h3>
            <p style={{ margin: 0 }}>{binder ? "Open All cards, tap Select, pick cards and move them into this binder. Or use Move… on a card's owned printings." : "Every copy is in a binder."}</p>
            <button type="button" className="btn" onClick={() => onOpen({ view: "all" })}>Show all cards</button>
          </div>
        )}
        {!sectioned && total === 0 && dq && !error && (
          <div className="empty"><h3>No matches</h3><p style={{ margin: 0 }}>Nothing {binderName ? `in ${binderName}` : "in your collection"} matches <code>{dq}</code>.</p></div>
        )}

        {sectioned && !emptyBinder && (
          <SectionList by={sectionBy} params={baseParams} dq={dq} group={group} view={view} dataVersion={dataVersion} binderName={binderName}
            onOpenCard={onOpenCard} selecting={selecting} isSelected={isSelected} onToggle={toggleRow} />
        )}
        {!sectioned && rows.length > 0 && (
          <CardRows rows={rows} view={view} group={group} onOpenCard={onOpenCard} selecting={selecting} isSelected={isSelected} onToggle={toggleRow} />
        )}

        {!sectioned && loading && <Spinner label={rows.length ? "Loading more…" : "Searching…"} />}
        <div ref={sentinel} aria-hidden="true" />
        {hasMore && !loading && !error && (
          <button type="button" className="btn" onClick={() => load(rows.length)}>
            Load more ({fmtInt(total - rows.length)} left)
          </button>
        )}
      </div>

      {selecting && (
        <div className="commit-bar" role="region" aria-label="Selection">
          <span className="grow small">{selected.size
            ? plural(selected.size, group === "card" ? "card" : "printing") + " selected" + (selectCapped && allSelected ? ` (max ${SELECT_ALL_MAX} at once)` : "")
            : "Tap cards to select"}</span>
          <button type="button" className="btn ghost" onClick={selectAll} disabled={!canSelect || selectingAll}>
            {selectingAll ? "…" : allSelected ? "None" : "All"}</button>
          <button type="button" className="btn danger" disabled={!selected.size} onClick={() => setSheet("delete")} aria-label="Delete the selected copies"><Icon.trash /><span className="sel-del-label"> Delete</span></button>
          <button type="button" className="btn primary" disabled={!selected.size} onClick={() => setSheet("move")}>Move to…</button>
        </div>
      )}
      {sheet === "menu" && entry && binder && (
        <BinderMenuSheet entry={entry} list={binderList.data} onClose={() => setSheet(null)}
          onChanged={() => afterChange(null)}
          onRenamed={(name) => { setSheet(null); afterChange(`Renamed to “${name}”`); onOpen({ view: "binder", binder: name }, { replace: true }); }}
          onDeleted={(text, editId) => { setSheet(null); afterChange(text, editId); onBack(); }} />
      )}
      {sheet === "move" && (
        <BulkMoveSheet items={[...selected.values()]} group={group} binder={binder} guarded={guarded} onClose={() => setSheet(null)}
          onDone={(res) => {
            setSheet(null);
            stopSelecting();
            afterChange(`Moved ${plural(res.moved_copies, "copy", "copies")} to ${res.to_binder || UNSORTED}`);
          }} />
      )}
      {sheet === "delete" && (
        <BulkDeleteSheet items={[...selected.values()]} group={group} binder={binder} onClose={() => setSheet(null)}
          onDone={(res, n) => {
            setSheet(null);
            stopSelecting();
            afterChange(`Deleted ${plural(res?.deleted_copies ?? n, "copy", "copies")}`, res?.edit_id ?? null);
          }} />
      )}
      {masterDialog}
      {toastEl}
    </div>
  );
}

/**
 * Collapsible sections of a collection view (GET /api/collection/sections). Closed
 * sections render only their header; an open one pages its cards like the flat list.
 */
function SectionList({ by, params, dq, group, view, dataVersion, binderName, onOpenCard, selecting, isSelected, onToggle }) {
  const [data, setData] = useState(null);
  const [error, setError] = useState(null);
  const [open, setOpen] = useState(() => new Set());
  const reqId = useRef(0);
  const sp = params();
  sp.delete("sort"); sp.delete("dir");
  sp.set("by", by);
  const qs = sp.toString();
  const load = useCallback(() => {
    const id = ++reqId.current;
    setError(null);
    api(`/api/collection/sections?${qs}`)
      .then((d) => {
        if (id !== reqId.current) return;
        const list = asList(d, "sections");
        setData(list);
        // Few sections or a search: open the first ones, else everything starts closed.
        setOpen((prev) => (prev.size ? prev : new Set(list.length <= 2 ? list.map((s) => s.key) : dq ? list.slice(0, 3).map((s) => s.key) : [])));
      })
      .catch((e) => { if (id === reqId.current) setError(e.status === 400 ? `Search error: ${e.message}` : e.message); });
  }, [qs, dq]);
  useEffect(() => { setOpen(new Set()); setData(null); }, [by, qs]);
  useEffect(load, [load, dataVersion]);
  const toggle = (k) => setOpen((s) => { const n = new Set(s); if (n.has(k)) n.delete(k); else n.add(k); return n; });
  const unit = { set: ["set", "sets"], color: ["colour", "colours"], rarity: ["rarity", "rarities"], type: ["type", "types"] }[by] || ["section", "sections"];
  if (error) return <ErrorNotice error={error} onRetry={load} />;
  if (!data) return <Spinner />;
  if (!data.length) {
    return <div className="empty"><h3>No matches</h3><p style={{ margin: 0 }}>Nothing {binderName ? `in ${binderName}` : "in your collection"} matches <code>{dq}</code>.</p></div>;
  }
  const allOpen = data.every((s) => open.has(s.key));
  return (
    <div className="stack" style={{ gap: 8 }}>
      <div className="row between">
        <span className="result-count" aria-live="polite">{plural(data.length, ...unit)}{dq ? " with matches" : ""} · tap one to open</span>
        {data.length > 1 && (
          <button type="button" className="btn ghost sm" onClick={() => setOpen(allOpen ? new Set() : new Set(data.map((s) => s.key)))}>
            {allOpen ? "Close all" : "Open all"}</button>
        )}
      </div>
      {data.map((s) => (

      ))}

}

function CollSection({ s, by, open, onToggle, params, group, view, dataVersion, onOpenCard, selecting, isSelected, onToggle2 }) {

function SectionRows({ section, by, params, group, view, dataVersion, onOpenCard, selecting, isSelected, onToggle }) {
  const [rows, setRows] = useState([]);
  const [total, setTotal] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const reqId = useRef(0);
  const loadingRef = useRef(false);
  const sentinel = useRef(null);
  const load = useCallback(async (offset) => {
    const id = ++reqId.current;
    loadingRef.current = true;
    setLoading(true); setError(null);
    try {
      const d = await api(`/api/collection?${params({ section_by: by, section: section.key, limit: String(PAGE_SIZE), offset: String(offset) })}`);
      if (id !== reqId.current) return;
      setTotal(d.total);
      setRows((prev) => (offset === 0 ? d.rows : [...prev, ...d.rows]));
    } catch (e) {
      if (id === reqId.current) setError(e.message);
    } finally {
      if (id === reqId.current) { loadingRef.current = false; setLoading(false); }
    }
  }, [params, by, section.key]);
  useEffect(() => { load(0); }, [load, dataVersion]);
  const hasMore = total != null && rows.length < total;
  useEffect(() => {
    const el = sentinel.current;
    if (!el || !hasMore || error || typeof IntersectionObserver === "undefined") return;
    const io = new IntersectionObserver((entries) => {
      if (entries.some((e) => e.isIntersecting) && !loadingRef.current) load(rows.length);
    }, { rootMargin: "400px 0px" });
    io.observe(el);
    return () => io.disconnect();
  }, [hasMore, rows.length, load, error]);
  return (
    <div className="stack" style={{ gap: 8 }}>
      {error && <ErrorNotice error={error} onRetry={() => load(rows.length && hasMore ? rows.length : 0)} />}
      {rows.length > 0 && <CardRows rows={rows} view={view} group={group} onOpenCard={onOpenCard} selecting={selecting} isSelected={isSelected} onToggle={onToggle} />}
      {loading && <Spinner label={rows.length ? "Loading more…" : "Loading…"} />}
      <div ref={sentinel} aria-hidden="true" />
      {hasMore && !loading && !error && (
        <button type="button" className="btn sm" onClick={() => load(rows.length)}>Load more ({fmtInt(total - rows.length)} left)</button>
      )}
    </div>
  );
}

/** Move every copy of the selected cards (or only those in the filtered binder). */
function BulkMoveSheet({ items, group, binder, guarded, onClose, onDone }) {
  const [scoped, setScoped] = useState(binder != null);
  const what = plural(items.length, group === "card" ? "card" : "printing");
  return (
    <MoveSheet title={`Move ${what}`} exclude={scoped ? binder : null} submitLabel="Move" onClose={onClose}
      intro={<span className="small muted" style={{ overflowWrap: "anywhere" }}>{items.slice(0, 6).map((i) => i.name).join(", ")}{items.length > 6 ? ` and ${items.length - 6} more` : ""}</span>}
      onMove={async ({ to_binder, create }) => {
        const from = scoped && binder != null ? { from_binder: binder } : {};
        const list = items.map((i) => (group === "card" && i.oracle_id ? { oracle_id: i.oracle_id, ...from } : { printing_id: i.scryfall_id, ...from }));
        const res = await guarded((confirm) => api("/api/collection/move", { method: "POST", json: { items: list, to_binder, create, confirm_master: confirm } }));
        if (!res) return false;
        onDone(res);
        return true;
      }}>
      {binder != null ? (
        <label className="radio-card">
          <input type="checkbox" checked={scoped} onChange={(e) => setScoped(e.target.checked)} />
          <span><b>Only copies in {binder || UNSORTED}</b><br /><span className="small muted">{scoped ? "Copies in other binders stay where they are." : `Every copy of the selected ${group === "card" ? "cards" : "printings"} moves, from all binders.`}</span></span>
        </label>
      ) : (
        <span className="small muted">Every copy of the selected {group === "card" ? "cards (all printings)" : "printings"} moves, from all binders.</span>
      )}
    </MoveSheet>
  );
}

// Deck list filters, remembered per device: {fav, status idea|built|null, formats[], colors[]}.
const DECK_FILTER_KEY = "mtg.decks.filter";
const NO_DECK_FILTER = { fav: false, status: null, formats: [], colors: [] };
function loadDeckFilter() {
  const f = store.get(DECK_FILTER_KEY, null) || {};
  return {
    fav: f.fav === true,
    status: f.status === "idea" || f.status === "built" ? f.status : null,
    formats: asList(f.formats).filter((x) => typeof x === "string"),
    colors: asList(f.colors).filter((x) => typeof x === "string" && "WUBRGC".includes(x) && x.length === 1),
  };
}
const deckFormatKey = (d) => String(d.format || "").trim().toLowerCase();
const formatLabel = (f) => f.replace(/\b\w/g, (m) => m.toUpperCase());
/** Colours: the deck's identity holds every picked colour (like c:wu in a search); C = colourless only. */
function deckMatches(d, f) {
  if (f.fav && !d.favorite) return false;
  if (f.status && d.status !== f.status) return false;
  if (f.formats.length && !f.formats.includes(deckFormatKey(d))) return false;
  const id = String(d.colors ?? "");
  for (const c of f.colors) if (c === "C" ? id !== "" : !id.includes(c)) return false;
  return true;
}

  const [decks, setDecks] = useState(null);

  const all = decks || [];
  const formats = [...new Set(all.map(deckFormatKey).filter(Boolean))].sort();
  // A remembered format that no deck has any more is dropped from the filter.
  const f = { ...filter, formats: filter.formats.filter((x) => formats.includes(x)) };
  const active = f.fav || f.status || f.formats.length > 0 || f.colors.length > 0;

      {decks && shown.length > 0 && (

            </button>

        </div>
