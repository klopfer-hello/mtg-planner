name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA="$(git rev-parse --short=12 HEAD)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build=${VERSION}+${SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # Build and inspect locally first: nothing is pushed unless the image
      # passes the license check below.
      - name: Build image (not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          build-args: |
            VERSION=${{ steps.version.outputs.build }}
          tags: mtg-planner:release
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Same gates as CI, on the image that is about to be published: the whole
      # suite inside it (OCR, djpeg) and a working persistent OCR helper.
      - name: Tests in the image (OCR, djpeg)
        run: docker run --rm -v "$PWD":/app -w /app --entrypoint npm mtg-planner:release test

      - name: Image contains a working OCR helper
        run: |
          docker run --rm --entrypoint sh mtg-planner:release -c 'test -x /usr/local/bin/mtg-ocr && /usr/local/bin/mtg-ocr </dev/null'
          docker run --rm --entrypoint node mtg-planner:release --input-type=module -e '
            const o = await import("/app/lib/ocr.js");
            const img = o.encodePgm({ width: 40, height: 20, data: new Uint8Array(800).fill(255) });
            await o.ocrImage(img, { lang: "eng", psm: 7 });
            const st = o.ocrHelperStatus();
            console.log(JSON.stringify(st));
            if (!st.active || st.spawned !== 1 || st.fallbacks || st.crashes) process.exit(1);'

      # The Claude Code CLI is proprietary: it is installed at runtime into the
      # /claude volume and must never end up in the published image.
      - name: Image contains no Claude Code CLI
        run: |
          found=$(docker run --rm --user root --entrypoint sh mtg-planner:release -c 'find / \( -path /proc -o -path /sys \) -prune -o -iname "*claude-code*" -print')
          if [ -n "$found" ]; then echo "$found"; exit 1; fi

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.build }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:v${{ steps.version.outputs.version }}
          cache-from: type=gha

  release:
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build changelog
        run: |
          PREV_TAG="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -n "$PREV_TAG" ]; then RANGE="${PREV_TAG}..${GITHUB_REF_NAME}"; else RANGE="${GITHUB_REF_NAME}"; fi
          LOG="$(git log --no-merges --pretty=format:'%s (%h)' "$RANGE")"
          section() {
            local title="$1" pattern="$2" lines
            lines="$(printf '%s\n' "$LOG" | grep -E "^${pattern}(\([^)]*\))?!?: " | sed -E 's/^[a-z]+(\([^)]*\))?!?: /- /' || true)"
            if [ -n "$lines" ]; then printf '### %s\n\n%s\n\n' "$title" "$lines"; fi
          }
          {
            section "Features" "feat"
            section "Fixes" "fix"
            section "Refactoring" "refactor"
            section "Documentation" "docs"
            OTHER="$(printf '%s\n' "$LOG" | grep -vE '^(feat|fix|refactor|docs)(\([^)]*\))?!?: ' | sed '/^$/d; s/^/- /' || true)"
            if [ -n "$OTHER" ]; then printf '### Other\n\n%s\n\n' "$OTHER"; fi
            IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
            printf '**Image:** `%s:%s`\n' "$IMAGE" "$GITHUB_REF_NAME"
            if [ -n "$PREV_TAG" ]; then
              printf '\n**Full changelog:** https://github.com/%s/compare/%s...%s\n' "$GITHUB_REPOSITORY" "$PREV_TAG" "$GITHUB_REF_NAME"
            fi
          } > CHANGELOG.md
          cat CHANGELOG.md

      - uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
