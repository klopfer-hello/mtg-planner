name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: mtg-planner:ci
          build-args: |
            VERSION=ci+${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The image has tesseract + djpeg: run the whole suite there so the OCR
      # and JPEG tests (skipped on the bare runner) are exercised too.
      - name: Tests in the image (OCR, djpeg)
        run: docker run --rm -v "$PWD":/app -w /app --entrypoint npm mtg-planner:ci test
      # A working OCR helper and no Claude Code CLI (see the script's header).
      - name: Image checks (OCR helper, no Claude Code CLI)
        run: sh scripts/check-image.sh mtg-planner:ci
