name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: mtg-planner:ci
          build-args: |
            VERSION=ci+${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The image has tesseract + djpeg: run the whole suite there so the OCR
      # and JPEG tests (skipped on the bare runner) are exercised too.
      - name: Tests in the image (OCR, djpeg)
        run: docker run --rm -v "$PWD":/app -w /app --entrypoint npm mtg-planner:ci test
      # The persistent OCR helper must be in the image and start (else lib/ocr.js
      # silently falls back to spawning tesseract and the equivalence tests skip).
      - name: Image contains a working OCR helper
        run: |
          docker run --rm --entrypoint sh mtg-planner:ci -c 'test -x /usr/local/bin/mtg-ocr && /usr/local/bin/mtg-ocr </dev/null'
          docker run --rm --entrypoint node mtg-planner:ci --input-type=module -e '
            const o = await import("/app/lib/ocr.js");
            const img = o.encodePgm({ width: 40, height: 20, data: new Uint8Array(800).fill(255) });
            await o.ocrImage(img, { lang: "eng", psm: 7 });
            const st = o.ocrHelperStatus();
            console.log(JSON.stringify(st));
            if (!st.active || st.spawned !== 1 || st.fallbacks || st.crashes) process.exit(1);'
      # The Claude Code CLI is proprietary: it is installed at runtime into the
      # /claude volume and must never end up in the published image.
      - name: Image contains no Claude Code CLI
        run: |
          found=$(docker run --rm --user root --entrypoint sh mtg-planner:ci -c 'find / \( -path /proc -o -path /sys \) -prune -o -iname "*claude-code*" -print')
          if [ -n "$found" ]; then echo "$found"; exit 1; fi
